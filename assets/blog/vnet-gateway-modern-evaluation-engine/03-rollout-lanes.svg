<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Rollout lanes for the modern evaluation engine preview</title>
  <desc id="desc">Four rollout lanes: inventory, pilot, compare, expand, for teams evaluating the modern evaluation engine on VNet data gateways.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#14294b"/></linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102a48"/><stop offset="1" stop-color="#0a1b32"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="800" fill="#f5fbff">A safe rollout path for private gateway performance</text>
  <text x="70" y="122" font-family="Inter,Segoe UI,Arial" font-size="18" fill="#bac8d9">Treat the preview like a controlled platform change, not a random switch.</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial">
    <rect x="84" y="214" width="230" height="250" rx="28" fill="url(#lane)" stroke="#2b4e6c"/>
    <text x="116" y="265" font-size="26" font-weight="800" fill="#ffffff">1. Inventory</text>
    <text x="116" y="314" font-size="17" fill="#c1d0e1">List refreshes,</text><text x="116" y="342" font-size="17" fill="#c1d0e1">DirectQuery models,</text><text x="116" y="370" font-size="17" fill="#c1d0e1">connectors, owners.</text>
    <rect x="348" y="214" width="230" height="250" rx="28" fill="url(#lane)" stroke="#2b4e6c"/>
    <text x="380" y="265" font-size="26" font-weight="800" fill="#ffffff">2. Pilot</text>
    <text x="380" y="314" font-size="17" fill="#c1d0e1">Enable selected</text><text x="380" y="342" font-size="17" fill="#c1d0e1">gateway workloads</text><text x="380" y="370" font-size="17" fill="#c1d0e1">with clear rollback.</text>
    <rect x="612" y="214" width="230" height="250" rx="28" fill="url(#lane)" stroke="#2b4e6c"/>
    <text x="644" y="265" font-size="26" font-weight="800" fill="#ffffff">3. Compare</text>
    <text x="644" y="314" font-size="17" fill="#c1d0e1">Measure before</text><text x="644" y="342" font-size="17" fill="#c1d0e1">and after using</text><text x="644" y="370" font-size="17" fill="#c1d0e1">real workloads.</text>
    <rect x="876" y="214" width="230" height="250" rx="28" fill="url(#lane)" stroke="#2b4e6c"/>
    <text x="908" y="265" font-size="26" font-weight="800" fill="#ffffff">4. Expand</text>
    <text x="908" y="314" font-size="17" fill="#c1d0e1">Move only the</text><text x="908" y="342" font-size="17" fill="#c1d0e1">workloads with</text><text x="908" y="370" font-size="17" fill="#c1d0e1">proven benefit.</text>
  </g>
  <rect x="240" y="535" width="720" height="62" rx="22" fill="#0b1c33" stroke="#37d7c0"/>
  <text x="285" y="573" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="800" fill="#eafffb">Best result: better performance evidence without changing the private network architecture.</text>
</svg>
