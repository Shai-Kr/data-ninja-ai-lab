<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">A practical decision loop</title><desc id="desc">Turn the white paper into a small internal benchmark.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102f4a"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter></defs>
<rect width="1400" height="820" fill="url(#g)"/>
<circle cx="1180" cy="80" r="220" fill="#123f61" opacity="0.35"/>
<text x="70" y="88" fill="#7df9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Data Ninja AI Lab</text>
<text x="70" y="150" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">A practical decision loop</text>
<text x="70" y="196" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28">Turn the white paper into a small internal benchmark.</text>
<rect x="70" y="220" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3" filter="url(#shadow)"/>
<text x="110" y="278" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">1. Pick two modes</text>
<text x="110" y="330" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Shortlist the storage modes that fit</text>
<text x="110" y="366" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">security, data freshness, and ownership.</text>
<rect x="714" y="220" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3" filter="url(#shadow)"/>
<text x="754" y="278" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">2. Rebuild one report</text>
<text x="754" y="330" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Use the same model intent, same visuals,</text>
<text x="754" y="366" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">and same user scenarios.</text>
<rect x="70" y="474" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#ffd166" stroke-width="3" filter="url(#shadow)"/>
<text x="110" y="532" fill="#ffd166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">3. Measure properly</text>
<text x="110" y="584" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Track cold load, warm load, slicers,</text>
<text x="110" y="620" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">drill paths, and source pressure.</text>
<rect x="714" y="474" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#8bf5b5" stroke-width="3" filter="url(#shadow)"/>
<text x="754" y="532" fill="#8bf5b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">4. Decide with tradeoffs</text>
<text x="754" y="584" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Choose the pattern the team can operate,</text>
<text x="754" y="620" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">not only the fastest chart.</text>
<text x="70" y="776" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Power BI on Azure Databricks: use benchmark evidence, then test your own workload.</text>
</svg>