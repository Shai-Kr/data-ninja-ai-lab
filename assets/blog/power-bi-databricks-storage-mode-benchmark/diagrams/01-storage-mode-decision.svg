<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Four storage modes</title><desc id="desc">The benchmark gives teams a better starting map.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#102f4a"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter></defs>
<rect width="1400" height="820" fill="url(#g)"/>
<circle cx="1180" cy="80" r="220" fill="#123f61" opacity="0.35"/>
<text x="70" y="88" fill="#7df9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Data Ninja AI Lab</text>
<text x="70" y="150" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">Four storage modes</text>
<text x="70" y="196" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28">The benchmark gives teams a better starting map.</text>
<rect x="70" y="220" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#8bf5b5" stroke-width="3" filter="url(#shadow)"/>
<text x="110" y="278" fill="#8bf5b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Direct Lake on OneLake</text>
<text x="110" y="330" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Strong default candidate when Delta data</text>
<text x="110" y="366" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">can be served through Fabric and the</text>
<text x="110" y="402" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">workload benefits from repeated</text>
<text x="110" y="438" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">interactive use.</text>
<rect x="714" y="220" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3" filter="url(#shadow)"/>
<text x="754" y="278" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Direct Lake on mirrored UC</text>
<text x="754" y="330" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Useful when the team wants OneLake</text>
<text x="754" y="366" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">access over Unity Catalog tables without</text>
<text x="754" y="402" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">copying data first.</text>
<rect x="70" y="474" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#ffd166" stroke-width="3" filter="url(#shadow)"/>
<text x="110" y="532" fill="#ffd166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">DirectQuery</text>
<text x="110" y="584" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Simple live path, but every interaction</text>
<text x="110" y="620" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">keeps asking the source to work. Test it</text>
<text x="110" y="656" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">under real report behavior.</text>
<rect x="714" y="474" width="616" height="226" rx="28" fill="#0e1b2f" stroke="#8bf5b5" stroke-width="3" filter="url(#shadow)"/>
<text x="754" y="532" fill="#8bf5b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Composite + aggregations</text>
<text x="754" y="584" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Can be fastest when aggregation tables</text>
<text x="754" y="620" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">match how users actually filter, slice,</text>
<text x="754" y="656" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">and summarize.</text>
<text x="70" y="776" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Power BI on Azure Databricks: use benchmark evidence, then test your own workload.</text>
</svg>