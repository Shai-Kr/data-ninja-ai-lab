<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1180" viewBox="0 0 760 1180" role="img" aria-labelledby="title desc">
<title id="title">What to test first</title><desc id="desc">Do not choose from averages.</desc>
<rect width="760" height="1180" fill="#07111f"/>
<circle cx="640" cy="60" r="180" fill="#123f61" opacity="0.35"/>
<text x="56" y="78" fill="#7df9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Data Ninja AI Lab</text>
<text x="56" y="138" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">What to test first</text>
<text x="56" y="184" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Do not choose from averages.</text>
<rect x="56" y="220" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3"/>
<text x="100" y="284" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Data volume</text>
<text x="100" y="332" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Test today and the 12-month shape.</text>
<rect x="56" y="448" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#ffd166" stroke-width="3"/>
<text x="100" y="512" fill="#ffd166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Cache state</text>
<text x="100" y="560" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Measure cold and warm report</text>
<text x="100" y="594" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">behavior.</text>
<rect x="56" y="677" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3"/>
<text x="100" y="741" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Query shape</text>
<text x="100" y="789" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Totals, filters, detail pages, and</text>
<text x="100" y="823" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">drill paths differ.</text>
<rect x="56" y="906" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#8bf5b5" stroke-width="3"/>
<text x="100" y="970" fill="#8bf5b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">User behavior</text>
<text x="100" y="1018" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Design around the paths people</text>
<text x="100" y="1052" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">actually use.</text>
</svg>