<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1150" viewBox="0 0 760 1150" role="img" aria-labelledby="title desc">
<title id="title">What to test before choosing</title><desc id="desc">Performance depends on workload shape, not only the engine.</desc>
<rect width="760" height="1150" fill="#07111f"/>
<circle cx="650" cy="60" r="190" fill="#123f61" opacity="0.35"/>
<text x="38" y="72" fill="#7df9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Data Ninja AI Lab</text>
<text x="38" y="126" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">What to test before choosing</text>
<text x="38" y="171" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Performance depends on workload shape, not only the engine.</text>
<rect x="38" y="210" width="684" height="195" rx="24" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3"/>
<text x="64" y="258" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Data volume</text>
<text x="64" y="300" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Small and mid-size models behave</text>
<text x="64" y="331" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">differently from billion-row fact</text>
<text x="64" y="362" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">tables. Do not extrapolate blindly.</text>
<rect x="38" y="427" width="684" height="195" rx="24" fill="#0e1b2f" stroke="#ffd166" stroke-width="3"/>
<text x="64" y="475" fill="#ffd166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Cache state</text>
<text x="64" y="517" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Warm reports can hide expensive</text>
<text x="64" y="548" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">fallback paths. Test cold and warm</text>
<text x="64" y="579" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">behavior.</text>
<rect x="38" y="644" width="684" height="195" rx="24" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3"/>
<text x="64" y="692" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Query shape</text>
<text x="64" y="734" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Totals, detail pages, high-cardinality</text>
<text x="64" y="764" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">filters, and drill paths stress</text>
<text x="64" y="796" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">different parts of the design.</text>
<rect x="38" y="860" width="684" height="195" rx="24" fill="#0e1b2f" stroke="#8bf5b5" stroke-width="3"/>
<text x="64" y="908" fill="#8bf5b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">User behavior</text>
<text x="64" y="950" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Aggregations only pay off when they</text>
<text x="64" y="981" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">match what people do in the report.</text>
<text x="38" y="1110" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Benchmark first. Validate locally.</text>
</svg>