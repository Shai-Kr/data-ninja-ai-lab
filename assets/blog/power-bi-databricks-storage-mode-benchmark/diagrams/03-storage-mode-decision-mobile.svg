<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1180" viewBox="0 0 760 1180" role="img" aria-labelledby="title desc">
<title id="title">Decision loop</title><desc id="desc">Small test. Better standard.</desc>
<rect width="760" height="1180" fill="#07111f"/>
<circle cx="640" cy="60" r="180" fill="#123f61" opacity="0.35"/>
<text x="56" y="78" fill="#7df9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Data Ninja AI Lab</text>
<text x="56" y="138" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">Decision loop</text>
<text x="56" y="184" fill="#a8bdd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Small test. Better standard.</text>
<rect x="56" y="220" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3"/>
<text x="100" y="284" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Shortlist</text>
<text x="100" y="332" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Pick two realistic storage modes.</text>
<rect x="56" y="448" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#1fcbff" stroke-width="3"/>
<text x="100" y="512" fill="#1fcbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Rebuild</text>
<text x="100" y="560" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Use the same report intent and</text>
<text x="100" y="594" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">visuals.</text>
<rect x="56" y="677" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#ffd166" stroke-width="3"/>
<text x="100" y="741" fill="#ffd166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Measure</text>
<text x="100" y="789" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Track load time, slicers, drills,</text>
<text x="100" y="823" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">and source pressure.</text>
<rect x="56" y="906" width="648" height="204" rx="26" fill="#0e1b2f" stroke="#8bf5b5" stroke-width="3"/>
<text x="100" y="970" fill="#8bf5b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Decide</text>
<text x="100" y="1018" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Choose the pattern the team can</text>
<text x="100" y="1052" fill="#e8f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">operate.</text>
</svg>