<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="0.55" stop-color="#0b1830"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="170" fill="#0891b2" opacity="0.14"/>
  <circle cx="130" cy="570" r="210" fill="#7c3aed" opacity="0.12"/>
  <text x="70" y="92" fill="#e5f7ff" font-family="Inter,Segoe UI,Arial" font-size="42" font-weight="800">A practical rollout model</text>
  <text x="72" y="135" fill="#9fb7d1" font-family="Inter,Segoe UI,Arial" font-size="24">How to introduce agent visuals without drama</text>

  <rect x="46" y="225" width="250" height="305" rx="28" fill="#0e1b2e" stroke="#22d3ee" stroke-width="2" opacity="0.96"/>
  <circle cx="88" cy="273" r="17" fill="#22d3ee" filter="url(#glow)"/>
  <text x="118" y="282" fill="#f8fbff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="750">Start narrow</text>
  <text x="80" y="337" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">Pick three trusted</text>
  <text x="80" y="371" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">metrics and known</text>
  <text x="80" y="405" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">questions first.</text>

  <rect x="332" y="225" width="250" height="305" rx="28" fill="#0e1b2e" stroke="#60a5fa" stroke-width="2" opacity="0.96"/>
  <circle cx="374" cy="273" r="17" fill="#60a5fa" filter="url(#glow)"/>
  <text x="404" y="282" fill="#f8fbff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="750">Compare</text>
  <text x="366" y="337" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">Check agent charts</text>
  <text x="366" y="371" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">against existing reports</text>
  <text x="366" y="405" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">and semantic model</text>
  <text x="366" y="439" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">logic.</text>

  <rect x="618" y="225" width="250" height="305" rx="28" fill="#0e1b2e" stroke="#a78bfa" stroke-width="2" opacity="0.96"/>
  <circle cx="660" cy="273" r="17" fill="#a78bfa" filter="url(#glow)"/>
  <text x="690" y="282" fill="#f8fbff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="750">Document</text>
  <text x="652" y="337" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">Capture chart rules,</text>
  <text x="652" y="371" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">preferred visual types,</text>
  <text x="652" y="405" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">and known limits.</text>

  <rect x="904" y="225" width="250" height="305" rx="28" fill="#0e1b2e" stroke="#34d399" stroke-width="2" opacity="0.96"/>
  <circle cx="946" cy="273" r="17" fill="#34d399" filter="url(#glow)"/>
  <text x="976" y="282" fill="#f8fbff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="750">Expand</text>
  <text x="938" y="337" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">Add new domains only</text>
  <text x="938" y="371" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">after answer quality is</text>
  <text x="938" y="405" fill="#c8d8ea" font-family="Inter,Segoe UI,Arial" font-size="21">boring and repeatable.</text>

  <text x="70" y="620" fill="#5eead4" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="700">Data Ninja AI Lab</text>
</svg>