<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650"><rect width="800" height="650" rx="22" fill="#081322"/><text x="44" y="66" fill="#eef7ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Ask the graph two useful questions</text><rect x="40" y="106" width="720" height="146" rx="16" fill="#13283c" stroke="#2e8197"/><text x="66" y="153" fill="#66e1f5" font-family="Arial,sans-serif" font-size="29" font-weight="700">UPSTREAM</text><text x="66" y="198" fill="#edf4fc" font-family="Arial,sans-serif" font-size="26">What does this item depend on?</text><text x="66" y="232" fill="#edf4fc" font-family="Arial,sans-serif" font-size="26">Use it to explain source context.</text><rect x="40" y="276" width="720" height="146" rx="16" fill="#13283c" stroke="#2e8197"/><text x="66" y="323" fill="#66e1f5" font-family="Arial,sans-serif" font-size="29" font-weight="700">TARGET ITEM</text><text x="66" y="368" fill="#edf4fc" font-family="Arial,sans-serif" font-size="26">One familiar model, notebook, or report</text><text x="66" y="402" fill="#edf4fc" font-family="Arial,sans-serif" font-size="26">Keep its item and workspace IDs.</text><rect x="40" y="446" width="720" height="146" rx="16" fill="#13283c" stroke="#2e8197"/><text x="66" y="493" fill="#66e1f5" font-family="Arial,sans-serif" font-size="29" font-weight="700">DOWNSTREAM</text><text x="66" y="538" fill="#edf4fc" font-family="Arial,sans-serif" font-size="26">What depends on this item?</text><text x="66" y="572" fill="#edf4fc" font-family="Arial,sans-serif" font-size="26">Use it to identify review candidates.</text></svg>
