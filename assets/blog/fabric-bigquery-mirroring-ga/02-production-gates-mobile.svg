<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc"><title id="title">Four review gates before production</title><desc id="desc">GA removes preview status. It does not remove architecture work.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102b44"/></linearGradient></defs><rect width="720" height="1500" rx="28" fill="url(#bg)"/><text x="44" y="70" fill="#64e6ff" font-family="Arial" font-size="20" font-weight="700" letter-spacing="2">MICROSOFT FABRIC</text><text x="44" y="124" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Four review gates before production</text><text x="44" y="166" fill="#a9c4d8" font-family="Arial" font-size="19">GA removes preview status. It does not remove architecture work.</text><rect x="44" y="220" width="632" height="240" rx="20" fill="#0e2236" stroke="#45d9f5" stroke-width="2"/><circle cx="82" cy="264" r="17" fill="#45d9f5"/><text x="82" y="271" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="18" font-weight="700">1</text><text x="116" y="272" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Scope</text><text x="76" y="321" fill="#cce0ee" font-family="Arial" font-size="18">Choose tables</text><text x="76" y="356" fill="#cce0ee" font-family="Arial" font-size="18">Record owners</text><text x="76" y="391" fill="#cce0ee" font-family="Arial" font-size="18">Define freshness</text><rect x="44" y="505" width="632" height="240" rx="20" fill="#0e2236" stroke="#ffd166" stroke-width="2"/><circle cx="82" cy="549" r="17" fill="#ffd166"/><text x="82" y="556" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="18" font-weight="700">2</text><text x="116" y="557" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Access</text><text x="76" y="606" fill="#cce0ee" font-family="Arial" font-size="18">Least privilege</text><text x="76" y="641" fill="#cce0ee" font-family="Arial" font-size="18">Separate identities</text><text x="76" y="676" fill="#cce0ee" font-family="Arial" font-size="18">Rebuild security</text><rect x="44" y="790" width="632" height="240" rx="20" fill="#0e2236" stroke="#ff7b9c" stroke-width="2"/><circle cx="82" cy="834" r="17" fill="#ff7b9c"/><text x="82" y="841" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="18" font-weight="700">3</text><text x="116" y="842" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Behavior</text><text x="76" y="891" fill="#cce0ee" font-family="Arial" font-size="18">Keys and CDC</text><text x="76" y="926" fill="#cce0ee" font-family="Arial" font-size="18">Reseed cases</text><text x="76" y="961" fill="#cce0ee" font-family="Arial" font-size="18">Backoff timing</text><rect x="44" y="1075" width="632" height="240" rx="20" fill="#0e2236" stroke="#7ae582" stroke-width="2"/><circle cx="82" cy="1119" r="17" fill="#7ae582"/><text x="82" y="1126" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="18" font-weight="700">4</text><text x="116" y="1127" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Evidence</text><text x="76" y="1176" fill="#cce0ee" font-family="Arial" font-size="18">Counts and totals</text><text x="76" y="1211" fill="#cce0ee" font-family="Arial" font-size="18">Lag and cost</text><text x="76" y="1246" fill="#cce0ee" font-family="Arial" font-size="18">Failure recovery</text><rect x="44" y="1365" width="632" height="105" rx="18" fill="#092033" stroke="#2c6d8c"/><text x="360" y="1407" text-anchor="middle" fill="#80ebff" font-family="Arial" font-size="19" font-weight="700">Approve production only when the mirror is measurable,</text><text x="360" y="1436" text-anchor="middle" fill="#80ebff" font-family="Arial" font-size="19" font-weight="700">explainable, and owned.</text></svg>