<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Four review gates before production</title><desc id="desc">GA removes preview status. It does not remove architecture work.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102b44"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs>
<rect width="1440" height="820" rx="32" fill="url(#bg)"/><circle cx="1230" cy="90" r="150" fill="#00d4ff" opacity=".08" filter="url(#glow)"/>
<text x="80" y="92" fill="#64e6ff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">MICROSOFT FABRIC</text>
<text x="80" y="158" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Four review gates before production</text>
<text x="80" y="204" fill="#a9c4d8" font-family="Arial,sans-serif" font-size="24">GA removes preview status. It does not remove architecture work.</text><rect x="75" y="285" width="250" height="350" rx="24" fill="#0e2236" stroke="#45d9f5" stroke-width="2"/><circle cx="113" cy="331" r="18" fill="#45d9f5"/><text x="113" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">1</text><text x="145" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Scope</text><text x="105" y="397" fill="#cce0ee" font-family="Arial" font-size="21">Choose tables</text><text x="105" y="443" fill="#cce0ee" font-family="Arial" font-size="21">Record owners</text><text x="105" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Define freshness</text><path d="M 340 460 H 372" stroke="#45d9f5" stroke-width="4"/><path d="M 356 448 L 372 460 L 356 472" fill="none" stroke="#45d9f5" stroke-width="4"/><rect x="390" y="285" width="250" height="350" rx="24" fill="#0e2236" stroke="#ffd166" stroke-width="2"/><circle cx="428" cy="331" r="18" fill="#ffd166"/><text x="428" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">2</text><text x="460" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Access</text><text x="420" y="397" fill="#cce0ee" font-family="Arial" font-size="21">Least privilege</text><text x="420" y="443" fill="#cce0ee" font-family="Arial" font-size="21">Separate identities</text><text x="420" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Rebuild security</text><path d="M 655 460 H 687" stroke="#45d9f5" stroke-width="4"/><path d="M 671 448 L 687 460 L 671 472" fill="none" stroke="#45d9f5" stroke-width="4"/><rect x="705" y="285" width="250" height="350" rx="24" fill="#0e2236" stroke="#ff7b9c" stroke-width="2"/><circle cx="743" cy="331" r="18" fill="#ff7b9c"/><text x="743" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">3</text><text x="775" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Behavior</text><text x="735" y="397" fill="#cce0ee" font-family="Arial" font-size="21">Keys and CDC</text><text x="735" y="443" fill="#cce0ee" font-family="Arial" font-size="21">Reseed cases</text><text x="735" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Backoff timing</text><path d="M 970 460 H 1002" stroke="#45d9f5" stroke-width="4"/><path d="M 986 448 L 1002 460 L 986 472" fill="none" stroke="#45d9f5" stroke-width="4"/><rect x="1020" y="285" width="250" height="350" rx="24" fill="#0e2236" stroke="#7ae582" stroke-width="2"/><circle cx="1058" cy="331" r="18" fill="#7ae582"/><text x="1058" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">4</text><text x="1090" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Evidence</text><text x="1050" y="397" fill="#cce0ee" font-family="Arial" font-size="21">Counts and totals</text><text x="1050" y="443" fill="#cce0ee" font-family="Arial" font-size="21">Lag and cost</text><text x="1050" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Failure recovery</text><rect x="80" y="690" width="1280" height="74" rx="18" fill="#092033" stroke="#2c6d8c"/><text x="720" y="737" text-anchor="middle" fill="#80ebff" font-family="Arial" font-size="24" font-weight="700">Approve production only when the mirror is measurable, explainable, and owned.</text></svg>