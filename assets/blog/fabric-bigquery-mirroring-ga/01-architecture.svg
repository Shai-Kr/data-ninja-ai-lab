<text x="80" y="204" fill="#a9c4d8" font-family="Arial,sans-serif" font-size="24">Replication creates an analytics-ready copy in OneLake</text><rect x="110" y="285" width="360" height="350" rx="24" fill="#0e2236" stroke="#ffd166" stroke-width="2"/><circle cx="148" cy="331" r="18" fill="#ffd166"/><text x="148" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">1</text><text x="180" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Source</text><text x="140" y="397" fill="#cce0ee" font-family="Arial" font-size="21">BigQuery tables</text><text x="140" y="443" fill="#cce0ee" font-family="Arial" font-size="21">Change history enabled</text><text x="140" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Source permissions</text><path d="M 485 460 H 522" stroke="#45d9f5" stroke-width="4"/><path d="M 506 448 L 522 460 L 506 472" fill="none" stroke="#45d9f5" stroke-width="4"/><rect x="540" y="285" width="360" height="350" rx="24" fill="#0e2236" stroke="#45d9f5" stroke-width="2"/><circle cx="578" cy="331" r="18" fill="#45d9f5"/><text x="578" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">2</text><text x="610" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Replication</text><text x="570" y="397" fill="#cce0ee" font-family="Arial" font-size="21">CDC plus staging</text><text x="570" y="443" fill="#cce0ee" font-family="Arial" font-size="21">Managed by Fabric</text><text x="570" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Near real-time target</text><path d="M 915 460 H 952" stroke="#45d9f5" stroke-width="4"/><path d="M 936 448 L 952 460 L 936 472" fill="none" stroke="#45d9f5" stroke-width="4"/><rect x="970" y="285" width="360" height="350" rx="24" fill="#0e2236" stroke="#7ae582" stroke-width="2"/><circle cx="1008" cy="331" r="18" fill="#7ae582"/><text x="1008" y="339" text-anchor="middle" fill="#07111f" font-family="Arial" font-size="20" font-weight="700">3</text><text x="1040" y="340" fill="#fff" font-family="Arial" font-size="25" font-weight="700">OneLake</text><text x="1000" y="397" fill="#cce0ee" font-family="Arial" font-size="21">Delta tables</text><text x="1000" y="443" fill="#cce0ee" font-family="Arial" font-size="21">SQL endpoint</text><text x="1000" y="489" fill="#cce0ee" font-family="Arial" font-size="21">Fabric engines</text><rect x="80" y="690" width="1280" height="74" rx="18" fill="#092033" stroke="#2c6d8c"/><text x="720" y="737" text-anchor="middle" fill="#80ebff" font-family="Arial" font-size="24" font-weight="700">The design goal: one governed analytical copy, not another hand-built pipeline.</text></svg>