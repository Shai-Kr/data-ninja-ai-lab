<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="The three-part agent control model">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="0.55" stop-color="#0b1530"/><stop offset="1" stop-color="#101a3d"/></linearGradient>
      <radialGradient id="glow" cx="50%" cy="28%" r="60%"><stop offset="0" stop-color="#244fd8" stop-opacity="0.55"/><stop offset="1" stop-color="#244fd8" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1200" height="675" fill="url(#bg)"/>
    <rect width="1200" height="675" fill="url(#glow)"/>
    <circle cx="1040" cy="110" r="130" fill="#42e8f5" opacity="0.08"/>
    <circle cx="130" cy="560" r="170" fill="#9b7cff" opacity="0.10"/>
    <text x="70" y="92" fill="#42e8f5" font-size="22" font-weight="800" letter-spacing="3">DATA NINJA AI LAB</text>
    <text x="70" y="150" fill="#ffffff" font-size="46" font-weight="900">The three-part agent control model</text>
    <text x="70" y="198" fill="#b8c7e6" font-size="25">Good automation needs policy, enforcement, and evidence.</text>
    
        <rect x="103.0" y="250" width="310" height="245" rx="28" fill="#101b34" stroke="#42e8f5" stroke-width="3"/>
        <circle cx="145.0" cy="296" r="15" fill="#42e8f5" opacity="0.95"/>
        <text x="173.0" y="304" fill="#f8fbff" font-size="27" font-weight="800">Policy</text>
        <text x="131.0" y="355" fill="#d5e2ff" font-size="23" font-weight="500"><tspan x="131.0" dy="24">Define what outbound</tspan><tspan x="131.0" dy="24">destinations are allowed</tspan></text>
        
        <rect x="445.0" y="250" width="310" height="245" rx="28" fill="#101b34" stroke="#9b7cff" stroke-width="3"/>
        <circle cx="487.0" cy="296" r="15" fill="#9b7cff" opacity="0.95"/>
        <text x="515.0" y="304" fill="#f8fbff" font-size="27" font-weight="800">Enforcement</text>
        <text x="473.0" y="355" fill="#d5e2ff" font-size="23" font-weight="500"><tspan x="473.0" dy="24">Block actions that do not match</tspan><tspan x="473.0" dy="24">workspace rules</tspan></text>
        
        <rect x="787.0" y="250" width="310" height="245" rx="28" fill="#101b34" stroke="#36d399" stroke-width="3"/>
        <circle cx="829.0" cy="296" r="15" fill="#36d399" opacity="0.95"/>
        <text x="857.0" y="304" fill="#f8fbff" font-size="27" font-weight="800">Evidence</text>
        <text x="815.0" y="355" fill="#d5e2ff" font-size="23" font-weight="500"><tspan x="815.0" dy="24">Use notifications and activity</tspan><tspan x="815.0" dy="24">logs to explain outcomes</tspan></text>
        
    <text x="600" y="616" text-anchor="middle" fill="#92a7ce" font-size="22">No evidence means every blocked action becomes a mystery</text>
    </svg>