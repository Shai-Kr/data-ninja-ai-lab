<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A better way to choose the first database</title><desc id="desc">The first Fabric SQL migration should be selected by readiness, value, and downstream analytics payoff.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient><radialGradient id="glow" cx="75%" cy="15%" r="55%"><stop offset="0" stop-color="#34d399" stop-opacity="0.32"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#glow)"/><text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="850" fill="#f8fafc">A better way to choose the first database</text><foreignObject x="72" y="116" width="950" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;color:#cbd5e1;font-size:22px;line-height:1.35">The first Fabric SQL migration should be selected by readiness, value, and downstream analytics payoff.</div></foreignObject><g transform="translate(70,250)"><rect width="260" height="210" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="38" cy="42" r="20" fill="#34d399" opacity="0.9"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#07111f">1</text><text x="24" y="88" font-size="25" font-weight="800" fill="#f8fafc">Easy wins</text><foreignObject x="24" y="108" width="212" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;color:#cbd5e1;font-size:17px;line-height:1.32">Clean schema, low dependency risk, high reporting value.</div></foreignObject></g><path d="M342 355 L402 355" stroke="#34d399" stroke-width="5" stroke-linecap="round"/><path d="M400 340 L420 355 L400 370" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(370,250)"><rect width="260" height="210" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="38" cy="42" r="20" fill="#34d399" opacity="0.9"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#07111f">2</text><text x="24" y="88" font-size="25" font-weight="800" fill="#f8fafc">Remediate</text><foreignObject x="24" y="108" width="212" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;color:#cbd5e1;font-size:17px;line-height:1.32">Useful workloads with known unsupported features and clear owners.</div></foreignObject></g><path d="M642 355 L702 355" stroke="#34d399" stroke-width="5" stroke-linecap="round"/><path d="M700 340 L720 355 L700 370" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(670,250)"><rect width="260" height="210" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="38" cy="42" r="20" fill="#34d399" opacity="0.9"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="700" fill="#07111f">3</text><text x="24" y="88" font-size="25" font-weight="800" fill="#f8fafc">Hold</text><foreignObject x="24" y="108" width="212" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;color:#cbd5e1;font-size:17px;line-height:1.32">High-risk systems where compatibility, ownership, or cutover are unclear.</div></foreignObject></g><text x="70" y="605" font-family="Inter,Arial,sans-serif" font-size="18" fill="#94a3b8">Shai Karmani • Data Ninja AI Lab • Microsoft Fabric</text></svg>