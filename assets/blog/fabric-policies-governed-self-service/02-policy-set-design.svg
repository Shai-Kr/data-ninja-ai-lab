<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Design the policy set before the rule</title><desc id="desc">A narrow policy needs explicit scope, logic, and ownership</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="70" r="120" fill="#18d7ff" opacity=".08"/><circle cx="60" cy="580" r="110" fill="#7b61ff" opacity=".08"/>
<text x="600" y="54" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="28">Design the policy set before the rule</text>
<text x="600" y="84" text-anchor="middle" fill="#91b7ca" font-family="Arial,sans-serif" font-size="15">A narrow policy needs explicit scope, logic, and ownership</text><rect x="45" y="125" width="340" height="360" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><circle cx="75" cy="155" r="16" fill="#18d7ff" opacity=".9"/><text x="75" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">A</text><text x="101" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Admin scope</text><text x="67" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Tenant or capacity admin</text><text x="67" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Policy set ownership</text><text x="67" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Hosting capacity recorded</text><text x="67" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Enforcement target recorded</text><rect x="430" y="125" width="340" height="360" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><circle cx="460" cy="155" r="16" fill="#67e8a5" opacity=".9"/><text x="460" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">B</text><text x="486" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Decision logic</text><text x="452" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Default, allow, or block</text><text x="452" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">AND within each rule</text><text x="452" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">OR across matching rules</text><text x="452" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">No-match behavior tested</text><rect x="815" y="125" width="340" height="360" rx="18" fill="#0d2032" stroke="#ffca68" stroke-width="2"/><circle cx="845" cy="155" r="16" fill="#ffca68" opacity=".9"/><text x="845" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">C</text><text x="871" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Operational record</text><text x="837" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Business purpose</text><text x="837" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Exception owner</text><text x="837" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Audit query or report</text><text x="837" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Review date and rollback</text><rect x="24" y="564" width="1152" height="34" rx="17" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".45"/><text x="600" y="586" text-anchor="middle" fill="#8feeff" font-family="Arial,sans-serif" font-weight="700" font-size="14">A policy is production configuration, so treat it like a release artifact</text></svg>