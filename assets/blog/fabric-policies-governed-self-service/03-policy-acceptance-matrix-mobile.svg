<text x="195" y="54" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="28">Policy acceptance matrix</text>
<text x="195" y="84" text-anchor="middle" fill="#91b7ca" font-family="Arial,sans-serif" font-size="15">Positive and negative tests</text><rect x="25" y="110" width="340" height="180" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><circle cx="55" cy="140" r="16" fill="#67e8a5" opacity=".9"/><text x="55" y="146" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">1</text><text x="81" y="146" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Allowed user</text><text x="47" y="177" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Correct group and scope</text><text x="47" y="200" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Expected result: ALLOW</text><rect x="25" y="310" width="340" height="180" rx="18" fill="#0d2032" stroke="#ff7f96" stroke-width="2"/><circle cx="55" cy="340" r="16" fill="#ff7f96" opacity=".9"/><text x="55" y="346" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">2</text><text x="81" y="346" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Blocked user</text><text x="47" y="377" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Wrong group or role</text><text x="47" y="400" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Expected result: BLOCK</text><rect x="25" y="510" width="340" height="180" rx="18" fill="#0d2032" stroke="#b18cff" stroke-width="2"/><circle cx="55" cy="540" r="16" fill="#b18cff" opacity=".9"/><text x="55" y="546" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">3</text><text x="81" y="546" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Wrong scope</text><text x="47" y="577" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Correct identity, wrong target</text><text x="47" y="600" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Expected result recorded</text><rect x="25" y="710" width="340" height="180" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><circle cx="55" cy="740" r="16" fill="#18d7ff" opacity=".9"/><text x="55" y="746" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">4</text><text x="81" y="746" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Evidence</text><text x="47" y="777" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Audit event and owner</text><text x="47" y="800" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Retest date scheduled</text><rect x="24" y="924" width="342" height="34" rx="17" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".45"/><text x="195" y="946" text-anchor="middle" fill="#8feeff" font-family="Arial,sans-serif" font-weight="700" font-size="14">Prove identity + action + scope + evidence</text></svg>