<text x="195" y="84" text-anchor="middle" fill="#91b7ca" font-family="Arial,sans-serif" font-size="15">Governed self-service in four steps</text><rect x="25" y="110" width="340" height="180" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><circle cx="55" cy="140" r="16" fill="#18d7ff" opacity=".9"/><text x="55" y="146" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">1</text><text x="81" y="146" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Define</text><text x="47" y="177" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Business action and scope</text><text x="47" y="200" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Default behavior and owner</text><rect x="25" y="310" width="340" height="180" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><circle cx="55" cy="340" r="16" fill="#67e8a5" opacity=".9"/><text x="55" y="346" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">2</text><text x="81" y="346" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Target</text><text x="47" y="377" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">WHO, WHAT, and WHERE</text><text x="47" y="400" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Contextual conditions</text><rect x="25" y="510" width="340" height="180" rx="18" fill="#0d2032" stroke="#b18cff" stroke-width="2"/><circle cx="55" cy="540" r="16" fill="#b18cff" opacity=".9"/><text x="55" y="546" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">3</text><text x="81" y="546" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Enforce</text><text x="47" y="577" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Runtime allow or block</text><text x="47" y="600" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Self-service within boundaries</text><rect x="25" y="710" width="340" height="180" rx="18" fill="#0d2032" stroke="#ffca68" stroke-width="2"/><circle cx="55" cy="740" r="16" fill="#ffca68" opacity=".9"/><text x="55" y="746" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">4</text><text x="81" y="746" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Prove</text><text x="47" y="777" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Audit results and personas</text><text x="47" y="800" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Review drift and exceptions</text><rect x="24" y="924" width="342" height="34" rx="17" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".45"/><text x="195" y="946" text-anchor="middle" fill="#8feeff" font-family="Arial,sans-serif" font-weight="700" font-size="14">Policy set + enforcement + evidence</text></svg>