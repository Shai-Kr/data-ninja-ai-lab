<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Policy acceptance matrix</title><desc id="desc">Prove the intended result with positive and negative tests</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="70" r="120" fill="#18d7ff" opacity=".08"/><circle cx="60" cy="580" r="110" fill="#7b61ff" opacity=".08"/>
<text x="600" y="54" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="28">Policy acceptance matrix</text>
<text x="600" y="84" text-anchor="middle" fill="#91b7ca" font-family="Arial,sans-serif" font-size="15">Prove the intended result with positive and negative tests</text><rect x="45" y="125" width="250" height="360" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><circle cx="75" cy="155" r="16" fill="#67e8a5" opacity=".9"/><text x="75" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">1</text><text x="101" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Allowed user</text><text x="67" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Correct security group</text><text x="67" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Correct workspace</text><text x="67" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Expected item or action</text><text x="67" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Result: ALLOW</text><rect x="330" y="125" width="250" height="360" rx="18" fill="#0d2032" stroke="#ff7f96" stroke-width="2"/><circle cx="360" cy="155" r="16" fill="#ff7f96" opacity=".9"/><text x="360" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">2</text><text x="386" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Blocked user</text><text x="352" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Wrong group or role</text><text x="352" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Same target workspace</text><text x="352" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Same requested action</text><text x="352" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Result: BLOCK</text><rect x="615" y="125" width="250" height="360" rx="18" fill="#0d2032" stroke="#b18cff" stroke-width="2"/><circle cx="645" cy="155" r="16" fill="#b18cff" opacity=".9"/><text x="645" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">3</text><text x="671" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Wrong scope</text><text x="637" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Allowed user identity</text><text x="637" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Different workspace/capacity</text><text x="637" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Same requested action</text><text x="637" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Expected result recorded</text><rect x="900" y="125" width="250" height="360" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><circle cx="930" cy="155" r="16" fill="#18d7ff" opacity=".9"/><text x="930" y="161" text-anchor="middle" fill="#06101b" font-family="Arial,sans-serif" font-weight="700" font-size="15">4</text><text x="956" y="161" fill="#f2fbff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Evidence</text><text x="922" y="192" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Audit event captured</text><text x="922" y="215" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Rule and scope identified</text><text x="922" y="238" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Owner signs the outcome</text><text x="922" y="261" fill="#b9d3df" font-family="Arial,sans-serif" font-size="14">Retest date scheduled</text><rect x="24" y="564" width="1152" height="34" rx="17" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".45"/><text x="600" y="586" text-anchor="middle" fill="#8feeff" font-family="Arial,sans-serif" font-weight="700" font-size="14">Test identity, action, scope, no-match behavior, and audit evidence</text></svg>