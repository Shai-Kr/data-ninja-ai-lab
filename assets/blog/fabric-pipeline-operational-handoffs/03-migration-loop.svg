<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">A controlled migration loop</title><desc id="desc">Replace legacy activities without losing operational intent</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233b"/></linearGradient></defs><rect width="100%" height="100%" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="640" rx="22" fill="none" stroke="#1f4667" stroke-width="2"/><text x="600" y="70" text-anchor="middle" fill="#eaf7ff" font-family="Arial" font-size="34" font-weight="700">A controlled migration loop</text><text x="600" y="108" text-anchor="middle" fill="#9fc4dc" font-family="Arial" font-size="19">Replace legacy activities without losing operational intent</text><rect x="48" y="190" width="195" height="270" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="146" cy="245" r="28" fill="#20d6ff" opacity=".18"/><text x="146" y="254" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="23" font-weight="700">1</text><text x="146" y="310" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Inventory</text><text x="146" y="356" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">Legacy activity</text><text x="146" y="384" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">Owner and trigger</text><path d="M243 325 H273" stroke="#43e6a1" stroke-width="4"/><path d="M265 316 L275 325 L265 334" fill="none" stroke="#43e6a1" stroke-width="4"/><rect x="278" y="190" width="195" height="270" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="376" cy="245" r="28" fill="#20d6ff" opacity=".18"/><text x="376" y="254" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="23" font-weight="700">2</text><text x="376" y="310" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Classify</text><text x="376" y="356" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">Notify, acknowledge</text><text x="376" y="384" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">or approve</text><path d="M473 325 H503" stroke="#43e6a1" stroke-width="4"/><path d="M495 316 L505 325 L495 334" fill="none" stroke="#43e6a1" stroke-width="4"/><rect x="508" y="190" width="195" height="270" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="606" cy="245" r="28" fill="#20d6ff" opacity=".18"/><text x="606" y="254" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="23" font-weight="700">3</text><text x="606" y="310" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Replace</text><text x="606" y="356" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">Modern activity</text><text x="606" y="384" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">or operating queue</text><path d="M703 325 H733" stroke="#43e6a1" stroke-width="4"/><path d="M725 316 L735 325 L725 334" fill="none" stroke="#43e6a1" stroke-width="4"/><rect x="738" y="190" width="195" height="270" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="836" cy="245" r="28" fill="#20d6ff" opacity=".18"/><text x="836" y="254" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="23" font-weight="700">4</text><text x="836" y="310" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Test</text><text x="836" y="356" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">Five cases and</text><text x="836" y="384" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">environment routing</text><path d="M933 325 H963" stroke="#43e6a1" stroke-width="4"/><path d="M955 316 L965 325 L955 334" fill="none" stroke="#43e6a1" stroke-width="4"/><rect x="968" y="190" width="195" height="270" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="1066" cy="245" r="28" fill="#20d6ff" opacity=".18"/><text x="1066" y="254" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="23" font-weight="700">5</text><text x="1066" y="310" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Prove</text><text x="1066" y="356" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">Record result and</text><text x="1066" y="384" text-anchor="middle" fill="#bfd5e5" font-family="Arial" font-size="16">rescan inventory</text><rect x="130" y="525" width="940" height="80" rx="20" fill="#102b3c" stroke="#43e6a1"/><text x="600" y="560" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Completion evidence</text><text x="600" y="590" text-anchor="middle" fill="#bfe9d6" font-family="Arial" font-size="18">No unmanaged legacy activity remains, and every replacement has a test result</text></svg>