<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1020" viewBox="0 0 700 1020" role="img" aria-labelledby="title desc">
<title id="title">Three operational handoffs</title><desc id="desc">Notify, acknowledge, or approve</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="660" height="980" rx="22" fill="none" stroke="#1f4667" stroke-width="2"/>
<text x="350" y="70" text-anchor="middle" fill="#eaf7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Three operational handoffs</text>
<text x="350" y="108" text-anchor="middle" fill="#9fc4dc" font-family="Arial, sans-serif" font-size="19">Notify, acknowledge, or approve</text><rect x="60" y="145" width="580" height="235" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><rect x="82" y="167" width="54" height="34" rx="17" fill="#20d6ff" opacity=".18"/><text x="109" y="191" text-anchor="middle" fill="#20d6ff" font-family="Arial" font-size="17" font-weight="700">1</text><text x="82" y="239" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Notify</text><circle cx="88" cy="272" r="4" fill="#20d6ff"/><text x="103" y="278" fill="#bfd5e5" font-family="Arial" font-size="18">Pipeline continues</text><circle cx="88" cy="306" r="4" fill="#20d6ff"/><text x="103" y="312" fill="#bfd5e5" font-family="Arial" font-size="18">No human decision</text><rect x="60" y="410" width="580" height="235" rx="20" fill="#0d1d30" stroke="#a78bfa" stroke-width="2"/><rect x="82" y="432" width="54" height="34" rx="17" fill="#a78bfa" opacity=".18"/><text x="109" y="456" text-anchor="middle" fill="#a78bfa" font-family="Arial" font-size="17" font-weight="700">2</text><text x="82" y="504" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Acknowledge</text><circle cx="88" cy="537" r="4" fill="#a78bfa"/><text x="103" y="543" fill="#bfd5e5" font-family="Arial" font-size="18">Owner takes action</text><circle cx="88" cy="571" r="4" fill="#a78bfa"/><text x="103" y="577" fill="#bfd5e5" font-family="Arial" font-size="18">Track outside pipeline</text><rect x="60" y="675" width="580" height="235" rx="20" fill="#0d1d30" stroke="#43e6a1" stroke-width="2"/><rect x="82" y="697" width="54" height="34" rx="17" fill="#43e6a1" opacity=".18"/><text x="109" y="721" text-anchor="middle" fill="#43e6a1" font-family="Arial" font-size="17" font-weight="700">3</text><text x="82" y="769" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Approve</text><circle cx="88" cy="802" r="4" fill="#43e6a1"/><text x="103" y="808" fill="#bfd5e5" font-family="Arial" font-size="18">Pipeline pauses</text><circle cx="88" cy="836" r="4" fill="#43e6a1"/><text x="103" y="842" fill="#bfd5e5" font-family="Arial" font-size="18">Decision is traceable</text><text x="350" y="975" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="22" font-weight="700">Choose by required outcome</text></svg>