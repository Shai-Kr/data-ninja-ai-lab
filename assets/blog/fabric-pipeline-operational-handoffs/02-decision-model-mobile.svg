<svg xmlns="http://www.w3.org/2000/svg" width="700" height="970" viewBox="0 0 700 970" role="img" aria-labelledby="title desc">
<title id="title">Choose the handoff pattern</title><desc id="desc">Should processing continue or pause?</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="660" height="930" rx="22" fill="none" stroke="#1f4667" stroke-width="2"/>
<text x="350" y="70" text-anchor="middle" fill="#eaf7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Choose the handoff pattern</text>
<text x="350" y="108" text-anchor="middle" fill="#9fc4dc" font-family="Arial, sans-serif" font-size="19">Should processing continue or pause?</text><rect x="90" y="145" width="520" height="105" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><text x="350" y="188" text-anchor="middle" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Must the pipeline wait?</text><text x="350" y="222" text-anchor="middle" fill="#b9d3e3" font-family="Arial" font-size="18">Define the contract first</text><path d="M350 250 V300" stroke="#688da8" stroke-width="4"/><rect x="60" y="300" width="580" height="255" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><rect x="82" y="322" width="54" height="34" rx="17" fill="#20d6ff" opacity=".18"/><text x="109" y="346" text-anchor="middle" fill="#20d6ff" font-family="Arial" font-size="17" font-weight="700">NO</text><text x="82" y="394" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Continue</text><circle cx="88" cy="427" r="4" fill="#20d6ff"/><text x="103" y="433" fill="#bfd5e5" font-family="Arial" font-size="18">Modern Teams or Outlook</text><circle cx="88" cy="461" r="4" fill="#20d6ff"/><text x="103" y="467" fill="#bfd5e5" font-family="Arial" font-size="18">Define delivery failure</text><rect x="60" y="585" width="580" height="255" rx="20" fill="#0d1d30" stroke="#ffd166" stroke-width="2"/><rect x="82" y="607" width="54" height="34" rx="17" fill="#ffd166" opacity=".18"/><text x="109" y="631" text-anchor="middle" fill="#ffd166" font-family="Arial" font-size="17" font-weight="700">YES</text><text x="82" y="679" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Pause</text><circle cx="88" cy="712" r="4" fill="#ffd166"/><text x="103" y="718" fill="#bfd5e5" font-family="Arial" font-size="18">Use Approval activity</text><circle cx="88" cy="746" r="4" fill="#ffd166"/><text x="103" y="752" fill="#bfd5e5" font-family="Arial" font-size="18">Approve, reject, timeout</text><text x="350" y="920" text-anchor="middle" fill="#9fc4dc" font-family="Arial" font-size="18">Track acknowledgment in an operational queue</text></svg>