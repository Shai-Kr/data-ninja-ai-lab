<svg xmlns="http://www.w3.org/2000/svg" width="700" height="970" viewBox="0 0 700 970" role="img" aria-labelledby="title desc"><title id="title">A controlled migration loop</title><desc id="desc">Preserve intent and prove each replacement</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233b"/></linearGradient></defs><rect width="100%" height="100%" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="660" height="930" rx="22" fill="none" stroke="#1f4667" stroke-width="2"/><text x="350" y="70" text-anchor="middle" fill="#eaf7ff" font-family="Arial" font-size="34" font-weight="700">A controlled migration loop</text><text x="350" y="108" text-anchor="middle" fill="#9fc4dc" font-family="Arial" font-size="19">Preserve intent and prove each replacement</text><rect x="70" y="140" width="560" height="124" rx="18" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="122" cy="202" r="27" fill="#20d6ff" opacity=".18"/><text x="122" y="210" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="22" font-weight="700">1</text><text x="175" y="190" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Inventory</text><text x="175" y="222" fill="#bfd5e5" font-family="Arial" font-size="17">Legacy activity</text><text x="175" y="245" fill="#bfd5e5" font-family="Arial" font-size="17">Owner and trigger</text><path d="M350 264 V288" stroke="#43e6a1" stroke-width="4"/><rect x="70" y="290" width="560" height="124" rx="18" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="122" cy="352" r="27" fill="#20d6ff" opacity=".18"/><text x="122" y="360" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="22" font-weight="700">2</text><text x="175" y="340" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Classify</text><text x="175" y="372" fill="#bfd5e5" font-family="Arial" font-size="17">Notify, acknowledge</text><text x="175" y="395" fill="#bfd5e5" font-family="Arial" font-size="17">or approve</text><path d="M350 414 V438" stroke="#43e6a1" stroke-width="4"/><rect x="70" y="440" width="560" height="124" rx="18" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="122" cy="502" r="27" fill="#20d6ff" opacity=".18"/><text x="122" y="510" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="22" font-weight="700">3</text><text x="175" y="490" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Replace</text><text x="175" y="522" fill="#bfd5e5" font-family="Arial" font-size="17">Modern activity</text><text x="175" y="545" fill="#bfd5e5" font-family="Arial" font-size="17">or operating queue</text><path d="M350 564 V588" stroke="#43e6a1" stroke-width="4"/><rect x="70" y="590" width="560" height="124" rx="18" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="122" cy="652" r="27" fill="#20d6ff" opacity=".18"/><text x="122" y="660" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="22" font-weight="700">4</text><text x="175" y="640" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Test</text><text x="175" y="672" fill="#bfd5e5" font-family="Arial" font-size="17">Five cases and</text><text x="175" y="695" fill="#bfd5e5" font-family="Arial" font-size="17">environment routing</text><path d="M350 714 V738" stroke="#43e6a1" stroke-width="4"/><rect x="70" y="740" width="560" height="124" rx="18" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><circle cx="122" cy="802" r="27" fill="#20d6ff" opacity=".18"/><text x="122" y="810" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="22" font-weight="700">5</text><text x="175" y="790" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Prove</text><text x="175" y="822" fill="#bfd5e5" font-family="Arial" font-size="17">Record result and</text><text x="175" y="845" fill="#bfd5e5" font-family="Arial" font-size="17">rescan inventory</text><text x="350" y="930" text-anchor="middle" fill="#43e6a1" font-family="Arial" font-size="20" font-weight="700">Inventory clean. Test evidence complete.</text></svg>