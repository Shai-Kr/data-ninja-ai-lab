<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Choose the handoff pattern</title><desc id="desc">A simple decision model for Fabric pipeline messaging</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="680" rx="22" fill="none" stroke="#1f4667" stroke-width="2"/>
<text x="600" y="70" text-anchor="middle" fill="#eaf7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Choose the handoff pattern</text>
<text x="600" y="108" text-anchor="middle" fill="#9fc4dc" font-family="Arial, sans-serif" font-size="19">A simple decision model for Fabric pipeline messaging</text><rect x="420" y="145" width="360" height="92" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><text x="600" y="183" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Must the pipeline wait?</text><text x="600" y="215" text-anchor="middle" fill="#b9d3e3" font-family="Arial" font-size="18">Define the business contract first</text>
<path d="M600 237 V295 M600 295 H300 V335 M600 295 H900 V335" stroke="#688da8" stroke-width="4" fill="none"/><text x="430" y="286" fill="#43e6a1" font-family="Arial" font-size="18" font-weight="700">NO</text><text x="755" y="286" fill="#ffd166" font-family="Arial" font-size="18" font-weight="700">YES</text><rect x="100" y="335" width="400" height="265" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><rect x="122" y="357" width="54" height="34" rx="17" fill="#20d6ff" opacity=".18"/><text x="149" y="381" text-anchor="middle" fill="#20d6ff" font-family="Arial" font-size="17" font-weight="700">A</text><text x="122" y="429" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Continue</text><circle cx="128" cy="462" r="4" fill="#20d6ff"/><text x="143" y="468" fill="#bfd5e5" font-family="Arial" font-size="18">Modern Teams or Outlook</text><circle cx="128" cy="496" r="4" fill="#20d6ff"/><text x="143" y="502" fill="#bfd5e5" font-family="Arial" font-size="18">Add owner and next action</text><circle cx="128" cy="530" r="4" fill="#20d6ff"/><text x="143" y="536" fill="#bfd5e5" font-family="Arial" font-size="18">Define delivery failure</text><rect x="700" y="335" width="400" height="265" rx="20" fill="#0d1d30" stroke="#ffd166" stroke-width="2"/><rect x="722" y="357" width="54" height="34" rx="17" fill="#ffd166" opacity=".18"/><text x="749" y="381" text-anchor="middle" fill="#ffd166" font-family="Arial" font-size="17" font-weight="700">B</text><text x="722" y="429" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Pause</text><circle cx="728" cy="462" r="4" fill="#ffd166"/><text x="743" y="468" fill="#bfd5e5" font-family="Arial" font-size="18">Use Approval activity</text><circle cx="728" cy="496" r="4" fill="#ffd166"/><text x="743" y="502" fill="#bfd5e5" font-family="Arial" font-size="18">Approve, reject, timeout</text><circle cx="728" cy="530" r="4" fill="#ffd166"/><text x="743" y="536" fill="#bfd5e5" font-family="Arial" font-size="18">Fail safely if undelivered</text><text x="600" y="670" text-anchor="middle" fill="#9fc4dc" font-family="Arial" font-size="20">Acknowledgment without a pipeline gate belongs in an operational queue</text></svg>