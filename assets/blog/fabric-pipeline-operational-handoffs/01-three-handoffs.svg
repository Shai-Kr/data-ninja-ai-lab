<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Three operational handoffs</title><desc id="desc">The same message channel can support very different business outcomes</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="680" rx="22" fill="none" stroke="#1f4667" stroke-width="2"/>
<text x="600" y="70" text-anchor="middle" fill="#eaf7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Three operational handoffs</text>
<text x="600" y="108" text-anchor="middle" fill="#9fc4dc" font-family="Arial, sans-serif" font-size="19">The same message channel can support very different business outcomes</text><rect x="70" y="155" width="320" height="430" rx="20" fill="#0d1d30" stroke="#20d6ff" stroke-width="2"/><rect x="92" y="177" width="54" height="34" rx="17" fill="#20d6ff" opacity=".18"/><text x="119" y="201" text-anchor="middle" fill="#20d6ff" font-family="Arial" font-size="17" font-weight="700">1</text><text x="92" y="249" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Notify</text><circle cx="98" cy="282" r="4" fill="#20d6ff"/><text x="113" y="288" fill="#bfd5e5" font-family="Arial" font-size="18">Pipeline continues</text><circle cx="98" cy="316" r="4" fill="#20d6ff"/><text x="113" y="322" fill="#bfd5e5" font-family="Arial" font-size="18">Useful run context</text><circle cx="98" cy="350" r="4" fill="#20d6ff"/><text x="113" y="356" fill="#bfd5e5" font-family="Arial" font-size="18">No human decision</text><rect x="440" y="155" width="320" height="430" rx="20" fill="#0d1d30" stroke="#a78bfa" stroke-width="2"/><rect x="462" y="177" width="54" height="34" rx="17" fill="#a78bfa" opacity=".18"/><text x="489" y="201" text-anchor="middle" fill="#a78bfa" font-family="Arial" font-size="17" font-weight="700">2</text><text x="462" y="249" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Acknowledge</text><circle cx="468" cy="282" r="4" fill="#a78bfa"/><text x="483" y="288" fill="#bfd5e5" font-family="Arial" font-size="18">Owner takes action</text><circle cx="468" cy="316" r="4" fill="#a78bfa"/><text x="483" y="322" fill="#bfd5e5" font-family="Arial" font-size="18">Track outside pipeline</text><circle cx="468" cy="350" r="4" fill="#a78bfa"/><text x="483" y="356" fill="#bfd5e5" font-family="Arial" font-size="18">Escalation is explicit</text><rect x="810" y="155" width="320" height="430" rx="20" fill="#0d1d30" stroke="#43e6a1" stroke-width="2"/><rect x="832" y="177" width="54" height="34" rx="17" fill="#43e6a1" opacity=".18"/><text x="859" y="201" text-anchor="middle" fill="#43e6a1" font-family="Arial" font-size="17" font-weight="700">3</text><text x="832" y="249" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Approve</text><circle cx="838" cy="282" r="4" fill="#43e6a1"/><text x="853" y="288" fill="#bfd5e5" font-family="Arial" font-size="18">Pipeline pauses</text><circle cx="838" cy="316" r="4" fill="#43e6a1"/><text x="853" y="322" fill="#bfd5e5" font-family="Arial" font-size="18">Approve, reject, timeout</text><circle cx="838" cy="350" r="4" fill="#43e6a1"/><text x="853" y="356" fill="#bfd5e5" font-family="Arial" font-size="18">Decision is traceable</text><path d="M390 370 H440 M760 370 H810" stroke="#668ca8" stroke-width="4" stroke-dasharray="10 9"/><text x="600" y="660" text-anchor="middle" fill="#6fe7ff" font-family="Arial" font-size="23" font-weight="700">Choose by required outcome, not by delivery channel</text></svg>