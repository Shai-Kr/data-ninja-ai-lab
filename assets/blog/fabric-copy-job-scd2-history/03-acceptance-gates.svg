<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img"><rect width="100%" height="100%" fill="#07111f"/><circle cx="1300" cy="80" r="210" fill="#102c49" opacity=".42"/><circle cx="80" cy="720" r="180" fill="#092a3c" opacity=".35"/><text x="60" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#eef7ff" text-anchor="start">Six gates for trustworthy SCD Type 2 history</text><text x="60" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">Built-in logic still needs an explicit production contract.</text><rect x="55" y="160" width="390" height="190" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="55" y="160" width="8" height="190" rx="4" fill="#36d7ff"/><text x="85" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">1. Key</text><text x="85" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Stable and unique</text><text x="85" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Nulls and reuse tested</text><rect x="505" y="160" width="390" height="190" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="505" y="160" width="8" height="190" rx="4" fill="#6495ff"/><text x="535" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">2. Versions</text><text x="535" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">One current row</text><text x="535" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">No overlapping intervals</text><rect x="955" y="160" width="390" height="190" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="955" y="160" width="8" height="190" rx="4" fill="#48e0a4"/><text x="985" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">3. Time</text><text x="985" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Business and load time</text><text x="985" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Meanings stay separate</text><rect x="55" y="405" width="390" height="190" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="55" y="405" width="8" height="190" rx="4" fill="#ffcc66"/><text x="85" y="453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">4. Deletes</text><text x="85" y="493" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Source meaning defined</text><text x="85" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Recreate behavior tested</text><rect x="505" y="405" width="390" height="190" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="505" y="405" width="8" height="190" rx="4" fill="#36d7ff"/><text x="535" y="453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">5. Evidence</text><text x="535" y="493" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Run and audit metadata</text><text x="535" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Retry leaves no duplicate</text><rect x="955" y="405" width="390" height="190" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="955" y="405" width="8" height="190" rx="4" fill="#48e0a4"/><text x="985" y="453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">6. Consumers</text><text x="985" y="493" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Current view is explicit</text><text x="985" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Facts join to valid time</text><rect x="285" y="670" width="830" height="64" rx="18" fill="#0b3040" stroke="#36d7ff"/><text x="700" y="711" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#eef7ff" text-anchor="middle">Promote only when all six gates have evidence.</text><text x="1358" y="756" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#6f8ba2" text-anchor="end">Shai Karmani • Data Ninja AI Lab</text></svg>