<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" role="img"><rect width="100%" height="100%" fill="#07111f"/><circle cx="660" cy="80" r="210" fill="#102c49" opacity=".42"/><circle cx="80" cy="1020" r="180" fill="#092a3c" opacity=".35"/><text x="60" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#eef7ff" text-anchor="start">Six production gates</text><text x="60" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">Every gate needs evidence before promotion.</text><rect x="50" y="150" width="660" height="135" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="150" width="8" height="135" rx="4" fill="#36d7ff"/><text x="80" y="198" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">1. Key</text><text x="80" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Stable and unique</text><text x="80" y="272" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Nulls and reuse tested</text><rect x="50" y="295" width="660" height="135" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="295" width="8" height="135" rx="4" fill="#6495ff"/><text x="80" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">2. Versions</text><text x="80" y="383" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">One current row</text><text x="80" y="417" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">No overlapping intervals</text><rect x="50" y="440" width="660" height="135" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="440" width="8" height="135" rx="4" fill="#48e0a4"/><text x="80" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">3. Time</text><text x="80" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Business and load time</text><text x="80" y="562" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Meanings stay separate</text><rect x="50" y="585" width="660" height="135" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="585" width="8" height="135" rx="4" fill="#ffcc66"/><text x="80" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">4. Deletes</text><text x="80" y="673" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Source meaning defined</text><text x="80" y="707" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Recreate behavior tested</text><rect x="50" y="730" width="660" height="135" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="730" width="8" height="135" rx="4" fill="#36d7ff"/><text x="80" y="778" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">5. Evidence</text><text x="80" y="818" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Run and audit metadata</text><text x="80" y="852" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Retry leaves no duplicate</text><rect x="50" y="875" width="660" height="135" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="875" width="8" height="135" rx="4" fill="#48e0a4"/><text x="80" y="923" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#eef7ff" text-anchor="start">6. Consumers</text><text x="80" y="963" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Current view is explicit</text><text x="80" y="997" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9bed1" text-anchor="start">Facts join to valid time</text><text x="718" y="1056" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#6f8ba2" text-anchor="end">Shai Karmani • Data Ninja AI Lab</text></svg>