<svg xmlns="http://www.w3.org/2000/svg" width="760" height="990" viewBox="0 0 760 990" role="img"><rect width="100%" height="100%" fill="#07111f"/><circle cx="660" cy="80" r="210" fill="#102c49" opacity=".42"/><circle cx="80" cy="930" r="180" fill="#092a3c" opacity=".35"/><text x="60" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#eef7ff" text-anchor="start">A new state, without lost history</text><text x="60" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">The validity interval makes time explicit.</text><rect x="50" y="165" width="660" height="230" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="165" width="8" height="230" rx="4" fill="#6495ff"/><text x="80" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef7ff" text-anchor="start">Version 1: East</text><text x="80" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#a9bed1" text-anchor="start">Effective from Jan 15</text><text x="80" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#a9bed1" text-anchor="start">Closed on Oct 6</text><text x="80" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#a9bed1" text-anchor="start">Is_Current: false</text><path d="M380 410 V520" stroke="#36d7ff" stroke-width="7"/><circle cx="380" cy="465" r="17" fill="#36d7ff"/><text x="410" y="472" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#eef7ff" text-anchor="start">Region changes</text><rect x="50" y="545" width="660" height="230" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="50" y="545" width="8" height="230" rx="4" fill="#48e0a4"/><text x="80" y="593" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#eef7ff" text-anchor="start">Version 2: West</text><text x="80" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#a9bed1" text-anchor="start">Effective from Oct 6</text><text x="80" y="667" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#a9bed1" text-anchor="start">Open validity interval</text><text x="80" y="701" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#a9bed1" text-anchor="start">Is_Current: true</text><rect x="70" y="825" width="620" height="92" rx="18" fill="#0b3040" stroke="#36d7ff"/><text x="380" y="865" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#eef7ff" text-anchor="middle">One key • one current row</text><text x="380" y="898" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="middle">History remains queryable.</text><text x="718" y="966" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#6f8ba2" text-anchor="end">Shai Karmani • Data Ninja AI Lab</text></svg>