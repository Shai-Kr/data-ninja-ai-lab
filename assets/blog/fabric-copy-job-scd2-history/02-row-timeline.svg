<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img"><rect width="100%" height="100%" fill="#07111f"/><circle cx="1300" cy="80" r="210" fill="#102c49" opacity=".42"/><circle cx="80" cy="660" r="180" fill="#092a3c" opacity=".35"/><text x="60" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#eef7ff" text-anchor="start">A change becomes a new row version</text><text x="60" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">The old version closes. The new version becomes current.</text><path d="M120 385 H1280" stroke="#27445f" stroke-width="8"/><rect x="90" y="175" width="500" height="155" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="90" y="175" width="8" height="155" rx="4" fill="#6495ff"/><text x="120" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#eef7ff" text-anchor="start">Version 1: East</text><text x="120" y="263" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">Valid_From: Jan 15</text><text x="120" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">Valid_To: Oct 6 • Is_Current: false</text><rect x="810" y="175" width="500" height="155" rx="22" fill="#0f2135" stroke="#27445f" stroke-width="2"/><rect x="810" y="175" width="8" height="155" rx="4" fill="#48e0a4"/><text x="840" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#eef7ff" text-anchor="start">Version 2: West</text><text x="840" y="263" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">Valid_From: Oct 6</text><text x="840" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9bed1" text-anchor="start">Valid_To: open • Is_Current: true</text><circle cx="160" cy="385" r="16" fill="#36d7ff"/><text x="160" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#eef7ff" text-anchor="middle">Jan 15</text><text x="160" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#a9bed1" text-anchor="middle">Initial row</text><circle cx="700" cy="385" r="16" fill="#36d7ff"/><text x="700" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#eef7ff" text-anchor="middle">Oct 6</text><text x="700" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#a9bed1" text-anchor="middle">Region changes</text><circle cx="1240" cy="385" r="16" fill="#36d7ff"/><text x="1240" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#eef7ff" text-anchor="middle">Now</text><text x="1240" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" fill="#a9bed1" text-anchor="middle">Current state</text><rect x="210" y="555" width="980" height="92" rx="20" fill="#0b3040" stroke="#36d7ff"/><text x="700" y="596" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#eef7ff" text-anchor="middle">One business key • non-overlapping intervals • one current row</text><text x="700" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#a9bed1" text-anchor="middle">The destination preserves both the previous state and the active state.</text><text x="1358" y="696" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#6f8ba2" text-anchor="end">Shai Karmani • Data Ninja AI Lab</text></svg>