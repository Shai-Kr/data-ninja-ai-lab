<text x="320" y="1055" text-anchor="middle" fill="#a8bdd2" font-family="Arial" font-size="16"><tspan x="320">Measurements keep their source.</tspan><tspan x="320" dy="22">Zero rows remain valid evidence.</tspan></text>
