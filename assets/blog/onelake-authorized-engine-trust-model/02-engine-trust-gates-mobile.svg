<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1190" viewBox="0 0 760 1190" role="img" aria-labelledby="title desc"><title id="title">Six engine trust gates</title><desc id="desc">Evidence before authorization.</desc><rect width="760" height="1190" rx="28" fill="#07111f"/><circle cx="680" cy="70" r="110" fill="#12345b" opacity=".28"/><text x="380" y="58" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Six engine trust gates</text><text x="380" y="88" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16">Evidence before authorization.</text><rect x="65" y="120" width="630" height="135" rx="18" fill="#0d1b2d" stroke="#43d9ff" stroke-width="2"/><text x="100" y="160" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">01</text><text x="155" y="160" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Identity</text><text x="100" y="198" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Named Entra identity</text><text x="100" y="225" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Owner and purpose</text><circle cx="650" cy="157" r="13" fill="#52f2b8"/><path d="M643 157 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="65" y="285" width="630" height="135" rx="18" fill="#0d1b2d" stroke="#43d9ff" stroke-width="2"/><text x="100" y="325" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">02</text><text x="155" y="325" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Scope</text><text x="100" y="363" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Named workspaces</text><text x="100" y="390" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Business reason</text><circle cx="650" cy="322" r="13" fill="#52f2b8"/><path d="M643 322 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="65" y="450" width="630" height="135" rx="18" fill="#0d1b2d" stroke="#43d9ff" stroke-width="2"/><text x="100" y="490" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">03</text><text x="155" y="490" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Policy support</text><text x="100" y="528" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Tables, rows, columns</text><text x="100" y="555" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Known limitations</text><circle cx="650" cy="487" r="13" fill="#52f2b8"/><path d="M643 487 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="65" y="615" width="630" height="135" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="100" y="655" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">04</text><text x="155" y="655" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">User context</text><text x="100" y="693" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Identity end to end</text><text x="100" y="720" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">No shared-user shortcut</text><circle cx="650" cy="652" r="13" fill="#52f2b8"/><path d="M643 652 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="65" y="780" width="630" height="135" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="100" y="820" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">05</text><text x="155" y="820" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Fail closed</text><text x="100" y="858" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Policy failure blocks</text><text x="100" y="885" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">No unfiltered fallback</text><circle cx="650" cy="817" r="13" fill="#52f2b8"/><path d="M643 817 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="65" y="945" width="630" height="135" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="100" y="985" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">06</text><text x="155" y="985" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Evidence</text><text x="100" y="1023" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Audit and retest</text><text x="100" y="1050" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Revocation included</text><circle cx="650" cy="982" r="13" fill="#52f2b8"/><path d="M643 982 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><text x="380" y="1130" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="18" font-weight="700">Six gates. One reviewable trust decision.</text></svg>