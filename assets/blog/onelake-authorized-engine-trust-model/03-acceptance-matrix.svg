<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Test effective access, not only connectivity</title><desc id="desc">The same identity should receive the same authorized slice through every path.</desc><rect width="1200" height="650" rx="28" fill="#07111f"/><circle cx="1120" cy="70" r="110" fill="#12345b" opacity=".28"/><text x="600" y="58" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Test effective access, not only connectivity</text><text x="600" y="88" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16">The same identity should receive the same authorized slice through every path.</text><rect x="55" y="125" width="240" height="60" rx="10" fill="#10243a" stroke="#43d9ff" stroke-width="2"/><text x="175.0" y="163" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Persona</text><rect x="305" y="125" width="225" height="60" rx="10" fill="#10243a" stroke="#43d9ff" stroke-width="2"/><text x="417.5" y="163" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Expected rows</text><rect x="540" y="125" width="245" height="60" rx="10" fill="#10243a" stroke="#43d9ff" stroke-width="2"/><text x="662.5" y="163" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Expected columns</text><rect x="795" y="125" width="350" height="60" rx="10" fill="#10243a" stroke="#43d9ff" stroke-width="2"/><text x="970.0" y="163" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Expected outcome</text><rect x="55" y="195" width="240" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="69" y="238" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">Full-data user</text><rect x="305" y="195" width="225" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="319" y="238" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">All known rows</text><rect x="540" y="195" width="245" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="554" y="238" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">All allowed columns</text><rect x="795" y="195" width="350" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="970.0" y="238" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="15" font-weight="600">Filtered result</text><rect x="55" y="280" width="240" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="69" y="323" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">Regional user</text><rect x="305" y="280" width="225" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="319" y="323" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">Known region only</text><rect x="540" y="280" width="245" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="554" y="323" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">All allowed columns</text><rect x="795" y="280" width="350" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="970.0" y="323" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="15" font-weight="600">Filtered result</text><rect x="55" y="365" width="240" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="69" y="408" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">Restricted-column user</text><rect x="305" y="365" width="225" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="319" y="408" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">Allowed rows</text><rect x="540" y="365" width="245" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="554" y="408" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">Sensitive column hidden</text><rect x="795" y="365" width="350" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="970.0" y="408" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="15" font-weight="600">Filtered result</text><rect x="55" y="450" width="240" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="69" y="493" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">No-access user</text><rect x="305" y="450" width="225" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="319" y="493" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">No rows</text><rect x="540" y="450" width="245" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="554" y="493" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="15" font-weight="400">No columns</text><rect x="795" y="450" width="350" height="72" rx="8" fill="#0d1b2d" stroke="#254361" stroke-width="2"/><text x="970.0" y="493" text-anchor="middle" fill="#ff7d8b" font-family="Arial,sans-serif" font-size="15" font-weight="600">Blocked</text><text x="600" y="580" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="500">Repeat across Direct Lake, Spark, SQL endpoint, and each authorized engine.</text><text x="600" y="612" text-anchor="middle" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Then switch identities, test the cache, revoke access, and run it again.</text></svg>