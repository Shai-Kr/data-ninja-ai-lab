<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc"><title id="title">One policy source</title><desc id="desc">Effective access follows the user.</desc><rect width="760" height="1030" rx="28" fill="#07111f"/><circle cx="680" cy="70" r="110" fill="#12345b" opacity=".28"/><text x="380" y="58" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">One policy source</text><text x="380" y="88" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16">Effective access follows the user.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#43d9ff"/></marker></defs><rect x="90" y="130" width="580" height="150" rx="18" fill="#10243a" stroke="#43d9ff" stroke-width="2"/><text x="380" y="180" text-anchor="middle" fill="#43d9ff" font-family="Arial,sans-serif" font-size="27" font-weight="700">OneLake security</text><text x="380" y="218" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="18" font-weight="400">Roles • tables • rows • columns</text><text x="380" y="250" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Effective access is resolved here</text><path d="M380 280 L380 340" stroke="#43d9ff" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="100" y="340" width="560" height="105" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="380" y="380" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Direct Lake</text><text x="380" y="414" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="16" font-weight="500">Apply policy, return allowed data</text><path d="M380 445 L380 485" stroke="#43d9ff" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="100" y="485" width="560" height="105"