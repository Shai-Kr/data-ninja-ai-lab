<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">One policy source. Multiple enforcement points.</title><desc id="desc">Effective access follows the user to each trusted query path.</desc><rect width="1200" height="620" rx="28" fill="#07111f"/><circle cx="1120" cy="70" r="110" fill="#12345b" opacity=".28"/><text x="600" y="58" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">One policy source. Multiple enforcement points.</text><text x="600" y="88" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16">Effective access follows the user to each trusted query path.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#43d9ff"/></marker></defs><rect x="415" y="145" width="370" height="150" rx="18" fill="#10243a" stroke="#43d9ff" stroke-width="2"/><text x="600" y="190" text-anchor="middle" fill="#43d9ff" font-family="Arial,sans-serif" font-size="26" font-weight="700">OneLake security</text><text x="600" y="225" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="18" font-weight="400">Roles • tables • rows • columns</text><text x="600" y="258" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Source of truth for effective access</text><path d="M600 295 L600 338 M205 338 L995 338" stroke="#43d9ff" stroke-width="4" fill="none"/><path d="M205 338 L205 368" stroke="#43d9ff" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="60" y="375" width="290" height="145" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="205" y="418" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Direct Lake</text><text x="205" y="452" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Apply policy at query time</text><text x="205" y="482" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="16" font-weight="600">Return only allowed data</text><path d="M455 338 L455 368" stroke="#43d9ff" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="310" y="375" width="290" height="145" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="455" y="418" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Spark</text><text x="455" y="452" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Apply policy at query time</text><text x="455" y="482" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="16" font-weight="600">Return only allowed data</text><path d="M705 338 L705 368" stroke="#43d9ff" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="560" y="375" width="290" height="145" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="705" y="418" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">SQL endpoint</text><text x="705" y="452" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Apply policy at query time</text><text x="705" y="482" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="16" font-weight="600">Return only allowed data</text><path d="M955 338 L955 368" stroke="#43d9ff" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="810" y="375" width="290" height="145" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="955" y="418" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Authorized engine</text><text x="955" y="452" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16" font-weight="400">Apply policy at query time</text><text x="955" y="482" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="16" font-weight="600">Return only allowed data</text><text x="600" y="576" text-anchor="middle" fill="#ff7d8b" font-family="Arial,sans-serif" font-size="18" font-weight="600">If the path cannot enforce RLS or CLS safely, access is blocked.</text></svg>