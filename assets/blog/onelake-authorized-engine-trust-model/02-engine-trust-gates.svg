<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Six gates before an engine becomes trusted</title><desc id="desc">Authorization is an operating decision, not a connector toggle.</desc><rect width="1200" height="650" rx="28" fill="#07111f"/><circle cx="1120" cy="70" r="110" fill="#12345b" opacity=".28"/><text x="600" y="58" text-anchor="middle" fill="#edf7ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Six gates before an engine becomes trusted</text><text x="600" y="88" text-anchor="middle" fill="#9db3c8" font-family="Arial,sans-serif" font-size="16">Authorization is an operating decision, not a connector toggle.</text><rect x="55" y="130" width="330" height="180" rx="18" fill="#0d1b2d" stroke="#43d9ff" stroke-width="2"/><text x="83" y="170" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">01</text><text x="130" y="170" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Identity</text><text x="83" y="220" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Named Entra identity</text><text x="83" y="252" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Owner and purpose</text><circle cx="345" cy="168" r="13" fill="#52f2b8"/><path d="M338 168 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="435" y="130" width="330" height="180" rx="18" fill="#0d1b2d" stroke="#43d9ff" stroke-width="2"/><text x="463" y="170" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">02</text><text x="510" y="170" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Scope</text><text x="463" y="220" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Named workspaces</text><text x="463" y="252" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Business reason</text><circle cx="725" cy="168" r="13" fill="#52f2b8"/><path d="M718 168 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="815" y="130" width="330" height="180" rx="18" fill="#0d1b2d" stroke="#43d9ff" stroke-width="2"/><text x="843" y="170" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">03</text><text x="890" y="170" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Policy support</text><text x="843" y="220" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Tables, rows, columns</text><text x="843" y="252" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Known limitations</text><circle cx="1105" cy="168" r="13" fill="#52f2b8"/><path d="M1098 168 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="55" y="355" width="330" height="180" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="83" y="395" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">04</text><text x="130" y="395" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">User context</text><text x="83" y="445" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Identity end to end</text><text x="83" y="477" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">No shared-user shortcut</text><circle cx="345" cy="393" r="13" fill="#52f2b8"/><path d="M338 393 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="435" y="355" width="330" height="180" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="463" y="395" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">05</text><text x="510" y="395" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Fail closed</text><text x="463" y="445" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Policy failure blocks</text><text x="463" y="477" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">No unfiltered fallback</text><circle cx="725" cy="393" r="13" fill="#52f2b8"/><path d="M718 393 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><rect x="815" y="355" width="330" height="180" rx="18" fill="#0d1b2d" stroke="#4c7dff" stroke-width="2"/><text x="843" y="395" text-anchor="start" fill="#43d9ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">06</text><text x="890" y="395" text-anchor="start" fill="#edf7ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Evidence</text><text x="843" y="445" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Audit and retest</text><text x="843" y="477" text-anchor="start" fill="#9db3c8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Revocation included</text><circle cx="1105" cy="393" r="13" fill="#52f2b8"/><path d="M1098 393 l5 5 l10 -12" stroke="#07111f" stroke-width="4" fill="none"/><text x="600" y="606" text-anchor="middle" fill="#52f2b8" font-family="Arial,sans-serif" font-size="18" font-weight="700">Approve the engine only when all six gates have evidence.</text></svg>