<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Custom SQL Pools workload lanes</title>
<desc id="desc">A Fabric Data Warehouse diagram showing separate workload lanes for interactive reports, ETL, and analyst queries.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#38d5ff"/><stop offset="1" stop-color="#7c3cff"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="820" rx="38" fill="url(#bg)"/>
<circle cx="1200" cy="90" r="190" fill="#0ea5e9" opacity="0.12"/>
<circle cx="210" cy="720" r="250" fill="#7c3cff" opacity="0.10"/>
<text x="80" y="86" fill="#e6f7ff" font-family="Inter,Segoe UI,Arial" font-size="42" font-weight="800">Custom SQL Pools make warehouse capacity intentional</text>
<text x="80" y="136" fill="#9fb9c9" font-family="Inter,Segoe UI,Arial" font-size="24">Separate workload lanes instead of letting every job compete the same way</text>
<rect x="80" y="195" width="1240" height="470" rx="28" fill="#0e2236" stroke="#244a68" stroke-width="2"/>
<text x="120" y="250" fill="#dff7ff" font-family="Inter,Segoe UI,Arial" font-size="30" font-weight="750">Fabric Data Warehouse</text>
<g font-family="Inter,Segoe UI,Arial">
  <rect x="120" y="300" width="360" height="275" rx="24" fill="#102f45" stroke="#37d5ff" stroke-width="3"/>
  <text x="150" y="350" fill="#ffffff" font-size="28" font-weight="750">Interactive reports</text>
  <text x="150" y="395" fill="#bfeeff" font-size="22">Goal: lower latency</text>
  <text x="150" y="435" fill="#bfeeff" font-size="22">Pool share: priority lane</text>
  <text x="150" y="475" fill="#bfeeff" font-size="22">Watch: user wait time</text>
  <rect x="150" y="510" width="260" height="22" rx="11" fill="#17384e"/>
  <rect x="150" y="510" width="210" height="22" rx="11" fill="url(#cyan)" filter="url(#glow)"/>
  <text x="150" y="555" fill="#8bdcff" font-size="18">Designed for business hours</text>

  <rect x="520" y="300" width="360" height="275" rx="24" fill="#132642" stroke="#8b5cf6" stroke-width="3"/>
  <text x="550" y="350" fill="#ffffff" font-size="28" font-weight="750">ETL and loading</text>
  <text x="550" y="395" fill="#d9ccff" font-size="22">Goal: predictable spend</text>
  <text x="550" y="435" fill="#d9ccff" font-size="22">Pool share: capped lane</text>
  <text x="550" y="475" fill="#d9ccff" font-size="22">Watch: completion window</text>
  <rect x="550" y="510" width="260" height="22" rx="11" fill="#241f44"/>
  <rect x="550" y="510" width="140" height="22" rx="11" fill="#8b5cf6" filter="url(#glow)"/>
  <text x="550" y="555" fill="#cdbdff" font-size="18">Can run longer when safe</text>

  <rect x="920" y="300" width="360" height="275" rx="24" fill="#102b38" stroke="#34d399" stroke-width="3"/>
  <text x="950" y="350" fill="#ffffff" font-size="28" font-weight="750">Analyst queries</text>
  <text x="950" y="395" fill="#c7ffee" font-size="22">Goal: controlled bursts</text>
  <text x="950" y="435" fill="#c7ffee" font-size="22">Pool share: bounded lane</text>
  <text x="950" y="475" fill="#c7ffee" font-size="22">Watch: concurrency spikes</text>
  <rect x="950" y="510" width="260" height="22" rx="11" fill="#14382e"/>
  <rect x="950" y="510" width="170" height="22" rx="11" fill="#34d399" filter="url(#glow)"/>
  <text x="950" y="555" fill="#a7f3d0" font-size="18">Keeps ad hoc work contained</text>
</g>
<rect x="210" y="705" width="980" height="58" rx="18" fill="#081f30" stroke="#1d5f85"/>
<text x="250" y="742" fill="#cdefff" font-family="Inter,Segoe UI,Arial" font-size="23">The win: performance decisions become policy instead of surprise consumption.</text>
</svg>
