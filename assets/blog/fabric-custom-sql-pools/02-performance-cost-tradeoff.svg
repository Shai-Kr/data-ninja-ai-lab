<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Performance and cost tradeoff</title>
<desc id="desc">A comparison of uncapped and capped warehouse workloads using vNodes and runtime.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061622"/><stop offset="1" stop-color="#10101f"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#39d5ff"/><stop offset="1" stop-color="#7c3cff"/></linearGradient></defs>
<rect width="1400" height="820" rx="38" fill="url(#bg)"/>
<text x="82" y="90" fill="#ecfeff" font-family="Inter,Segoe UI,Arial" font-size="44" font-weight="800">The useful tradeoff is explicit</text>
<text x="82" y="140" fill="#9fb9c9" font-family="Inter,Segoe UI,Arial" font-size="24">Sometimes a slower background job is the cheaper and safer platform choice</text>
<g font-family="Inter,Segoe UI,Arial">
  <rect x="95" y="205" width="570" height="430" rx="30" fill="#0e2236" stroke="#2d5873" stroke-width="2"/>
  <text x="140" y="270" fill="#ffffff" font-size="32" font-weight="760">No Custom SQL Pool</text>
  <text x="140" y="315" fill="#b9d6e5" font-size="22">Workload can scale aggressively</text>
  <text x="140" y="383" fill="#dff7ff" font-size="24">Allocated resources</text>
  <rect x="140" y="410" width="410" height="46" rx="14" fill="#17364c"/>
  <rect x="140" y="410" width="410" height="46" rx="14" fill="url(#bar)"/>
  <text x="570" y="442" fill="#ffffff" font-size="24">10 vNodes</text>
  <text x="140" y="515" fill="#dff7ff" font-size="24">Runtime</text>
  <rect x="140" y="542" width="410" height="46" rx="14" fill="#17364c"/>
  <rect x="140" y="542" width="210" height="46" rx="14" fill="#38d5ff"/>
  <text x="370" y="574" fill="#ffffff" font-size="24">10 sec</text>

  <rect x="735" y="205" width="570" height="430" rx="30" fill="#121d38" stroke="#5b46b3" stroke-width="2"/>
  <text x="780" y="270" fill="#ffffff" font-size="32" font-weight="760">With Custom SQL Pool</text>
  <text x="780" y="315" fill="#d7caff" font-size="22">Workload runs inside a defined lane</text>
  <text x="780" y="383" fill="#eeeaff" font-size="24">Allocated resources</text>
  <rect x="780" y="410" width="410" height="46" rx="14" fill="#211f42"/>
  <rect x="780" y="410" width="205" height="46" rx="14" fill="#8b5cf6"/>
  <text x="1008" y="442" fill="#ffffff" font-size="24">5 vNodes</text>
  <text x="780" y="515" fill="#eeeaff" font-size="24">Runtime</text>
  <rect x="780" y="542" width="410" height="46" rx="14" fill="#211f42"/>
  <rect x="780" y="542" width="360" height="46" rx="14" fill="url(#bar)"/>
  <text x="1160" y="574" fill="#ffffff" font-size="24">20 sec</text>
</g>
<rect x="220" y="695" width="960" height="58" rx="18" fill="#091e2e" stroke="#1d5f85"/>
<text x="260" y="732" fill="#cdefff" font-family="Inter,Segoe UI,Arial" font-size="23">Not every query deserves the fastest lane. Some deserve a budget boundary.</text>
</svg>
