<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Custom SQL Pools rollout checklist</title>
<desc id="desc">A five step rollout checklist for piloting Custom SQL Pools in Fabric Data Warehouse.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0b1020"/></linearGradient></defs>
<rect width="1400" height="820" rx="38" fill="url(#bg)"/>
<text x="80" y="90" fill="#ecfeff" font-family="Inter,Segoe UI,Arial" font-size="44" font-weight="800">A safe rollout beats a clever setting</text>
<text x="80" y="140" fill="#9fb9c9" font-family="Inter,Segoe UI,Arial" font-size="24">Use Custom SQL Pools as an operating model, not a last-minute throttle</text>
<g font-family="Inter,Segoe UI,Arial" font-size="24">
  <rect x="90" y="210" width="1220" height="96" rx="22" fill="#0e2236" stroke="#24516f"/>
  <circle cx="145" cy="258" r="27" fill="#38d5ff"/><text x="136" y="267" fill="#001522" font-weight="800">1</text>
  <text x="195" y="250" fill="#ffffff" font-weight="760">Inventory warehouse workloads</text>
  <text x="195" y="282" fill="#b9d6e5" font-size="20">Separate interactive reports, ETL, background processing, and ad hoc query patterns.</text>

  <rect x="90" y="326" width="1220" height="96" rx="22" fill="#0d2034" stroke="#24516f"/>
  <circle cx="145" cy="374" r="27" fill="#7c3cff"/><text x="136" y="383" fill="#ffffff" font-weight="800">2</text>
  <text x="195" y="366" fill="#ffffff" font-weight="760">Classify by latency and business impact</text>
  <text x="195" y="398" fill="#cfc4ff" font-size="20">Give business-critical reporting different treatment from jobs that can finish later.</text>

  <rect x="90" y="442" width="1220" height="96" rx="22" fill="#0e2236" stroke="#24516f"/>
  <circle cx="145" cy="490" r="27" fill="#34d399"/><text x="136" y="499" fill="#002218" font-weight="800">3</text>
  <text x="195" y="482" fill="#ffffff" font-weight="760">Pilot one bounded pool</text>
  <text x="195" y="514" fill="#bdf7e4" font-size="20">Start with a non-latency-sensitive workload where longer runtime is acceptable.</text>

  <rect x="90" y="558" width="1220" height="96" rx="22" fill="#0d2034" stroke="#24516f"/>
  <circle cx="145" cy="606" r="27" fill="#f59e0b"/><text x="136" y="615" fill="#251500" font-weight="800">4</text>
  <text x="195" y="598" fill="#ffffff" font-weight="760">Measure before and after</text>
  <text x="195" y="630" fill="#ffe1a3" font-size="20">Track runtime, resource allocation, queueing, report latency, and business-hour contention.</text>

  <rect x="90" y="674" width="1220" height="96" rx="22" fill="#0e2236" stroke="#24516f"/>
  <circle cx="145" cy="722" r="27" fill="#38d5ff"/><text x="136" y="731" fill="#001522" font-weight="800">5</text>
  <text x="195" y="714" fill="#ffffff" font-weight="760">Document the policy</text>
  <text x="195" y="746" fill="#b9d6e5" font-size="20">Write down owner, purpose, pool limit, review date, and the reason the tradeoff exists.</text>
</g>
</svg>
