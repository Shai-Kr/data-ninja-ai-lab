<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Declarative file-to-gold pipeline</title><desc id="desc">CSV and Parquet files flow through bronze, silver, and gold materialized lake views.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#101b36"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102642"/><stop offset="1" stop-color="#0b1930"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><circle cx="1080" cy="80" r="180" fill="#713cff" opacity=".1"/><circle cx="110" cy="610" r="210" fill="#00d4ff" opacity=".08"/>
<g font-family="Arial,sans-serif"><text x="70" y="78" fill="#68e5ff" font-size="24" font-weight="700" letter-spacing="3">FABRIC DATA ENGINEERING</text><text x="70" y="128" fill="#f6fbff" font-size="40" font-weight="700">One declarative path from files to gold</text><text x="70" y="166" fill="#a9bbcf" font-size="22">The first mile joins the same managed dependency graph.</text>
<rect x="62" y="236" width="210" height="222" rx="22" fill="url(#card)" stroke="#2d5477" stroke-width="2"/><text x="167" y="282" text-anchor="middle" fill="#68e5ff" font-size="25" font-weight="700">OneLake files</text><rect x="102" y="315" width="130" height="46" rx="10" fill="#122d4b" stroke="#42d9ff"/><text x="167" y="345" text-anchor="middle" fill="#f6fbff" font-size="22">CSV</text><rect x="102" y="378" width="130" height="46" rx="10" fill="#122d4b" stroke="#8b72ff"/><text x="167" y="408" text-anchor="middle" fill="#f6fbff" font-size="22">Parquet</text>
<path d="M275 347H350" stroke="#42d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="365" y="244" width="210" height="206" rx="22" fill="url(#card)" stroke="#be8755" stroke-width="2"/><text x="470" y="291" text-anchor="middle" fill="#efb477" font-size="27" font-weight="700">BRONZE</text><text x="470" y="330" text-anchor="middle" fill="#f6fbff" font-size="23" font-weight="700">File-ingesting MLV</text><text x="470" y="369" text-anchor="middle" fill="#a9bbcf" font-size="19">schema + refresh</text><text x="470" y="400" text-anchor="middle" fill="#a9bbcf" font-size="19">file traceability</text><path d="M580 347H632" stroke="#42d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="647" y="244" width="210" height="206" rx="22" fill="url(#card)" stroke="#a9b7c8" stroke-width="2"/><text x="752" y="291" text-anchor="middle" fill="#d4deea" font-size="27" font-weight="700">SILVER</text><text x="752" y="330" text-anchor="middle" fill="#f6fbff" font-size="23" font-weight="700">Quality rules</text><text x="752" y="369" text-anchor="middle" fill="#a9bbcf" font-size="19">cast + clean</text><text x="752" y="400" text-anchor="middle" fill="#a9bbcf" font-size="19">reject or drop</text><path d="M862 347H914" stroke="#42d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="929" y="244" width="210" height="206" rx="22" fill="url(#card)" stroke="#f2c94c" stroke-width="2"/><text x="1034" y="291" text-anchor="middle" fill="#f2c94c" font-size="27" font-weight="700">GOLD</text><text x="1034" y="330" text-anchor="middle" fill="#f6fbff" font-size="23" font-weight="700">Business-ready</text><text x="1034" y="369" text-anchor="middle" fill="#a9bbcf" font-size="19">aggregate + serve</text><text x="1034" y="400" text-anchor="middle" fill="#a9bbcf" font-size="19">Power BI consumption</text>
<rect x="160" y="521" width="880" height="82" rx="18" fill="#091b31" stroke="#1f6585"/><text x="600" y="555" text-anchor="middle" fill="#68e5ff" font-size="20" font-weight="700">ONE MANAGED OPERATING LAYER</text><text x="600" y="585" text-anchor="middle" fill="#d8e5f2" font-size="19">dependency order  •  scheduled refresh  •  lineage  •  monitoring  •  retries</text></g>
</svg>
