<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Production gate</title><desc id="desc">Six evidence gates for file-ingesting materialized lake views.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#111c37"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112945"/><stop offset="1" stop-color="#0a172b"/></linearGradient></defs><rect width="1200" height="675" rx="30" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="70" y="78" fill="#68e5ff" font-size="24" font-weight="700" letter-spacing="3">PRODUCTION ACCEPTANCE</text><text x="70" y="128" fill="#f6fbff" font-size="40" font-weight="700">Six gates before the first real workload</text><text x="70" y="166" fill="#a9bbcf" font-size="22">Every gate needs evidence, an owner, and a recovery path.</text>
<g transform="translate(70 225)"><rect width="330" height="145" rx="20" fill="url(#c)" stroke="#42d9ff"/><circle cx="42" cy="44" r="24" fill="#123f5c"/><text x="42" y="52" text-anchor="middle" fill="#68e5ff" font-size="23" font-weight="700">1</text><text x="82" y="50" fill="#f6fbff" font-size="23" font-weight="700">Source boundary</text><text x="28" y="95" fill="#b9cada" font-size="18">Path, shortcut, file scope</text><text x="28" y="123" fill="#b9cada" font-size="18">and publishing owner</text></g>
<g transform="translate(435 225)"><rect width="330" height="145" rx="20" fill="url(#c)" stroke="#6f9cff"/><circle cx="42" cy="44" r="24" fill="#193459"/><text x="42" y="52" text-anchor="middle" fill="#8fb2ff" font-size="23" font-weight="700">2</text><text x="82" y="50" fill="#f6fbff" font-size="23" font-weight="700">Parser contract</text><text x="28" y="95" fill="#b9cada" font-size="18">Format, encoding, dates</text><text x="28" y="123" fill="#b9cada" font-size="18">and malformed records</text></g>
<g transform="translate(800 225)"><rect width="330" height="145" rx="20" fill="url(#c)" stroke="#8b72ff"/><circle cx="42" cy="44" r="24" fill="#30245b"/><text x="42" y="52" text-anchor="middle" fill="#b7a9ff" font-size="23" font-weight="700">3</text><text x="82" y="50" fill="#f6fbff" font-size="23" font-weight="700">Schema contract</text><text x="28" y="95" fill="#b9cada" font-size="18">Dynamic or fixed, with</text><text x="28" y="123" fill="#b9cada" font-size="18">documented drift tolerance</text></g>
<g transform="translate(70 405)"><rect width="330" height="145" rx="20" fill="url(#c)" stroke="#f2c94c"/><circle cx="42" cy="44" r="24" fill="#51441d"/><text x="42" y="52" text-anchor="middle" fill="#f2c94c" font-size="23" font-weight="700">4</text><text x="82" y="50" fill="#f6fbff" font-size="23" font-weight="700">Refresh contract</text><text x="28" y="95" fill="#b9cada" font-size="18">Append, full, or mirror</text><text x="28" y="123" fill="#b9cada" font-size="18">tested against source lifecycle</text></g>
<g transform="translate(435 405)"><rect width="330" height="145" rx="20" fill="url(#c)" stroke="#42e0a4"/><circle cx="42" cy="44" r="24" fill="#164839"/><text x="42" y="52" text-anchor="middle" fill="#69f0bd" font-size="23" font-weight="700">5</text><text x="82" y="50" fill="#f6fbff" font-size="23" font-weight="700">Data proof</text><text x="28" y="95" fill="#b9cada" font-size="18">Files, rows, rejects, rules</text><text x="28" y="123" fill="#b9cada" font-size="18">and known business totals</text></g>
<g transform="translate(800 405)"><rect width="330" height="145" rx="20" fill="url(#c)" stroke="#ff7fa5"/><circle cx="42" cy="44" r="24" fill="#54243b"/><text x="42" y="52" text-anchor="middle" fill="#ff9dbc" font-size="23" font-weight="700">6</text><text x="82" y="50" fill="#f6fbff" font-size="23" font-weight="700">Recovery owner</text><text x="28" y="95" fill="#b9cada" font-size="18">Runbook, escalation, retry</text><text x="28" y="123" fill="#b9cada" font-size="18">and closure evidence</text></g>
<rect x="255" y="590" width="690" height="46" rx="14" fill="#0b2036" stroke="#2b6c89"/><text x="600" y="620" text-anchor="middle" fill="#dff8ff" font-size="20" font-weight="700">PASS = repeatable result, explainable change, recoverable failure</text></g></svg>
