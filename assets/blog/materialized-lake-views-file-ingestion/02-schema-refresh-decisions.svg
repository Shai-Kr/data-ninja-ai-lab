<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Schema and refresh decisions</title><desc id="desc">Decision guide for selecting schema and refresh modes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#15102e"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112844"/><stop offset="1" stop-color="#0b172b"/></linearGradient></defs><rect width="1200" height="675" rx="30" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="70" y="78" fill="#68e5ff" font-size="24" font-weight="700" letter-spacing="3">TWO DECISIONS, ONE CONTRACT</text><text x="70" y="128" fill="#f6fbff" font-size="40" font-weight="700">Match Fabric behavior to the source</text><text x="70" y="166" fill="#a9bbcf" font-size="22">A successful refresh is not proof that the lifecycle is correct.</text>
<rect x="60" y="220" width="510" height="390" rx="24" fill="url(#p)" stroke="#2a5b7d" stroke-width="2"/><text x="95" y="270" fill="#68e5ff" font-size="25" font-weight="700">SCHEMA MODE</text>
<rect x="95" y="300" width="200" height="230" rx="18" fill="#0c1f35" stroke="#42d9ff"/><text x="195" y="345" text-anchor="middle" fill="#f6fbff" font-size="26" font-weight="700">DYNAMIC</text><text x="195" y="389" text-anchor="middle" fill="#b9cada" font-size="19">Accept additive drift</text><text x="195" y="423" text-anchor="middle" fill="#b9cada" font-size="19">Missing fields get NULL</text><text x="195" y="473" text-anchor="middle" fill="#68e5ff" font-size="18">Best when change</text><text x="195" y="500" text-anchor="middle" fill="#68e5ff" font-size="18">is expected and safe</text>
<rect x="325" y="300" width="200" height="230" rx="18" fill="#0c1f35" stroke="#8b72ff"/><text x="425" y="345" text-anchor="middle" fill="#f6fbff" font-size="26" font-weight="700">FIXED</text><text x="425" y="389" text-anchor="middle" fill="#b9cada" font-size="19">Pin the contract</text><text x="425" y="423" text-anchor="middle" fill="#b9cada" font-size="19">Reject later drift</text><text x="425" y="473" text-anchor="middle" fill="#b7a9ff" font-size="18">Best when downstream</text><text x="425" y="500" text-anchor="middle" fill="#b7a9ff" font-size="18">stability is the priority</text>
<rect x="610" y="220" width="530" height="390" rx="24" fill="url(#p)" stroke="#4f3d80" stroke-width="2"/><text x="645" y="270" fill="#b7a9ff" font-size="25" font-weight="700">REFRESH MODE</text>
<rect x="645" y="300" width="460" height="74" rx="16" fill="#0c1f35" stroke="#42d9ff"/><text x="675" y="334" fill="#68e5ff" font-size="22" font-weight="700">APPEND_ONLY</text><text x="675" y="359" fill="#b9cada" font-size="17">New immutable files add rows</text>
<rect x="645" y="395" width="460" height="74" rx="16" fill="#0c1f35" stroke="#8b72ff"/><text x="675" y="429" fill="#b7a9ff" font-size="22" font-weight="700">FULL</text><text x="675" y="454" fill="#b9cada" font-size="17">Current folder is the full snapshot</text>
<rect x="645" y="490" width="460" height="74" rx="16" fill="#0c1f35" stroke="#f2c94c"/><text x="675" y="524" fill="#f2c94c" font-size="22" font-weight="700">MIRROR</text><text x="675" y="549" fill="#b9cada" font-size="17">Additions and deletions both matter</text>
<text x="600" y="648" text-anchor="middle" fill="#d8e5f2" font-size="20">Test add  •  replace  •  delete  •  drift  •  retry  •  full reprocess</text></g></svg>
