<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="The Boundary Checklist">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="55%" stop-color="#091a2d"/><stop offset="100%" stop-color="#0b1020"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2742"/><stop offset="100%" stop-color="#0b1b2f"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="820" rx="34" fill="url(#bg)"/>
<circle cx="1180" cy="105" r="220" fill="#15d6ff" opacity="0.10"/>
<circle cx="160" cy="730" r="260" fill="#7c3aed" opacity="0.09"/>
<text x="70" y="88" fill="#e7f8ff" font-family="Inter,Segoe UI,Arial" font-size="44" font-weight="800">The Boundary Checklist</text>
<text x="72" y="135" fill="#9cc7d8" font-family="Inter,Segoe UI,Arial" font-size="24">Before a public data app goes live, review the exact data and action surface.</text>
<rect x="70.0" y="215" width="401.3" height="360" rx="24" fill="url(#card)" stroke="#25c7f7" stroke-opacity="0.50"/>
<text x="98.0" y="273" fill="#45e6ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">01</text>
<text x="98.0" y="317" fill="#f4fbff" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="800">Data</text>
<text x="98.0" y="367" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">Which tables and fields are public?</text>
<text x="98.0" y="405" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">What is excluded?</text>
<text x="98.0" y="443" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">Who owns the contract?</text>
<rect x="499.3" y="215" width="401.3" height="360" rx="24" fill="url(#card)" stroke="#25c7f7" stroke-opacity="0.50"/>
<text x="527.3" y="273" fill="#45e6ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">02</text>
<text x="527.3" y="317" fill="#f4fbff" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="800">Actions</text>
<text x="527.3" y="367" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">Can users read, create, or both?</text>
<text x="527.3" y="405" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">What validation runs first?</text>
<text x="527.3" y="443" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">What abuse pattern is expected?</text>
<rect x="928.7" y="215" width="401.3" height="360" rx="24" fill="url(#card)" stroke="#25c7f7" stroke-opacity="0.50"/>
<text x="956.7" y="273" fill="#45e6ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">03</text>
<text x="956.7" y="317" fill="#f4fbff" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="800">Operations</text>
<text x="956.7" y="367" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">Who monitors usage?</text>
<text x="956.7" y="405" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">How are failures reviewed?</text>
<text x="956.7" y="443" fill="#c8deea" font-family="Inter,Segoe UI,Arial" font-size="22">How quickly can access be disabled?</text>
<rect x="70" y="660" width="1260" height="84" rx="22" fill="#061423" stroke="#1e7494" stroke-opacity="0.6"/>
<text x="102" y="713" fill="#d9f5ff" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="700">The smallest safe public surface is usually the one that survives production contact.</text>
</svg>