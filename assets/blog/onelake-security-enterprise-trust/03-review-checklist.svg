<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Rollout Checklist</title>
<desc id="desc">A small review pattern before broad adoption</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#071a2b"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="760" fill="url(#bg)"/>
<circle cx="1140" cy="110" r="220" fill="#0ea5e9" opacity="0.10"/>
<circle cx="180" cy="620" r="260" fill="#8b5cf6" opacity="0.10"/>
<text x="80" y="92" fill="#e5f5ff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">Rollout Checklist</text>
<text x="80" y="142" fill="#a7c4d8" font-family="Arial, Helvetica, sans-serif" font-size="24">A small review pattern before broad adoption</text>

<rect x="218" y="210" width="300" height="330" rx="28" fill="#0f172a" stroke="#57d6ff" stroke-width="2" opacity="0.98"/>
<circle cx="262" cy="258" r="17" fill="#57d6ff" filter="url(#glow)"/>
<text x="292" y="266" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Inventory</text>
<text x="252" y="322" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Tables and shortcuts</text>
<text x="252" y="356" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Sensitive columns</text>
<text x="252" y="390" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Current RLS and CLS</text>
<rect x="550" y="210" width="300" height="330" rx="28" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" opacity="0.98"/>
<circle cx="594" cy="258" r="17" fill="#8b5cf6" filter="url(#glow)"/>
<text x="624" y="266" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Validate</text>
<text x="584" y="322" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Test nested groups</text>
<text x="584" y="356" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Check service principals</text>
<text x="584" y="390" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Confirm endpoint behavior</text>
<rect x="882" y="210" width="300" height="330" rx="28" fill="#0f172a" stroke="#22c55e" stroke-width="2" opacity="0.98"/>
<circle cx="926" cy="258" r="17" fill="#22c55e" filter="url(#glow)"/>
<text x="956" y="266" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Operate</text>
<text x="916" y="322" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Owner per policy</text>
<text x="916" y="356" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Audit exceptions</text>
<text x="916" y="390" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Retest after changes</text>
<rect x="80" y="610" width="1240" height="78" rx="24" fill="#020617" stroke="#1e3a8a"/>
<text x="112" y="660" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Centralized security only helps if teams test the actual access paths people and agents use.</text>
</svg>