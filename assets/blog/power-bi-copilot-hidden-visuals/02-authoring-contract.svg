<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="The hidden-visual authoring contract">
<rect width="1200" height="620" rx="28" fill="#07111f"/>
<circle cx="1130" cy="70" r="120" fill="#0c6ea8" opacity=".16"/>
<text x="48" y="62" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">The hidden-visual authoring contract</text>
<text x="48" y="92" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="17">Five rules before Copilot uses bookmark context.</text>
<rect x="45" y="155" width="205" height="330" rx="20" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="147" cy="215" r="34" fill="#2dd4ff" opacity=".95"/><text x="147" y="225" fill="#07111f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="147" y="282" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Display-only</text><text x="147" y="325" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Clear Data in the</text><text x="147" y="350" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">bookmark</text><rect x="275" y="155" width="205" height="330" rx="20" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="377" cy="215" r="34" fill="#2dd4ff" opacity=".95"/><text x="377" y="225" fill="#07111f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="377" y="282" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Reachable</text><text x="377" y="325" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Use a button or</text><text x="377" y="350" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">navigator</text><rect x="505" y="155" width="205" height="330" rx="20" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="607" cy="215" r="34" fill="#2dd4ff" opacity=".95"/><text x="607" y="225" fill="#07111f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">3</text><text x="607" y="282" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Clearly named</text><text x="607" y="325" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">State metric, grain,</text><text x="607" y="350" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">and unit</text><rect x="735" y="155" width="205" height="330" rx="20" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="837" cy="215" r="34" fill="#49e6a1" opacity=".95"/><text x="837" y="225" fill="#07111f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">4</text><text x="837" y="282" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">One question</text><text x="837" y="325" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Keep each panel</text><text x="837" y="350" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">coherent</text><rect x="965" y="155" width="205" height="330" rx="20" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="1067" cy="215" r="34" fill="#49e6a1" opacity=".95"/><text x="1067" y="225" fill="#07111f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">5</text><text x="1067" y="282" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Governed</text><text x="1067" y="325" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Test roles, filters,</text><text x="1067" y="350" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">and freshness</text><text x="600" y="555" fill="#6ea8ff" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Hidden is a layout state. It is not a lower quality standard.</text></svg>