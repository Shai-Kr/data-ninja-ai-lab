<svg xmlns="http://www.w3.org/2000/svg" width="720" height="970" viewBox="0 0 720 970" role="img" aria-label="The authoring contract">
<rect width="720" height="970" rx="28" fill="#07111f"/>
<circle cx="650" cy="70" r="120" fill="#0c6ea8" opacity=".16"/>
<text x="48" y="62" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">The authoring contract</text>
<text x="48" y="92" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="17">Five rules for intentional context.</text>
<rect x="55" y="135" width="610" height="135" rx="18" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="110" cy="202" r="30" fill="#2dd4ff"/><text x="110" y="211" fill="#07111f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text><text x="160" y="185" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Display-only</text><text x="160" y="218" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Clear Data in the bookmark</text><rect x="55" y="295" width="610" height="135" rx="18" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="110" cy="362" r="30" fill="#2dd4ff"/><text x="110" y="371" fill="#07111f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text><text x="160" y="345" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Reachable</text><text x="160" y="378" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Use a button or navigator</text><rect x="55" y="455" width="610" height="135" rx="18" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="110" cy="522" r="30" fill="#2dd4ff"/><text x="110" y="531" fill="#07111f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text><text x="160" y="505" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Clearly named</text><text x="160" y="538" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">State metric, grain, and unit</text><rect x="55" y="615" width="610" height="135" rx="18" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="110" cy="682" r="30" fill="#49e6a1"/><text x="110" y="691" fill="#07111f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">4</text><text x="160" y="665" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">One question</text><text x="160" y="698" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Keep each panel coherent</text><rect x="55" y="775" width="610" height="135" rx="18" fill="#10243a" stroke="#294761" stroke-width="2"/><circle cx="110" cy="842" r="30" fill="#49e6a1"/><text x="110" y="851" fill="#07111f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">5</text><text x="160" y="825" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Governed</text><text x="160" y="858" fill="#a8bdd0" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Test roles, filters, and freshness</text></svg>