<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#081120"/><stop offset="0.58" stop-color="#102347"/><stop offset="1" stop-color="#073B46"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#132A55"/><stop offset="1" stop-color="#0C4350"/></linearGradient>
    <style>.title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#F7FBFF}.sub{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#BDD9F6}.head{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}.body{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#CBE1F2}.metric{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#55F3D1}.card{fill:url(#card);stroke:#55F3D1;stroke-opacity:.62;stroke-width:2}.chip{fill:#65E8FF;fill-opacity:.12;stroke:#65E8FF;stroke-width:1.5}</style>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <text x="70" y="82" class="title">One Operational Surface, Two Kinds of Context</text>
  <text x="70" y="118" class="sub">Real-time metrics explain what changed. Fabric Maps show where the change matters.</text>
  <rect x="70" y="180" width="390" height="500" rx="30" class="card"/>
  <text x="112" y="235" class="head">Live operational signals</text>
  <rect x="112" y="278" width="306" height="102" rx="18" class="chip"/><text x="140" y="320" class="body">Open incidents</text><text x="140" y="360" class="metric">27</text>
  <rect x="112" y="402" width="306" height="102" rx="18" class="chip"/><text x="140" y="444" class="body">Threshold breaches</text><text x="140" y="484" class="metric">6</text>
  <rect x="112" y="526" width="306" height="102" rx="18" class="chip"/><text x="140" y="568" class="body">Median response</text><text x="140" y="608" class="metric">18 min</text>
  <rect x="505" y="180" width="825" height="500" rx="30" class="card"/>
  <text x="548" y="235" class="head">Geographic operating context</text>
  <path d="M585 300 C680 245 752 292 830 250 C930 198 1030 250 1115 220 C1200 190 1260 250 1250 335 C1240 430 1160 450 1130 548 C1090 650 980 620 910 584 C820 538 770 635 680 585 C590 535 535 390 585 300Z" fill="#123B5D" stroke="#78DFFF" stroke-width="3"/>
  <path d="M662 332 C745 305 820 348 850 412 C884 484 952 472 1010 430 C1075 382 1158 410 1202 485" fill="none" stroke="#55F3D1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="680" cy="330" r="19" fill="#FFCC66"/><circle cx="856" cy="414" r="27" fill="#FF6B8A"/><circle cx="1010" cy="430" r="18" fill="#FFCC66"/><circle cx="1198" cy="485" r="24" fill="#FF6B8A"/>
  <rect x="590" y="600" width="190" height="42" rx="21" class="chip"/><text x="624" y="627" class="body">Affected corridor</text>
  <rect x="800" y="600" width="195" height="42" rx="21" class="chip"/><text x="836" y="627" class="body">Priority sites</text>
  <rect x="1015" y="600" width="250" height="42" rx="21" class="chip"/><text x="1045" y="627" class="body">Viewer-controlled layers</text>
</svg>
