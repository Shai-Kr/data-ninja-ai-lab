<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#08101D"/><stop offset=".55" stop-color="#10264C"/><stop offset="1" stop-color="#063943"/></linearGradient>
    <style>.title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#F7FBFF}.sub{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#BDD9F6}.num{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#071A24}.head{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}.body{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#CBE1F2}.card{fill:#102D50;stroke:#60EBD2;stroke-opacity:.62;stroke-width:2}.dot{fill:#60EBD2}</style>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <text x="70" y="82" class="title">A Production-Minded Rollout</text>
  <text x="70" y="118" class="sub">Start with one decision loop, prove the value, then widen the operating surface.</text>
  <rect x="70" y="190" width="390" height="190" rx="28" class="card"/><circle cx="120" cy="242" r="25" class="dot"/><text x="112" y="251" class="num">1</text><text x="160" y="247" class="head">Choose the decision</text><text x="112" y="300" class="body">Pick one workflow where location</text><text x="112" y="327" class="body">changes the next operational action.</text>
  <rect x="505" y="190" width="390" height="190" rx="28" class="card"/><circle cx="555" cy="242" r="25" class="dot"/><text x="547" y="251" class="num">2</text><text x="595" y="247" class="head">Align the scope</text><text x="547" y="300" class="body">Match geographic grain, metric grain,</text><text x="547" y="327" class="body">locked filters, and refresh timing.</text>
  <rect x="940" y="190" width="390" height="190" rx="28" class="card"/><circle cx="990" cy="242" r="25" class="dot"/><text x="982" y="251" class="num">3</text><text x="1030" y="247" class="head">Test real permissions</text><text x="982" y="300" class="body">Validate viewer, regional, restricted,</text><text x="982" y="327" class="body">and support-owner experiences.</text>
  <rect x="286" y="430" width="390" height="190" rx="28" class="card"/><circle cx="336" cy="482" r="25" class="dot"/><text x="328" y="491" class="num">4</text><text x="376" y="487" class="head">Design the action path</text><text x="328" y="540" class="body">Connect the map and metrics to an</text><text x="328" y="567" class="body">owner, alert, runbook, or workflow.</text>
  <rect x="724" y="430" width="390" height="190" rx="28" class="card"/><circle cx="774" cy="482" r="25" class="dot"/><text x="766" y="491" class="num">5</text><text x="814" y="487" class="head">Measure the outcome</text><text x="766" y="540" class="body">Track whether location reduced</text><text x="766" y="567" class="body">diagnosis time or improved response.</text>
  <rect x="456" y="666" width="488" height="54" rx="27" fill="#60EBD2" fill-opacity=".17" stroke="#60EBD2" stroke-width="2"/><text x="515" y="700" class="head">One useful loop before one large rollout</text>
</svg>
