<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="t d"><title id="t">Mobile report release flow</title><desc id="d">Five stacked release gates.</desc><rect width="720" height="1050" rx="32" fill="#081425"/><text x="42" y="70" fill="#fff" font-family="Arial" font-size="31" font-weight="700">Five gates to mobile release</text><text x="42" y="108" fill="#9db0ca" font-family="Arial" font-size="19">Recheck when pages or navigation change.</text><path d="M90 190v660" stroke="#24445f" stroke-width="9"/><g font-family="Arial"><g transform="translate(90 210)"><circle r="35" fill="#25d9ff"/><text y="9" text-anchor="middle" font-size="24" font-weight="700">1</text><text x="70" y="-4" fill="#fff" font-size="25" font-weight="700">Inventory</text><text x="70" y="30" fill="#b9c9dd" font-size="19">Scope pages and entry paths</text></g><g transform="translate(90 355)"><circle r="35" fill="#25d9ff"/><text y="9" text-anchor="middle" font-size="24" font-weight="700">2</text><text x="70" y="-4" fill="#fff" font-size="25" font-weight="700">Generate</text><text x="70" y="30" fill="#b9c9dd" font-size="19">Create the starting layout</text></g><g transform="translate(90 500)"><circle r="35" fill="#a57cff"/><text y="9" text-anchor="middle" font-size="24" font-weight="700">3</text><text x="70" y="-4" fill="#fff" font-size="25" font-weight="700">Design</text><text x="70" y="30" fill="#b9c9dd" font-size="19">Preserve the user's task</text></g><g transform="translate(90 645)"><circle r="35" fill="#a57cff"/><text y="9" text-anchor="middle" font-size="24" font-weight="700">4</text><text x="70" y="-4" fill="#fff" font-size="25" font-weight="700">Validate</text><text x="70" y="30" fill="#b9c9dd" font-size="19">Test the path on a phone</text></g><g transform="translate(90 790)"><circle r="35" fill="#47f0b5"/><text y="9" text-anchor="middle" font-size="24" font-weight="700">5</text><text x="70" y="-4" fill="#fff" font-size="25" font-weight="700">Release</text><text x="70" y="30" fill="#b9c9dd" font-size="19">Publish with evidence</text></g></g><rect x="42" y="900" width="636" height="74" rx="28" fill="#102c3f" stroke="#47f0b5"/><text x="360" y="946" text-anchor="middle" fill="#47f0b5" font-family="Arial" font-size="21" font-weight="700">The user's task is the acceptance unit</text></svg>
