<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="t d"><title id="t">Page-level mobile coverage</title><desc id="d">Four stacked stages from inventory to evidence.</desc><rect width="720" height="1050" rx="32" fill="#081425"/><text x="42" y="70" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Mobile coverage by page</text><text x="42" y="108" fill="#9db0ca" font-family="Arial" font-size="19">The icon starts the review. Evidence finishes it.</text><g font-family="Arial"><g transform="translate(42 155)"><rect width="636" height="165" rx="22" fill="#112943" stroke="#25d9ff" stroke-width="2"/><circle cx="48" cy="50" r="23" fill="#25d9ff"/><text x="48" y="58" text-anchor="middle" font-size="22" font-weight="700">1</text><text x="88" y="58" fill="#fff" font-size="25" font-weight="700">Inventory</text><text x="30" y="108" fill="#bdcce0" font-size="19">Pages, entry paths, scope, owner</text></g><g transform="translate(42 350)"><rect width="636" height="165" rx="22" fill="#112943" stroke="#25d9ff" stroke-width="2"/><circle cx="48" cy="50" r="23" fill="#25d9ff"/><text x="48" y="58" text-anchor="middle" font-size="22" font-weight="700">2</text><text x="88" y="58" fill="#fff" font-size="25" font-weight="700">Coverage</text><text x="30" y="108" fill="#bdcce0" font-size="19">Present, excluded, missing, prioritized</text></g><g transform="translate(42 545)"><rect width="636" height="165" rx="22" fill="#112943" stroke="#a57cff" stroke-width="2"/><circle cx="48" cy="50" r="23" fill="#a57cff"/><text x="48" y="58" text-anchor="middle" font-size="22" font-weight="700">3</text><text x="88" y="58" fill="#fff" font-size="25" font-weight="700">Validation</text><text x="30" y="108" fill="#bdcce0" font-size="19">Readability, filters, paths, device behavior</text></g><g transform="translate(42 740)"><rect width="636" height="165" rx="22" fill="#112943" stroke="#47f0b5" stroke-width="2"/><circle cx="48" cy="50" r="23" fill="#47f0b5"/><text x="48" y="58" text-anchor="middle" font-size="22" font-weight="700">4</text><text x="88" y="58" fill="#fff" font-size="25" font-weight="700">Evidence</text><text x="30" y="108" fill="#bdcce0" font-size="19">Version, tests, exclusions, approval</text></g></g><text x="360" y="980" text-anchor="middle" fill="#25d9ff" font-family="Arial" font-size="22" font-weight="700">Measure the pages users actually open</text></svg>
