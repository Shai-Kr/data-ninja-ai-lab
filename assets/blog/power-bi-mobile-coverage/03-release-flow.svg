<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Mobile report release flow</title><desc id="d">Five gates from inventory to controlled release.</desc><rect width="1200" height="680" rx="36" fill="#081425"/><text x="70" y="90" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Turn one icon into a five-gate release flow</text><text x="70" y="132" fill="#99aec8" font-family="Arial" font-size="21">Fast enough for regular changes. Specific enough to catch gaps.</text><path d="M110 345h980" stroke="#24445f" stroke-width="10" stroke-linecap="round"/><g font-family="Arial"><g transform="translate(110 345)"><circle r="38" fill="#25d9ff"/><text y="9" text-anchor="middle" font-size="25" font-weight="700">1</text><text y="95" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">INVENTORY</text><text y="128" text-anchor="middle" fill="#aebfd4" font-size="17">Scope pages</text></g><g transform="translate(355 345)"><circle r="38" fill="#25d9ff"/><text y="9" text-anchor="middle" font-size="25" font-weight="700">2</text><text y="95" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">GENERATE</text><text y="128" text-anchor="middle" fill="#aebfd4" font-size="17">Create the base</text></g><g transform="translate(600 345)"><circle r="38" fill="#a57cff"/><text y="9" text-anchor="middle" font-size="25" font-weight="700">3</text><text y="95" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">DESIGN</text><text y="128" text-anchor="middle" fill="#aebfd4" font-size="17">Preserve the task</text></g><g transform="translate(845 345)"><circle r="38" fill="#a57cff"/><text y="9" text-anchor="middle" font-size="25" font-weight="700">4</text><text y="95" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">VALIDATE</text><text y="128" text-anchor="middle" fill="#aebfd4" font-size="17">Test the path</text></g><g transform="translate(1090 345)"><circle r="38" fill="#47f0b5"/><text y="9" text-anchor="middle" font-size="25" font-weight="700">5</text><text y="95" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">RELEASE</text><text y="128" text-anchor="middle" fill="#aebfd4" font-size="17">Record evidence</text></g></g><rect x="225" y="540" width="750" height="64" rx="32" fill="#102c3f" stroke="#47f0b5"/><text x="600" y="581" text-anchor="middle" fill="#47f0b5" font-family="Arial" font-size="23" font-weight="700">Recheck whenever pages or navigation change</text></svg>
