<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Mobile acceptance matrix</title><desc id="d">Five checks applied across report pages.</desc><rect width="1200" height="680" rx="36" fill="#081425"/><text x="70" y="88" fill="#fff" font-family="Arial" font-size="38" font-weight="700">A layout is present. Does the task still work?</text><text x="70" y="130" fill="#99aec8" font-family="Arial" font-size="21">Test every in-scope page against the same acceptance contract.</text><g font-family="Arial"><rect x="70" y="190" width="1060" height="340" rx="24" fill="#102640" stroke="#294867"/><g fill="#fff" font-size="19" font-weight="700"><text x="98" y="235">PAGE</text><text x="320" y="235">READABLE</text><text x="500" y="235">FILTERS</text><text x="650" y="235">NAVIGATION</text><text x="835" y="235">INTERACTION</text><text x="1000" y="235">EVIDENCE</text></g><g stroke="#294867"><path d="M70 260h1060M70 330h1060M70 400h1060M70 470h1060"/><path d="M280 190v340M462 190v340M629 190v340M796 190v340M963 190v340"/></g><g fill="#bfd0e5" font-size="19"><text x="98" y="305">Overview</text><text x="98" y="375">Exceptions</text><text x="98" y="445">Drillthrough</text><text x="98" y="515">Detail</text></g><g fill="#47f0b5" font-size="28" font-weight="700"><text x="360" y="307">✓</text><text x="530" y="307">✓</text><text x="695" y="307">✓</text><text x="860" y="307">✓</text><text x="1025" y="307">✓</text><text x="360" y="377">✓</text><text x="530" y="377">✓</text><text x="695" y="377">✓</text><text x="1025" y="377">✓</text><text x="360" y="447">✓</text><text x="695" y="447">✓</text><text x="860" y="447">✓</text><text x="1025" y="447">✓</text></g><g fill="#ffbd69" font-size="19" font-weight="700"><text x="825" y="377">RETEST</text><text x="515" y="447">N/A</text><text x="325" y="517">MISSING</text></g></g><text x="600" y="610" text-anchor="middle" fill="#a57cff" font-family="Arial" font-size="24" font-weight="700">Presence, function, and release state are separate facts</text></svg>
