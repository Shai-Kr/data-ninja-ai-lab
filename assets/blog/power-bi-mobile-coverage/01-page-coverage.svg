<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Page-level mobile coverage</title><desc id="d">Four stages from page inventory to release evidence.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101f38"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#g)"/><text x="70" y="90" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Mobile coverage is a page-level contract</text><text x="70" y="132" fill="#9db0ca" font-family="Arial" font-size="21">A layout icon starts the review. It does not finish it.</text><g font-family="Arial"><g transform="translate(70 205)"><rect width="235" height="300" rx="24" fill="#112943" stroke="#25d9ff" stroke-width="2"/><circle cx="42" cy="48" r="22" fill="#25d9ff"/><text x="42" y="56" text-anchor="middle" font-size="22" font-weight="700">1</text><text x="28" y="102" fill="#fff" font-size="25" font-weight="700">Inventory</text><text x="28" y="150" fill="#bed0e4" font-size="19">Every page</text><text x="28" y="188" fill="#bed0e4" font-size="19">Entry path</text><text x="28" y="226" fill="#bed0e4" font-size="19">Mobile scope</text><text x="28" y="264" fill="#bed0e4" font-size="19">Named owner</text></g><g transform="translate(345 205)"><rect width="235" height="300" rx="24" fill="#112943" stroke="#25d9ff" stroke-width="2"/><circle cx="42" cy="48" r="22" fill="#25d9ff"/><text x="42" y="56" text-anchor="middle" font-size="22" font-weight="700">2</text><text x="28" y="102" fill="#fff" font-size="25" font-weight="700">Coverage</text><text x="28" y="150" fill="#bed0e4" font-size="19">Icon present</text><text x="28" y="188" fill="#bed0e4" font-size="19">Excluded by design</text><text x="28" y="226" fill="#bed0e4" font-size="19">Missing layout</text><text x="28" y="264" fill="#bed0e4" font-size="19">Priority</text></g><g transform="translate(620 205)"><rect width="235" height="300" rx="24" fill="#112943" stroke="#a57cff" stroke-width="2"/><circle cx="42" cy="48" r="22" fill="#a57cff"/><text x="42" y="56" text-anchor="middle" font-size="22" font-weight="700">3</text><text x="28" y="102" fill="#fff" font-size="25" font-weight="700">Validation</text><text x="28" y="150" fill="#bed0e4" font-size="19">Readable content</text><text x="28" y="188" fill="#bed0e4" font-size="19">Filters and state</text><text x="28" y="226" fill="#bed0e4" font-size="19">Navigation paths</text><text x="28" y="264" fill="#bed0e4" font-size="19">Device behavior</text></g><g transform="translate(895 205)"><rect width="235" height="300" rx="24" fill="#112943" stroke="#47f0b5" stroke-width="2"/><circle cx="42" cy="48" r="22" fill="#47f0b5"/><text x="42" y="56" text-anchor="middle" font-size="22" font-weight="700">4</text><text x="28" y="102" fill="#fff" font-size="25" font-weight="700">Evidence</text><text x="28" y="150" fill="#bed0e4" font-size="19">Report version</text><text x="28" y="188" fill="#bed0e4" font-size="19">Tested pages</text><text x="28" y="226" fill="#bed0e4" font-size="19">Known exclusions</text><text x="28" y="264" fill="#bed0e4" font-size="19">Approval</text></g></g><text x="600" y="600" text-anchor="middle" fill="#25d9ff" font-family="Arial" font-size="25" font-weight="700">Measured coverage beats a report-level assumption</text></svg>
