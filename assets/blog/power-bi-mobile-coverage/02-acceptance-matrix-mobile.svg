<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="t d"><title id="t">Mobile acceptance matrix</title><desc id="d">Five acceptance checks as stacked cards.</desc><rect width="720" height="1050" rx="32" fill="#081425"/><text x="42" y="70" fill="#fff" font-family="Arial" font-size="31" font-weight="700">Does the task still work?</text><text x="42" y="108" fill="#9db0ca" font-family="Arial" font-size="19">Use the same contract for every in-scope page.</text><g font-family="Arial"><g transform="translate(42 160)"><rect width="636" height="125" rx="20" fill="#112943" stroke="#25d9ff"/><text x="28" y="48" fill="#25d9ff" font-size="22" font-weight="700">READABILITY</text><text x="28" y="88" fill="#c2d1e4" font-size="19">Labels, KPIs, context work without zoom</text></g><g transform="translate(42 315)"><rect width="636" height="125" rx="20" fill="#112943" stroke="#25d9ff"/><text x="28" y="48" fill="#25d9ff" font-size="22" font-weight="700">FILTER STATE</text><text x="28" y="88" fill="#c2d1e4" font-size="19">Defaults, slicers, reset return known results</text></g><g transform="translate(42 470)"><rect width="636" height="125" rx="20" fill="#112943" stroke="#a57cff"/><text x="28" y="48" fill="#a57cff" font-size="22" font-weight="700">NAVIGATION</text><text x="28" y="88" fill="#c2d1e4" font-size="19">Buttons, bookmarks, drillthrough keep context</text></g><g transform="translate(42 625)"><rect width="636" height="125" rx="20" fill="#112943" stroke="#a57cff"/><text x="28" y="48" fill="#a57cff" font-size="22" font-weight="700">INTERACTION</text><text x="28" y="88" fill="#c2d1e4" font-size="19">Tap, focus mode, drill, orientation make sense</text></g><g transform="translate(42 780)"><rect width="636" height="125" rx="20" fill="#112943" stroke="#47f0b5"/><text x="28" y="48" fill="#47f0b5" font-size="22" font-weight="700">EVIDENCE</text><text x="28" y="88" fill="#c2d1e4" font-size="19">Version, result, exception, reviewer, approval</text></g></g><text x="360" y="980" text-anchor="middle" fill="#47f0b5" font-family="Arial" font-size="22" font-weight="700">A visible icon is only the first check</text></svg>
