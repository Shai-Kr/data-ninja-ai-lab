<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Item Recovery safety net operating model</title>
  <desc id="desc">A readable diagram showing deleted items moving through a recovery window into validation and trusted restore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#10243d"/><stop offset="1" stop-color="#09131f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132d4d"/><stop offset="1" stop-color="#0d1c31"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="190" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="170" cy="610" r="220" fill="#60a5fa" opacity="0.09"/>
  <text x="70" y="90" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Fabric Item Recovery</text>
  <text x="70" y="136" fill="#9fc3df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">Default safety net for supported deleted items</text>
  <rect x="75" y="210" width="300" height="180" rx="30" fill="url(#card)" stroke="#284969"/>
  <rect x="450" y="210" width="300" height="180" rx="30" fill="url(#card)" stroke="#2dd4bf" stroke-width="3"/>
  <rect x="825" y="210" width="300" height="180" rx="30" fill="url(#card)" stroke="#284969"/>
  <text x="120" y="275" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Delete</text>
  <text x="120" y="326" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">Supported item</text>
  <text x="505" y="275" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Recover</text>
  <text x="505" y="326" fill="#2dd4bf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">3 day default</text>
  <text x="880" y="275" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Validate</text>
  <text x="880" y="326" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">Safe to use</text>
  <path d="M392 300 H430" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/><path d="M420 282 L448 300 L420 318" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M767 300 H805" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/><path d="M795 282 L823 300 L795 318" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="500" width="944" height="88" rx="24" fill="#0b1829" stroke="#254562"/>
  <text x="210" y="555" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Restore helps. The runbook makes it reliable.</text>
</svg>
