<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Item Recovery safety net operating model</title>
  <desc id="desc">A dark technical diagram showing deleted items moving through a recovery window into validation and restored trusted use.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#10243d"/><stop offset="1" stop-color="#09131f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132d4d"/><stop offset="1" stop-color="#0d1c31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1000" cy="80" r="190" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="170" cy="610" r="220" fill="#60a5fa" opacity="0.09"/>
  <text x="70" y="88" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Fabric Item Recovery</text>
  <text x="70" y="126" fill="#9fc3df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">A default safety net for supported deleted items</text>
  <g filter="url(#shadow)">
    <rect x="78" y="205" width="250" height="190" rx="28" fill="url(#card)" stroke="#284969"/>
    <rect x="475" y="205" width="250" height="190" rx="28" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <rect x="872" y="205" width="250" height="190" rx="28" fill="url(#card)" stroke="#284969"/>
  </g>
  <text x="122" y="254" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">1. Delete happens</text>
  <text x="122" y="296" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Report, semantic model,</text>
  <text x="122" y="324" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Lakehouse item, or other</text>
  <text x="122" y="352" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">supported Fabric item.</text>
  <text x="512" y="254" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">2. Recovery window</text>
  <text x="512" y="296" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Default enabled for</text>
  <text x="512" y="324" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">unconfigured tenants.</text>
  <text x="512" y="352" fill="#2dd4bf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">3 day default window</text>
  <text x="916" y="254" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">3. Validate restore</text>
  <text x="916" y="296" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Check ownership, access,</text>
  <text x="916" y="324" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">refresh, dependencies,</text>
  <text x="916" y="352" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">and downstream users.</text>
  <path d="M348 300 H455" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="M444 286 L466 300 L444 314" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M746 300 H853" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="M842 286 L864 300 L842 314" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="160" y="500" width="880" height="82" rx="24" fill="#0b1829" stroke="#254562"/>
  <text x="220" y="550" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750">The restore button helps. The admin runbook makes it reliable.</text>
</svg>
