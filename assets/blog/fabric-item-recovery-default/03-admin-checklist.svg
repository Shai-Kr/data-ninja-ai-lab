<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Item Recovery admin checklist</title>
  <desc id="desc">A readable checklist for tenant setting, retention, owner, validation, and governance feedback.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101e"/><stop offset="0.55" stop-color="#10243d"/><stop offset="1" stop-color="#08111d"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="86" fill="#eff9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Item Recovery admin checklist</text>
  <text x="70" y="132" fill="#9db9d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27">Turn restore into a runbook before the incident.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="90" y="185" width="1020" height="74" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="138" cy="222" r="24" fill="#2dd4bf"/><text x="131" y="231" fill="#06212a" font-size="24" font-weight="900">1</text>
    <text x="182" y="232" fill="#e6f6ff" font-size="30" font-weight="800">Confirm the tenant setting</text>
    <rect x="90" y="278" width="1020" height="74" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="138" cy="315" r="24" fill="#60a5fa"/><text x="131" y="324" fill="#06162a" font-size="24" font-weight="900">2</text>
    <text x="182" y="325" fill="#e6f6ff" font-size="30" font-weight="800">Choose 3 to 90 days intentionally</text>
    <rect x="90" y="371" width="1020" height="74" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="138" cy="408" r="24" fill="#c084fc"/><text x="131" y="417" fill="#1f0b2f" font-size="24" font-weight="900">3</text>
    <text x="182" y="418" fill="#e6f6ff" font-size="30" font-weight="800">Assign restore ownership</text>
    <rect x="90" y="464" width="1020" height="74" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="138" cy="501" r="24" fill="#fbbf24"/><text x="131" y="510" fill="#2d1a05" font-size="24" font-weight="900">4</text>
    <text x="182" y="511" fill="#e6f6ff" font-size="30" font-weight="800">Validate after restore</text>
    <rect x="90" y="557" width="1020" height="74" rx="22" fill="#091525" stroke="#244463"/>
    <circle cx="138" cy="594" r="24" fill="#34d399"/><text x="131" y="603" fill="#06241a" font-size="24" font-weight="900">5</text>
    <text x="182" y="604" fill="#dff6ff" font-size="30" font-weight="800">Learn from every deletion event</text>
  </g>
</svg>
