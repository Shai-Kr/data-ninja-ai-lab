<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Item Recovery admin checklist</title>
  <desc id="desc">A checklist for Fabric admins covering tenant setting, retention window, restore owner, validation, and governance feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101e"/><stop offset="0.55" stop-color="#10243d"/><stop offset="1" stop-color="#08111d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.30"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="82" fill="#eff9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Fabric Item Recovery checklist</text>
  <text x="70" y="118" fill="#9db9d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Turn default recovery into an admin runbook before the first incident.</text>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">
    <rect x="85" y="178" width="1030" height="86" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="135" cy="221" r="22" fill="#2dd4bf"/><text x="128" y="229" fill="#06212a" font-weight="900">1</text>
    <text x="178" y="215" fill="#e6f6ff" font-weight="750">Confirm the tenant setting</text><text x="178" y="244" fill="#a9c7dc" font-size="18">Know whether recovery is explicit policy or the new default.</text>
    <rect x="85" y="282" width="1030" height="86" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="135" cy="325" r="22" fill="#60a5fa"/><text x="128" y="333" fill="#06162a" font-weight="900">2</text>
    <text x="178" y="319" fill="#e6f6ff" font-weight="750">Choose the retention window</text><text x="178" y="348" fill="#a9c7dc" font-size="18">Use 3 to 90 days based on reporting speed, risk, and operating maturity.</text>
    <rect x="85" y="386" width="1030" height="86" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="135" cy="429" r="22" fill="#c084fc"/><text x="128" y="437" fill="#1f0b2f" font-weight="900">3</text>
    <text x="178" y="423" fill="#e6f6ff" font-weight="750">Assign restore ownership</text><text x="178" y="452" fill="#a9c7dc" font-size="18">Define who requests, validates, restores, and confirms the item is safe to use.</text>
    <rect x="85" y="490" width="1030" height="86" rx="22" fill="#10243d" stroke="#2b4f73"/>
    <circle cx="135" cy="533" r="22" fill="#fbbf24"/><text x="128" y="541" fill="#2d1a05" font-weight="900">4</text>
    <text x="178" y="527" fill="#e6f6ff" font-weight="750">Validate after restore</text><text x="178" y="556" fill="#a9c7dc" font-size="18">Check permissions, refresh, dependencies, downstream reports, and production readiness.</text>
    <rect x="85" y="594" width="1030" height="54" rx="18" fill="#091525" stroke="#244463"/>
    <text x="178" y="628" fill="#dff6ff" font-size="20" font-weight="750">5. Learn from deletion events: permissions, naming, automation, and workspace hygiene.</text>
  </g>
</svg>
