<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Default policy decision flow for Fabric admins</title>
  <desc id="desc">A readable decision flow showing explicit policy, default enablement, and admin retention choice.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081020"/><stop offset="1" stop-color="#101c33"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="92" fill="#eff9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Admin policy flow</text>
  <text x="70" y="140" fill="#9db9d3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">Default safety net first. Deliberate policy next.</text>
  <rect x="85" y="230" width="275" height="150" rx="28" fill="#10243d" stroke="#2b4f73"/>
  <text x="125" y="292" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Tenant</text>
  <text x="125" y="340" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">Setting exists?</text>
  <rect x="465" y="170" width="285" height="130" rx="26" fill="#132d4d" stroke="#60a5fa" stroke-width="3"/>
  <text x="512" y="224" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Yes</text>
  <text x="512" y="268" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">Keep policy</text>
  <rect x="465" y="385" width="285" height="130" rx="26" fill="#123548" stroke="#2dd4bf" stroke-width="3"/>
  <text x="512" y="439" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">No</text>
  <text x="512" y="483" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">Enable default</text>
  <rect x="845" y="230" width="280" height="150" rx="28" fill="#10243d" stroke="#2b4f73"/>
  <text x="890" y="292" fill="#e6f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Admin</text>
  <text x="890" y="340" fill="#a9c7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">3 to 90 days</text>
  <path d="M380 305 H445" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/><path d="M432 286 L462 305 L432 324" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M380 305 C420 305 420 450 445 450" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/><path d="M432 431 L462 450 L432 469" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M765 235 C820 235 820 305 825 305" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <path d="M765 450 C820 450 820 305 825 305" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/>
</svg>
