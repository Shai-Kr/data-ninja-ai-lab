<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CDC is a trust contract</title>
  <desc id="desc">The real design issue is history, deletes, latency, ownership, and auditability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1930"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font: 700 42px Inter, Segoe UI, Arial, sans-serif; fill: #f4fbff; }
      .sub { font: 400 22px Inter, Segoe UI, Arial, sans-serif; fill: #9fc8d8; }
      .card { fill: rgba(13,31,54,.9); stroke: #22d3ee; stroke-width: 2; rx: 24; }
      .card2 { fill: rgba(13,31,54,.86); stroke: #60a5fa; stroke-width: 2; rx: 24; }
      .head { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #e6fbff; }
      .txt { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #c7dbe8; }
      .small { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #8fc9db; }
      .arrow { stroke: #22d3ee; stroke-width: 6; fill: none; marker-end: url(#arrow); filter:url(#glow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="210" fill="#0ea5e9" opacity=".12"/>
  <circle cx="110" cy="650" r="220" fill="#22d3ee" opacity=".09"/>
  <text x="70" y="78" class="title">CDC is a trust contract</text>
  <text x="70" y="116" class="sub">The real design issue is history, deletes, latency, ownership, and auditability.</text>
  
  <rect x="80" y="180" width="470" height="420" class="card"/>
  <text x="120" y="240" class="head">Old pattern</text>
  <text x="120" y="305" class="txt">Full reloads or custom scripts</text>
  <text x="120" y="355" class="txt">Manual delete handling</text>
  <text x="120" y="405" class="txt">History depends on pipeline code</text>
  <text x="120" y="455" class="txt">Audit trail is hard to explain</text>
  <text x="120" y="525" class="small">Works until the system grows,</text>
  <text x="120" y="555" class="small">then every exception becomes architecture.</text>
  <rect x="650" y="180" width="470" height="420" class="card2"/>
  <text x="690" y="240" class="head">Fabric Copy Job CDC</text>
  <text x="690" y="305" class="txt">Only changed records move</text>
  <text x="690" y="355" class="txt">SCD Type 2 keeps history</text>
  <text x="690" y="405" class="txt">Soft deletes keep traceability</text>
  <text x="690" y="455" class="txt">Replication lives in Data Factory</text>
  <text x="690" y="525" class="small">A platform pattern the team</text>
  <text x="690" y="555" class="small">can operate and discuss explicitly.</text>
  <path d="M560 390 C590 390 610 390 640 390" class="arrow"/>
  <text x="95" y="675" class="sub">Better question: how do we trust the data after it changes?</text>

</svg>