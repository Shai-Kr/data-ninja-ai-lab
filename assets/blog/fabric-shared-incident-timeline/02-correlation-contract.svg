<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" rx="34" fill="#071426"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#fff" font-size="38" font-weight="700">THE CORRELATION CONTRACT</text><text x="70" y="120" fill="#9db3d2" font-size="20">Turn separate telemetry records into one operational story.</text><g text-anchor="middle"><g fill="#102d4e" stroke="#2877b8" stroke-width="2"><rect x="60" y="180" width="205" height="330" rx="24"/><rect x="280" y="180" width="205" height="330" rx="24"/><rect x="500" y="180" width="205" height="330" rx="24"/><rect x="720" y="180" width="205" height="330" rx="24"/></g><rect x="940" y="180" width="205" height="330" rx="24" fill="#143849" stroke="#72f1c9" stroke-width="3"/><g fill="#61ddff" font-size="28" font-weight="700"><text x="163" y="250">01</text><text x="383" y="250">02</text><text x="603" y="250">03</text><text x="823" y="250">04</text><text x="1043" y="250" fill="#9affdc">05</text></g><g fill="#fff" font-size="18" font-weight="700"><text x="163" y="300">TIME</text><text x="383" y="300">IDENTITY</text><text x="603" y="300">EXECUTION</text><text x="823" y="300">SERVICE</text><text x="1043" y="300">OWNERSHIP</text></g><g fill="#bcd0e8" font-size="15"><text x="163" y="350">Timestamp</text><text x="163" y="382">Ordered window</text><text x="383" y="350">Workspace ID</text><text x="383" y="382">Item + environment</text><text x="603" y="350">Run ID</text><text x="603" y="382">Parent trigger</text><text x="823" y="350">Business service</text><text x="823" y="382">User impact</text><text x="1043" y="350" fill="#d8fff2">Severity</text><text x="1043" y="382" fill="#d8fff2">Owner + action</text></g></g><rect x="225" y="555" width="750" height="60" rx="16" fill="#0d2239" stroke="#315779"/><text x="600" y="592" text-anchor="middle" fill="#d8e8fb" font-size="18" font-weight="700">PLATFORM SIGNALS + BUSINESS CONTEXT = ACTIONABLE EVIDENCE</text></g></svg>
