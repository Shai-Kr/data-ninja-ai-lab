<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980"><rect width="720" height="980" rx="32" fill="#071426"/><g font-family="Arial,sans-serif"><text x="360" y="68" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">CORRELATION CONTRACT</text><text x="360" y="104" text-anchor="middle" fill="#9db3d2" font-size="16">Five layers connect telemetry to action</text><g font-size="17" font-weight="700"><g transform="translate(70 150)"><rect width="580" height="115" rx="20" fill="#102d4e" stroke="#2877b8" stroke-width="2"/><text x="45" y="66" text-anchor="middle" fill="#61ddff">01</text><text x="95" y="48" fill="#fff">TIME</text><text x="95" y="78" fill="#bcd0e8" font-size="14" font-weight="400">Timestamp, order, investigation window</text></g><g transform="translate(70 285)"><rect width="580" height="115" rx="20" fill="#102d4e" stroke="#2877b8" stroke-width="2"/><text x="45" y="66" text-anchor="middle" fill="#61ddff">02</text><text x="95" y="48" fill="#fff">IDENTITY</text><text x="95" y="78" fill="#bcd0e8" font-size="14" font-weight="400">Workspace, item, environment</text></g><g transform="translate(70 420)"><rect width="580" height="115" rx="20" fill="#103448" stroke="#00d4ff" stroke-width="3"/><text x="45" y="66" text-anchor="middle" fill="#9af0ff">03</text><text x="95" y="48" fill="#fff">EXECUTION</text><text x="95" y="78" fill="#d1eff8" font-size="14" font-weight="400">Run ID, parent trigger, state</text></g><g transform="translate(70 555)"><rect width="580" height="115" rx="20" fill="#102d4e" stroke="#2877b8" stroke-width="2"/><text x="45" y="66" text-anchor="middle" fill="#61ddff">04</text><text x="95" y="48" fill="#fff">BUSINESS SERVICE</text><text x="95" y="78" fill="#bcd0e8" font-size="14" font-weight="400">Service, criticality, user impact</text></g><g transform="translate(70 690)"><rect width="580" height="115" rx="20" fill="#143849" stroke="#72f1c9" stroke-width="3"/><text x="45" y="66" text-anchor="middle" fill="#9affdc">05</text><text x="95" y="48" fill="#fff">OWNERSHIP</text><text x="95" y="78" fill="#d8fff2" font-size="14" font-weight="400">Severity, owner, next action</text></g></g><rect x="70" y="845" width="580" height="70" rx="16" fill="#0d2239" stroke="#315779"/><text x="360" y="875" text-anchor="middle" fill="#d8e8fb" font-size="14" font-weight="700">PLATFORM SIGNALS + BUSINESS CONTEXT</text><text x="360" y="898" text-anchor="middle" fill="#72f1c9" font-size="14" font-weight="700">ACTIONABLE EVIDENCE</text></g></svg>
