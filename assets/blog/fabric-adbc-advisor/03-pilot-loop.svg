<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img"><title>The controlled ADBC pilot loop</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="grid"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#071522}.grid{stroke:#15344a;stroke-width:1}.card{fill:#0d2233;stroke:#2dd4bf;stroke-width:2}.blue{fill:#0d2233;stroke:#38bdf8;stroke-width:2}.amber{fill:#221d14;stroke:#fbbf24;stroke-width:2}.red{fill:#28151a;stroke:#fb7185;stroke-width:2}.green{fill:#11251f;stroke:#34d399;stroke-width:2}.title{fill:#f1f5f9;font-size:44px;font-weight:700}.sub{fill:#94a3b8;font-size:22px}.h{fill:#e2e8f0;font-size:27px;font-weight:700}.t{fill:#cbd5e1;font-size:20px}.small{fill:#94a3b8;font-size:17px}.num{fill:#071522;font-size:20px;font-weight:800}.arrow{stroke:#38bdf8;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="100%" height="100%" class="bg"/><rect width="100%" height="100%" fill="url(#g)" opacity=".42"/><text x="60" y="78" class="title">The controlled ADBC pilot loop</text><text x="60" y="116" class="sub">Measure the same evidence before and after the driver change</text><rect x="70" y="190" width="330" height="180" rx="22" class="card"/><circle cx="108" cy="232" r="20" fill="#38bdf8"/><text x="108" y="239" text-anchor="middle" class="num">1</text><text x="142" y="241" class="h">Baseline</text><text x="100" y="284" class="t">Current path</text><text x="100" y="314" class="t">Known totals</text><rect x="470" y="190" width="330" height="180" rx="22" class="blue"/><circle cx="508" cy="232" r="20" fill="#38bdf8"/><text x="508" y="239" text-anchor="middle" class="num">2</text><text x="542" y="241" class="h">Pilot</text><text x="500" y="284" class="t">Cloud ADBC</text><text x="500" y="314" class="t">Copied item</text><rect x="870" y="190" width="330" height="180" rx="22" class="blue"/><circle cx="908" cy="232" r="20" fill="#38bdf8"/><text x="908" y="239" text-anchor="middle" class="num">3</text><text x="942" y="241" class="h">Compare</text><text x="900" y="284" class="t">Rows and types</text><text x="900" y="314" class="t">Refresh duration</text><rect x="870" y="480" width="330" height="180" rx="22" class="blue"/><circle cx="908" cy="522" r="20" fill="#38bdf8"/><text x="908" y="529" text-anchor="middle" class="num">4</text><text x="942" y="531" class="h">Review</text><text x="900" y="574" class="t">Business owner</text><text x="900" y="604" class="t">Technical owner</text><rect x="470" y="480" width="330" height="180" rx="22" class="blue"/><circle cx="508" cy="522" r="20" fill="#38bdf8"/><text x="508" y="529" text-anchor="middle" class="num">5</text><text x="542" y="531" class="h">Promote</text><text x="500" y="574" class="t">Approved change</text><text x="500" y="604" class="t">Rollback ready</text><rect x="70" y="480" width="330" height="180" rx="22" class="card"/><circle cx="108" cy="522" r="20" fill="#38bdf8"/><text x="108" y="529" text-anchor="middle" class="num">6</text><text x="142" y="531" class="h">Rescan</text><text x="100" y="574" class="t">Risk removed</text><text x="100" y="604" class="t">Delta recorded</text><path d="M400 280 H470" class="arrow"/><path d="M800 280 H870" class="arrow"/><path d="M1035 370 V480" class="arrow"/><path d="M870 570 H800" class="arrow"/><path d="M470 570 H400" class="arrow"/><path d="M235 480 V370" class="arrow"/><text x="700" y="735" text-anchor="middle" class="sub">Close the item only when the rescan and the business result agree.</text></svg>