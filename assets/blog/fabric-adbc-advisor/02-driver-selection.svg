<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img"><title>Which driver will run?</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="grid"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#071522}.grid{stroke:#15344a;stroke-width:1}.card{fill:#0d2233;stroke:#2dd4bf;stroke-width:2}.blue{fill:#0d2233;stroke:#38bdf8;stroke-width:2}.amber{fill:#221d14;stroke:#fbbf24;stroke-width:2}.red{fill:#28151a;stroke:#fb7185;stroke-width:2}.green{fill:#11251f;stroke:#34d399;stroke-width:2}.title{fill:#f1f5f9;font-size:44px;font-weight:700}.sub{fill:#94a3b8;font-size:22px}.h{fill:#e2e8f0;font-size:27px;font-weight:700}.t{fill:#cbd5e1;font-size:20px}.small{fill:#94a3b8;font-size:17px}.num{fill:#071522;font-size:20px;font-weight:800}.arrow{stroke:#38bdf8;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="100%" height="100%" class="bg"/><rect width="100%" height="100%" fill="url(#g)" opacity=".42"/><text x="60" y="78" class="title">Which driver will run?</text><text x="60" y="116" class="sub">Test the execution path you intend to prove</text><rect x="70" y="175" width="390" height="190" rx="22" class="blue"/><text x="100" y="226" class="h">Explicit implementation</text><text x="100" y="269" class="t">2.0 selects ADBC</text><text x="100" y="299" class="t">1.0 selects legacy ODBC</text><text x="100" y="329" class="t">Explicit value wins</text><rect x="505" y="175" width="390" height="190" rx="22" class="card"/><text x="535" y="226" class="h">No implementation pin</text><text x="535" y="269" class="t">Workspace override first</text><text x="535" y="299" class="t">Then tenant default</text><text x="535" y="329" class="t">Cloud service execution</text><rect x="940" y="175" width="390" height="190" rx="22" class="amber"/><text x="970" y="226" class="h">Gateway-routed refresh</text><text x="970" y="269" class="t">Uses gateway-bundled driver</text><text x="970" y="299" class="t">Can defer service cutover</text><text x="970" y="329" class="t">Not a permanent opt-out</text><path d="M265 365 V455" class="arrow"/><path d="M700 365 V455" class="arrow"/><path d="M1135 365 V455" class="arrow"/><rect x="120" y="455" width="500" height="230" rx="22" class="green"/><text x="150" y="506" class="h">ADBC validation path</text><text x="150" y="549" class="t">Use a cloud connection</text><text x="150" y="579" class="t">Compare rows, types, duration</text><text x="150" y="609" class="t">Review downstream totals</text><rect x="780" y="455" width="500" height="230" rx="22" class="red"/><text x="810" y="506" class="h">False confidence path</text><text x="810" y="549" class="t">Enable workspace ADBC</text><text x="810" y="579" class="t">Keep refresh on gateway</text><text x="810" y="609" class="t">Assume ADBC was tested</text><text x="700" y="755" text-anchor="middle" class="sub">A successful refresh only proves the path that actually executed.</text></svg>