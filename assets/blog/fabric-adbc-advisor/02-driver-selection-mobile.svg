<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1340" viewBox="0 0 720 1340" role="img"><title>Which driver runs?</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="grid"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.bg{fill:#071522}.grid{stroke:#15344a;stroke-width:1}.card{fill:#0d2233;stroke:#2dd4bf;stroke-width:2}.blue{fill:#0d2233;stroke:#38bdf8;stroke-width:2}.amber{fill:#221d14;stroke:#fbbf24;stroke-width:2}.red{fill:#28151a;stroke:#fb7185;stroke-width:2}.green{fill:#11251f;stroke:#34d399;stroke-width:2}.title{fill:#f1f5f9;font-size:44px;font-weight:700}.sub{fill:#94a3b8;font-size:22px}.h{fill:#e2e8f0;font-size:27px;font-weight:700}.t{fill:#cbd5e1;font-size:20px}.small{fill:#94a3b8;font-size:17px}.num{fill:#071522;font-size:20px;font-weight:800}.arrow{stroke:#38bdf8;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="100%" height="100%" class="bg"/><rect width="100%" height="100%" fill="url(#g)" opacity=".42"/><text x="60" y="78" class="title">Which driver runs?</text><text x="60" y="116" class="sub">Follow the real execution path</text><rect x="70" y="170" width="580" height="230" rx="22" class="blue"/><circle cx="108" cy="212" r="20" fill="#38bdf8"/><text x="108" y="219" text-anchor="middle" class="num">1</text><text x="142" y="221" class="h">Explicit implementation</text><text x="100" y="264" class="t">2.0: ADBC</text><text x="100" y="294" class="t">1.0: legacy ODBC</text><text x="100" y="324" class="t">Pin takes priority</text><path d="M360 400 V440" class="arrow"/><rect x="70" y="450" width="580" height="230" rx="22" class="card"/><circle cx="108" cy="492" r="20" fill="#38bdf8"/><text x="108" y="499" text-anchor="middle" class="num">2</text><text x="142" y="501" class="h">No implementation pin</text><text x="100" y="544" class="t">Workspace override</text><text x="100" y="574" class="t">Tenant default</text><text x="100" y="604" class="t">Cloud execution</text><path d="M360 680 V720" class="arrow"/><rect x="70" y="730" width="580" height="230" rx="22" class="amber"/><circle cx="108" cy="772" r="20" fill="#38bdf8"/><text x="108" y="779" text-anchor="middle" class="num">3</text><text x="142" y="781" class="h">Gateway refresh</text><text x="100" y="824" class="t">Gateway-bundled driver</text><text x="100" y="854" class="t">Temporary deferral</text><text x="100" y="884" class="t">Separate validation path</text><path d="M360 960 V1000" class="arrow"/><rect x="70" y="1010" width="580" height="230" rx="22" class="green"/><circle cx="108" cy="1052" r="20" fill="#38bdf8"/><text x="108" y="1059" text-anchor="middle" class="num">4</text><text x="142" y="1061" class="h">Proof of ADBC</text><text x="100" y="1104" class="t">Use a cloud connection</text><text x="100" y="1134" class="t">Compare output and duration</text><text x="100" y="1164" class="t">Review before promotion</text></svg>