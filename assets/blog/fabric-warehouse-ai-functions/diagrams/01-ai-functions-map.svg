<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Warehouse AI functions map</title>
  <desc id="desc">A map of Fabric Warehouse AI functions grouped by practical use case.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#020712"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1140" cy="110" r="220" fill="#0ea5e9" opacity="0.10"/>
  <circle cx="220" cy="690" r="260" fill="#22d3ee" opacity="0.08"/>
  <text x="70" y="86" fill="#e5f6ff" font-size="44" font-family="Inter, Segoe UI, Arial" font-weight="800">Fabric Warehouse AI functions</text>
  <text x="70" y="130" fill="#9ccfe3" font-size="24" font-family="Inter, Segoe UI, Arial">Use T-SQL to enrich text before it reaches reports, semantic models, or agent workflows.</text>

  <rect x="82" y="205" width="360" height="150" rx="26" fill="#08243a" stroke="#26c6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="118" y="250" fill="#dff8ff" font-size="27" font-family="Inter, Segoe UI, Arial" font-weight="800">Understand text</text>
  <text x="118" y="292" fill="#8fe7ff" font-size="22" font-family="Inter, Segoe UI, Arial">AI_ANALYZE_SENTIMENT</text>
  <text x="118" y="326" fill="#8fe7ff" font-size="22" font-family="Inter, Segoe UI, Arial">AI_SUMMARIZE</text>

  <rect x="520" y="205" width="360" height="150" rx="26" fill="#0b2035" stroke="#4ade80" stroke-width="2"/>
  <text x="556" y="250" fill="#eafff1" font-size="27" font-family="Inter, Segoe UI, Arial" font-weight="800">Structure text</text>
  <text x="556" y="292" fill="#b7f7c9" font-size="22" font-family="Inter, Segoe UI, Arial">AI_CLASSIFY</text>
  <text x="556" y="326" fill="#b7f7c9" font-size="22" font-family="Inter, Segoe UI, Arial">AI_EXTRACT</text>

  <rect x="958" y="205" width="360" height="150" rx="26" fill="#241b3b" stroke="#a78bfa" stroke-width="2"/>
  <text x="994" y="250" fill="#f4edff" font-size="27" font-family="Inter, Segoe UI, Arial" font-weight="800">Improve text</text>
  <text x="994" y="292" fill="#d8c8ff" font-size="22" font-family="Inter, Segoe UI, Arial">AI_TRANSLATE</text>
  <text x="994" y="326" fill="#d8c8ff" font-size="22" font-family="Inter, Segoe UI, Arial">AI_FIX_GRAMMAR</text>

  <rect x="330" y="445" width="740" height="132" rx="28" fill="#102033" stroke="#facc15" stroke-width="2"/>
  <text x="372" y="494" fill="#fff8d4" font-size="29" font-family="Inter, Segoe UI, Arial" font-weight="800">Generate controlled responses</text>
  <text x="372" y="539" fill="#fde68a" font-size="23" font-family="Inter, Segoe UI, Arial">AI_GENERATE_RESPONSE(prompt, data)</text>


  <rect x="112" y="660" width="1176" height="70" rx="20" fill="#071827" stroke="#1d9eca" stroke-width="1.5"/>
  <text x="154" y="704" fill="#b9edff" font-size="24" font-family="Inter, Segoe UI, Arial">Best use: materialized enrichment columns, staging tables, reviewed outputs, and governed refresh patterns.</text>
</svg>
