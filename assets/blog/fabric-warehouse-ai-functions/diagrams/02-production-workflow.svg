<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Production workflow for AI functions in Fabric Warehouse</title>
  <desc id="desc">A six-step workflow for using AI functions safely in Fabric Warehouse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset="1" stop-color="#081827"/></linearGradient>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="82" fill="#e9fbff" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">A safer pattern for AI-in-SQL</text>
  <text x="70" y="126" fill="#9dd8ec" font-size="23" font-family="Inter, Segoe UI, Arial">Do not bury AI calls inside report queries. Treat each output as a governed transformation.</text>

  <g font-family="Inter, Segoe UI, Arial">
    <rect x="82" y="210" width="190" height="135" rx="22" fill="#09263a" stroke="#22d3ee" stroke-width="2"/>
    <text x="112" y="255" fill="#dff8ff" font-size="25" font-weight="800">1. Profile</text>
    <text x="112" y="292" fill="#a7eaff" font-size="19">Find blanks,</text>
    <text x="112" y="318" fill="#a7eaff" font-size="19">length, volume,</text>
    <text x="112" y="344" fill="#a7eaff" font-size="19">and noise.</text>

    <rect x="305" y="210" width="190" height="135" rx="22" fill="#0a2236" stroke="#38bdf8" stroke-width="2"/>
    <text x="335" y="255" fill="#e3f8ff" font-size="25" font-weight="800">2. Choose</text>
    <text x="335" y="292" fill="#afeaff" font-size="19">Select the</text>
    <text x="335" y="318" fill="#afeaff" font-size="19">right function</text>
    <text x="335" y="344" fill="#afeaff" font-size="19">for the task.</text>

    <rect x="528" y="210" width="190" height="135" rx="22" fill="#0f2533" stroke="#4ade80" stroke-width="2"/>
    <text x="558" y="255" fill="#ecfff2" font-size="25" font-weight="800">3. Stage</text>
    <text x="558" y="292" fill="#b9f7cf" font-size="19">Write outputs</text>
    <text x="558" y="318" fill="#b9f7cf" font-size="19">to staging or</text>
    <text x="558" y="344" fill="#b9f7cf" font-size="19">enrichment cols.</text>

    <rect x="751" y="210" width="190" height="135" rx="22" fill="#172338" stroke="#facc15" stroke-width="2"/>
    <text x="781" y="255" fill="#fff9d8" font-size="25" font-weight="800">4. Fallback</text>
    <text x="781" y="292" fill="#fde68a" font-size="19">Handle NULL,</text>
    <text x="781" y="318" fill="#fde68a" font-size="19">token limits,</text>
    <text x="781" y="344" fill="#fde68a" font-size="19">and rejects.</text>

    <rect x="974" y="210" width="190" height="135" rx="22" fill="#251b3a" stroke="#c084fc" stroke-width="2"/>
    <text x="1004" y="255" fill="#f6edff" font-size="25" font-weight="800">5. Review</text>
    <text x="1004" y="292" fill="#dfc7ff" font-size="19">Sample outputs</text>
    <text x="1004" y="318" fill="#dfc7ff" font-size="19">before business</text>
    <text x="1004" y="344" fill="#dfc7ff" font-size="19">use.</text>

    <rect x="1197" y="210" width="150" height="135" rx="22" fill="#2a1722" stroke="#fb7185" stroke-width="2"/>
    <text x="1227" y="255" fill="#ffe8ee" font-size="25" font-weight="800">6. Audit</text>
    <text x="1227" y="292" fill="#fecdd3" font-size="19">Track owner,</text>
    <text x="1227" y="318" fill="#fecdd3" font-size="19">cost, labels,</text>
    <text x="1227" y="344" fill="#fecdd3" font-size="19">and refresh.</text>
  </g>

  <g stroke="#79dfff" stroke-width="4" fill="none" opacity="0.65">
    <path d="M273 278 L304 278"/><path d="M496 278 L527 278"/><path d="M719 278 L750 278"/><path d="M942 278 L973 278"/><path d="M1165 278 L1196 278"/>
  </g>

  <rect x="122" y="485" width="1156" height="140" rx="28" fill="#071827" stroke="#1a93c4" stroke-width="2"/>
  <text x="166" y="535" fill="#dff8ff" font-size="28" font-family="Inter, Segoe UI, Arial" font-weight="800">Governance rule</text>
  <text x="166" y="579" fill="#aee8ff" font-size="23" font-family="Inter, Segoe UI, Arial">If the output affects a KPI, a customer record, a workflow, or an AI agent, it needs ownership and validation.</text>
</svg>
