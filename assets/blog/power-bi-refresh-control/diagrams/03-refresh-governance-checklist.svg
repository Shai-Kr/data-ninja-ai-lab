<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="Power BI refresh governance checklist">
  <rect width="1400" height="800" fill="#061826"/>
  <text x="70" y="86" fill="#e6f7ff" font-family="Inter,Arial" font-size="46" font-weight="800">Refresh control needs team rules</text>
  <text x="72" y="130" fill="#9ac7d8" font-family="Inter,Arial" font-size="24">The feature is useful when ownership is explicit.</text>
  <g font-family="Inter,Arial">
    <rect x="110" y="205" width="1180" height="95" rx="24" fill="#0d2a42" stroke="#22d3ee" stroke-width="3"/><circle cx="165" cy="252" r="24" fill="#22d3ee"/><text x="156" y="260" fill="#05212f" font-size="24" font-weight="900">1</text><text x="215" y="260" fill="#e6f7ff" font-size="28" font-weight="800">Document which tables can be refreshed independently.</text>
    <rect x="110" y="330" width="1180" height="95" rx="24" fill="#0d2a42" stroke="#22c55e" stroke-width="3"/><circle cx="165" cy="377" r="24" fill="#22c55e"/><text x="156" y="385" fill="#05212f" font-size="24" font-weight="900">2</text><text x="215" y="385" fill="#e6f7ff" font-size="28" font-weight="800">Decide who can run schema sync in production.</text>
    <rect x="110" y="455" width="1180" height="95" rx="24" fill="#0d2a42" stroke="#a78bfa" stroke-width="3"/><circle cx="165" cy="502" r="24" fill="#a78bfa"/><text x="156" y="510" fill="#05212f" font-size="24" font-weight="900">3</text><text x="215" y="510" fill="#e6f7ff" font-size="28" font-weight="800">Separate emergency refresh from planned deployment.</text>
    <rect x="110" y="580" width="1180" height="95" rx="24" fill="#0d2a42" stroke="#f59e0b" stroke-width="3"/><circle cx="165" cy="627" r="24" fill="#f59e0b"/><text x="156" y="635" fill="#05212f" font-size="24" font-weight="900">4</text><text x="215" y="635" fill="#e6f7ff" font-size="28" font-weight="800">Log the action, reason, owner, and validation result.</text>
  </g>
</svg>