<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" role="img" aria-labelledby="title desc"><title id="title">Controlled purge deployment path</title><desc id="desc">Technical diagram for a controlled semantic model deployment.</desc><rect width="100%" height="100%" fill="#07111f"/><defs><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs><circle cx="670" cy="70" r="90" fill="#38d9ff" opacity=".08" filter="url(#g)"/><text x="45" y="70" fill="#38d9ff" font-family="Arial, sans-serif" font-size="31" font-weight="800" text-anchor="start">CONTROLLED PURGE PATH</text><text x="45" y="108" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Safe default, explicit exception, proven result.</text><rect x="55" y="155" width="650" height="185" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="155" width="8" height="185" rx="4" fill="#38d9ff"/><text x="83" y="195" fill="#38d9ff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">1  VALIDATE</text><text x="83" y="233" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Definition diff</text><text x="83" y="270" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Purge disabled</text><rect x="55" y="375" width="650" height="185" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="375" width="8" height="185" rx="4" fill="#ffc857"/><text x="83" y="415" fill="#ffc857" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">2  DECIDE</text><text x="83" y="453" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Reason recorded</text><text x="83" y="490" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Owner approves</text><rect x="55" y="595" width="650" height="185" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="595" width="8" height="185" rx="4" fill="#578bff"/><text x="83" y="635" fill="#578bff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">3  DEPLOY</text><text x="83" y="673" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Explicit option</text><text x="83" y="710" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Target verified</text><rect x="55" y="815" width="650" height="185" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="815" width="8" height="185" rx="4" fill="#55e6a5"/><text x="83" y="855" fill="#55e6a5" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">4  REFRESH</text><text x="83" y="893" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Credentials ready</text><text x="83" y="930" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Capacity watched</text><rect x="55" y="1035" width="650" height="185" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="1035" width="8" height="185" rx="4" fill="#38d9ff"/><text x="83" y="1075" fill="#38d9ff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">5  PROVE</text><text x="83" y="1113" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">DAX, RLS, reports</text><text x="83" y="1150" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Operational evidence</text><rect x="55" y="1270" width="650" height="160" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="1270" width="8" height="160" rx="4" fill="#55e6a5"/><text x="83" y="1310" fill="#55e6a5" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">PROMOTION RULE</text><text x="83" y="1348" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Refresh and validation</text><text x="83" y="1385" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">must pass first.</text></svg>