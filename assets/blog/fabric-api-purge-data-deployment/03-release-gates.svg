<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Five semantic model release gates</title><desc id="desc">Technical diagram for a controlled semantic model deployment.</desc><rect width="100%" height="100%" fill="#07111f"/><defs><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs><circle cx="1310" cy="70" r="90" fill="#38d9ff" opacity=".08" filter="url(#g)"/><text x="70" y="75" fill="#38d9ff" font-family="Arial, sans-serif" font-size="34" font-weight="800" text-anchor="start">FIVE GATES BEFORE PROMOTION</text><text x="70" y="112" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">A successful refresh is necessary. It is not sufficient.</text><rect x="45" y="190" width="230" height="245" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="45" y="190" width="8" height="245" rx="4" fill="#38d9ff"/><text x="73" y="230" fill="#38d9ff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">DEFINITION</text><text x="73" y="268" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Expected model</text><text x="73" y="301" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">structure</text><rect x="315" y="190" width="230" height="245" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="315" y="190" width="8" height="245" rx="4" fill="#578bff"/><text x="343" y="230" fill="#578bff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">KNOWN ANSWERS</text><text x="343" y="268" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Stable DAX</text><text x="343" y="301" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">results</text><rect x="585" y="190" width="230" height="245" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="585" y="190" width="8" height="245" rx="4" fill="#ffc857"/><text x="613" y="230" fill="#ffc857" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">SECURITY</text><text x="613" y="268" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">RLS and OLS</text><text x="613" y="301" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">personas</text><rect x="855" y="190" width="230" height="245" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="855" y="190" width="8" height="245" rx="4" fill="#55e6a5"/><text x="883" y="230" fill="#55e6a5" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">REPORTS</text><text x="883" y="268" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Critical pages</text><text x="883" y="301" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">and filters</text><rect x="1125" y="190" width="230" height="245" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="1125" y="190" width="8" height="245" rx="4" fill="#38d9ff"/><text x="1153" y="230" fill="#38d9ff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">OPERATIONS</text><text x="1153" y="268" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Refresh time</text><text x="1153" y="301" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">and capacity</text><rect x="210" y="525" width="980" height="130" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="210" y="525" width="8" height="130" rx="4" fill="#55e6a5"/><text x="238" y="565" fill="#55e6a5" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start">PROMOTE</text><text x="238" y="603" fill="#a9bed0" font-family="Arial, sans-serif" font-size="25" font-weight="500" text-anchor="start">Only when all five gates pass and the model is ready for users.</text></svg>