<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Purge approval record</title><desc id="desc">Technical diagram for a controlled semantic model deployment.</desc><rect width="100%" height="100%" fill="#07111f"/><defs><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs><circle cx="1310" cy="70" r="90" fill="#38d9ff" opacity=".08" filter="url(#g)"/><text x="70" y="75" fill="#38d9ff" font-family="Arial, sans-serif" font-size="34" font-weight="800" text-anchor="start">THE PURGE APPROVAL RECORD</text><text x="70" y="112" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Six facts make the destructive step attributable and recoverable.</text><rect x="70" y="175" width="390" height="190" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="70" y="175" width="8" height="190" rx="4" fill="#38d9ff"/><text x="98" y="215" fill="#38d9ff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">CHANGE</text><text x="98" y="253" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Reviewed definition</text><text x="98" y="290" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">and commit</text><rect x="515" y="175" width="390" height="190" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="515" y="175" width="8" height="190" rx="4" fill="#ffc857"/><text x="543" y="215" fill="#ffc857" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">REASON</text><text x="543" y="253" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Why data cannot</text><text x="543" y="290" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">be retained</text><rect x="960" y="175" width="390" height="190" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="960" y="175" width="8" height="190" rx="4" fill="#55e6a5"/><text x="988" y="215" fill="#55e6a5" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">RECOVERY</text><text x="988" y="253" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Refresh path</text><text x="988" y="290" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">verified</text><rect x="70" y="420" width="390" height="190" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="70" y="420" width="8" height="190" rx="4" fill="#578bff"/><text x="98" y="460" fill="#578bff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">WINDOW</text><text x="98" y="498" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Expected impact</text><text x="98" y="535" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">and duration</text><rect x="515" y="420" width="390" height="190" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="515" y="420" width="8" height="190" rx="4" fill="#38d9ff"/><text x="543" y="460" fill="#38d9ff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">OWNER</text><text x="543" y="498" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Named approver</text><text x="543" y="535" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">and operator</text><rect x="960" y="420" width="390" height="190" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="960" y="420" width="8" height="190" rx="4" fill="#55e6a5"/><text x="988" y="460" fill="#55e6a5" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">PROOF</text><text x="988" y="498" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Tests defined</text><text x="988" y="535" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">before release</text><text x="700" y="720" fill="#edf7ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">No generic retry button. One reviewed decision record.</text></svg>