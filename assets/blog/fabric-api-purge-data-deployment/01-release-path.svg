<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Controlled purge deployment path</title><desc id="desc">Technical diagram for a controlled semantic model deployment.</desc><rect width="100%" height="100%" fill="#07111f"/><defs><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs><circle cx="1310" cy="70" r="90" fill="#38d9ff" opacity=".08" filter="url(#g)"/><text x="70" y="75" fill="#38d9ff" font-family="Arial, sans-serif" font-size="34" font-weight="800" text-anchor="start">A CONTROLLED PURGE DEPLOYMENT PATH</text><text x="70" y="112" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Keep the normal path safe. Open the exception only with evidence.</text><rect x="55" y="195" width="215" height="250" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="195" width="8" height="250" rx="4" fill="#38d9ff"/><text x="83" y="235" fill="#38d9ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">1  VALIDATE</text><text x="83" y="273" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Definition diff</text><text x="83" y="308" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Purge disabled</text><rect x="325" y="195" width="215" height="250" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="325" y="195" width="8" height="250" rx="4" fill="#ffc857"/><text x="353" y="235" fill="#ffc857" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">2  DECIDE</text><text x="353" y="273" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Reason recorded</text><text x="353" y="308" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Owner approves</text><rect x="595" y="195" width="215" height="250" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="595" y="195" width="8" height="250" rx="4" fill="#578bff"/><text x="623" y="235" fill="#578bff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">3  DEPLOY</text><text x="623" y="273" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Explicit option</text><text x="623" y="308" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Target verified</text><rect x="865" y="195" width="215" height="250" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="865" y="195" width="8" height="250" rx="4" fill="#55e6a5"/><text x="893" y="235" fill="#55e6a5" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">4  REFRESH</text><text x="893" y="273" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Credentials ready</text><text x="893" y="308" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Capacity watched</text><rect x="1135" y="195" width="215" height="250" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="1135" y="195" width="8" height="250" rx="4" fill="#38d9ff"/><text x="1163" y="235" fill="#38d9ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">5  PROVE</text><text x="1163" y="273" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">DAX and RLS</text><text x="1163" y="308" fill="#a9bed0" font-family="Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Reports checked</text><path d="M270 320 L313 320" stroke="#38d9ff" stroke-width="4" fill="none"/><path d="M301 312 L313 320 L301 328" stroke="#38d9ff" stroke-width="4" fill="none"/><path d="M540 320 L58