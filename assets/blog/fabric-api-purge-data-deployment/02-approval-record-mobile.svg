<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1580" viewBox="0 0 760 1580" role="img" aria-labelledby="title desc"><title id="title">Purge approval record</title><desc id="desc">Technical diagram for a controlled semantic model deployment.</desc><rect width="100%" height="100%" fill="#07111f"/><defs><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs><circle cx="670" cy="70" r="90" fill="#38d9ff" opacity=".08" filter="url(#g)"/><text x="45" y="70" fill="#38d9ff" font-family="Arial, sans-serif" font-size="31" font-weight="800" text-anchor="start">PURGE APPROVAL RECORD</text><text x="45" y="108" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Six facts before the release proceeds.</text><rect x="55" y="155" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="155" width="8" height="175" rx="4" fill="#38d9ff"/><text x="83" y="195" fill="#38d9ff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">CHANGE</text><text x="83" y="233" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Reviewed definition and commit</text><rect x="55" y="360" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="360" width="8" height="175" rx="4" fill="#ffc857"/><text x="83" y="400" fill="#ffc857" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">REASON</text><text x="83" y="438" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Why data cannot be retained</text><rect x="55" y="565" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="565" width="8" height="175" rx="4" fill="#55e6a5"/><text x="83" y="605" fill="#55e6a5" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">RECOVERY</text><text x="83" y="643" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Refresh path verified</text><rect x="55" y="770" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="770" width="8" height="175" rx="4" fill="#578bff"/><text x="83" y="810" fill="#578bff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">WINDOW</text><text x="83" y="848" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Impact and duration recorded</text><rect x="55" y="975" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="975" width="8" height="175" rx="4" fill="#38d9ff"/><text x="83" y="1015" fill="#38d9ff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">OWNER</text><text x="83" y="1053" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Named approver and operator</text><rect x="55" y="1180" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="1180" width="8" height="175" rx="4" fill="#55e6a5"/><text x="83" y="1220" fill="#55e6a5" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">PROOF</text><text x="83" y="1258" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Tests defined before release</text><text x="380" y="1450" fill="#edf7ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">One reviewed decision record.</text></svg>