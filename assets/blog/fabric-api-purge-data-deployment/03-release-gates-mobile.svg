<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1480" viewBox="0 0 760 1480" role="img" aria-labelledby="title desc"><title id="title">Five semantic model release gates</title><desc id="desc">Technical diagram for a controlled semantic model deployment.</desc><rect width="100%" height="100%" fill="#07111f"/><defs><filter id="g"><feGaussianBlur stdDeviation="12"/></filter></defs><circle cx="670" cy="70" r="90" fill="#38d9ff" opacity=".08" filter="url(#g)"/><text x="45" y="70" fill="#38d9ff" font-family="Arial, sans-serif" font-size="31" font-weight="800" text-anchor="start">FIVE RELEASE GATES</text><text x="45" y="108" fill="#a9bed0" font-family="Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Refresh success is only one signal.</text><rect x="55" y="155" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="155" width="8" height="175" rx="4" fill="#38d9ff"/><text x="83" y="195" fill="#38d9ff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">1  DEFINITION</text><text x="83" y="233" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Expected model structure</text><rect x="55" y="360" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="360" width="8" height="175" rx="4" fill="#578bff"/><text x="83" y="400" fill="#578bff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">2  KNOWN ANSWERS</text><text x="83" y="438" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Stable DAX results</text><rect x="55" y="565" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="565" width="8" height="175" rx="4" fill="#ffc857"/><text x="83" y="605" fill="#ffc857" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">3  SECURITY</text><text x="83" y="643" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">RLS and OLS personas</text><rect x="55" y="770" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="770" width="8" height="175" rx="4" fill="#55e6a5"/><text x="83" y="810" fill="#55e6a5" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">4  REPORTS</text><text x="83" y="848" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Critical pages and filters</text><rect x="55" y="975" width="650" height="175" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="975" width="8" height="175" rx="4" fill="#38d9ff"/><text x="83" y="1015" fill="#38d9ff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">5  OPERATIONS</text><text x="83" y="1053" fill="#a9bed0" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Refresh time and capacity</text><rect x="55" y="1210" width="650" height="165" rx="20" fill="#0d2034" stroke="#2f5b78" stroke-width="2"/><rect x="55" y="1210" width="8" height="165" rx="4" fill="#55e6a5"/><text x="83" y="1250" fill="#55e6a5" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">PROMOTE</text><text x="83" y="1288" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">All five gates pass.</text><text x="83" y="1325" fill="#a9bed0" font-family="Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start">Model ready for users.</text></svg>