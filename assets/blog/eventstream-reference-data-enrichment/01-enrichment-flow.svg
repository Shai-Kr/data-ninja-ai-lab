<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">In-flight reference data enrichment</title><desc id="d">Live events and a Delta reference table enter a controlled Eventstream join and produce contextualized events.</desc>
<rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Add business context while the event is moving</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">A governed lookup turns a technical signal into a useful business event.</text>
<rect x="70" y="205" width="260" height="180" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="100" y="252" fill="#27d3ff" font-family="Arial" font-size="19" font-weight="700">LIVE EVENT</text><text x="100" y="298" fill="#fff" font-family="Arial" font-size="28" font-weight="700">deviceId: D-42</text><text x="100" y="337" fill="#b6c9da" font-family="Arial" font-size="20">temperature: 87</text><text x="100" y="366" fill="#b6c9da" font-family="Arial" font-size="20">eventTime: 14:03</text>
<rect x="70" y="430" width="260" height="150" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="100" y="475" fill="#b9a8ff" font-family="Arial" font-size="19" font-weight="700">DELTA REFERENCE</text><text x="100" y="517" fill="#fff" font-family="Arial" font-size="22" font-weight="700">D-42 | Plant 7</text><text x="100" y="549" fill="#b6c9da" font-family="Arial" font-size="19">Owner: Operations</text>
<path d="M350 294 H468" stroke="#27d3ff" stroke-width="4"/><path d="M350 505 H420 Q468 505 468 455 V365" stroke="#9b7cff" stroke-width="4" fill="none"/><polygon points="468,294 450,284 450,304" fill="#27d3ff"/><polygon points="468,365 458,383 478,383" fill="#9b7cff"/>
<rect x="468" y="245" width="260" height="220" rx="28" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="510" y="300" fill="#31e6a1" font-family="Arial" font-size="19" font-weight="700">EVENTSTREAM JOIN</text><text x="510" y="345" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Match deviceId</text><text x="510" y="385" fill="#b6c9da" font-family="Arial" font-size="19">Join policy</text><text x="510" y="416" fill="#b6c9da" font-family="Arial" font-size="19">Refresh schedule</text><text x="510" y="447" fill="#b6c9da" font-family="Arial" font-size="19">Quality evidence</text>
<path d="M728 355 H842" stroke="#31e6a1" stroke-width="4"/><polygon points="842,355 824,345 824,365" fill="#31e6a1"/>
<rect x="842" y="205" width="288" height="285" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="875" y="252" fill="#31e6a1" font-family="Arial" font-size="19" font-weight="700">CONTEXTUAL EVENT</text><text x="875" y="298" fill="#fff" font-family="Arial" font-size="25" font-weight="700">deviceId: D-42</text><text x="875" y="336" fill="#b6c9da" font-family="Arial" font-size="19">temperature: 87</text><text x="875" y="374" fill="#b6c9da" font-family="Arial" font-size="19">site: Plant 7</text><text x="875" y="412" fill="#b6c9da" font-family="Arial" font-size="19">owner: Operations</text><text x="875" y="452" fill="#8eabc5" font-family="Arial" font-size="17">Ready for routing or action</text>
<text x="70" y="636" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text>
