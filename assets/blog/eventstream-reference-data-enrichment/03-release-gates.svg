<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Release gates for reference enrichment</title><desc id="d">Six gates cover contract, quality, freshness, join behavior, replay, and monitoring.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Six gates before in-flight enrichment goes live</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">Make the hidden data-quality decisions testable.</text>
<g font-family="Arial"><rect x="70" y="175" width="325" height="145" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="100" y="215" fill="#27d3ff" font-size="18" font-weight="700">01 CONTRACT</text><text x="100" y="255" fill="#fff" font-size="22" font-weight="700">Key and cardinality</text><text x="100" y="288" fill="#b6c9da" font-size="17">Types, uniqueness, required fields</text><rect x="438" y="175" width="325" height="145" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="468" y="215" fill="#b9a8ff" font-size="18" font-weight="700">02 QUALITY</text><text x="468" y="255" fill="#fff" font-size="22" font-weight="700">Reference checks</text><text x="468" y="288" fill="#b6c9da" font-size="17">Nulls, duplicates, row-count drift</text><rect x="805" y="175" width="325" height="145" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="835" y="215" fill="#31e6a1" font-size="18" font-weight="700">03 FRESHNESS</text><text x="835" y="255" fill="#fff" font-size="22" font-weight="700">Snapshot target</text><text x="835" y="288" fill="#b6c9da" font-size="17">Refresh interval and owner</text><rect x="70" y="365" width="325" height="145" rx="22" fill="#10283d" stroke="#ffbd69" stroke-width="2"/><text x="100" y="405" fill="#ffbd69" font-size="18" font-weight="700">04 JOIN</text><text x="100" y="445" fill="#fff" font-size="22" font-weight="700">Missing-key path</text><text x="100" y="478" fill="#b6c9da" font-size="17">Keep, drop, repair, or quarantine</text><rect x="438" y="365" width="325" height="145" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="468" y="405" fill="#27d3ff" font-size="18" font-weight="700">05 REPLAY</text><text x="468" y="445" fill="#fff" font-size="22" font-weight="700">Result policy</text><text x="468" y="478" fill="#b6c9da" font-size="17">Current, as-of, or preserved</text><rect x="805" y="365" width="325" height="145" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="835" y="405" fill="#b9a8ff" font-size="18" font-weight="700">06 MONITOR</text><text x="835" y="445" fill="#fff" font-size="22" font-weight="700">Operational evidence</text><text x="835" y="478" fill="#b6c9da" font-size="17">Counts, misses, age, destinations</text></g><rect x="250" y="550" width="700" height="67" rx="18" fill="#12354b" stroke="#31e6a1" stroke-width="2"/><text x="600" y="592" text-anchor="middle" fill="#eef7ff" font-family="Arial" font-size="21" font-weight="700">Promote only when all six gates have evidence</text><text x="70" y="650" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
