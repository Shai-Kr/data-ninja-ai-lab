<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Choose join behavior from the business rule</title><desc id="d">A decision tree contrasts left outer and inner joins and adds monitoring for missing reference keys.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Choose the join from the failure behavior</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">The key question: what should happen when reference data is missing?</text><rect x="350" y="170" width="500" height="105" rx="22" fill="#12354b" stroke="#27d3ff" stroke-width="2"/><text x="600" y="215" text-anchor="middle" fill="#27d3ff" font-family="Arial" font-size="18" font-weight="700">BUSINESS DECISION</text><text x="600" y="252" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Can an unmatched event still be useful?</text><path d="M520 275 V340 H300" stroke="#9b7cff" stroke-width="4" fill="none"/><path d="M680 275 V340 H900" stroke="#31e6a1" stroke-width="4" fill="none"/><text x="410" y="325" fill="#b9a8ff" font-family="Arial" font-size="18" font-weight="700">NO</text><text x="775" y="325" fill="#31e6a1" font-family="Arial" font-size="18" font-weight="700">YES</text><rect x="70" y="340" width="460" height="190" rx="24" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="105" y="390" fill="#b9a8ff" font-family="Arial" font-size="21" font-weight="700">INNER JOIN</text><text x="105" y="432" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Keep matched events only</text><text x="105" y="472" fill="#b6c9da" font-family="Arial" font-size="18">Use when context is mandatory</text><text x="105" y="503" fill="#ffbd69" font-family="Arial" font-size="17">Risk: silent event loss</text><rect x="670" y="340" width="460" height="190" rx="24" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="705" y="390" fill="#31e6a1" font-family="Arial" font-size="21" font-weight="700">LEFT OUTER JOIN</text><text x="705" y="432" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Keep every incoming event</text><text x="705" y="472" fill="#b6c9da" font-family="Arial" font-size="18">Expose missing context as null</text><text x="705" y="503" fill="#31e6a1" font-family="Arial" font-size="17">Route or repair unmatched keys</text><rect x="245" y="565" width="710" height="66" rx="18" fill="#0e2234" stroke="#36536d"/><text x="600" y="607" text-anchor="middle" fill="#eef7ff" font-family="Arial" font-size="20" font-weight="700">Always measure unmatched %, duplicate keys, snapshot age, and row-count change</text><text x="70" y="652" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
