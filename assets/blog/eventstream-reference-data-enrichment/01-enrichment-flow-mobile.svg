ygon points="300,730 288,710 312,710" fill="#31e6a1"/><rect x="38" y="730" width="524" height="120" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="68" y="774" fill="#31e6a1" font-family="Arial" font-size="17" font-weight="700">CONTEXTUAL EVENT</text><text x="68" y="818" fill="#fff" font-family="Arial" font-size="22" font-weight="700">D-42 | Plant 7 | Operations</text><text x="38" y="880" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
