<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Join decision</title><desc id="d">Choose inner or left outer based on whether unmatched events remain useful.</desc><rect width="600" height="900" rx="28" fill="#07111f"/><text x="38" y="62" fill="#eef7ff" font-family="Arial" font-size="29" font-weight="700">Choose failure behavior</text><text x="38" y="98" fill="#8eabc5" font-family="Arial" font-size="17">What happens when the key is missing?</text><rect x="38" y="145" width="524" height="120" rx="22" fill="#12354b" stroke="#27d3ff" stroke-width="2"/><text x="300" y="190" text-anchor="middle" fill="#27d3ff" font-family="Arial" font-size="17" font-weight="700">BUSINESS DECISION</text><text x="300" y="231" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Is the event useful without context?</text><rect x="38" y="315" width="524" height="190" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="68" y="360" fill="#b9a8ff" font-family="Arial" font-size="18" font-weight="700">NO: INNER JOIN</text><text x="68" y="405" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Keep matched events only</text><text x="68" y="443" fill="#b6c9da" font-family="Arial" font-size="18">Context is mandatory</text><text x="68" y="477" fill="#ffbd69" font-family="Arial" font-size="17">Monitor silent event loss</text><rect x="38" y="540" width="524" height="190" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="68" y="585" fill="#31e6a1" font-family="Arial" font-size="18" font-weight="700">YES: LEFT OUTER JOIN</text><text x="68" y="630" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Keep every incoming event</text><text x="68" y="668" fill="#b6c9da" font-family="Arial" font-size="18">Missing context stays visible</text><text x="68" y="702" fill="#31e6a1" font-family="Arial" font-size="17">Route or repair unmatched keys</text><rect x="38" y="765" width="524" height="85" rx="18" fill="#0e2234" stroke="#36536d"/><text x="64" y="798" fill="#eef7ff" font-family="Arial" font-size="17" font-weight="700">Measure: unmatched %, duplicates,</text><text x="64" y="827" fill="#eef7ff" font-family="Arial" font-size="17" font-weight="700">snapshot age, input vs output count</text><text x="38" y="882" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
