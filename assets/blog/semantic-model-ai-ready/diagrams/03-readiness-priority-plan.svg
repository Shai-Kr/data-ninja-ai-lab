<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="380" fill="#0f1117" rx="12"/>

  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Semantic Model AI Readiness: Where to Start</text>

  <!-- Phase 1 -->
  <rect x="30" y="58" width="258" height="298" fill="#1a1f2e" rx="10" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="30" y="58" width="258" height="36" fill="#166534" rx="10"/>
  <rect x="30" y="80" width="258" height="14" fill="#166534"/>
  <text x="159" y="81" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="700">Week 1 - Fix the names</text>

  <text x="50" y="116" fill="#94a3b8" font-size="11.5">Rename ambiguous measures</text>
  <text x="50" y="136" fill="#94a3b8" font-size="11.5">and columns to plain business</text>
  <text x="50" y="156" fill="#94a3b8" font-size="11.5">language. No "Col1", no "Amt".</text>

  <text x="50" y="186" fill="#e2e8f0" font-size="11.5" font-weight="600">Add descriptions to top 20</text>
  <text x="50" y="206" fill="#94a3b8" font-size="11.5">measures. What does this</text>
  <text x="50" y="226" fill="#94a3b8" font-size="11.5">number mean, when is it wrong?</text>

  <text x="50" y="256" fill="#e2e8f0" font-size="11.5" font-weight="600">Add 3-5 synonyms per</text>
  <text x="50" y="276" fill="#94a3b8" font-size="11.5">business term. Revenue = Sales</text>
  <text x="50" y="296" fill="#94a3b8" font-size="11.5">= Turnover = Net Revenue.</text>

  <text x="50" y="326" fill="#6ee7b7" font-size="11" font-style="italic">Impact: Copilot resolves intent</text>
  <text x="50" y="344" fill="#6ee7b7" font-size="11" font-style="italic">without guessing</text>

  <!-- Phase 2 -->
  <rect x="322" y="58" width="256" height="298" fill="#1a1f2e" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="322" y="58" width="256" height="36" fill="#78350f" rx="10"/>
  <rect x="322" y="80" width="256" height="14" fill="#78350f"/>
  <text x="450" y="81" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">Week 2 - Build trust signals</text>

  <text x="342" y="116" fill="#94a3b8" font-size="11.5">Submit the model for</text>
  <text x="342" y="136" fill="#94a3b8" font-size="11.5">certification or promotion.</text>
  <text x="342" y="156" fill="#94a3b8" font-size="11.5">Copilot prefers certified.</text>

  <text x="342" y="186" fill="#e2e8f0" font-size="11.5" font-weight="600">Create 10-15 sample Q&amp;A</text>
  <text x="342" y="206" fill="#94a3b8" font-size="11.5">pairs. Real questions your</text>
  <text x="342" y="226" fill="#94a3b8" font-size="11.5">business users actually ask.</text>

  <text x="342" y="256" fill="#e2e8f0" font-size="11.5" font-weight="600">Verify RLS rules reflect</text>
  <text x="342" y="276" fill="#94a3b8" font-size="11.5">current access policy.</text>
  <text x="342" y="296" fill="#94a3b8" font-size="11.5">AI inherits your security model.</text>

  <text x="342" y="326" fill="#fcd34d" font-size="11" font-style="italic">Impact: Answers are scoped</text>
  <text x="342" y="344" fill="#fcd34d" font-size="11" font-style="italic">and trustworthy</text>

  <!-- Phase 3 -->
  <rect x="612" y="58" width="258" height="298" fill="#1a1f2e" rx="10" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="612" y="58" width="258" height="36" fill="#4c1d95" rx="10"/>
  <rect x="612" y="80" width="258" height="14" fill="#4c1d95"/>
  <text x="741" y="81" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="700">Week 3 - Connect to Fabric IQ</text>

  <text x="632" y="116" fill="#94a3b8" font-size="11.5">Enable Fabric IQ connection</text>
  <text x="632" y="136" fill="#94a3b8" font-size="11.5">for certified semantic models.</text>
  <text x="632" y="156" fill="#94a3b8" font-size="11.5">Start with one team as pilot.</text>

  <text x="632" y="186" fill="#e2e8f0" font-size="11.5" font-weight="600">Define an answer validation</text>
  <text x="632" y="206" fill="#94a3b8" font-size="11.5">workflow. How do users report</text>
  <text x="632" y="226" fill="#94a3b8" font-size="11.5">a wrong AI answer?</text>

  <text x="632" y="256" fill="#e2e8f0" font-size="11.5" font-weight="600">Set a refresh SLA and</text>
  <text x="632" y="276" fill="#94a3b8" font-size="11.5">monitor freshness. AI answers</text>
  <text x="632" y="296" fill="#94a3b8" font-size="11.5">reflect the last refresh time.</text>

  <text x="632" y="326" fill="#c4b5fd" font-size="11" font-style="italic">Impact: Governed AI layer</text>
  <text x="632" y="344" fill="#c4b5fd" font-size="11" font-style="italic">from what you already own</text>
</svg>
