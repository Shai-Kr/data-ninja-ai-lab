<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="400" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">From Semantic Model to AI-Ready Layer via Fabric IQ</text>

  <!-- Left box: Power BI Semantic Model -->
  <rect x="30" y="70" width="230" height="290" fill="#1e2433" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="96" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">Power BI Semantic Model</text>
  <line x1="50" y1="105" x2="240" y2="105" stroke="#3b82f6" stroke-width="0.5"/>

  <text x="60" y="130" fill="#94a3b8" font-size="11.5">Metric definitions</text>
  <text x="60" y="152" fill="#94a3b8" font-size="11.5">Business relationships</text>
  <text x="60" y="174" fill="#94a3b8" font-size="11.5">Hierarchies and dimensions</text>
  <text x="60" y="196" fill="#94a3b8" font-size="11.5">Aggregation rules</text>
  <text x="60" y="218" fill="#94a3b8" font-size="11.5">Currency and date logic</text>
  <text x="60" y="240" fill="#94a3b8" font-size="11.5">Synonyms and descriptions</text>
  <text x="60" y="262" fill="#94a3b8" font-size="11.5">RLS and OLS rules</text>
  <text x="60" y="284" fill="#94a3b8" font-size="11.5">Certified answers</text>
  <text x="60" y="306" fill="#94a3b8" font-size="11.5">Sample questions</text>
  <text x="60" y="328" fill="#94a3b8" font-size="11.5">Endorsement and trust</text>

  <!-- Center box: Fabric IQ -->
  <rect x="330" y="110" width="240" height="200" fill="#1e2433" rx="10" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="136" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Fabric IQ</text>
  <line x1="348" y1="145" x2="552" y2="145" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="450" y="170" text-anchor="middle" fill="#94a3b8" font-size="11.5">Semantic context layer</text>
  <text x="450" y="192" text-anchor="middle" fill="#94a3b8" font-size="11.5">Business vocabulary</text>
  <text x="450" y="214" text-anchor="middle" fill="#94a3b8" font-size="11.5">Governed definitions</text>
  <text x="450" y="236" text-anchor="middle" fill="#94a3b8" font-size="11.5">AI grounding surface</text>
  <text x="450" y="260" text-anchor="middle" fill="#94a3b8" font-size="11.5">Ontology and Graph</text>
  <text x="450" y="282" text-anchor="middle" fill="#94a3b8" font-size="11.5">OneLake foundation</text>

  <!-- Right: AI outputs -->
  <rect x="638" y="70" width="232" height="120" fill="#1e2433" rx="10" stroke="#10b981" stroke-width="1.5"/>
  <text x="754" y="95" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">M365 Copilot Chat</text>
  <line x1="658" y1="104" x2="850" y2="104" stroke="#10b981" stroke-width="0.5"/>
  <text x="754" y="128" text-anchor="middle" fill="#94a3b8" font-size="11.5">Answers from your</text>
  <text x="754" y="148" text-anchor="middle" fill="#94a3b8" font-size="11.5">semantic definitions</text>
  <text x="754" y="168" text-anchor="middle" fill="#94a3b8" font-size="11.5">not statistical guesses</text>

  <rect x="638" y="210" width="232" height="150" fill="#1e2433" rx="10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="754" y="235" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">Fabric Data Agents</text>
  <line x1="658" y1="244" x2="850" y2="244" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="754" y="268" text-anchor="middle" fill="#94a3b8" font-size="11.5">Governed queries</text>
  <text x="754" y="290" text-anchor="middle" fill="#94a3b8" font-size="11.5">against your business</text>
  <text x="754" y="312" text-anchor="middle" fill="#94a3b8" font-size="11.5">vocabulary</text>
  <text x="754" y="334" text-anchor="middle" fill="#94a3b8" font-size="11.5">trusted, permissioned</text>

  <!-- Arrows -->
  <path d="M260 215 L325 215" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M570 155 L630 130" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M570 255 L630 270" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>
