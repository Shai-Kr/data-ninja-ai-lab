<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#0f1117" rx="12"/>

  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">What Makes a Power BI Semantic Model AI-Ready</text>

  <!-- Left column -->
  <rect x="30" y="58" width="405" height="340" fill="#1a1f2e" rx="10"/>
  <text x="232" y="83" text-anchor="middle" fill="#93c5fd" font-size="12.5" font-weight="700">Foundation layer</text>

  <!-- Item 1 -->
  <rect x="50" y="96" width="14" height="14" fill="#22c55e" rx="2"/>
  <text x="76" y="107" fill="#e2e8f0" font-size="12" font-weight="600">Measure descriptions</text>
  <text x="76" y="123" fill="#64748b" font-size="11">What the metric means, how it is calculated, caveats</text>

  <!-- Item 2 -->
  <rect x="50" y="138" width="14" height="14" fill="#22c55e" rx="2"/>
  <text x="76" y="149" fill="#e2e8f0" font-size="12" font-weight="600">Synonyms</text>
  <text x="76" y="165" fill="#64748b" font-size="11">Revenue = Sales = Turnover. Define all of them.</text>

  <!-- Item 3 -->
  <rect x="50" y="180" width="14" height="14" fill="#22c55e" rx="2"/>
  <text x="76" y="191" fill="#e2e8f0" font-size="12" font-weight="600">Column and table descriptions</text>
  <text x="76" y="207" fill="#64748b" font-size="11">Not just names. Actual business context per field.</text>

  <!-- Item 4 -->
  <rect x="50" y="222" width="14" height="14" fill="#f59e0b" rx="2"/>
  <text x="76" y="233" fill="#e2e8f0" font-size="12" font-weight="600">Certified sample Q&amp;A pairs</text>
  <text x="76" y="249" fill="#64748b" font-size="11">Approved question-answer pairs for Copilot grounding</text>

  <!-- Item 5 -->
  <rect x="50" y="264" width="14" height="14" fill="#f59e0b" rx="2"/>
  <text x="76" y="275" fill="#e2e8f0" font-size="12" font-weight="600">Endorsement status</text>
  <text x="76" y="291" fill="#64748b" font-size="11">Promoted or Certified. Copilot prefers certified models.</text>

  <!-- Item 6 -->
  <rect x="50" y="306" width="14" height="14" fill="#ef4444" rx="2"/>
  <text x="76" y="317" fill="#e2e8f0" font-size="12" font-weight="600">Semantic clarity audit</text>
  <text x="76" y="333" fill="#64748b" font-size="11">Names like "Col1" or "Amount2" break AI context</text>

  <!-- Legend -->
  <rect x="50" y="358" width="10" height="10" fill="#22c55e" rx="1"/>
  <text x="66" y="368" fill="#94a3b8" font-size="10">Ready</text>
  <rect x="116" y="358" width="10" height="10" fill="#f59e0b" rx="1"/>
  <text x="132" y="368" fill="#94a3b8" font-size="10">Often missing</text>
  <rect x="218" y="358" width="10" height="10" fill="#ef4444" rx="1"/>
  <text x="234" y="368" fill="#94a3b8" font-size="10">Critical gap</text>

  <!-- Right column -->
  <rect x="465" y="58" width="405" height="340" fill="#1a1f2e" rx="10"/>
  <text x="667" y="83" text-anchor="middle" fill="#c4b5fd" font-size="12.5" font-weight="700">Access and governance layer</text>

  <!-- Item 7 -->
  <rect x="485" y="96" width="14" height="14" fill="#22c55e" rx="2"/>
  <text x="511" y="107" fill="#e2e8f0" font-size="12" font-weight="600">Row-level security (RLS)</text>
  <text x="511" y="123" fill="#64748b" font-size="11">AI answers inherit RLS. Model it correctly first.</text>

  <!-- Item 8 -->
  <rect x="485" y="138" width="14" height="14" fill="#22c55e" rx="2"/>
  <text x="511" y="149" fill="#e2e8f0" font-size="12" font-weight="600">Object-level security (OLS)</text>
  <text x="511" y="165" fill="#64748b" font-size="11">Hide columns AI should never surface</text>

  <!-- Item 9 -->
  <rect x="485" y="180" width="14" height="14" fill="#f59e0b" rx="2"/>
  <text x="511" y="191" fill="#e2e8f0" font-size="12" font-weight="600">Fabric IQ connection</text>
  <text x="511" y="207" fill="#64748b" font-size="11">Explicitly connect the semantic model to Fabric IQ</text>

  <!-- Item 10 -->
  <rect x="485" y="222" width="14" height="14" fill="#f59e0b" rx="2"/>
  <text x="511" y="233" fill="#e2e8f0" font-size="12" font-weight="600">Measure owner in metadata</text>
  <text x="511" y="249" fill="#64748b" font-size="11">Who validates AI answers when they drift?</text>

  <!-- Item 11 -->
  <rect x="485" y="264" width="14" height="14" fill="#ef4444" rx="2"/>
  <text x="511" y="275" fill="#e2e8f0" font-size="12" font-weight="600">Answer validation workflow</text>
  <text x="511" y="291" fill="#64748b" font-size="11">How do users report a wrong Copilot answer?</text>

  <!-- Item 12 -->
  <rect x="485" y="306" width="14" height="14" fill="#ef4444" rx="2"/>
  <text x="511" y="317" fill="#e2e8f0" font-size="12" font-weight="600">Freshness SLA</text>
  <text x="511" y="333" fill="#64748b" font-size="11">AI answers are only as fresh as the last refresh</text>
</svg>
