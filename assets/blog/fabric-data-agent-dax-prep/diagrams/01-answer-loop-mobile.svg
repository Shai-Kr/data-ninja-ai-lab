<svg xmlns="http://www.w3.org/2000/svg" width="430" height="980" viewBox="0 0 430 980" role="img" aria-labelledby="title desc"><title id="title">Fabric data agent answer loop mobile</title><desc id="desc">Mobile stacked version of the Fabric data agent answer loop.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="1" stop-color="#0b2138"/></linearGradient><style>.title{font:800 25px Inter,Segoe UI,Arial,sans-serif;fill:#effbff}.sub{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#9fd7ff}.h{font:800 20px Inter,Segoe UI,Arial,sans-serif;fill:#f2fbff}.p{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#b9d8ea}.card{fill:#0d243c;stroke:#32d8ff;stroke-width:2}.num{font:900 18px Inter,Segoe UI,Arial,sans-serif;fill:#06111f}.dot{fill:#63e6be}.arrow{stroke:#47e9ff;stroke-width:4;stroke-linecap:round}</style></defs><rect width="430" height="980" rx="28" fill="url(#bg)"/><text x="28" y="52" class="title">Better DAX answers</text><text x="28" y="78" class="sub">The agent improves when the semantic</text><text x="28" y="100" class="sub">model gives it clean signals first.</text><g transform="translate(28 142)"><rect class="card" width="374" height="132" rx="22"/><circle class="dot" cx="34" cy="36" r="18"/><text x="28" y="43" class="num">1</text><text x="68" y="43" class="h">User question</text><text x="26" y="82" class="p">Plain-English business wording,</text><text x="26" y="106" class="p">often with hidden metric assumptions.</text></g><line class="arrow" x1="215" y1="292" x2="215" y2="328"/><g transform="translate(28 344)"><rect class="card" width="374" height="150" rx="22"/><circle class="dot" cx="34" cy="36" r="18"/><text x="28" y="43" class="num">2</text><text x="68" y="43" class="h">Semantic model</text><text x="26" y="82" class="p">Measures, names, AI schema,</text><text x="26" y="106" class="p">verified answers, visual metadata,</text><text x="26" y="130" class="p">and value hints.</text></g><line class="arrow" x1="215" y1="512" x2="215" y2="548"/><g transform="translate(28 564)"><rect class="card" width="374" height="132" rx="22"/><circle class="dot" cx="34" cy="36" r="18"/><text x="28" y="43" class="num">3</text><text x="68" y="43" class="h">DAX planning</text><text x="26" y="82" class="p">Generate, inspect results, resolve</text><text x="26" y="106" class="p">ambiguity, then refine the query.</text></g><line class="arrow" x1="215" y1="714" x2="215" y2="750"/><g transform="translate(28 766)"><rect class="card" width="374" height="150" rx="22"/><circle class="dot" cx="34" cy="36" r="18"/><text x="28" y="43" class="num">4</text><text x="68" y="43" class="h">Answer with context</text><text x="26" y="82" class="p">The output is only as trustworthy</text><text x="26" y="106" class="p">as the semantic layer and test</text><text x="26" y="130" class="p">questions behind it.</text></g></svg>
