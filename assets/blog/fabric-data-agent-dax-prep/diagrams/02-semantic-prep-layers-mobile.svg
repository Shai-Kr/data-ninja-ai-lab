<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1000" viewBox="0 0 430 1000" role="img" aria-labelledby="title desc"><title id="title">Semantic model prep layers mobile</title><desc id="desc">Mobile stacked layers for AI-ready semantic models.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101c"/><stop offset="1" stop-color="#102947"/></linearGradient><style>.title{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#effbff}.sub{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#9fd7ff}.h{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#f1fbff}.p{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#b9d8ea}.card{stroke:#34d9ff;stroke-width:2}.a{fill:#0e2740}.b{fill:#123250}.c{fill:#164264}.d{fill:#1c567d}.pill{fill:#7ee7ff}.tag{font:800 14px Inter,Segoe UI,Arial,sans-serif;fill:#06111f}</style></defs><rect width="430" height="1000" rx="28" fill="url(#bg)"/><text x="28" y="52" class="title">Prepare before judging</text><text x="28" y="78" class="sub">Advanced DAX works best when the</text><text x="28" y="100" class="sub">semantic layer is already clear.</text><g transform="translate(28 146)"><rect class="card a" width="374" height="152" rx="22"/><rect class="pill" x="24" y="24" width="76" height="34" rx="17"/><text x="40" y="47" class="tag">Layer 1</text><text x="24" y="90" class="h">Scope the AI data schema</text><text x="24" y="122" class="p">Expose only the objects that match</text><text x="24" y="146" class="p">the questions the agent should answer.</text></g><g transform="translate(28 326)"><rect class="card b" width="374" height="152" rx="22"/><rect class="pill" x="24" y="24" width="76" height="34" rx="17"/><text x="40" y="47" class="tag">Layer 2</text><text x="24" y="90" class="h">Use business names</text><text x="24" y="122" class="p">Rename and describe measures so</text><text x="24" y="146" class="p">they match how users speak.</text></g><g transform="translate(28 506)"><rect class="card c" width="374" height="152" rx="22"/><rect class="pill" x="24" y="24" width="76" height="34" rx="17"/><text x="40" y="47" class="tag">Layer 3</text><text x="24" y="90" class="h">Add verified answers</text><text x="24" y="122" class="p">Pin trusted answers for high-value</text><text x="24" y="146" class="p">questions with sensitive wording.</text></g><g transform="translate(28 686)"><rect class="card d" width="374" height="176" rx="22"/><rect class="pill" x="24" y="24" width="76" height="34" rx="17"/><text x="40" y="47" class="tag">Layer 4</text><text x="24" y="90" class="h">Keep regression questions</text><text x="24" y="122" class="p">Run the same test set when preview</text><text x="24" y="146" class="p">runtime behavior changes or before</text><text x="24" y="170" class="p">business users depend on it.</text></g><text x="28" y="926" class="sub">Better answers come from better model signals.</text></svg>
