<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1120" viewBox="0 0 430 1120" role="img" aria-labelledby="title desc"><title id="title">Agent rollout checklist mobile</title><desc id="desc">Mobile checklist for testing Fabric data agents with semantic models.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101d"/><stop offset="1" stop-color="#0f2848"/></linearGradient><style>.title{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#effbff}.sub{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#9fd7ff}.h{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#edfaff}.p{font:500 15.5px Inter,Segoe UI,Arial,sans-serif;fill:#b7d8ea}.card{fill:#0d243c;stroke:#26c9ff;stroke-width:2}.dot{fill:#5af0bd}.num{font:900 16px Inter,Segoe UI,Arial,sans-serif;fill:#06101d}</style></defs><rect width="430" height="1120" rx="28" fill="url(#bg)"/><text x="28" y="52" class="title">Roll out with evidence</text><text x="28" y="78" class="sub">Treat the agent like a production</text><text x="28" y="100" class="sub">analytics surface, not a demo.</text><g transform="translate(28 140)"><rect class="card" width="374" height="124" rx="22"/><circle class="dot" cx="34" cy="34" r="17"/><text x="29" y="40" class="num">1</text><text x="66" y="41" class="h">Pick the right model</text><text x="24" y="78" class="p">Start with trusted measures and real</text><text x="24" y="102" class="p">business ownership.</text></g><g transform="translate(28 292)"><rect class="card" width="374" height="124" rx="22"/><circle class="dot" cx="34" cy="34" r="17"/><text x="29" y="40" class="num">2</text><text x="66" y="41" class="h">Prepare for AI</text><text x="24" y="78" class="p">Limit schema, clean names, add context,</text><text x="24" y="102" class="p">and verify critical answers.</text></g><g transform="translate(28 444)"><rect class="card" width="374" height="124" rx="22"/><circle class="dot" cx="34" cy="34" r="17"/><text x="29" y="40" class="num">3</text><text x="66" y="41" class="h">Test preview runtime</text><text x="24" y="78" class="p">Compare answers, filters, values,</text><text x="24" y="102" class="p">latency, and failure modes.</text></g><g transform="translate(28 596)"><rect class="card" width="374" height="124" rx="22"/><circle class="dot" cx="34" cy="34" r="17"/><text x="29" y="40" class="num">4</text><text x="66" y="41" class="h">Publish intentionally</text><text x="24" y="78" class="p">Published agents keep their selected</text><text x="24" y="102" class="p">runtime until republished.</text></g><g transform="translate(28 748)"><rect class="card" width="374" height="124" rx="22"/><circle class="dot" cx="34" cy="34" r="17"/><text x="29" y="40" class="num">5</text><text x="66" y="41" class="h">Track regressions</text><text x="24" y="78" class="p">Keep expected answers and ambiguous</text><text x="24" y="102" class="p">phrases in a small runbook.</text></g><g transform="translate(28 900)"><rect class="card" width="374" height="124" rx="22"/><circle class="dot" cx="34" cy="34" r="17"/><text x="29" y="40" class="num">6</text><text x="66" y="41" class="h">Use it where it pays</text><text x="24" y="78" class="p">Best fit: high-value questions where</text><text x="24" y="102" class="p">business definitions must be right.</text></g><text x="28" y="1076" class="sub">The win is governed self-service over trusted measures.</text></svg>
