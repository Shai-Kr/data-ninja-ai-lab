<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Semantic model preparation layers</title>
<desc id="desc">Four preparation layers for AI-ready semantic models: scope, naming, verified answers, and test questions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101c"/><stop offset="1" stop-color="#102947"/></linearGradient>
  <style>.title{font:700 44px Inter,Segoe UI,Arial,sans-serif;fill:#f1fbff}.sub{font:500 23px Inter,Segoe UI,Arial,sans-serif;fill:#9fd7ff}.h{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#effbff}.p{font:500 22px Inter,Segoe UI,Arial,sans-serif;fill:#b9d8ea}.tag{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#06111f}.layer{stroke:#34d9ff;stroke-width:2}.a{fill:#0e2740}.b{fill:#123250}.c{fill:#164264}.d{fill:#1c567d}.pill{fill:#7ee7ff}.accent{fill:#46f2bd}</style>
</defs>
<rect width="1400" height="820" rx="34" fill="url(#bg)"/>
<text x="84" y="90" class="title">Prepare the model before judging the agent</text>
<text x="84" y="128" class="sub">Advanced DAX generation is strongest when the semantic layer gives it clean signals.</text>
<g transform="translate(130 210)">
  <rect class="layer a" width="1140" height="120" rx="28"/>
  <rect class="pill" x="34" y="34" width="116" height="52" rx="26"/><text x="59" y="68" class="tag">Layer 1</text>
  <text x="186" y="52" class="h">Scope the AI data schema</text>
  <text x="186" y="88" class="p">Expose the tables, columns, and measures that match the questions the agent should answer.</text>
</g>
<g transform="translate(185 345)">
  <rect class="layer b" width="1030" height="120" rx="28"/>
  <rect class="pill" x="34" y="34" width="116" height="52" rx="26"/><text x="59" y="68" class="tag">Layer 2</text>
  <text x="186" y="52" class="h">Use business names and descriptions</text>
  <text x="186" y="88" class="p">Make measures and dimensions sound like users speak, not like source-system column codes.</text>
</g>
<g transform="translate(240 480)">
  <rect class="layer c" width="920" height="120" rx="28"/>
  <rect class="pill" x="34" y="34" width="116" height="52" rx="26"/><text x="59" y="68" class="tag">Layer 3</text>
  <text x="186" y="52" class="h">Add verified answers for high-value questions</text>
  <text x="186" y="88" class="p">Pin trusted visual answers where business wording is sensitive or easy to misread.</text>
</g>
<g transform="translate(295 615)">
  <rect class="layer d" width="810" height="120" rx="28"/>
  <rect class="pill" x="34" y="34" width="116" height="52" rx="26"/><text x="59" y="68" class="tag">Layer 4</text>
  <text x="186" y="52" class="h">Keep a regression set of questions</text>
  <text x="186" y="88" class="p">Test preview runtime answers before promoting agents to normal business use.</text>
</g>
<circle cx="1190" cy="622" r="66" fill="#46f2bd" opacity=".95"/><text x="1154" y="612" class="tag">Better</text><text x="1138" y="638" class="tag">answers</text>
</svg>
