<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">AWS Glue catalog mirroring flow into OneLake</title>
<desc id="desc">AWS Glue metadata is mirrored into Fabric while Iceberg data remains in Amazon S3 and is accessed through shortcuts.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="55%" stop-color="#0b1f33"/><stop offset="100%" stop-color="#07101c"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="820" fill="url(#bg)"/>
<circle cx="1110" cy="130" r="180" fill="#0ea5e9" opacity="0.08"/>
<circle cx="190" cy="690" r="220" fill="#22d3ee" opacity="0.06"/>
<text x="70" y="90" fill="#e5f6ff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">Mirroring the catalog, not copying the lake</text>
<text x="72" y="136" fill="#9cc7d7" font-family="Inter, Arial, sans-serif" font-size="24">Fabric can discover AWS Glue Iceberg tables while the data stays in Amazon S3.</text>
<g transform="translate(80 235)">
  <rect x="0" y="0" width="300" height="220" rx="28" fill="#10243a" stroke="#24536b" stroke-width="2"/>
  <text x="34" y="58" fill="#f8fafc" font-family="Inter, Arial" font-size="28" font-weight="750">AWS Glue</text>
  <text x="34" y="96" fill="#a8cfe0" font-family="Inter, Arial" font-size="21">Iceberg catalog</text>
  <text x="34" y="134" fill="#7dd3fc" font-family="Inter, Arial" font-size="19">databases</text>
  <text x="34" y="164" fill="#7dd3fc" font-family="Inter, Arial" font-size="19">tables</text>
  <text x="34" y="194" fill="#7dd3fc" font-family="Inter, Arial" font-size="19">schemas</text>
</g>
<g transform="translate(80 525)">
  <rect x="0" y="0" width="300" height="150" rx="24" fill="#132033" stroke="#334155" stroke-width="2"/>
  <text x="34" y="55" fill="#f8fafc" font-family="Inter, Arial" font-size="27" font-weight="750">Amazon S3</text>
  <text x="34" y="94" fill="#a8cfe0" font-family="Inter, Arial" font-size="21">Iceberg table data</text>
</g>
<g transform="translate(550 285)">
  <rect x="0" y="0" width="310" height="230" rx="30" fill="#092b3b" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)"/>
  <text x="36" y="62" fill="#f8fafc" font-family="Inter, Arial" font-size="28" font-weight="800">Fabric mirrored</text>
  <text x="36" y="100" fill="#f8fafc" font-family="Inter, Arial" font-size="28" font-weight="800">catalog item</text>
  <text x="36" y="145" fill="#a8cfe0" font-family="Inter, Arial" font-size="20">metadata sync</text>
  <text x="36" y="176" fill="#a8cfe0" font-family="Inter, Arial" font-size="20">table selection</text>
  <text x="36" y="207" fill="#a8cfe0" font-family="Inter, Arial" font-size="20">automatic future tables</text>
</g>
<g transform="translate(1040 210)">
  <rect x="0" y="0" width="280" height="150" rx="24" fill="#10243a" stroke="#24536b" stroke-width="2"/>
  <text x="30" y="56" fill="#f8fafc" font-family="Inter, Arial" font-size="27" font-weight="750">SQL endpoint</text>
  <text x="30" y="96" fill="#a8cfe0" font-family="Inter, Arial" font-size="20">query with T-SQL</text>
</g>
<g transform="translate(1040 430)">
  <rect x="0" y="0" width="280" height="150" rx="24" fill="#10243a" stroke="#24536b" stroke-width="2"/>
  <text x="30" y="56" fill="#f8fafc" font-family="Inter, Arial" font-size="27" font-weight="750">Power BI</text>
  <text x="30" y="96" fill="#a8cfe0" font-family="Inter, Arial" font-size="20">Direct Lake reports</text>
</g>
<path d="M390 340 C455 340 475 400 540 400" fill="none" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M390 600 C470 600 465 470 540 450" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrowGrey)"/>
<path d="M870 370 C940 345 970 300 1030 285" fill="none" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M870 445 C940 470 970 505 1030 505" fill="none" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/></marker>
  <marker id="arrowGrey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
</defs>
<text x="430" y="315" fill="#7dd3fc" font-family="Inter, Arial" font-size="20" font-weight="700">catalog structure mirrors</text>
<text x="430" y="650" fill="#94a3b8" font-family="Inter, Arial" font-size="19" font-weight="700">data stays in S3, read through shortcuts</text>
<text x="70" y="760" fill="#9cc7d7" font-family="Inter, Arial" font-size="19">Key design point: Fabric gets governed access without forcing a full lake migration first.</text>
</svg>
