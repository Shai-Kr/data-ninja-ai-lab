<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">AWS Glue mirroring readiness checklist</title>
<desc id="desc">A five-part checklist for selecting a pilot, IAM permissions, Lake Formation access, table scope, and propagation expectations.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0e2237"/></linearGradient></defs>
<rect width="1400" height="820" fill="url(#bg)"/>
<text x="70" y="90" fill="#e5f6ff" font-family="Inter, Arial" font-size="46" font-weight="800">The pilot checklist before you mirror</text>
<text x="72" y="136" fill="#a8cfe0" font-family="Inter, Arial" font-size="24">Treat the preview as an architecture pilot, not a shortcut around governance.</text>
<g font-family="Inter, Arial">
  <g transform="translate(80 220)"><rect width="360" height="170" rx="26" fill="#10243a" stroke="#24536b" stroke-width="2"/><circle cx="54" cy="58" r="24" fill="#22d3ee"/><text x="46" y="67" fill="#07111f" font-size="26" font-weight="900">1</text><text x="94" y="58" fill="#f8fafc" font-size="26" font-weight="750">Pick one domain</text><text x="34" y="105" fill="#a8cfe0" font-size="20">Start with a bounded Iceberg</text><text x="34" y="134" fill="#a8cfe0" font-size="20">dataset and a real BI use case.</text></g>
  <g transform="translate(520 220)"><rect width="360" height="170" rx="26" fill="#10243a" stroke="#24536b" stroke-width="2"/><circle cx="54" cy="58" r="24" fill="#22d3ee"/><text x="46" y="67" fill="#07111f" font-size="26" font-weight="900">2</text><text x="94" y="58" fill="#f8fafc" font-size="26" font-weight="750">Design IAM access</text><text x="34" y="105" fill="#a8cfe0" font-size="20">Grant read access to Glue</text><text x="34" y="134" fill="#a8cfe0" font-size="20">metadata and S3 data paths.</text></g>
  <g transform="translate(960 220)"><rect width="360" height="170" rx="26" fill="#10243a" stroke="#24536b" stroke-width="2"/><circle cx="54" cy="58" r="24" fill="#22d3ee"/><text x="46" y="67" fill="#07111f" font-size="26" font-weight="900">3</text><text x="94" y="58" fill="#f8fafc" font-size="26" font-weight="750">Check Lake Formation</text><text x="34" y="105" fill="#a8cfe0" font-size="20">If it governs the catalog,</text><text x="34" y="134" fill="#a8cfe0" font-size="20">Fabric only sees allowed tables.</text></g>
  <g transform="translate(300 475)"><rect width="360" height="170" rx="26" fill="#10243a" stroke="#24536b" stroke-width="2"/><circle cx="54" cy="58" r="24" fill="#22d3ee"/><text x="46" y="67" fill="#07111f" font-size="26" font-weight="900">4</text><text x="94" y="58" fill="#f8fafc" font-size="26" font-weight="750">Choose table scope</text><text x="34" y="105" fill="#a8cfe0" font-size="20">Do not mirror every table by</text><text x="34" y="134" fill="#a8cfe0" font-size="20">default. Curate the first set.</text></g>
  <g transform="translate(740 475)"><rect width="360" height="170" rx="26" fill="#10243a" stroke="#24536b" stroke-width="2"/><circle cx="54" cy="58" r="24" fill="#22d3ee"/><text x="46" y="67" fill="#07111f" font-size="26" font-weight="900">5</text><text x="94" y="58" fill="#f8fafc" font-size="26" font-weight="750">Set expectations</text><text x="34" y="105" fill="#a8cfe0" font-size="20">Metadata propagation can take</text><text x="34" y="134" fill="#a8cfe0" font-size="20">seconds to a few minutes.</text></g>
</g>
<text x="70" y="755" fill="#9cc7d7" font-family="Inter, Arial" font-size="20">The win is not a bigger catalog. The win is a trusted cross-cloud analytics path people can explain.</text>
</svg>
