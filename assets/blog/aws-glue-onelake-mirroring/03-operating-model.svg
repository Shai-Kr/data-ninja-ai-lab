<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Operating model for AWS Glue mirrored catalogs in Fabric</title>
<desc id="desc">Ownership model that connects data owners, platform owners, BI builders, and governance review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset="1" stop-color="#10243a"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2a3d"/><stop offset="1" stop-color="#10243a"/></linearGradient></defs>
<rect width="1400" height="820" fill="url(#bg)"/>
<text x="70" y="90" fill="#e5f6ff" font-family="Inter, Arial" font-size="46" font-weight="800">A cross-cloud lake needs an owner map</text>
<text x="72" y="136" fill="#a8cfe0" font-family="Inter, Arial" font-size="24">Mirroring is useful when ownership is clear across AWS, Fabric, BI, and governance.</text>
<g font-family="Inter, Arial">
  <rect x="95" y="235" width="250" height="145" rx="24" fill="url(#card)" stroke="#24536b" stroke-width="2"/>
  <text x="130" y="285" fill="#f8fafc" font-size="26" font-weight="800">AWS data owner</text>
  <text x="130" y="326" fill="#a8cfe0" font-size="19">table meaning</text>
  <text x="130" y="354" fill="#a8cfe0" font-size="19">source access</text>
  <rect x="420" y="235" width="250" height="145" rx="24" fill="url(#card)" stroke="#24536b" stroke-width="2"/>
  <text x="455" y="285" fill="#f8fafc" font-size="26" font-weight="800">Platform owner</text>
  <text x="455" y="326" fill="#a8cfe0" font-size="19">connection</text>
  <text x="455" y="354" fill="#a8cfe0" font-size="19">sync policy</text>
  <rect x="745" y="235" width="250" height="145" rx="24" fill="url(#card)" stroke="#24536b" stroke-width="2"/>
  <text x="780" y="285" fill="#f8fafc" font-size="26" font-weight="800">BI owner</text>
  <text x="780" y="326" fill="#a8cfe0" font-size="19">semantic model</text>
  <text x="780" y="354" fill="#a8cfe0" font-size="19">report trust</text>
  <rect x="1070" y="235" width="250" height="145" rx="24" fill="url(#card)" stroke="#24536b" stroke-width="2"/>
  <text x="1105" y="285" fill="#f8fafc" font-size="26" font-weight="800">Governance</text>
  <text x="1105" y="326" fill="#a8cfe0" font-size="19">scope review</text>
  <text x="1105" y="354" fill="#a8cfe0" font-size="19">risk controls</text>
  <path d="M345 307 H420" stroke="#38bdf8" stroke-width="5"/><path d="M670 307 H745" stroke="#38bdf8" stroke-width="5"/><path d="M995 307 H1070" stroke="#38bdf8" stroke-width="5"/>
  <rect x="190" y="500" width="1020" height="120" rx="30" fill="#071827" stroke="#22d3ee" stroke-width="3"/>
  <text x="245" y="550" fill="#f8fafc" font-size="26" font-weight="850">Review rhythm: selected tables, IAM credential, S3 path, sync expectation</text>
  <text x="245" y="588" fill="#a8cfe0" font-size="21">If one part changes, someone owns the impact before reports drift.</text>
</g>
<text x="70" y="755" fill="#9cc7d7" font-family="Inter, Arial" font-size="20">Fabric makes access possible. The operating model makes the result trustworthy.</text>
</svg>
