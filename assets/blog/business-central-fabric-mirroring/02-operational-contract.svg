<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Six-part mirroring operational contract</title><desc id="d">Scope, identity, freshness, movement, failure, and business validation form the operating contract.</desc><rect width="1200" height="640" rx="34" fill="#07111f"/><text x="70" y="78" fill="#f4f8ff" font-family="Arial" font-size="34" font-weight="700">The replication job needs an operating contract</text><text x="70" y="116" fill="#8fa8c6" font-family="Arial" font-size="20">A green run is only one part of production readiness</text><g font-family="Arial"><g fill="#10253a" stroke-width="3"><rect x="70" y="170" width="320" height="150" rx="22" stroke="#18d3ff"/><rect x="440" y="170" width="320" height="150" rx="22" stroke="#8b7cff"/><rect x="810" y="170" width="320" height="150" rx="22" stroke="#2ee6a6"/><rect x="70" y="360" width="320" height="150" rx="22" stroke="#f7b955"/><rect x="440" y="360" width="320" height="150" rx="22" stroke="#ff6f91"/><rect x="810" y="360" width="320" height="150" rx="22" stroke="#5de0ff"/></g><text x="100" y="217" fill="#18d3ff" font-size="23" font-weight="700">1 · Scope</text><text x="100" y="257" fill="#eaf4ff" font-size="19">Companies, tables, grain</text><text x="470" y="217" fill="#b6aaff" font-size="23" font-weight="700">2 · Identity</text><text x="470" y="257" fill="#eaf4ff" font-size="19">App, secret, workspace role</text><text x="840" y="217" fill="#59f2bc" font-size="23" font-weight="700">3 · Freshness</text><text x="840" y="257" fill="#eaf4ff" font-size="19">Interval and last good run</text><text x="100" y="407" fill="#ffd083" font-size="23" font-weight="700">4 · Movement</text><text x="100" y="447" fill="#eaf4ff" font-size="19">Insert, update, delete counts</text><text x="470" y="407" fill="#ff9bb0" font-size="23" font-weight="700">5 · Failure</text><text x="470" y="447" fill="#eaf4ff" font-size="19">Threshold, owner, recovery</text><text x="840" y="407" fill="#5de0ff" font-size="23" font-weight="700">6 · Business truth</text><text x="840" y="447" fill="#eaf4ff" font-size="19">Known totals and reconciliation</text><rect x="270" y="550" width="660" height="54" rx="27" fill="#0d2033"/><text x="600" y="584" text-anchor="middle" fill="#f4f8ff" font-size="20" font-weight="700">Technical delivery plus business acceptance builds trust</text></g></svg>
