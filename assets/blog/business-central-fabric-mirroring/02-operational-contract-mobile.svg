<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><rect width="600" height="900" rx="30" fill="#07111f"/><text x="42" y="62" fill="#f4f8ff" font-family="Arial" font-size="27" font-weight="700">Six production controls</text><text x="42" y="98" fill="#8fa8c6" font-family="Arial" font-size="18">A green run is only the beginning</text><g font-family="Arial" fill="#10253a" stroke-width="3"><rect x="42" y="140" width="516" height="92" rx="18" stroke="#18d3ff"/><rect x="42" y="250" width="516" height="92" rx="18" stroke="#8b7cff"/><rect x="42" y="360" width="516" height="92" rx="18" stroke="#2ee6a6"/><rect x="42" y="470" width="516" height="92" rx="18" stroke="#f7b955"/><rect x="42" y="580" width="516" height="92" rx="18" stroke="#ff6f91"/><rect x="42" y="690" width="516" height="92" rx="18" stroke="#5de0ff"/></g><g font-family="Arial"><text x="68" y="179" fill="#18d3ff" font-size="21" font-weight="700">1 · Scope</text><text x="68" y="210" fill="#eaf4ff" font-size="18">Companies, tables, grain</text><text x="68" y="289" fill="#b6aaff" font-size="21" font-weight="700">2 · Identity</text><text x="68" y="320" fill="#eaf4ff" font-size="18">App, secret, workspace role</text><text x="68" y="399" fill="#59f2bc" font-size="21" font-weight="700">3 · Freshness</text><text x="68" y="430" fill="#eaf4ff" font-size="18">Interval and last good run</text><text x="68" y="509" fill="#ffd083" font-size="21" font-weight="700">4 · Movement</text><text x="68" y="540" fill="#eaf4ff" font-size="18">Insert, update, delete counts</text><text x="68" y="619" fill="#ff9bb0" font-size="21" font-weight="700">5 · Failure</text><text x="68" y="650" fill="#eaf4ff" font-size="18">Threshold, owner, recovery</text><text x="68" y="729" fill="#5de0ff" font-size="21" font-weight="700">6 · Business truth</text><text x="68" y="760" fill="#eaf4ff" font-size="18">Known totals and reconciliation</text><text x="300" y="842" text-anchor="middle" fill="#f4f8ff" font-size="18" font-weight="700">Delivery plus acceptance builds trust</text></g></svg>
