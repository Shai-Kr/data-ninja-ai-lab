<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">One shared path from Business Central to Fabric</title><desc id="d">Selected Business Central companies and tables flow through open mirroring into OneLake and shared consumers.</desc><rect width="1200" height="640" rx="34" fill="#07111f"/><text x="70" y="78" fill="#f4f8ff" font-family="Arial" font-size="34" font-weight="700">One controlled path, many analytical consumers</text><text x="70" y="116" fill="#8fa8c6" font-family="Arial" font-size="20">Transaction ownership stays in Business Central. Analytics ownership moves to Fabric.</text><g font-family="Arial"><rect x="70" y="190" width="270" height="280" rx="24" fill="#10253a" stroke="#18d3ff" stroke-width="3"/><text x="100" y="240" fill="#18d3ff" font-size="24" font-weight="700">Business Central</text><text x="100" y="294" fill="#eaf4ff" font-size="20">Selected companies</text><text x="100" y="334" fill="#eaf4ff" font-size="20">Selected tables</text><text x="100" y="374" fill="#eaf4ff" font-size="20">Initial snapshot</text><text x="100" y="414" fill="#eaf4ff" font-size="20">Ongoing changes</text><path d="M340 330H455" stroke="#5de0ff" stroke-width="6"/><path d="M440 315l20 15-20 15" fill="none" stroke="#5de0ff" stroke-width="6"/><rect x="460" y="190" width="280" height="280" rx="24" fill="#10253a" stroke="#8b7cff" stroke-width="3"/><text x="500" y="240" fill="#b6aaff" font-size="24" font-weight="700">Open mirroring</text><text x="500" y="294" fill="#eaf4ff" font-size="20">Delta Parquet</text><text x="500" y="334" fill="#eaf4ff" font-size="20">OneLake tables</text><text x="500" y="374" fill="#eaf4ff" font-size="20">SQL endpoint</text><text x="500" y="414" fill="#eaf4ff" font-size="20">Logging namespace</text><path d="M740 330H850" stroke="#5de0ff" stroke-width="6"/><path d="M835 315l20 15-20 15" fill="none" stroke="#5de0ff" stroke-width="6"/><rect x="855" y="170" width="275" height="320" rx="24" fill="#10253a" stroke="#2ee6a6" stroke-width="3"/><text x="895" y="220" fill="#59f2bc" font-size="24" font-weight="700">Shared consumers</text><text x="895" y="278" fill="#eaf4ff" font-size="20">Power BI</text><text x="895" y="320" fill="#eaf4ff" font-size="20">Data Factory</text><text x="895" y="362" fill="#eaf4ff" font-size="20">Fabric IQ</text><text x="895" y="404" fill="#eaf4ff" font-size="20">Notebooks</text><text x="895" y="446" fill="#eaf4ff" font-size="20">Data products</text><rect x="260" y="530" width="680" height="58" rx="29" fill="#0d2033"/><text x="600" y="566" text-anchor="middle" fill="#f4f8ff" font-size="20" font-weight="700">Retire duplicate extracts after reconciliation and parallel validation</text></g></svg>
