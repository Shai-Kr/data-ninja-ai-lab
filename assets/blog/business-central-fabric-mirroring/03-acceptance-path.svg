<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Five gates for Business Central mirroring</title><desc id="d">The release path validates scope, connection, synchronization, reconciliation, and consumer cutover.</desc><rect width="1200" height="640" rx="34" fill="#07111f"/><text x="70" y="78" fill="#f4f8ff" font-family="Arial" font-size="34" font-weight="700">Release the data path through five evidence gates</text><text x="70" y="116" fill="#8fa8c6" font-family="Arial" font-size="20">Do not move reports until each gate has an owner and proof</text><g font-family="Arial"><path d="M150 330H1045" stroke="#23445f" stroke-width="10"/><g fill="#10253a" stroke="#18d3ff" stroke-width="4"><circle cx="150" cy="330" r="66"/><circle cx="375" cy="330" r="66"/><circle cx="600" cy="330" r="66"/><circle cx="825" cy="330" r="66"/><circle cx="1050" cy="330" r="66"/></g><g text-anchor="middle"><text x="150" y="340" fill="#18d3ff" font-size="34" font-weight="700">1</text><text x="375" y="340" fill="#18d3ff" font-size="34" font-weight="700">2</text><text x="600" y="340" fill="#18d3ff" font-size="34" font-weight="700">3</text><text x="825" y="340" fill="#18d3ff" font-size="34" font-weight="700">4</text><text x="1050" y="340" fill="#18d3ff" font-size="34" font-weight="700">5</text><text x="150" y="440" fill="#f4f8ff" font-size="21" font-weight="700">Scope</text><text x="150" y="472" fill="#9eb4cf" font-size="17">domain contract</text><text x="375" y="440" fill="#f4f8ff" font-size="21" font-weight="700">Connection</text><text x="375" y="472" fill="#9eb4cf" font-size="17">identity proof</text><text x="600" y="440" fill="#f4f8ff" font-size="21" font-weight="700">Sync</text><text x="600" y="472" fill="#9eb4cf" font-size="17">rows + watermarks</text><text x="825" y="440" fill="#f4f8ff" font-size="21" font-weight="700">Reconcile</text><text x="825" y="472" fill="#9eb4cf" font-size="17">known totals</text><text x="1050" y="440" fill="#f4f8ff" font-size="21" font-weight="700">Cut over</text><text x="1050" y="472" fill="#9eb4cf" font-size="17">retire old extract</text></g><rect x="260" y="540" width="680" height="54" rx="27" fill="#0d2033"/><text x="600" y="574" text-anchor="middle" fill="#59f2bc" font-size="20" font-weight="700">Every gate leaves evidence that another person can verify</text></g></svg>
