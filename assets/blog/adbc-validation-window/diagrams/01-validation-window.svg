<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">ADBC validation window</title>
<desc id="desc">Move critical connections before the platform moves them for you</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1f33"/><stop offset="1" stop-color="#101629"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102944"/><stop offset="1" stop-color="#111c32"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #eaf6ff; }
    .muted { fill: #a8c2d9; } .small { font-size: 24px; } .mid { font-size: 30px; font-weight: 650; }
    .title { font-size: 52px; font-weight: 800; letter-spacing: -1.2px; }
    .sub { font-size: 27px; fill: #b8d2e8; } .label { font-size: 28px; font-weight: 700; }
    .tiny { font-size: 21px; fill: #bad2e4; } .box { fill: url(#card); stroke: #2f89c5; stroke-width: 2.2; rx: 26; }
    .accent { fill: #61d6ff; } .good { fill: #7cffc7; } .warn { fill: #ffd166; }
    .line { stroke: #61d6ff; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1440" height="810" fill="url(#bg)"/>
<circle cx="1190" cy="130" r="185" fill="#174c82" opacity="0.22" filter="url(#glow)"/>
<circle cx="210" cy="690" r="210" fill="#0aa6c2" opacity="0.14" filter="url(#glow)"/>
<text x="86" y="92" class="title">ADBC validation window</text>
<text x="88" y="137" class="sub">Move critical connections before the platform moves them for you</text>

<rect class="box" x="88" y="215" width="360" height="350"/>
<text x="130" y="275" class="label">1. Inventory</text>
<text x="130" y="325" class="small muted">Snowflake</text>
<text x="130" y="370" class="small muted">Databricks</text>
<text x="130" y="415" class="small muted">BigQuery</text>
<text x="130" y="460" class="small muted">Spark, Dremio, Impala</text>
<rect class="box" x="540" y="215" width="360" height="350"/>
<text x="582" y="275" class="label">2. Pilot</text>
<text x="582" y="325" class="small muted">Use a test workspace</text>
<text x="582" y="370" class="small muted">Try Implementation = 2.0</text>
<text x="582" y="415" class="small muted">Compare refresh behavior</text>
<text x="582" y="460" class="small muted">Keep rollback explicit</text>
<rect class="box" x="992" y="215" width="360" height="350"/>
<text x="1034" y="275" class="label">3. Decide</text>
<text x="1034" y="325" class="small muted">Enable tenant default</text>
<text x="1034" y="370" class="small muted">Document exceptions</text>
<text x="1034" y="415" class="small muted">Update runbooks</text>
<text x="1034" y="460" class="small muted">Track gateway deferrals</text>
<path class="line" d="M450 390 H532"/><path class="line" d="M902 390 H984"/>
<text x="160" y="665" class="mid accent">Default changes arrive in Fall 2026.</text>
<text x="160" y="708" class="mid good">Service-side ODBC removal starts in Early 2027.</text>

</svg>