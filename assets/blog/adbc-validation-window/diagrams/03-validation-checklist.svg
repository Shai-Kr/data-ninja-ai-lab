<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">ADBC readiness checklist</title>
<desc id="desc">A small operating model for Power BI and Fabric teams</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1f33"/><stop offset="1" stop-color="#101629"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102944"/><stop offset="1" stop-color="#111c32"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #eaf6ff; }
    .muted { fill: #a8c2d9; } .small { font-size: 24px; } .mid { font-size: 30px; font-weight: 650; }
    .title { font-size: 52px; font-weight: 800; letter-spacing: -1.2px; }
    .sub { font-size: 27px; fill: #b8d2e8; } .label { font-size: 28px; font-weight: 700; }
    .tiny { font-size: 21px; fill: #bad2e4; } .box { fill: url(#card); stroke: #2f89c5; stroke-width: 2.2; rx: 26; }
    .accent { fill: #61d6ff; } .good { fill: #7cffc7; } .warn { fill: #ffd166; }
    .line { stroke: #61d6ff; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1440" height="810" fill="url(#bg)"/>
<circle cx="1190" cy="130" r="185" fill="#174c82" opacity="0.22" filter="url(#glow)"/>
<circle cx="210" cy="690" r="210" fill="#0aa6c2" opacity="0.14" filter="url(#glow)"/>
<text x="86" y="92" class="title">ADBC readiness checklist</text>
<text x="88" y="137" class="sub">A small operating model for Power BI and Fabric teams</text>

<rect class="box" x="104" y="205" width="1230" height="445"/>
<text x="160" y="278" class="label">Validate before the default flips</text>
<circle cx="178" cy="345" r="14" class="good"/><text x="215" y="354" class="small muted">Pick top refresh and DirectQuery workloads for each affected connector.</text>
<circle cx="178" cy="410" r="14" class="good"/><text x="215" y="419" class="small muted">Create a pilot workspace and enable ADBC only there.</text>
<circle cx="178" cy="475" r="14" class="good"/><text x="215" y="484" class="small muted">Compare row counts, types, refresh time, failures, and query folding assumptions.</text>
<circle cx="178" cy="540" r="14" class="good"/><text x="215" y="549" class="small muted">Separate cloud connection results from gateway-routed results.</text>
<circle cx="178" cy="605" r="14" class="good"/><text x="215" y="614" class="small muted">Record exceptions, owners, rollback notes, and tenant decision date.</text>
<text x="160" y="710" class="mid accent">The win is not the new driver. The win is controlled validation.</text>

</svg>