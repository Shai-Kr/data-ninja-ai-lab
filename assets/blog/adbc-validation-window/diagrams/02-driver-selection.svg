<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">How the driver gets selected</title>
<desc id="desc">Tenant settings matter, but explicit connection choices win</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1f33"/><stop offset="1" stop-color="#101629"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102944"/><stop offset="1" stop-color="#111c32"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #eaf6ff; }
    .muted { fill: #a8c2d9; } .small { font-size: 24px; } .mid { font-size: 30px; font-weight: 650; }
    .title { font-size: 52px; font-weight: 800; letter-spacing: -1.2px; }
    .sub { font-size: 27px; fill: #b8d2e8; } .label { font-size: 28px; font-weight: 700; }
    .tiny { font-size: 21px; fill: #bad2e4; } .box { fill: url(#card); stroke: #2f89c5; stroke-width: 2.2; rx: 26; }
    .accent { fill: #61d6ff; } .good { fill: #7cffc7; } .warn { fill: #ffd166; }
    .line { stroke: #61d6ff; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1440" height="810" fill="url(#bg)"/>
<circle cx="1190" cy="130" r="185" fill="#174c82" opacity="0.22" filter="url(#glow)"/>
<circle cx="210" cy="690" r="210" fill="#0aa6c2" opacity="0.14" filter="url(#glow)"/>
<text x="86" y="92" class="title">How the driver gets selected</text>
<text x="88" y="137" class="sub">Tenant settings matter, but explicit connection choices win</text>

<rect class="box" x="95" y="210" width="540" height="120"/><text x="135" y="260" class="label">Implementation = 2.0</text><text x="135" y="302" class="small muted">Always uses ADBC</text>
<rect class="box" x="805" y="210" width="540" height="120"/><text x="845" y="260" class="label">Implementation = 1.0</text><text x="845" y="302" class="small muted">Stays on ODBC until cutover risk</text>
<rect class="box" x="95" y="410" width="540" height="120"/><text x="135" y="460" class="label">No implementation set</text><text x="135" y="502" class="small muted">Workspace or tenant default decides</text>
<rect class="box" x="805" y="410" width="540" height="120"/><text x="845" y="460" class="label">Gateway routed refresh</text><text x="845" y="502" class="small muted">Still validates the ODBC path today</text>
<path class="line" d="M365 330 V405"/><path class="line" d="M1075 330 V405"/>
<text x="245" y="646" class="mid warn">Do not validate through the wrong execution path.</text>
<text x="245" y="692" class="small muted">Cloud connections prove ADBC behavior. Gateway paths can hide the change.</text>

</svg>