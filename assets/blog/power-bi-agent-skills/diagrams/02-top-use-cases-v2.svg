<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-label="Top Power BI agent skills use cases that save time">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#04111f"/>
      <stop offset="1" stop-color="#071b30"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0e314f"/>
      <stop offset="1" stop-color="#091c31"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:800 48px Inter,Segoe UI,Arial,sans-serif;fill:#f7fcff}
      .sub{font:500 22px Inter,Segoe UI,Arial,sans-serif;fill:#a8dcff}
      .h{font:800 27px Inter,Segoe UI,Arial,sans-serif;fill:#ffffff}
      .p{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#c7e6f8}
      .tag{font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#001423}
      .n{font:900 31px Inter,Segoe UI,Arial,sans-serif;fill:#04111f}
    </style>
  </defs>

  <rect width="1400" height="1120" fill="url(#bg)"/>
  <circle cx="1145" cy="205" r="190" fill="#24d5ff" opacity="0.08"/>
  <circle cx="245" cy="900" r="220" fill="#7df9ff" opacity="0.06"/>

  <text x="80" y="88" class="title">Top Use Cases for Power BI Agent Skills</text>
  <text x="82" y="130" class="sub">Prioritize repeatable report work where AI can remove mechanical friction.</text>

  <g transform="translate(80,190)">
    <rect width="585" height="215" rx="30" fill="url(#tile)" stroke="#28d8ff" stroke-width="2"/>
    <circle cx="54" cy="54" r="26" fill="#7df9ff" filter="url(#softGlow)"/>
    <text x="44" y="66" class="n">1</text>
    <text x="100" y="58" class="h">First draft report build</text>
    <text x="42" y="110" class="p">Create the first PBIR structure from a clear report brief.</text>
    <text x="42" y="140" class="p">Pages, KPIs, slicers, tables, and navigation start faster.</text>
    <rect x="42" y="165" width="170" height="32" rx="16" fill="#7df9ff"/>
    <text x="60" y="187" class="tag">Saves: setup work</text>
  </g>

  <g transform="translate(735,190)">
    <rect width="585" height="215" rx="30" fill="url(#tile)" stroke="#28d8ff" stroke-width="2"/>
    <circle cx="54" cy="54" r="26" fill="#7df9ff" filter="url(#softGlow)"/>
    <text x="44" y="66" class="n">2</text>
    <text x="100" y="58" class="h">Report modernization</text>
    <text x="42" y="110" class="p">Clean up old operational reports without starting over.</text>
    <text x="42" y="140" class="p">Improve layout, alignment, navigation, and scan flow.</text>
    <rect x="42" y="165" width="190" height="32" rx="16" fill="#7df9ff"/>
    <text x="60" y="187" class="tag">Saves: redesign time</text>
  </g>

  <g transform="translate(80,445)">
    <rect width="585" height="215" rx="30" fill="url(#tile)" stroke="#28d8ff" stroke-width="2"/>
    <circle cx="54" cy="54" r="26" fill="#7df9ff" filter="url(#softGlow)"/>
    <text x="44" y="66" class="n">3</text>
    <text x="100" y="58" class="h">Brand and theme updates</text>
    <text x="42" y="110" class="p">Use a reference image, logo, or theme direction.</text>
    <text x="42" y="140" class="p">Apply consistent styling across report pages.</text>
    <rect x="42" y="165" width="180" height="32" rx="16" fill="#7df9ff"/>
    <text x="60" y="187" class="tag">Saves: polish work</text>
  </g>

  <g transform="translate(735,445)">
    <rect width="585" height="215" rx="30" fill="url(#tile)" stroke="#28d8ff" stroke-width="2"/>
    <circle cx="54" cy="54" r="26" fill="#7df9ff" filter="url(#softGlow)"/>
    <text x="44" y="66" class="n">4</text>
    <text x="100" y="58" class="h">Semantic model plus report</text>
    <text x="42" y="110" class="p">Pair report authoring with Modeling MCP.</text>
    <text x="42" y="140" class="p">Build model and report artifacts in one workflow.</text>
    <rect x="42" y="165" width="200" height="32" rx="16" fill="#7df9ff"/>
    <text x="60" y="187" class="tag">Saves: handoff gaps</text>
  </g>

  <g transform="translate(80,700)">
    <rect width="585" height="215" rx="30" fill="url(#tile)" stroke="#28d8ff" stroke-width="2"/>
    <circle cx="54" cy="54" r="26" fill="#7df9ff" filter="url(#softGlow)"/>
    <text x="44" y="66" class="n">5</text>
    <text x="100" y="58" class="h">Screenshot-driven iteration</text>
    <text x="42" y="110" class="p">Reload Desktop and capture the actual rendered output.</text>
    <text x="42" y="140" class="p">Improve based on what the user will really see.</text>
    <rect x="42" y="165" width="170" height="32" rx="16" fill="#7df9ff"/>
    <text x="60" y="187" class="tag">Saves: QA loops</text>
  </g>

  <g transform="translate(735,700)">
    <rect width="585" height="215" rx="30" fill="url(#tile)" stroke="#28d8ff" stroke-width="2"/>
    <circle cx="54" cy="54" r="26" fill="#7df9ff" filter="url(#softGlow)"/>
    <text x="44" y="66" class="n">6</text>
    <text x="100" y="58" class="h">Publishable Fabric assets</text>
    <text x="42" y="110" class="p">Create, update, or publish report definitions in Fabric.</text>
    <text x="42" y="140" class="p">Keep the PBIR work reviewable before release.</text>
    <rect x="42" y="165" width="225" height="32" rx="16" fill="#7df9ff"/>
    <text x="60" y="187" class="tag">Saves: deployment prep</text>
  </g>

  <rect x="80" y="975" width="1240" height="78" rx="28" fill="#081d33" stroke="#28d8ff" stroke-width="1" opacity="0.92"/>
  <text x="112" y="1025" class="sub">Best starting point: one report, one semantic model, one business question, and a Git branch where every AI edit is visible.</text>
</svg>
