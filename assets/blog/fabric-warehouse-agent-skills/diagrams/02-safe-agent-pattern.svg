<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Safe Fabric Warehouse agent pattern</title>
  <desc id="desc">Four clear controls for safe agent-assisted Fabric Warehouse development.</desc>
  <rect width="720" height="520" rx="24" fill="#07111f"/>
  <text x="36" y="58" fill="#e5f8ff" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="700">Safe warehouse agent pattern</text>
  <text x="36" y="92" fill="#9cc9d8" font-family="Inter, Segoe UI, Arial" font-size="18">Use the agent for speed. Keep release authority with the team.</text>
  <g font-family="Inter, Segoe UI, Arial">
    <rect x="42" y="135" width="300" height="115" rx="18" fill="#0b2033" stroke="#22d3ee"/>
    <text x="68" y="178" fill="#e8fbff" font-size="23" font-weight="700">1. Scope access</text>
    <text x="68" y="212" fill="#b7d9e6" font-size="18">One workspace. Read-first.</text>
    <rect x="378" y="135" width="300" height="115" rx="18" fill="#0b2033" stroke="#38bdf8"/>
    <text x="404" y="178" fill="#e8fbff" font-size="23" font-weight="700">2. Generate drafts</text>
    <text x="404" y="212" fill="#b7d9e6" font-size="18">SQL, tests, explanations.</text>
    <rect x="42" y="290" width="300" height="115" rx="18" fill="#0b2033" stroke="#a78bfa"/>
    <text x="68" y="333" fill="#e8fbff" font-size="23" font-weight="700">3. Validate results</text>
    <text x="68" y="367" fill="#b7d9e6" font-size="18">Counts, totals, known samples.</text>
    <rect x="378" y="290" width="300" height="115" rx="18" fill="#0b2033" stroke="#34d399"/>
    <text x="404" y="333" fill="#e8fbff" font-size="23" font-weight="700">4. Approve changes</text>
    <text x="404" y="367" fill="#b7d9e6" font-size="18">PR, ticket, deployment gate.</text>
  </g>
  <rect x="72" y="442" width="576" height="44" rx="14" fill="#0f2940" stroke="#1f9bb5"/>
  <text x="102" y="471" fill="#e5f8ff" font-family="Inter, Segoe UI, Arial" font-size="17">First wins: explain objects, draft queries, troubleshoot errors.</text>
</svg>
