<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Warehouse agent loop</title>
  <desc id="desc">A five-step loop for agent-assisted warehouse work.</desc>
  <rect width="720" height="520" rx="24" fill="#07111f"/>
  <text x="36" y="58" fill="#e5f8ff" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="700">Fabric Warehouse agent loop</text>
  <text x="36" y="92" fill="#9cc9d8" font-family="Inter, Segoe UI, Arial" font-size="18">Skills guide the agent. MCP connects it to live Fabric context.</text>
  <g font-family="Inter, Segoe UI, Arial" fill="#e8fbff">
    <rect x="36" y="132" width="138" height="92" rx="16" fill="#0b2033" stroke="#22d3ee"/>
    <text x="56" y="170" font-size="20" font-weight="700">Intent</text><text x="56" y="199" font-size="16" fill="#b7d9e6">Ask the task</text>
    <rect x="212" y="132" width="138" height="92" rx="16" fill="#0b2033" stroke="#38bdf8"/>
    <text x="232" y="170" font-size="20" font-weight="700">AI tool</text><text x="232" y="199" font-size="16" fill="#b7d9e6">Plans work</text>
    <rect x="388" y="132" width="138" height="92" rx="16" fill="#0b2033" stroke="#a78bfa"/>
    <text x="408" y="170" font-size="20" font-weight="700">Skill</text><text x="408" y="199" font-size="16" fill="#b7d9e6">Fabric rules</text>
    <rect x="548" y="132" width="138" height="92" rx="16" fill="#0b2033" stroke="#34d399"/>
    <text x="568" y="170" font-size="20" font-weight="700">MCP</text><text x="568" y="199" font-size="16" fill="#b7d9e6">Live tools</text>
    <rect x="170" y="315" width="380" height="112" rx="18" fill="#081a2b" stroke="#22d3ee"/>
    <text x="215" y="362" font-size="24" font-weight="700">Fabric Data Warehouse</text>
    <text x="215" y="394" font-size="17" fill="#b7d9e6">Schema, SQL, errors, results, context</text>
  </g>
  <g stroke="#5eead4" stroke-width="4" fill="none" stroke-linecap="round"><path d="M174 178 H212"/><path d="M350 178 H388"/><path d="M526 178 H548"/><path d="M617 224 C617 300 545 315 505 315"/><path d="M215 315 C150 288 106 250 105 224"/></g>
  <g fill="#5eead4"><polygon points="206,170 224,178 206,186"/><polygon points="382,170 400,178 382,186"/><polygon points="542,170 560,178 542,186"/><polygon points="512,306 494,315 514,324"/><polygon points="112,232 104,214 96,232"/></g>
  <text x="122" y="478" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial" font-size="17">Human review decides what gets promoted.</text>
</svg>
