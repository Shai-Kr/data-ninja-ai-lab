<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Two-week Fabric Warehouse agent pilot</title>
  <desc id="desc">A compact checklist for a two-week Fabric Warehouse agent pilot.</desc>
  <rect width="720" height="520" rx="24" fill="#07111f"/>
  <text x="36" y="58" fill="#e5f8ff" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="700">Two-week warehouse agent pilot</text>
  <text x="36" y="92" fill="#9cc9d8" font-family="Inter, Segoe UI, Arial" font-size="18">Small enough to run now. Strict enough to learn.</text>
  <g font-family="Inter, Segoe UI, Arial">
    <rect x="42" y="132" width="300" height="270" rx="20" fill="#0b2033" stroke="#22d3ee"/>
    <text x="70" y="180" fill="#e8fbff" font-size="24" font-weight="700">Week 1: setup</text>
    <text x="70" y="225" fill="#b7d9e6" font-size="18">✓ Non-production warehouse</text>
    <text x="70" y="265" fill="#b7d9e6" font-size="18">✓ Relevant Fabric skills</text>
    <text x="70" y="305" fill="#b7d9e6" font-size="18">✓ MCP read-first access</text>
    <text x="70" y="345" fill="#b7d9e6" font-size="18">✓ Allowed and blocked tasks</text>
    <rect x="378" y="132" width="300" height="270" rx="20" fill="#0b2033" stroke="#34d399"/>
    <text x="406" y="180" fill="#e8fbff" font-size="24" font-weight="700">Week 2: validate</text>
    <text x="406" y="225" fill="#b7d9e6" font-size="18">✓ Real backlog tasks</text>
    <text x="406" y="265" fill="#b7d9e6" font-size="18">✓ Known result checks</text>
    <text x="406" y="305" fill="#b7d9e6" font-size="18">✓ Performance review</text>
    <text x="406" y="345" fill="#b7d9e6" font-size="18">✓ Human approval gates</text>
  </g>
  <rect x="82" y="440" width="556" height="46" rx="15" fill="#0f2940" stroke="#38bdf8"/>
  <text x="112" y="470" fill="#e8fbff" font-family="Inter, Segoe UI, Arial" font-size="17">Measure faster validated work, not just faster SQL generation.</text>
</svg>
