<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">The Fabric Warehouse Delivery Loop</title><desc id="desc">Small schema changes become reviewable, testable, and deployable.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09233a"/><stop offset="1" stop-color="#03101b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter></defs>
<rect width="1280" height="720" fill="url(#g)"/>
<circle cx="1080" cy="80" r="170" fill="#103d5e" opacity="0.35"/><circle cx="160" cy="650" r="210" fill="#0d3a48" opacity="0.28"/>
<text x="70" y="88" font-family="Inter, Segoe UI, Arial" font-size="44" font-weight="800" fill="#eaf7ff">The Fabric Warehouse Delivery Loop</text>
<text x="72" y="132" font-family="Inter, Segoe UI, Arial" font-size="22" fill="#9dc8d8">Small schema changes become reviewable, testable, and deployable.</text>
<rect x="55" y="230" width="270" height="300" rx="28" fill="#0b2235" stroke="#1d8fb8" stroke-width="2" filter="url(#shadow)"/>
<text x="83" y="285" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="800" fill="#38d9ff">1. Extract</text>
<text x="83" y="335" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">Start from an</text>
<text x="83" y="375" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">existing warehouse</text>
<text x="83" y="415" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">or database project</text>
<path d="M 335 380 L 345 380" stroke="#80f0c8" stroke-width="5" stroke-linecap="round"/>
<path d="M 335 368 L 351 380 L 335 392" fill="none" stroke="#80f0c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="355" y="230" width="270" height="300" rx="28" fill="#0b2235" stroke="#1d8fb8" stroke-width="2" filter="url(#shadow)"/>
<text x="383" y="285" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="800" fill="#38d9ff">2. Review</text>
<text x="383" y="335" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">Schema Compare</text>
<text x="383" y="375" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">shows the change</text>
<text x="383" y="415" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">before deployment</text>
<path d="M 635 380 L 645 380" stroke="#80f0c8" stroke-width="5" stroke-linecap="round"/>
<path d="M 635 368 L 651 380 L 635 392" fill="none" stroke="#80f0c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="655" y="230" width="270" height="300" rx="28" fill="#0b2235" stroke="#1d8fb8" stroke-width="2" filter="url(#shadow)"/>
<text x="683" y="285" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="800" fill="#38d9ff">3. Build</text>
<text x="683" y="335" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">DacFx creates</text>
<text x="683" y="375" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">a deployable</text>
<text x="683" y="415" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">database artifact</text>
<path d="M 935 380 L 945 380" stroke="#80f0c8" stroke-width="5" stroke-linecap="round"/>
<path d="M 935 368 L 951 380 L 935 392" fill="none" stroke="#80f0c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="955" y="230" width="270" height="300" rx="28" fill="#0b2235" stroke="#1d8fb8" stroke-width="2" filter="url(#shadow)"/>
<text x="983" y="285" font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="800" fill="#38d9ff">4. Promote</text>
<text x="983" y="335" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">Use pipelines</text>
<text x="983" y="375" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">GitHub Actions</text>
<text x="983" y="415" font-family="Inter, Segoe UI, Arial" font-size="23" fill="#eaf7ff">or Azure DevOps</text>
<text x="70" y="640" font-family="Inter, Segoe UI, Arial" font-size="24" fill="#80f0c8">Data Ninja AI Lab | Microsoft Fabric Warehouse engineering pattern</text>
</svg>