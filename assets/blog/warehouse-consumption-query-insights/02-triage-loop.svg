<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title>A practical triage loop</title><desc>Move from capacity spike to workload action.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1630"/><stop offset="1" stop-color="#102a3f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1400" height="820" rx="42" fill="url(#bg)"/>
<circle cx="1180" cy="120" r="220" fill="#2dd4bf" opacity="0.12"/>
<circle cx="150" cy="720" r="260" fill="#60a5fa" opacity="0.11"/>
<text x="80" y="92" fill="#e5f3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">A practical triage loop</text>
<text x="82" y="140" fill="#9fb7d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Move from capacity spike to workload action.</text>
<rect x="80" y="210" width="290" height="180" rx="24" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="2"/>
<text x="108" y="262" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">1. Find the spike</text>
<text x="108" y="335" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Open Capacity Metrics</text>
<text x="108" y="363" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Select the warehouse</text>
<text x="108" y="391" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Capture the time window</text>
<rect x="410" y="210" width="290" height="180" rx="24" fill="#2dd4bf" opacity="0.18" stroke="#2dd4bf" stroke-width="2"/>
<text x="438" y="262" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">2. Pull requests</text>
<text x="438" y="335" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Use Query Insights</text>
<text x="438" y="363" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Capture vCore seconds</text>
<text x="438" y="391" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Group by query and user</text>
<rect x="740" y="210" width="290" height="180" rx="24" fill="#a78bfa" opacity="0.18" stroke="#a78bfa" stroke-width="2"/>
<text x="768" y="262" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">3. Attribute cost</text>
<text x="768" y="335" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Weight query activity</text>
<text x="768" y="363" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">against warehouse CU use</text>
<text x="768" y="391" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Rank the drivers</text>
<rect x="1070" y="210" width="250" height="180" rx="24" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
<text x="1098" y="262" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">4. Act</text>
<text x="1098" y="335" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Tune, schedule, split</text>
<text x="1098" y="363" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">or assign ownership</text>
<rect x="180" y="500" width="1040" height="130" rx="24" fill="#22c55e" opacity="0.18" stroke="#22c55e" stroke-width="2"/>
<text x="208" y="552" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750">Best outcome</text>
<text x="208" y="625" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Capacity conversations become evidence-based, not blame-based.</text>
<text x="80" y="770" fill="#7890ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Data Ninja AI Lab · Shai Karmani · Microsoft Fabric warehouse operations</text>
</svg>