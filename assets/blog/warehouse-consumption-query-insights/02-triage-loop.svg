<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title>A practical triage loop</title><desc>Move from capacity spike to workload action.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1630"/><stop offset="1" stop-color="#102a3f"/></linearGradient></defs>
<rect width="1400" height="820" rx="42" fill="url(#bg)"/>
<circle cx="1190" cy="110" r="190" fill="#2dd4bf" opacity="0.10"/>
<circle cx="120" cy="735" r="220" fill="#60a5fa" opacity="0.08"/>
<text x="80" y="92" fill="#e5f3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">A practical triage loop</text>
<text x="82" y="140" fill="#9fb7d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Move from capacity spike to workload action.</text>
<rect x="80" y="205" width="290" height="185" rx="24" fill="#38bdf8" opacity="0.16" stroke="#38bdf8" stroke-width="2"/>
<text x="108" y="253" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">1. Find the spike</text>
<text x="108" y="317" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Open Capacity Metrics</text>
<text x="108" y="343" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Select warehouse</text>
<text x="108" y="369" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Capture time window</text>
<rect x="410" y="205" width="290" height="185" rx="24" fill="#2dd4bf" opacity="0.16" stroke="#2dd4bf" stroke-width="2"/>
<text x="438" y="253" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">2. Pull requests</text>
<text x="438" y="317" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Use Query Insights</text>
<text x="438" y="343" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Capture CPU time</text>
<text x="438" y="369" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Group by user</text>
<rect x="740" y="205" width="290" height="185" rx="24" fill="#a78bfa" opacity="0.16" stroke="#a78bfa" stroke-width="2"/>
<text x="768" y="253" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">3. Attribute cost</text>
<text x="768" y="317" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Weight activity</text>
<text x="768" y="343" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">against CU use</text>
<text x="768" y="369" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Rank the drivers</text>
<rect x="1070" y="205" width="250" height="185" rx="24" fill="#f59e0b" opacity="0.16" stroke="#f59e0b" stroke-width="2"/>
<text x="1098" y="253" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">4. Act</text>
<text x="1098" y="317" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Tune</text>
<text x="1098" y="343" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Schedule</text>
<text x="1098" y="369" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Assign owner</text>
<rect x="180" y="470" width="1040" height="150" rx="24" fill="#22c55e" opacity="0.16" stroke="#22c55e" stroke-width="2"/>
<text x="208" y="518" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750">Best outcome</text>
<text x="208" y="582" fill="#b9cae4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Capacity conversations become evidence-based, not blame-based.</text>
<text x="80" y="780" fill="#7890ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Data Ninja AI Lab · Shai Karmani · Microsoft Fabric warehouse operations</text>
</svg>