<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="0.55" stop-color="#101B3D"/><stop offset="1" stop-color="#062B3D"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#13254E"/><stop offset="1" stop-color="#0E3B4B"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#F8FBFF}.sub{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#B9D8FF}.label{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}.small{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#C7D7EF}.tiny{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#AFC3DD}.pill{fill:#1BE7C6;fill-opacity:.14;stroke:#1BE7C6;stroke-width:2}.box{fill:url(#card);stroke:#2EF2D0;stroke-opacity:.55;stroke-width:2}.arrow{stroke:#65E8FF;stroke-width:4;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65E8FF"/></marker></defs><rect width="1400" height="788" fill="url(#bg)"/><text x="70" y="86" class="title">The Enterprise Copilot Readiness Checklist</text><text x="70" y="122" class="sub">GA makes the pattern easier to adopt. It does not remove the operating model.</text><rect x="90" y="210" width="350" height="125" rx="24" class="box"/><text x="125" y="260" class="label">1. Tool intent</text><text x="125" y="297" class="small">Describe when Fabric should answer</text><rect x="510" y="210" width="350" height="125" rx="24" class="box"/><text x="545" y="260" class="label">2. Data quality</text><text x="545" y="297" class="small">Fix names, measures, and grain</text><rect x="930" y="210" width="350" height="125" rx="24" class="box"/><text x="965" y="260" class="label">3. Permissions</text><text x="965" y="297" class="small">Test as the real user</text><rect x="90" y="395" width="350" height="125" rx="24" class="box"/><text x="125" y="445" class="label">4. Evaluation</text><text x="125" y="482" class="small">Keep prompt and answer examples</text><rect x="510" y="395" width="350" height="125" rx="24" class="box"/><text x="545" y="445" class="label">5. Monitoring</text><text x="545" y="482" class="small">Review tool calls and failures</text><rect x="930" y="395" width="350" height="125" rx="24" class="box"/><text x="965" y="445" class="label">6. Ownership</text><text x="965" y="482" class="small">Assign model and agent stewards</text><rect x="322" y="610" width="756" height="62" rx="31" class="pill"/><text x="393" y="650" class="small">Useful copilots are designed systems, not just connected chat windows.</text></svg>