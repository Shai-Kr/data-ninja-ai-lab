<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="0.55" stop-color="#101B3D"/><stop offset="1" stop-color="#062B3D"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#13254E"/><stop offset="1" stop-color="#0E3B4B"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#F8FBFF}.sub{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#B9D8FF}.label{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}.small{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#C7D7EF}.tiny{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#AFC3DD}.pill{fill:#1BE7C6;fill-opacity:.14;stroke:#1BE7C6;stroke-width:2}.box{fill:url(#card);stroke:#2EF2D0;stroke-opacity:.55;stroke-width:2}.arrow{stroke:#65E8FF;stroke-width:4;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65E8FF"/></marker></defs><rect width="1400" height="788" fill="url(#bg)"/><text x="70" y="88" class="title">Fabric Data Agents as Copilot Studio Tools</text><text x="70" y="122" class="sub">The useful shift is composability: governed data becomes one callable capability inside the agent.</text><rect x="80" y="245" width="250" height="150" rx="26" class="box"/><text x="125" y="305" class="label">Business user</text><text x="125" y="340" class="small">Plain English request</text><text x="125" y="370" class="tiny">Question, process, action</text><path class="arrow" d="M335 320 H470"/><rect x="480" y="205" width="330" height="230" rx="30" class="box" filter="url(#glow)"/><text x="535" y="270" class="label">Copilot Studio</text><text x="535" y="304" class="small">Orchestrates topics, tools,</text><text x="535" y="334" class="small">knowledge, and agents</text><rect x="535" y="365" width="210" height="38" rx="19" class="pill"/><text x="562" y="390" class="tiny">Tool selection at runtime</text><path class="arrow" d="M815 320 H940"/><rect x="950" y="175" width="330" height="290" rx="30" class="box"/><text x="1010" y="240" class="label">Fabric Data Agent</text><text x="1010" y="276" class="small">Queries governed data</text><text x="1010" y="306" class="small">in Fabric, not a copy</text><text x="1010" y="352" class="tiny">Semantic models</text><text x="1010" y="382" class="tiny">Warehouses and Lakehouses</text><text x="1010" y="412" class="tiny">Eventhouse and KQL</text><path class="arrow" d="M1115 470 V570"/><rect x="910" y="585" width="410" height="80" rx="24" class="pill"/><text x="965" y="635" class="small">Permissions and governance stay in Fabric</text></svg>