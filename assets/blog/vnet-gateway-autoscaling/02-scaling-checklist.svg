<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1180" viewBox="0 0 520 1180" role="img" aria-label="Fabric gateway scaling checklist">
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8fbff}.title{font-size:31px;font-weight:850}.sub{font-size:24px;fill:#a8ceda}.h{font-size:26px;font-weight:850}.body{font-size:23px;fill:#bee7f2}.n{font-size:24px;font-weight:900;fill:#06111f}</style></defs>
  <rect width="520" height="1180" fill="#07111f"/>
  <rect x="24" y="24" width="472" height="1132" rx="30" fill="#0b1f33" stroke="#155e75"/>
  <text x="48" y="82" class="title">Before scaling</text>
  <text x="48" y="120" class="title">the gateway</text>
  <text x="48" y="160" class="sub">Autoscaling works when</text>
  <text x="48" y="190" class="sub">the contract is clear.</text>

  <g transform="translate(50 250)"><rect width="420" height="175" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="44" cy="48" r="24" fill="#22d3ee"/><text x="36" y="57" class="n">1</text><text x="82" y="55" class="h">Inventory</text><text x="82" y="98" class="body">Models, dataflows,</text><text x="82" y="132" class="body">pipelines, owners.</text></g>
  <g transform="translate(50 465)"><rect width="420" height="175" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="44" cy="48" r="24" fill="#22d3ee"/><text x="36" y="57" class="n">2</text><text x="82" y="55" class="h">Set limits</text><text x="82" y="98" class="body">Baseline load, peak</text><text x="82" y="132" class="body">tolerance, cost cap.</text></g>
  <g transform="translate(50 680)"><rect width="420" height="175" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="44" cy="48" r="24" fill="#22d3ee"/><text x="36" y="57" class="n">3</text><text x="82" y="55" class="h">Stagger refresh</text><text x="82" y="98" class="body">Dependency order beats</text><text x="82" y="132" class="body">one big 8 AM spike.</text></g>
  <g transform="translate(50 895)"><rect width="420" height="175" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="44" cy="48" r="24" fill="#22d3ee"/><text x="36" y="57" class="n">4</text><text x="82" y="55" class="h">Monitor pressure</text><text x="82" y="98" class="body">Failures, peaks, slow</text><text x="82" y="132" class="body">queries, cost.</text></g>
</svg>
