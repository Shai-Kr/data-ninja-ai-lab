<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-label="Fabric gateway scaling checklist">
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8fbff}.title{font-size:34px;font-weight:850}.sub{font-size:22px;fill:#a8ceda}.h{font-size:25px;font-weight:850}.body{font-size:21px;fill:#bee7f2}.n{font-size:24px;font-weight:900;fill:#06111f}</style></defs>
  <rect width="720" height="1040" fill="#07111f"/>
  <rect x="36" y="34" width="648" height="972" rx="34" fill="#0b1f33" stroke="#155e75"/>
  <text x="70" y="92" class="title">Four checks before scaling</text>
  <text x="70" y="128" class="sub">Autoscaling works best when the</text>
  <text x="70" y="158" class="sub">platform contract is clear.</text>

  <g transform="translate(75 215)"><rect width="570" height="150" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="46" cy="48" r="24" fill="#22d3ee"/><text x="38" y="57" class="n">1</text><text x="88" y="54" class="h">Inventory gateway workloads</text><text x="88" y="94" class="body">Models, dataflows, pipelines, Copy Jobs,</text><text x="88" y="126" class="body">mirroring, reports, owners.</text></g>
  <g transform="translate(75 410)"><rect width="570" height="150" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="46" cy="48" r="24" fill="#22d3ee"/><text x="38" y="57" class="n">2</text><text x="88" y="54" class="h">Set min and max with intent</text><text x="88" y="94" class="body">Baseline load, peak tolerance, cost</text><text x="88" y="126" class="body">boundary, and support target.</text></g>
  <g transform="translate(75 605)"><rect width="570" height="150" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="46" cy="48" r="24" fill="#22d3ee"/><text x="38" y="57" class="n">3</text><text x="88" y="54" class="h">Stagger refresh pressure</text><text x="88" y="94" class="body">Dependency order beats everyone</text><text x="88" y="126" class="body">starting at the same minute.</text></g>
  <g transform="translate(75 800)"><rect width="570" height="150" rx="24" fill="#10243a" stroke="#22d3ee"/><circle cx="46" cy="48" r="24" fill="#22d3ee"/><text x="38" y="57" class="n">4</text><text x="88" y="54" class="h">Monitor as a dependency</text><text x="88" y="94" class="body">Track failures, peaks, slow queries,</text><text x="88" y="126" class="body">scaling behavior, and cost.</text></g>
</svg>
