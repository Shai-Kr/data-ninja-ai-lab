<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1120" viewBox="0 0 520 1120" role="img" aria-label="VNet gateway autoscaling operating model">
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e8fbff}.title{font-size:31px;font-weight:850}.sub{font-size:24px;fill:#a8ceda}.h{font-size:28px;font-weight:850}.body{font-size:24px;fill:#bee7f2}.tag{font-size:22px;fill:#06111f;font-weight:850}</style></defs>
  <rect width="520" height="1120" fill="#07111f"/>
  <rect x="24" y="24" width="472" height="1072" rx="30" fill="#0b1f33" stroke="#155e75"/>
  <text x="48" y="82" class="title">VNet Gateway</text>
  <text x="48" y="120" class="title">Autoscaling</text>
  <text x="48" y="160" class="sub">Private Fabric access</text>
  <text x="48" y="190" class="sub">needs a scaling policy.</text>

  <rect x="50" y="250" width="420" height="160" rx="24" fill="#10243a" stroke="#22d3ee"/>
  <text x="78" y="300" class="h">Private data</text>
  <text x="78" y="342" class="body">Azure SQL</text>
  <text x="78" y="376" class="body">Private endpoints</text>

  <path d="M260 428 L260 490" stroke="#38bdf8" stroke-width="5"/>
  <path d="M245 474 L260 496 L275 474" fill="none" stroke="#38bdf8" stroke-width="5"/>

  <rect x="50" y="515" width="420" height="230" rx="26" fill="#083047" stroke="#22d3ee" stroke-width="3"/>
  <text x="78" y="565" class="h">VNet gateway</text>
  <text x="78" y="608" class="body">Min nodes</text>
  <text x="78" y="642" class="body">Max nodes</text>
  <text x="78" y="676" class="body">Scale up or down</text>
  <rect x="78" y="700" width="136" height="42" rx="21" fill="#22d3ee"/>
  <text x="109" y="729" class="tag">Policy</text>

  <path d="M260 762 L260 824" stroke="#38bdf8" stroke-width="5"/>
  <path d="M245 808 L260 830 L275 808" fill="none" stroke="#38bdf8" stroke-width="5"/>

  <rect x="50" y="850" width="420" height="175" rx="24" fill="#10243a" stroke="#22d3ee"/>
  <text x="78" y="900" class="h">Fabric workloads</text>
  <text x="78" y="942" class="body">Semantic models</text>
  <text x="78" y="976" class="body">Dataflows, pipelines</text>
  <text x="78" y="1010" class="body">Copy Job, reports</text>

  <text x="48" y="1066" class="sub">Inventory, stagger, limit, monitor.</text>
</svg>
