<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Autoscaling Readiness Checklist</title><desc id="desc">Do the boring checks before turning the feature into production policy</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="0.55" stop-color="#081827"/><stop offset="1" stop-color="#020712"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<circle cx="1020" cy="120" r="190" fill="#0ef3ff" opacity="0.08"/>
<circle cx="120" cy="620" r="230" fill="#57a6ff" opacity="0.07"/>
<path d="M80 120 C260 40 420 180 610 105 C790 35 940 60 1120 155" fill="none" stroke="#0ef3ff" opacity="0.22" stroke-width="3"/>
<text x="70" y="86" fill="#e8fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Autoscaling Readiness Checklist</text>
<text x="72" y="126" fill="#9fc6d6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Do the boring checks before turning the feature into production policy</text>
<rect x="70" y="180" width="500" height="160" rx="24" fill="#0b2032" stroke="#0ef3ff" stroke-opacity="0.72" stroke-width="2"/>
<text x="98" y="225" fill="#0ef3ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Workload map</text>
<text x="98" y="262" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Which semantic models, pipelines, jobs</text>
<text x="98" y="290" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">and reports depend on this gateway?</text>
<rect x="630" y="180" width="500" height="160" rx="24" fill="#0b2032" stroke="#57a6ff" stroke-opacity="0.72" stroke-width="2"/>
<text x="658" y="225" fill="#57a6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Baseline</text>
<text x="658" y="262" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Peak concurrency, refresh windows,</text>
<text x="658" y="290" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">latency, and failure history</text>
<rect x="70" y="390" width="500" height="160" rx="24" fill="#0b2032" stroke="#b56cff" stroke-opacity="0.72" stroke-width="2"/>
<text x="98" y="435" fill="#b56cff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Scale policy</text>
<text x="98" y="472" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Minimum nodes, maximum nodes,</text>
<text x="98" y="500" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">cost guardrails, owner approval</text>
<rect x="630" y="390" width="500" height="160" rx="24" fill="#0b2032" stroke="#23e3a2" stroke-opacity="0.72" stroke-width="2"/>
<text x="658" y="435" fill="#23e3a2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Runbook</text>
<text x="658" y="472" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">What changes during incidents,</text>
<text x="658" y="500" fill="#d7edf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">who owns exceptions, what gets logged</text>
<text x="70" y="668" fill="#7faabe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A practical review board for Fabric admins and BI platform owners</text>
</svg>