<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Three migration lanes for Synapse workloads">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131f"/><stop offset="1" stop-color="#0b2033"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<circle cx="1080" cy="90" r="180" fill="#102d48" opacity="0.52"/>
<circle cx="210" cy="650" r="240" fill="#0a3550" opacity="0.46"/>
<text x="70" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#eefbff">Three migration lanes for Synapse workloads</text>
<text x="72" y="124" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#a8c7d7">A practical split keeps AI-assisted migration from becoming blind lift-and-shift.</text>

<rect x="70" y="205" width="340" height="310" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="112" cy="253" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="104" y="261" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">1</text>
<text x="148" y="260" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Move quickly</text>
<text x="102" y="305" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">supported notebooks</text>
<text x="102" y="339" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">simple Spark jobs</text>
<text x="102" y="373" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">low integration risk</text>
<rect x="470" y="205" width="340" height="310" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="512" cy="253" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="504" y="261" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">2</text>
<text x="548" y="260" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Modernize</text>
<text x="502" y="305" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">pool and library changes</text>
<text x="502" y="339" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">data access patterns</text>
<text x="502" y="373" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">environment alignment</text>
<rect x="870" y="205" width="340" height="310" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="912" cy="253" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="904" y="261" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">3</text>
<text x="948" y="260" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Refactor manually</text>
<text x="902" y="305" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">Synapse-specific APIs</text>
<text x="902" y="339" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">custom auth patterns</text>
<text x="902" y="373" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">fragile orchestration</text>
<rect x="70" y="610" width="1140" height="58" rx="22" fill="#071827" stroke="#27445c"/>
<text x="98" y="647" font-family="Inter, Segoe UI, Arial" font-size="21" font-weight="700" fill="#7ee787">The win is not speed alone. The win is knowing which lane each workload belongs in.</text>
</svg>