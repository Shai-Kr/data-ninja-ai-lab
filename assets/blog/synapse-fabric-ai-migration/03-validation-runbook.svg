<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="The validation runbook matters more than the copy step">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131f"/><stop offset="1" stop-color="#0b2033"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<circle cx="1080" cy="90" r="180" fill="#102d48" opacity="0.52"/>
<circle cx="210" cy="650" r="240" fill="#0a3550" opacity="0.46"/>
<text x="70" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#eefbff">The validation runbook matters more than the copy step</text>
<text x="72" y="124" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#a8c7d7">A migrated workload is not done until behavior, data, security, and ownership are checked.</text>

<rect x="70" y="190" width="270" height="340" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="112" cy="238" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="104" y="246" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">1</text>
<text x="148" y="245" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Runtime</text>
<text x="102" y="290" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">Spark version behavior</text>
<text x="102" y="324" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">library compatibility</text>
<text x="102" y="358" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">job performance</text>
<rect x="370" y="190" width="270" height="340" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="412" cy="238" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="404" y="246" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">2</text>
<text x="448" y="245" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Data</text>
<text x="402" y="290" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">row counts and partitions</text>
<text x="402" y="324" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">file paths and shortcuts</text>
<text x="402" y="358" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">metadata and schemas</text>
<rect x="670" y="190" width="270" height="340" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="712" cy="238" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="704" y="246" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">3</text>
<text x="748" y="245" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Security</text>
<text x="702" y="290" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">roles and identities</text>
<text x="702" y="324" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">connections and secrets</text>
<text x="702" y="358" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">workspace ownership</text>
<rect x="970" y="190" width="240" height="340" rx="28" fill="#0e2b42" stroke="#2dd4ff" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="1012" cy="238" r="22" fill="#0b1220" stroke="#2dd4ff" stroke-width="2" filter="url(#glow)"/>
<text x="1004" y="246" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#2dd4ff">4</text>
<text x="1048" y="245" font-family="Inter, Segoe UI, Arial" font-size="24" font-weight="800" fill="#eefbff">Cutover</text>
<text x="1002" y="290" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">parallel run window</text>
<text x="1002" y="324" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">rollback decision</text>
<text x="1002" y="358" font-family="Inter, Segoe UI, Arial" font-size="19" fill="#a8c7d7">monitoring baseline</text>
<rect x="70" y="610" width="1140" height="58" rx="22" fill="#071827" stroke="#27445c"/>
<text x="98" y="647" font-family="Inter, Segoe UI, Arial" font-size="21" font-weight="700" fill="#7ee787">A safer migration uses AI for acceleration and humans for judgment.</text>
</svg>