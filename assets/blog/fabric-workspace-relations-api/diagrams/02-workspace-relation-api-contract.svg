<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Workspace Relation API contract</title>
<desc id="desc">The API records a relationship between a branch workspace and base workspace using IDs, relation type, permissions, and common errors.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0e1930"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<text x="70" y="74" font-family="Inter, Segoe UI, Arial" font-size="34" font-weight="800" fill="#e6f7ff">What the API actually gives your pipeline</text>
<text x="70" y="112" font-family="Inter, Segoe UI, Arial" font-size="18" fill="#9fc9db">A small contract, but a useful one: record the branch to base relationship after automation prepares the workspace.</text>
<g font-family="Inter, Segoe UI, Arial">
  <rect x="75" y="165" width="322" height="360" rx="26" fill="#0c2237" stroke="#38bdf8" stroke-width="2"/>
  <text x="110" y="214" font-size="23" font-weight="800" fill="#ffffff">Request</text>
  <text x="110" y="258" font-size="18" fill="#c7ecf7">POST /workspaces/{id}/git/</text>
  <text x="110" y="286" font-size="18" fill="#c7ecf7">workspaceRelations</text>
  <rect x="110" y="328" width="252" height="120" rx="18" fill="#061421" stroke="#234c6b"/>
  <text x="132" y="365" font-size="17" fill="#d8fbff">relatedWorkspaceId</text>
  <text x="132" y="402" font-size="17" fill="#d8fbff">relationType: Base</text>

  <rect x="439" y="165" width="322" height="360" rx="26" fill="#0c2237" stroke="#22c55e" stroke-width="2"/>
  <text x="474" y="214" font-size="23" font-weight="800" fill="#ffffff">Required guardrails</text>
  <text x="474" y="260" font-size="18" fill="#c7ecf7">Admin on branch workspace</text>
  <text x="474" y="298" font-size="18" fill="#c7ecf7">Contributor or higher on base</text>
  <text x="474" y="336" font-size="18" fill="#c7ecf7">Workspace.ReadWrite.All scope</text>
  <text x="474" y="374" font-size="18" fill="#c7ecf7">User, service principal, or MI</text>
  <text x="474" y="430" font-size="16" fill="#86efac">Permission model stays explicit.</text>

  <rect x="803" y="165" width="322" height="360" rx="26" fill="#0c2237" stroke="#f59e0b" stroke-width="2"/>
  <text x="838" y="214" font-size="23" font-weight="800" fill="#ffffff">Failure signals</text>
  <text x="838" y="260" font-size="18" fill="#c7ecf7">Relation already exists</text>
  <text x="838" y="298" font-size="18" fill="#c7ecf7">Root directory mismatch</text>
  <text x="838" y="336" font-size="18" fill="#c7ecf7">Different base workspace</text>
  <text x="838" y="374" font-size="18" fill="#c7ecf7">Insufficient privileges</text>
  <text x="838" y="430" font-size="16" fill="#fde68a">Treat errors as design feedback.</text>
</g>
<rect x="145" y="570" width="910" height="54" rx="22" fill="#071b2b" stroke="#264762"/>
<text x="190" y="604" font-family="Inter, Segoe UI, Arial" font-size="18" fill="#dff8ff">The useful pattern: automate workspace setup, then make the relationship visible to Fabric and to your operators.</text>
</svg>
