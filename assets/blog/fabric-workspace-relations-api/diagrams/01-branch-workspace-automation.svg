<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Automated branch workspace flow</title>
<desc id="desc">Feature branch automation creates a branch workspace, connects Git, syncs Fabric items, then records the workspace relation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061421"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10263d"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1020" cy="90" r="170" fill="#00d4ff" opacity="0.08"/>
<circle cx="120" cy="590" r="210" fill="#7c3aed" opacity="0.09"/>
<text x="70" y="72" font-family="Inter, Segoe UI, Arial" font-size="34" font-weight="800" fill="#e6f7ff">Branch workspaces become an automation pattern</text>
<text x="70" y="112" font-family="Inter, Segoe UI, Arial" font-size="18" fill="#9cc7d7">The new relation API gives pipelines a first-class way to map branch workspace back to base workspace.</text>
<g font-family="Inter, Segoe UI, Arial">
  <rect x="70" y="175" width="205" height="134" rx="24" fill="url(#card)" stroke="#1bb8ff" stroke-width="2"/>
  <text x="96" y="218" font-size="19" font-weight="800" fill="#e8fbff">1. Create branch</text>
  <text x="96" y="251" font-size="16" fill="#b6d6e3">Feature branch from</text>
  <text x="96" y="276" font-size="16" fill="#b6d6e3">the trusted main line</text>

  <rect x="360" y="175" width="205" height="134" rx="24" fill="url(#card)" stroke="#1bb8ff" stroke-width="2"/>
  <text x="386" y="218" font-size="19" font-weight="800" fill="#e8fbff">2. Provision</text>
  <text x="386" y="251" font-size="16" fill="#b6d6e3">Create isolated</text>
  <text x="386" y="276" font-size="16" fill="#b6d6e3">Fabric workspace</text>

  <rect x="650" y="175" width="205" height="134" rx="24" fill="url(#card)" stroke="#1bb8ff" stroke-width="2"/>
  <text x="676" y="218" font-size="19" font-weight="800" fill="#e8fbff">3. Configure Git</text>
  <text x="676" y="251" font-size="16" fill="#b6d6e3">Connect workspace</text>
  <text x="676" y="276" font-size="16" fill="#b6d6e3">to feature branch</text>

  <rect x="940" y="175" width="190" height="134" rx="24" fill="url(#card)" stroke="#1bb8ff" stroke-width="2"/>
  <text x="966" y="218" font-size="19" font-weight="800" fill="#e8fbff">4. Relate</text>
  <text x="966" y="251" font-size="16" fill="#b6d6e3">Create workspace</text>
  <text x="966" y="276" font-size="16" fill="#b6d6e3">relation by API</text>

  <path d="M285 242 H345" stroke="#6ee7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M575 242 H635" stroke="#6ee7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M865 242 H925" stroke="#6ee7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6ee7ff"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial">
  <rect x="145" y="410" width="910" height="128" rx="28" fill="#081f32" stroke="#243f63" stroke-width="2"/>
  <text x="185" y="456" font-size="22" font-weight="800" fill="#ffffff">Pipeline contract</text>
  <text x="185" y="492" font-size="18" fill="#bdefff">Branch workspace is not just a temporary copy. It has an explicit relationship, ownership path, and promotion story.</text>
</g>
</svg>
