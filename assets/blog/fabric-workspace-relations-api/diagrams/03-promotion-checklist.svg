<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Fabric workspace promotion checklist</title>
<desc id="desc">A checklist for moving Fabric branch workspace changes from development to production safely.</desc>
<rect width="1200" height="675" fill="#061421"/>
<circle cx="1000" cy="120" r="220" fill="#00d4ff" opacity="0.08"/>
<text x="70" y="74" font-family="Inter, Segoe UI, Arial" font-size="34" font-weight="800" fill="#e6f7ff">Before a branch workspace becomes production work</text>
<text x="70" y="112" font-family="Inter, Segoe UI, Arial" font-size="18" fill="#a8d3e4">The API solves traceability. Teams still need a promotion checklist.</text>
<g font-family="Inter, Segoe UI, Arial" font-size="18">
  <rect x="76" y="162" width="1048" height="410" rx="28" fill="#0b2035" stroke="#1f4d72" stroke-width="2"/>
  <g transform="translate(120 210)">
    <rect width="440" height="70" rx="18" fill="#102b45" stroke="#38bdf8"/><text x="28" y="44" fill="#eafdff">Commit branch workspace changes to Git</text>
    <rect y="92" width="440" height="70" rx="18" fill="#102b45" stroke="#38bdf8"/><text x="28" y="136" fill="#eafdff">Run semantic model and dependency checks</text>
    <rect y="184" width="440" height="70" rx="18" fill="#102b45" stroke="#38bdf8"/><text x="28" y="228" fill="#eafdff">Open pull request with business context</text>
    <rect y="276" width="440" height="70" rx="18" fill="#102b45" stroke="#38bdf8"/><text x="28" y="320" fill="#eafdff">Merge after reviewer approval</text>
  </g>
  <g transform="translate(650 210)">
    <rect width="395" height="70" rx="18" fill="#13243b" stroke="#22c55e"/><text x="28" y="44" fill="#eafdff">Update dev or test workspace</text>
    <rect y="92" width="395" height="70" rx="18" fill="#13243b" stroke="#22c55e"/><text x="28" y="136" fill="#eafdff">Deploy through pipeline stages</text>
    <rect y="184" width="395" height="70" rx="18" fill="#13243b" stroke="#22c55e"/><text x="28" y="228" fill="#eafdff">Validate permissions and labels</text>
    <rect y="276" width="395" height="70" rx="18" fill="#13243b" stroke="#22c55e"/><text x="28" y="320" fill="#eafdff">Keep rollback path visible</text>
  </g>
</g>
<text x="120" y="622" font-family="Inter, Segoe UI, Arial" font-size="18" fill="#bdefff">Branch workspaces are safer when they are temporary, traceable, and boring to promote.</text>
</svg>
