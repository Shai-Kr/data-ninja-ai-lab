<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Power BI org app operating checklist</title><desc id="desc">A short operating checklist for Power BI org apps.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#12345a"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17345c"/><stop offset="1" stop-color="#0c2038"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><g font-family="Inter, Arial"><text x="74" y="90" fill="#f8fafc" font-size="54" font-weight="800">Org app operating checklist</text><text x="76" y="142" fill="#c8d8ec" font-size="30">Five checks that make the app easier to trust.</text><rect x="120" y="210" width="1040" height="370" rx="34" fill="#0b1b31" stroke="#3b628d" stroke-width="3"/><text x="180" y="295" fill="#e5f0ff" font-size="44" font-weight="800">✓ Purpose is clear</text><text x="180" y="365" fill="#e5f0ff" font-size="44" font-weight="800">✓ Audiences are mapped</text><text x="180" y="435" fill="#e5f0ff" font-size="44" font-weight="800">✓ Dependencies are known</text><text x="180" y="505" fill="#e5f0ff" font-size="44" font-weight="800">✓ Owner and support path exist</text><text x="180" y="640" fill="#dbeafe" font-size="32" font-weight="760">If users depend on it, ship it like a product.</text></g></svg>