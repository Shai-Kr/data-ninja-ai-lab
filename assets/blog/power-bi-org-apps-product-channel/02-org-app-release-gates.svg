<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Release gates for Power BI org apps</title><desc id="desc">Four release gates for org app delivery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#12345a"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17345c"/><stop offset="1" stop-color="#0c2038"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><g font-family="Inter, Arial"><text x="70" y="90" fill="#f8fafc" font-size="54" font-weight="800">Four gates before release</text><text x="74" y="142" fill="#c8d8ec" font-size="30">Treat the app like a small internal product.</text><g transform="translate(85 235)"><rect width="255" height="250" rx="30" fill="url(#card)" stroke="#38bdf8" stroke-width="3"/><text x="34" y="76" fill="#e0f2fe" font-size="52" font-weight="850">1</text><text x="34" y="145" fill="#f8fafc" font-size="42" font-weight="800">Audience</text><text x="34" y="200" fill="#d3e2f5" font-size="30">Who sees it?</text></g><g transform="translate(375 235)"><rect width="255" height="250" rx="30" fill="url(#card)" stroke="#2dd4bf" stroke-width="3"/><text x="34" y="76" fill="#ccfbf1" font-size="52" font-weight="850">2</text><text x="34" y="145" fill="#f8fafc" font-size="42" font-weight="800">Content</text><text x="34" y="200" fill="#d3e2f5" font-size="30">Is it trusted?</text></g><g transform="translate(665 235)"><rect width="255" height="250" rx="30" fill="url(#card)" stroke="#a78bfa" stroke-width="3"/><text x="34" y="76" fill="#ede9fe" font-size="52" font-weight="850">3</text><text x="34" y="145" fill="#f8fafc" font-size="42" font-weight="800">Support</text><text x="34" y="200" fill="#d3e2f5" font-size="30">Who owns it?</text></g><g transform="translate(955 235)"><rect width="255" height="250" rx="30" fill="url(#card)" stroke="#f59e0b" stroke-width="3"/><text x="34" y="76" fill="#fef3c7" font-size="52" font-weight="850">4</text><text x="34" y="145" fill="#f8fafc" font-size="42" font-weight="800">API</text><text x="34" y="200" fill="#d3e2f5" font-size="30">Can it repeat?</text></g><rect x="230" y="560" width="820" height="72" rx="24" fill="#0b1c33" stroke="#31547d"/><text x="300" y="607" fill="#dbeafe" font-size="32" font-weight="760">Cleaner BI delivery starts before users click the link.</text></g></svg>