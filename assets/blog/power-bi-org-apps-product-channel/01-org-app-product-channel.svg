<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Power BI org app as a BI product channel</title><desc id="desc">Simple flow from workspace content to org app product channel to audiences.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#12345a"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17345c"/><stop offset="1" stop-color="#0c2038"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><circle cx="1030" cy="130" r="240" fill="#2563eb" opacity="0.16"/><circle cx="180" cy="610" r="260" fill="#14b8a6" opacity="0.12"/><g font-family="Inter, Arial"><text x="70" y="90" fill="#f8fafc" font-size="54" font-weight="800">Org apps are BI product channels</text><text x="74" y="142" fill="#c8d8ec" font-size="30">Move from scattered links to a managed consumer experience.</text><rect x="70" y="245" width="300" height="190" rx="30" fill="url(#card)" stroke="#60a5fa" stroke-width="3"/><text x="115" y="325" fill="#eaf2ff" font-size="44" font-weight="800">Workspace</text><text x="115" y="380" fill="#d3e2f5" font-size="30">Reports and models</text><rect x="490" y="225" width="300" height="230" rx="34" fill="#123660" stroke="#2dd4bf" stroke-width="4"/><text x="555" y="315" fill="#f0fdfa" font-size="48" font-weight="850">Org app</text><text x="548" y="375" fill="#ccfbf1" font-size="31">Packaged product</text><rect x="910" y="245" width="300" height="190" rx="30" fill="url(#card)" stroke="#a78bfa" stroke-width="3"/><text x="965" y="325" fill="#f3e8ff" font-size="44" font-weight="800">Audiences</text><text x="960" y="380" fill="#e9d5ff" font-size="30">Targeted delivery</text><path d="M380 340 H480" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/><path d="M455 310 L490 340 L455 370" fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round"/><path d="M800 340 H900" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/><path d="M875 310 L910 340 L875 370" fill="none" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/><rect x="180" y="545" width="920" height="78" rx="26" fill="#091a2f" stroke="#3b628d" stroke-width="2"/><text x="245" y="596" fill="#dbeafe" font-size="34" font-weight="750">Own the release, access, support, and adoption path.</text></g></svg>