<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From writeback to governed action</title><desc id="desc">Treat every planning event as an operational contract.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#0c2434"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/><path d="M0 570 C260 500 420 650 700 560 S1030 480 1200 550" fill="none" stroke="#12394d" stroke-width="2"/>
<text x="60" y="72" fill="#71e4ff" font-size="20" font-family="Arial,sans-serif" font-weight="700" letter-spacing="2">MICROSOFT FABRIC PLANNING</text>
<text x="60" y="125" fill="#f5fbff" font-size="38" font-family="Arial,sans-serif" font-weight="700">From writeback to governed action</text>
<text x="60" y="164" fill="#a9c3d2" font-size="22" font-family="Arial,sans-serif">Treat every planning event as an operational contract.</text><rect x="60.0" y="220" width="342.7" height="330" rx="20" fill="#102b3d" stroke="#55d8ff" stroke-width="2"/><circle cx="102.0" cy="266" r="20" fill="#55d8ff" opacity=".18"/><text x="102.0" y="273" text-anchor="middle" fill="#55d8ff" font-size="20" font-family="Arial,sans-serif" font-weight="700">1</text><text x="84.0" y="318" fill="#ffffff" font-size="24" font-family="Arial,sans-serif" font-weight="700">Trigger</text><circle cx="89.0" cy="358" r="4" fill="#55d8ff"/><text x="103.0" y="365" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Started, succeeded, failed</text><circle cx="89.0" cy="401" r="4" fill="#55d8ff"/><text x="103.0" y="408" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Sheet and scenario context</text><circle cx="89.0" cy="444" r="4" fill="#55d8ff"/><text x="103.0" y="451" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Stable correlation ID</text><path d="M407.7 385 h16" stroke="#71e4ff" stroke-width="3"/><path d="M421.7 378 l10 7 -10 7" fill="none" stroke="#71e4ff" stroke-width="3"/><rect x="428.7" y="220" width="342.7" height="330" rx="20" fill="#102b3d" stroke="#7b8cff" stroke-width="2"/><circle cx="470.7" cy="266" r="20" fill="#7b8cff" opacity=".18"/><text x="470.7" y="273" text-anchor="middle" fill="#7b8cff" font-size="20" font-family="Arial,sans-serif" font-weight="700">2</text><text x="452.7" y="318" fill="#ffffff" font-size="24" font-family="Arial,sans-serif" font-weight="700">Route</text><circle cx="457.7" cy="358" r="4" fill="#7b8cff"/><text x="471.7" y="365" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Pipeline or Dataflow Gen2</text><circle cx="457.7" cy="401" r="4" fill="#7b8cff"/><text x="471.7" y="408" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Semantic model refresh</text><circle cx="457.7" cy="444" r="4" fill="#7b8cff"/><text x="471.7" y="451" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Notebook or notification</text><path d="M776.3 385 h16" stroke="#71e4ff" stroke-width="3"/><path d="M790.3 378 l10 7 -10 7" fill="none" stroke="#71e4ff" stroke-width="3"/><rect x="797.3" y="220" width="342.7" height="330" rx="20" fill="#102b3d" stroke="#39e6b0" stroke-width="2"/><circle cx="839.3" cy="266" r="20" fill="#39e6b0" opacity=".18"/><text x="839.3" y="273" text-anchor="middle" fill="#39e6b0" font-size="20" font-family="Arial,sans-serif" font-weight="700">3</text><text x="821.3" y="318" fill="#ffffff" font-size="24" font-family="Arial,sans-serif" font-weight="700">Prove</text><circle cx="826.3" cy="358" r="4" fill="#39e6b0"/><text x="840.3" y="365" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Idempotent processing</text><circle cx="826.3" cy="401" r="4" fill="#39e6b0"/><text x="840.3" y="408" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Business and technical checks</text><circle cx="826.3" cy="444" r="4" fill="#39e6b0"/><text x="840.3" y="451" fill="#c7dce7" font-size="18" font-family="Arial,sans-serif">Owner, evidence, recovery</text><rect x="60" y="602" width="1080" height="70" rx="16" fill="#0a1c29" stroke="#24506a"/><text x="600" y="645" text-anchor="middle" fill="#f5fbff" font-size="22" font-family="Arial,sans-serif" font-weight="700">A planning value is not complete until the downstream result is visible and recoverable.</text></svg>