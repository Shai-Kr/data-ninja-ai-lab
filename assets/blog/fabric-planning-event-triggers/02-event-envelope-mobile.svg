<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc"><title id="title">The event envelope</title><desc id="desc">Enough context to act, trace, and recover.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#0c2434"/></linearGradient></defs><rect width="760" height="1080" rx="28" fill="url(#bg)"/><text x="46" y="58" fill="#71e4ff" font-size="18" font-family="Arial,sans-serif" font-weight="700" letter-spacing="2">MICROSOFT FABRIC PLANNING</text><text x="46" y="108" fill="#f5fbff" font-size="34" font-family="Arial,sans-serif" font-weight="700">The event envelope</text><text x="46" y="146" fill="#a9c3d2" font-size="22" font-family="Arial,sans-serif">Enough context to act, trace, and recover.</text><rect x="46" y="190" width="668" height="208" rx="20" fill="#102b3d" stroke="#55d8ff" stroke-width="2"/><circle cx="84" cy="229" r="20" fill="#55d8ff" opacity=".18"/><text x="84" y="236" text-anchor="middle" fill="#55d8ff" font-size="20" font-family="Arial,sans-serif" font-weight="700">1</text><text x="120" y="238" fill="#fff" font-size="26" font-family="Arial,sans-serif" font-weight="700">Business context</text><circle cx="80" cy="277" r="4" fill="#55d8ff"/><text x="96" y="284" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Plan and sheet</text><circle cx="80" cy="316" r="4" fill="#55d8ff"/><text x="96" y="323" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Scenario and period</text><circle cx="80" cy="355" r="4" fill="#55d8ff"/><text x="96" y="362" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Entity and changed scope</text><path d="M380 401 v26" stroke="#71e4ff" stroke-width="3"/><path d="M371 419 l9 10 9-10" fill="none" stroke="#71e4ff" stroke-width="3"/><rect x="46" y="435" width="668" height="208" rx="20" fill="#102b3d" stroke="#7b8cff" stroke-width="2"/><circle cx="84" cy="474" r="20" fill="#7b8cff" opacity=".18"/><text x="84" y="481" text-anchor="middle" fill="#7b8cff" font-size="20" font-family="Arial,sans-serif" font-weight="700">2</text><text x="120" y="483" fill="#fff" font-size="26" font-family="Arial,sans-serif" font-weight="700">Execution context</text><circle cx="80" cy="522" r="4" fill="#7b8cff"/><text x="96" y="529" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Event type and timestamp</text><circle cx="80" cy="561" r="4" fill="#7b8cff"/><text x="96" y="568" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Writeback and run IDs</text><circle cx="80" cy="600" r="4" fill="#7b8cff"/><text x="96" y="607" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Initiating user or process</text><path d="M380 646 v26" stroke="#71e4ff" stroke-width="3"/><path d="M371 664 l9 10 9-10" fill="none" stroke="#71e4ff" stroke-width="3"/><rect x="46" y="680" width="668" height="208" rx="20" fill="#102b3d" stroke="#39e6b0" stroke-width="2"/><circle cx="84" cy="719" r="20" fill="#39e6b0" opacity=".18"/><text x="84" y="726" text-anchor="middle" fill="#39e6b0" font-size="20" font-family="Arial,sans-serif" font-weight="700">3</text><text x="120" y="728" fill="#fff" font-size="26" font-family="Arial,sans-serif" font-weight="700">Control context</text><circle cx="80" cy="767" r="4" fill="#39e6b0"/><text x="96" y="774" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Schema or contract version</text><circle cx="80" cy="806" r="4" fill="#39e6b0"/><text x="96" y="813" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Retry and dedupe key</text><circle cx="80" cy="845" r="4" fill="#39e6b0"/><text x="96" y="852" fill="#c7dce7" font-size="21" font-family="Arial,sans-serif">Sensitivity and owner</text><rect x="46" y="940" width="668" height="94" rx="18" fill="#0a1c29" stroke="#24506a"/><text x="380" y="979" text-anchor="middle" fill="#f5fbff" font-size="20" font-family="Arial,sans-serif" font-weight="700">Explain what changed without</text><text x="380" y="1008" text-anchor="middle" fill="#f5fbff" font-size="20" font-family="Arial,sans-serif" font-weight="700">copying the plan into the event.</text></svg>