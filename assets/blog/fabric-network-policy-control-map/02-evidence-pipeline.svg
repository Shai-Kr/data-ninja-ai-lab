<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><style>.bg{fill:#07111f}.panel{fill:#0e2033;stroke:#1e6f93;stroke-width:2}.accent{fill:#18d1ff}.title{fill:#f3fbff;font:700 34px Arial,sans-serif}.sub{fill:#9fc9db;font:18px Arial,sans-serif}.head{fill:#f3fbff;font:700 22px Arial,sans-serif}.body{fill:#cce9f4;font:17px Arial,sans-serif}.small{fill:#9fc9db;font:15px Arial,sans-serif}.line{stroke:#18d1ff;stroke-width:4;fill:none}.warn{fill:#ffd166}.good{fill:#4ee1a0}</style><rect class="bg" width="1200" height="675" rx="24"/>
<text class="title" x="60" y="72">A REPEATABLE EVIDENCE PIPELINE</text><text class="sub" x="60" y="108">Preserve the source, normalize the controls, compare the change</text>
<rect class="panel" x="55" y="190" width="190" height="230" rx="18"/><text class="head" x="150" y="235" text-anchor="middle">COLLECT</text><text class="body" x="150" y="290" text-anchor="middle">All pages</text><text class="body" x="150" y="330" text-anchor="middle">Counts</text><text class="body" x="150" y="370" text-anchor="middle">Timestamp</text>
<path class="line" d="M245 305 H300"/><polygon class="accent" points="300,295 320,305 300,315"/>
<rect class="panel" x="320" y="190" width="220" height="230" rx="18"/><text class="head" x="430" y="235" text-anchor="middle">PRESERVE</text><text class="body" x="430" y="290" text-anchor="middle">Raw JSON</text><text class="body" x="430" y="330" text-anchor="middle">Run metadata</text><text class="body" x="430" y="370" text-anchor="middle">Schema version</text>
<path class="line" d="M540 305 H595"/><polygon class="accent" points="595,295 615,305 595,315"/>
<rect class="panel" x="615" y="190" width="220" height="230" rx="18"/><text class="head" x="725" y="235" text-anchor="middle">NORMALIZE</text><text class="body" x="725" y="290" text-anchor="middle">Posture</text><text class="body" x="725" y="330" text-anchor="middle">Exceptions</text><text class="body" x="725" y="370" text-anchor="middle">Ownership</text>
<path class="line" d="M835 305 H890"/><polygon class="accent" points="890,295 910,305 890,315"/>
<rect class="panel" x="910" y="190" width="235" height="230" rx="18"/><text class="head" x="1027" y="235" text-anchor="middle">COMPARE</text><text class="body" x="1027" y="290" text-anchor="middle">Before / after</text><text class="body" x="1027" y="330" text-anchor="middle">Drift severity</text><text class="body" x="1027" y="370" text-anchor="middle">Owner review</text>
<rect x="220" y="495" width="760" height="90" rx="18" fill="#0a2d40" stroke="#18d1ff" stroke-width="2"/><text class="head" x="600" y="535" text-anchor="middle">Completeness gate</text><text class="body" x="600" y="568" text-anchor="middle">Pages, workspaces, and policy counts must reconcile</text></svg>