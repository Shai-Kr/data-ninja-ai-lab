<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><style>.bg{fill:#07111f}.panel{fill:#0e2033;stroke:#1e6f93;stroke-width:2}.accent{fill:#18d1ff}.title{fill:#f3fbff;font:700 34px Arial,sans-serif}.sub{fill:#9fc9db;font:18px Arial,sans-serif}.head{fill:#f3fbff;font:700 22px Arial,sans-serif}.body{fill:#cce9f4;font:17px Arial,sans-serif}.small{fill:#9fc9db;font:15px Arial,sans-serif}.line{stroke:#18d1ff;stroke-width:4;fill:none}.warn{fill:#ffd166}.good{fill:#4ee1a0}</style><rect class="bg" width="1200" height="675" rx="24"/>
<text class="title" x="60" y="72">PRIORITIZE THE CHANGES THAT MATTER</text><text class="sub" x="60" y="108">Environment and sensitivity decide the review path</text>
<text class="head" x="330" y="170" text-anchor="middle">LOWER SENSITIVITY</text><text class="head" x="860" y="170" text-anchor="middle">HIGHER SENSITIVITY</text>
<text class="head" x="48" y="280" transform="rotate(-90 48 280)">PRODUCTION</text><text class="head" x="48" y="545" transform="rotate(-90 48 545)">DEVELOPMENT</text>
<rect x="95" y="195" width="505" height="205" rx="18" fill="#10364a" stroke="#18d1ff" stroke-width="2"/><text class="head" x="135" y="245">REVIEW</text><text class="body" x="135" y="295">Validate owner and business purpose</text><text class="body" x="135" y="338">Confirm exposure matches the standard</text>
<rect x="620" y="195" width="525" height="205" rx="18" fill="#493820" stroke="#ffd166" stroke-width="3"/><text class="head" x="660" y="245">URGENT REVIEW</text><text class="body" x="660" y="295">Public access or new exception</text><text class="body" x="660" y="338">Require evidence and explicit approval</text>
<rect x="95" y="425" width="505" height="185" rx="18" fill="#112b38" stroke="#1e6f93" stroke-width="2"/><text class="head" x="135" y="475">TRACK</text><text class="body" x="135" y="525">Keep the inventory current</text><text class="body" x="135" y="565">Review material changes only</text>
<rect x="620" y="425" width="525" height="185" rx="18" fill="#153b39" stroke="#4ee1a0" stroke-width="2"/><text class="head" x="660" y="475">CONTROLLED TEST</text><text class="body" x="660" y="525">Use time-bound exceptions</text><text class="body" x="660" y="565">Promote only with clean evidence</text></svg>