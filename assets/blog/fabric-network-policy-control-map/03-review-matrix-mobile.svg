<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img"><style>.bg{fill:#07111f}.panel{fill:#0e2033;stroke:#1e6f93;stroke-width:2}.accent{fill:#18d1ff}.title{fill:#f3fbff;font:700 34px Arial,sans-serif}.sub{fill:#9fc9db;font:18px Arial,sans-serif}.head{fill:#f3fbff;font:700 22px Arial,sans-serif}.body{fill:#cce9f4;font:17px Arial,sans-serif}.small{fill:#9fc9db;font:15px Arial,sans-serif}.line{stroke:#18d1ff;stroke-width:4;fill:none}.warn{fill:#ffd166}.good{fill:#4ee1a0}</style><rect class="bg" width="720" height="1060" rx="24"/>
<text class="title" x="50" y="72">REVIEW PRIORITY</text><text class="sub" x="50" y="110">Environment + sensitivity + exception status</text>
<rect x="70" y="165" width="580" height="190" rx="18" fill="#493820" stroke="#ffd166" stroke-width="3"/><text class="head" x="110" y="215">URGENT REVIEW</text><text class="body" x="110" y="265">Production + sensitive data</text><text class="body" x="110" y="307">Public access or a new exception</text>
<rect x="70" y="385" width="580" height="190" rx="18" fill="#10364a" stroke="#18d1ff" stroke-width="2"/><text class="head" x="110" y="435">REVIEW</text><text class="body" x="110" y="485">Production + lower sensitivity</text><text class="body" x="110" y="527">Validate owner and business purpose</text>
<rect x="70" y="605" width="580" height="190" rx="18" fill="#153b39" stroke="#4ee1a0" stroke-width="2"/><text class="head" x="110" y="655">CONTROLLED TEST</text><text class="body" x="110" y="705">Development + sensitive data</text><text class="body" x="110" y="747">Use time-bound exceptions</text>
<rect x="70" y="825" width="580" height="150" rx="18" fill="#112b38" stroke="#1e6f93" stroke-width="2"/><text class="head" x="110" y="875">TRACK</text><text class="body" x="110" y="925">Development + lower sensitivity</text></svg>