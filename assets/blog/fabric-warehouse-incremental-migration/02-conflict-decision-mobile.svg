<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Object conflict decision</title><desc id="d">Three controlled actions for a conflicting object definition.</desc><rect width="600" height="900" rx="28" fill="#07111f"/><text x="38" y="62" fill="#eef7ff" font-family="Arial" font-size="28" font-weight="700">Own every object conflict</text><text x="38" y="98" fill="#8eabc5" font-family="Arial" font-size="17">Compare definitions and downstream impact.</text><g font-family="Arial"><rect x="38" y="140" width="524" height="110" rx="22" fill="#12354b" stroke="#27d3ff" stroke-width="2"/><text x="300" y="184" text-anchor="middle" fill="#27d3ff" font-size="16" font-weight="700">NAME ALREADY EXISTS</text><text x="300" y="221" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Choose an explicit action</text><rect x="38" y="285" width="524" height="145" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="68" y="326" fill="#b9a8ff" font-size="17" font-weight="700">KEEP EXISTING</text><text x="68" y="368" fill="#fff" font-size="22" font-weight="700">Preserve the destination</text><text x="68" y="401" fill="#b6c9da" font-size="17">Record intentional source drift</text><rect x="38" y="460" width="524" height="145" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="68" y="501" fill="#31e6a1" font-size="17" font-weight="700">KEEP INCOMING</text><text x="68" y="543" fill="#fff" font-size="22" font-weight="700">Replace the definition</text><text x="68" y="576" fill="#b6c9da" font-size="17">Reload and retest if required</text><rect x="38" y="635" width="524" height="145" rx="22" fill="#10283d" stroke="#ffbd69" stroke-width="2"/><text x="68" y="676" fill="#ffbd69" font-size="17" font-weight="700">RENAME INCOMING</text><text x="68" y="718" fill="#fff" font-size="22" font-weight="700">Preserve both definitions</text><text x="68" y="751" fill="#b6c9da" font-size="17">Assign owner and retirement plan</text><rect x="38" y="810" width="524" height="50" rx="16" fill="#0e2234" stroke="#36536d"/><text x="300" y="842" text-anchor="middle" fill="#eef7ff" font-size="16" font-weight="700">Owner | reason | reload | tests | rollback</text></g><text x="38" y="888" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
