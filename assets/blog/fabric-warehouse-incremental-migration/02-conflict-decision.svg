<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Object conflict decision</title><desc id="d">Keep existing, keep incoming, or rename incoming after comparing definitions and downstream impact.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Turn every object conflict into an owned decision</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">Compare the complete definitions, then record the downstream impact.</text><g font-family="Arial"><rect x="345" y="160" width="510" height="100" rx="22" fill="#12354b" stroke="#27d3ff" stroke-width="2"/><text x="600" y="202" text-anchor="middle" fill="#27d3ff" font-size="17" font-weight="700">NAME ALREADY EXISTS</text><text x="600" y="236" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Existing definition vs. incoming definition</text><path d="M500 260 V320 H220" stroke="#9b7cff" stroke-width="4" fill="none"/><path d="M600 260 V320" stroke="#31e6a1" stroke-width="4"/><path d="M700 260 V320 H980" stroke="#ffbd69" stroke-width="4" fill="none"/><rect x="70" y="320" width="300" height="190" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="100" y="365" fill="#b9a8ff" font-size="18" font-weight="700">KEEP EXISTING</text><text x="100" y="407" fill="#fff" font-size="22" font-weight="700">Preserve destination</text><text x="100" y="445" fill="#b6c9da" font-size="17">Document intentional drift</text><text x="100" y="477" fill="#b6c9da" font-size="17">Retest source assumptions</text><rect x="450" y="320" width="300" height="190" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="480" y="365" fill="#31e6a1" font-size="18" font-weight="700">KEEP INCOMING</text><text x="480" y="407" fill="#fff" font-size="22" font-weight="700">Replace definition</text><text x="480" y="445" fill="#b6c9da" font-size="17">Check reload and permissions</text><text x="480" y="477" fill="#b6c9da" font-size="17">Retest every consumer</text><rect x="830" y="320" width="300" height="190" rx="22" fill="#10283d" stroke="#ffbd69" stroke-width="2"/><text x="860" y="365" fill="#ffbd69" font-size="18" font-weight="700">RENAME INCOMING</text><text x="860" y="407" fill="#fff" font-size="22" font-weight="700">Preserve both</text><text x="860" y="445" fill="#b6c9da" font-size="17">Assign owner and consumers</text><text x="860" y="477" fill="#b6c9da" font-size="17">Set a retirement decision</text><rect x="185" y="550" width="830" height="68" rx="18" fill="#0e2234" stroke="#36536d"/><text x="600" y="592" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">Decision + owner + reason + reload + tests + rollback</text></g><text x="70" y="650" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
