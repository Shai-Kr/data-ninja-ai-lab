<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Workload-sized migration waves</title><desc id="d">Three business workload waves move through scope, definitions, data, and validation into one controlled Fabric Warehouse.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Move the warehouse one validated workload at a time</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">Each wave has its own scope, object decisions, data load, and acceptance evidence.</text><g font-family="Arial"><rect x="70" y="190" width="245" height="270" rx="24" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="100" y="235" fill="#27d3ff" font-size="18" font-weight="700">WAVE 01</text><text x="100" y="276" fill="#fff" font-size="24" font-weight="700">Sales reporting</text><text x="100" y="320" fill="#b6c9da" font-size="18">12 selected objects</text><text x="100" y="353" fill="#b6c9da" font-size="18">3 dependencies added</text><text x="100" y="386" fill="#b6c9da" font-size="18">Data reconciled</text><text x="100" y="419" fill="#31e6a1" font-size="18" font-weight="700">Accepted</text><rect x="365" y="190" width="245" height="270" rx="24" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="395" y="235" fill="#b9a8ff" font-size="18" font-weight="700">WAVE 02</text><text x="395" y="276" fill="#fff" font-size="24" font-weight="700">Inventory</text><text x="395" y="320" fill="#b6c9da" font-size="18">18 selected objects</text><text x="395" y="353" fill="#b6c9da" font-size="18">2 conflicts owned</text><text x="395" y="386" fill="#b6c9da" font-size="18">Data load planned</text><text x="395" y="419" fill="#ffbd69" font-size="18" font-weight="700">In review</text><rect x="660" y="190" width="245" height="270" rx="24" fill="#10283d" stroke="#36536d" stroke-width="2"/><text x="690" y="235" fill="#8eabc5" font-size="18" font-weight="700">WAVE 03</text><text x="690" y="276" fill="#fff" font-size="24" font-weight="700">Finance close</text><text x="690" y="320" fill="#b6c9da" font-size="18">Boundary mapped</text><text x="690" y="353" fill="#b6c9da" font-size="18">Owners assigned</text><text x="690" y="386" fill="#b6c9da" font-size="18">Tests drafted</text><text x="690" y="419" fill="#8eabc5" font-size="18" font-weight="700">Queued</text><path d="M925 325 H985" stroke="#31e6a1" stroke-width="4"/><polygon points="997,325 977,313 977,337" fill="#31e6a1"/><rect x="997" y="210" width="150" height="230" rx="24" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="1072" y="260" text-anchor="middle" fill="#31e6a1" font-size="17" font-weight="700">FABRIC</text><text x="1072" y="290" text-anchor="middle" fill="#31e6a1" font-size="17" font-weight="700">WAREHOUSE</text><text x="1072" y="340" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Controlled</text><text x="1072" y="370" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">destination</text><text x="1072" y="408" text-anchor="middle" fill="#b6c9da" font-size="16">No warehouse</text><text x="1072" y="431" text-anchor="middle" fill="#b6c9da" font-size="16">per run</text><rect x="210" y="515" width="780" height="75" rx="20" fill="#0e2234" stroke="#36536d"/><text x="600" y="548" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">Scope  →  translate  →  deploy  →  load data  →  validate</text><text x="600" y="578" text-anchor="middle" fill="#8eabc5" font-size="17">Close one wave with evidence before expanding the next.</text></g><text x="70" y="650" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
