<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Six migration wave gates</title><desc id="d">Boundary, manifest, conflicts, data, validation, and evidence gates for each Fabric Warehouse migration wave.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Six gates before the next migration wave starts</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">A deployed definition is one checkpoint, not the finish line.</text><g font-family="Arial"><rect x="70" y="175" width="325" height="145" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="100" y="215" fill="#27d3ff" font-size="18" font-weight="700">01 BOUNDARY</text><text x="100" y="255" fill="#fff" font-size="22" font-weight="700">Business workload</text><text x="100" y="288" fill="#b6c9da" font-size="17">Outcome, owner, consumers</text><rect x="438" y="175" width="325" height="145" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="468" y="215" fill="#b9a8ff" font-size="18" font-weight="700">02 MANIFEST</text><text x="468" y="255" fill="#fff" font-size="22" font-weight="700">Objects and dependencies</text><text x="468" y="288" fill="#b6c9da" font-size="17">Selected, added, excluded</text><rect x="805" y="175" width="325" height="145" rx="22" fill="#10283d" stroke="#ffbd69" stroke-width="2"/><text x="835" y="215" fill="#ffbd69" font-size="18" font-weight="700">03 CONFLICTS</text><text x="835" y="255" fill="#fff" font-size="22" font-weight="700">Owned decisions</text><text x="835" y="288" fill="#b6c9da" font-size="17">Keep, replace, or rename</text><rect x="70" y="365" width="325" height="145" rx="22" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="100" y="405" fill="#31e6a1" font-size="18" font-weight="700">04 DATA</text><text x="100" y="445" fill="#fff" font-size="22" font-weight="700">Separate load plan</text><text x="100" y="478" fill="#b6c9da" font-size="17">Copy, reconcile, recover</text><rect x="438" y="365" width="325" height="145" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="468" y="405" fill="#27d3ff" font-size="18" font-weight="700">05 VALIDATION</text><text x="468" y="445" fill="#fff" font-size="22" font-weight="700">Known answers</text><text x="468" y="478" fill="#b6c9da" font-size="17">Queries, reports, failure paths</text><rect x="805" y="365" width="325" height="145" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="835" y="405" fill="#b9a8ff" font-size="18" font-weight="700">06 EVIDENCE</text><text x="835" y="445" fill="#fff" font-size="22" font-weight="700">Wave ledger</text><text x="835" y="478" fill="#b6c9da" font-size="17">Version, owner, result, time</text><rect x="250" y="550" width="700" height="67" rx="18" fill="#12354b" stroke="#31e6a1" stroke-width="2"/><text x="600" y="592" text-anchor="middle" fill="#eef7ff" font-size="21" font-weight="700">Expand scope only when all six gates have evidence</text></g><text x="70" y="650" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
