<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Workload-sized migration waves</title><desc id="d">Three workload waves move into a controlled Fabric Warehouse.</desc><rect width="600" height="900" rx="28" fill="#07111f"/><text x="38" y="62" fill="#eef7ff" font-family="Arial" font-size="28" font-weight="700">Migrate in validated waves</text><text x="38" y="98" fill="#8eabc5" font-family="Arial" font-size="17">One business workload at a time.</text><g font-family="Arial"><rect x="38" y="140" width="524" height="145" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="68" y="180" fill="#27d3ff" font-size="16" font-weight="700">WAVE 01 | SALES</text><text x="68" y="220" fill="#fff" font-size="22" font-weight="700">Scope, load, tests: accepted</text><text x="68" y="255" fill="#31e6a1" font-size="17">Evidence recorded</text><rect x="38" y="315" width="524" height="145" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="68" y="355" fill="#b9a8ff" font-size="16" font-weight="700">WAVE 02 | INVENTORY</text><text x="68" y="395" fill="#fff" font-size="22" font-weight="700">Two conflicts under review</text><text x="68" y="430" fill="#ffbd69" font-size="17">Owners and follow-up defined</text><rect x="38" y="490" width="524" height="145" rx="22" fill="#10283d" stroke="#36536d" stroke-width="2"/><text x="68" y="530" fill="#8eabc5" font-size="16" font-weight="700">WAVE 03 | FINANCE</text><text x="68" y="570" fill="#fff" font-size="22" font-weight="700">Boundary and tests queued</text><text x="68" y="605" fill="#8eabc5" font-size="17">Starts after Wave 02 closes</text><path d="M300 635 V680" stroke="#31e6a1" stroke-width="4"/><polygon points="300,694 288,674 312,674" fill="#31e6a1"/><rect x="38" y="694" width="524" height="145" rx="22" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="300" y="740" text-anchor="middle" fill="#31e6a1" font-size="17" font-weight="700">FABRIC WAREHOUSE</text><text x="300" y="782" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">One controlled destination</text><text x="300" y="816" text-anchor="middle" fill="#b6c9da" font-size="17">No new warehouse for every run</text></g><text x="38" y="882" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
