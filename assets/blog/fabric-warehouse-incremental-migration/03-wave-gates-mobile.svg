<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Six migration wave gates</title><desc id="d">Boundary, manifest, conflicts, data, validation, and evidence gates.</desc><rect width="600" height="900" rx="28" fill="#07111f"/><text x="38" y="62" fill="#eef7ff" font-family="Arial" font-size="28" font-weight="700">Six gates for every wave</text><text x="38" y="98" fill="#8eabc5" font-family="Arial" font-size="17">Deployment alone is not completion.</text><g font-family="Arial"><rect x="38" y="135" width="524" height="105" rx="20" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="65" y="174" fill="#27d3ff" font-size="16" font-weight="700">01 BOUNDARY</text><text x="65" y="211" fill="#fff" font-size="21" font-weight="700">Outcome, owner, consumers</text><rect x="38" y="260" width="524" height="105" rx="20" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="65" y="299" fill="#b9a8ff" font-size="16" font-weight="700">02 MANIFEST</text><text x="65" y="336" fill="#fff" font-size="21" font-weight="700">Selected and added dependencies</text><rect x="38" y="385" width="524" height="105" rx="20" fill="#10283d" stroke="#ffbd69" stroke-width="2"/><text x="65" y="424" fill="#ffbd69" font-size="16" font-weight="700">03 CONFLICTS</text><text x="65" y="461" fill="#fff" font-size="21" font-weight="700">Keep, replace, or rename</text><rect x="38" y="510" width="524" height="105" rx="20" fill="#10283d" stroke="#31e6a1" stroke-width="2"/><text x="65" y="549" fill="#31e6a1" font-size="16" font-weight="700">04 DATA</text><text x="65" y="586" fill="#fff" font-size="21" font-weight="700">Load, reconcile, recover</text><rect x="38" y="635" width="524" height="105" rx="20" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="65" y="674" fill="#27d3ff" font-size="16" font-weight="700">05 VALIDATION</text><text x="65" y="711" fill="#fff" font-size="21" font-weight="700">Known answers and failures</text><rect x="38" y="760" width="524" height="105" rx="20" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="65" y="799" fill="#b9a8ff" font-size="16" font-weight="700">06 EVIDENCE</text><text x="65" y="836" fill="#fff" font-size="21" font-weight="700">Version, owner, result, time</text></g><text x="38" y="888" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
