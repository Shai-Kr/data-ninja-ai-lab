<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1420" viewBox="0 0 900 1420" role="img" aria-label="Fabric IQ context layer for AI agents">
<defs>
<radialGradient id="bg" cx="20%" cy="10%" r="95%"><stop offset="0%" stop-color="#123b66"/><stop offset="50%" stop-color="#071527"/><stop offset="100%" stop-color="#020711"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10233d"/><stop offset="100%" stop-color="#07101f"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.title { font: 750 54px Inter, Segoe UI, Arial, sans-serif; fill:#f2fbff; }
.subtitle { font: 420 31px Inter, Segoe UI, Arial, sans-serif; fill:#a8d8ff; }
.card-title { font: 750 37px Inter, Segoe UI, Arial, sans-serif; fill:#e7fbff; }
.card-text { font: 430 30px Inter, Segoe UI, Arial, sans-serif; fill:#c2dcf0; }
.badge { font: 800 24px Inter, Segoe UI, Arial, sans-serif; fill:#06101d; }
.footer { font: 650 26px Inter, Segoe UI, Arial, sans-serif; fill:#82d7ff; }
.arrow { fill:none; stroke:#2ed3ff; stroke-width:5; marker-end:url(#arrow); opacity:.9; }
</style>
<marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M3,3 L13,8 L3,13 Z" fill="#2ed3ff"/></marker>
</defs>
<rect width="900" height="1420" fill="url(#bg)"/>
<circle cx="720" cy="135" r="180" fill="#0bc6ff" opacity=".11" filter="url(#glow)"/>
<circle cx="145" cy="1200" r="230" fill="#2563eb" opacity=".13" filter="url(#glow)"/>
<text x="58" y="78" class="title">Fabric IQ context</text>
<text x="58" y="140" class="title">for AI agents</text>
<text x="60" y="205" class="subtitle">Business meaning, governed once.</text>
<rect x="58" y="250" width="784" height="225" rx="30" fill="url(#card)" stroke="#1fbfe8" stroke-opacity=".58"/>
<rect x="90" y="280" width="130" height="46" rx="23" fill="#40e0ff"/>
<text x="155" y="312" text-anchor="middle" class="badge">01</text>
<text x="90" y="372" class="card-title">OneLake foundation</text>
<text x="90" y="420" class="card-text">Business data stays grounded in the Fabric</text>
<text x="90" y="458" class="card-text">data estate.</text>
<path class="arrow" d="M450,487 L450,520"/>
<rect x="58" y="533" width="784" height="225" rx="30" fill="url(#card)" stroke="#1fbfe8" stroke-opacity=".58"/>
<rect x="90" y="563" width="130" height="46" rx="23" fill="#40e0ff"/>
<text x="155" y="595" text-anchor="middle" class="badge">02</text>
<text x="90" y="655" class="card-title">Semantic models</text>
<text x="90" y="703" class="card-text">Trusted KPIs, measures, dimensions, and</text>
<text x="90" y="741" class="card-text">business definitions.</text>
<path class="arrow" d="M450,770 L450,803"/>
<rect x="58" y="816" width="784" height="225" rx="30" fill="url(#card)" stroke="#1fbfe8" stroke-opacity=".58"/>
<rect x="90" y="846" width="130" height="46" rx="23" fill="#40e0ff"/>
<text x="155" y="878" text-anchor="middle" class="badge">03</text>
<text x="90" y="938" class="card-title">Ontology + Graph</text>
<text x="90" y="986" class="card-text">Business entities, relationships, rules,</text>
<text x="90" y="1024" class="card-text">and connected context.</text>
<path class="arrow" d="M450,1053 L450,1086"/>
<rect x="58" y="1099" width="784" height="225" rx="30" fill="url(#card)" stroke="#1fbfe8" stroke-opacity=".58"/>
<rect x="90" y="1129" width="130" height="46" rx="23" fill="#40e0ff"/>
<text x="155" y="1161" text-anchor="middle" class="badge">04</text>
<text x="90" y="1221" class="card-title">Agents use context</text>
<text x="90" y="1269" class="card-text">AI agents answer and reason using governed</text>
<text x="90" y="1307" class="card-text">business meaning.</text>
<text x="58" y="1350" class="footer">Fabric IQ does not replace the data estate.</text>
<text x="58" y="1384" class="footer">It makes business context reusable for agents.</text>
</svg>