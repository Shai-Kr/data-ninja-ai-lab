<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">dbt Lakehouse adoption checklist</title><desc id="desc">Checklist for adopting dbt jobs with Fabric Lakehouse.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101d"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><text x="70" y="82" fill="#f8fbff" font-family="Inter,Segoe UI,Arial" font-size="38" font-weight="800">Before you put dbt jobs on Fabric Lakehouse</text><text x="70" y="124" fill="#9fb3c8" font-family="Inter,Segoe UI,Arial" font-size="22">A simple adoption checklist for teams that want useful standards without slowing delivery.</text><g font-family="Inter,Segoe UI,Arial" font-size="22" fill="#e8f2ff"><rect x="80" y="180" width="1120" height="430" rx="30" fill="#0b1425" stroke="#26384f"/><g transform="translate(130 235)"><circle cx="16" cy="0" r="14" fill="#22c55e"/><path d="M8 -1 l6 7 l12 -17" fill="none" stroke="#06210f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="8">Confirm which Lakehouse is the target and who owns it.</text></g><g transform="translate(130 305)"><circle cx="16" cy="0" r="14" fill="#22c55e"/><path d="M8 -1 l6 7 l12 -17" fill="none" stroke="#06210f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="8">Separate raw, prepared, and business-ready transformation layers.</text></g><g transform="translate(130 375)"><circle cx="16" cy="0" r="14" fill="#22c55e"/><path d="M8 -1 l6 7 l12 -17" fill="none" stroke="#06210f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="8">Require tests for joins, grain, accepted values, and row-count expectations.</text></g><g transform="translate(130 445)"><circle cx="16" cy="0" r="14" fill="#22c55e"/><path d="M8 -1 l6 7 l12 -17" fill="none" stroke="#06210f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="8">Document downstream semantic models and reports before promotion.</text></g><g transform="translate(130 515)"><circle cx="16" cy="0" r="14" fill="#22c55e"/><path d="M8 -1 l6 7 l12 -17" fill="none" stroke="#06210f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="8">Treat dbt failures as data product incidents, not background job noise.</text></g></g><text x="80" y="665" fill="#8aa1b8" font-family="Inter,Segoe UI,Arial" font-size="18">Review-only draft visual for Shai Karmani · Data Ninja AI Lab</text></svg>
