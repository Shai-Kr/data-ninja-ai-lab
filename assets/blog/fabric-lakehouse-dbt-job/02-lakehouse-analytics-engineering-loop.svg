<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Lakehouse analytics engineering loop</title><desc id="desc">A loop diagram for dbt development against Fabric Lakehouse.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#122a44"/><stop offset="1" stop-color="#0b1728"/></linearGradient></defs>
<rect width="1280" height="720" fill="url(#bg)"/><text x="70" y="82" fill="#f8fbff" font-family="Inter,Segoe UI,Arial" font-size="38" font-weight="800">The Lakehouse analytics engineering loop</text><text x="70" y="124" fill="#9fb3c8" font-family="Inter,Segoe UI,Arial" font-size="22">dbt in Fabric is strongest when it becomes a repeatable review cycle, not a one-off transformation run.</text>
<g transform="translate(640 370)" font-family="Inter,Segoe UI,Arial" text-anchor="middle">
<circle r="205" fill="none" stroke="#1f3856" stroke-width="18"/><circle r="205" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="120 42" opacity="0.9"/>
<g><rect x="-118" y="-285" width="236" height="78" rx="22" fill="url(#node)" stroke="#38bdf8"/><text y="-238" fill="#f8fbff" font-size="21" font-weight="800">Model</text></g>
<g><rect x="220" y="-62" width="248" height="86" rx="22" fill="url(#node)" stroke="#8b5cf6"/><text x="344" y="-12" fill="#f8fbff" font-size="21" font-weight="800">Test</text></g>
<g><rect x="-124" y="222" width="248" height="86" rx="22" fill="url(#node)" stroke="#22c55e"/><text y="272" fill="#f8fbff" font-size="21" font-weight="800">Review</text></g>
<g><rect x="-468" y="-62" width="248" height="86" rx="22" fill="url(#node)" stroke="#f59e0b"/><text x="-344" y="-12" fill="#f8fbff" font-size="21" font-weight="800">Publish</text></g>
<text y="-20" fill="#d7e7f7" font-size="26" font-weight="800">Fabric Lakehouse</text><text y="18" fill="#93a9bf" font-size="18">data, schemas, business logic</text>
</g>
<g font-family="Inter,Segoe UI,Arial" fill="#b8cce2" font-size="18"><text x="94" y="640">Practical rule: every dbt model should have a table owner, test expectation, downstream dependency, and promotion path.</text></g>
</svg>
