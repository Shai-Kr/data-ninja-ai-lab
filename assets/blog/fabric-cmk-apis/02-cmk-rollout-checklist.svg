<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="CMK rollout checklist for Fabric workspaces"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#030813"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10233d"/><stop offset="1" stop-color="#071221"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e6f1ff} .muted{fill:#a9bad0} .cyan{fill:#5ce7ff} .title{font-size:32px;font-weight:800;letter-spacing:-0.5px}.label{font-size:20px;font-weight:750}.small{font-size:15px}.tiny{font-size:13px}.box{fill:url(#card);stroke:#2fd8ff;stroke-opacity:.34;stroke-width:1.5}.pill{fill:#0b2036;stroke:#5ce7ff;stroke-opacity:.38}.line{stroke:#5ce7ff;stroke-width:3;stroke-linecap:round;stroke-opacity:.9}.dash{stroke:#7aa2ff;stroke-width:2;stroke-dasharray:6 8;stroke-opacity:.75}
  </style>
</defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><text x="70" y="74" class="title">A safe CMK rollout starts before the API call</text><text x="70" y="112" class="muted small">The API is the easy part. The controls around it decide if this scales.</text>
<g transform="translate(70,165)"><rect width="320" height="390" rx="24" class="box"/><text x="34" y="52" class="cyan label">Prerequisites</text><text x="34" y="100" class="muted small">Tenant CMK setting enabled</text><text x="34" y="138" class="muted small">Fabric Platform CMK app exists</text><text x="34" y="176" class="muted small">Key Vault soft delete enabled</text><text x="34" y="214" class="muted small">Purge protection enabled</text><text x="34" y="252" class="muted small">Versionless key URI used</text><text x="34" y="290" class="muted small">Unsupported items separated</text><text x="34" y="328" class="muted small">Workspace admin path clear</text></g>
<g transform="translate(440,165)"><rect width="320" height="390" rx="24" class="box"/><text x="34" y="52" class="cyan label">Deployment gates</text><text x="34" y="100" class="muted small">Pilot on low-risk workspace</text><text x="34" y="138" class="muted small">Record previous key state</text><text x="34" y="176" class="muted small">Track EnableInProgress states</text><text x="34" y="214" class="muted small">Wait for Active before expanding</text><text x="34" y="252" class="muted small">Log Retry-After behavior</text><text x="34" y="290" class="muted small">Document rollback intent</text><text x="34" y="328" class="muted small">Review audit events</text></g>
<g transform="translate(810,165)"><rect width="320" height="390" rx="24" class="box"/><text x="34" y="52" class="cyan label">Operating model</text><text x="34" y="100" class="muted small">Key owner named</text><text x="34" y="138" class="muted small">Rotation cadence defined</text><text x="34" y="176" class="muted small">Workspace inventory monitored</text><text x="34" y="214" class="muted small">Failure response assigned</text><text x="34" y="252" class="muted small">Capacity scope understood</text><text x="34" y="290" class="muted small">SQL database caveat known</text><text x="34" y="328" class="muted small">Exception workspaces tracked</text></g>
<path d="M390 360 H440 M760 360 H810" class="line"/><text x="70" y="635" class="muted small">Practical rule: do not automate encryption faster than you can prove status, ownership, and recovery.</text></svg>