<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Fabric workspace CMK API governance loop"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#030813"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10233d"/><stop offset="1" stop-color="#071221"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e6f1ff} .muted{fill:#a9bad0} .cyan{fill:#5ce7ff} .title{font-size:32px;font-weight:800;letter-spacing:-0.5px}.label{font-size:20px;font-weight:750}.small{font-size:15px}.tiny{font-size:13px}.box{fill:url(#card);stroke:#2fd8ff;stroke-opacity:.34;stroke-width:1.5}.pill{fill:#0b2036;stroke:#5ce7ff;stroke-opacity:.38}.line{stroke:#5ce7ff;stroke-width:3;stroke-linecap:round;stroke-opacity:.9}.dash{stroke:#7aa2ff;stroke-width:2;stroke-dasharray:6 8;stroke-opacity:.75}
  </style>
</defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><circle cx="1020" cy="110" r="145" fill="#1a8cff" opacity=".12"/><circle cx="190" cy="630" r="180" fill="#5ce7ff" opacity=".08"/><text x="70" y="74" class="title">Fabric workspace CMK as an API control loop</text><text x="70" y="112" class="muted small">Turn encryption from a portal task into repeatable platform governance.</text>
<rect x="70" y="165" width="250" height="150" rx="22" class="box"/><text x="105" y="212" class="label">Provision</text><text x="105" y="248" class="muted small">Workspace created</text><text x="105" y="276" class="muted small">Policy checks run</text>
<rect x="365" y="165" width="250" height="150" rx="22" class="box"/><text x="400" y="212" class="label">Assign or rotate</text><text x="400" y="248" class="muted small">POST encryption/assign</text><text x="400" y="276" class="muted small">Versionless Key Vault URI</text>
<rect x="660" y="165" width="250" height="150" rx="22" class="box"/><text x="695" y="212" class="label">Verify status</text><text x="695" y="248" class="muted small">GET encryption</text><text x="695" y="276" class="muted small">Active or in progress</text>
<rect x="365" y="405" width="250" height="150" rx="22" class="box"/><text x="400" y="452" class="label">Audit estate</text><text x="400" y="488" class="muted small">Admin list workspaces</text><text x="400" y="516" class="muted small">Encryption state by tenant</text>
