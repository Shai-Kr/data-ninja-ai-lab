<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Workspace encryption status model for Fabric CMK APIs"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#030813"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10233d"/><stop offset="1" stop-color="#071221"/></linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e6f1ff} .muted{fill:#a9bad0} .cyan{fill:#5ce7ff} .title{font-size:32px;font-weight:800;letter-spacing:-0.5px}.label{font-size:20px;font-weight:750}.small{font-size:15px}.tiny{font-size:13px}.box{fill:url(#card);stroke:#2fd8ff;stroke-opacity:.34;stroke-width:1.5}.pill{fill:#0b2036;stroke:#5ce7ff;stroke-opacity:.38}.line{stroke:#5ce7ff;stroke-width:3;stroke-linecap:round;stroke-opacity:.9}.dash{stroke:#7aa2ff;stroke-width:2;stroke-dasharray:6 8;stroke-opacity:.75}
  </style>
</defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><text x="70" y="74" class="title">The status model is where governance becomes visible</text><text x="70" y="112" class="muted small">CMK APIs expose enough state to build monitoring, drift checks, and exception handling.</text>
<rect x="92" y="175" width="230" height="120" rx="22" class="pill"/><text x="135" y="225" class="label">Disabled</text><text x="135" y="258" class="muted small">Microsoft-managed keys</text>
<rect x="382" y="175" width="230" height="120" rx="22" class="pill"/><text x="410" y="225" class="label">EnableInProgress</text><text x="410" y="258" class="muted small">Poll with Retry-After</text>
<rect x="672" y="175" width="230" height="120" rx="22" class="pill"/><text x="735" y="225" class="label">Active</text><text x="735" y="258" class="muted small">Workspace encrypted</text>
<rect x="382" y="395" width="230" height="120" rx="22" class="pill"/><text x="405" y="445" class="label">DisableInProgress</text><text x="405" y="478" class="muted small">Change window needed</text>
<rect x="672" y="395" width="230" height="120" rx="22" class="pill"/><text x="735" y="445" class="label">Failed</text><text x="735" y="478" class="muted small">Investigate item list</text>
<rect x="955" y="242" width="170" height="210" rx="24" fill="#071a2f" stroke="#5ce7ff" stroke-opacity=".36"/><text x="982" y="292" class="cyan label">Monitor</text><text x="982" y="330" class="muted small">Key URI</text><text x="982" y="360" class="muted small">Status</text><text x="982" y="390" class="muted small">Items</text><text x="982" y="420" class="muted small">Audit logs</text>
<path d="M322 235 H382 M612 235 H672 M787 295 V395 M672 455 H612 M497 395 V295 M902 346 H955" class="line"/><path d="M92 590 H902" class="dash"/><text x="96" y="634" class="muted small">Watch for: unsupported items, failed item groups, stale key ownership, and workspaces outside the encryption policy.</text></svg>