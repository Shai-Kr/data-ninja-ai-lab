<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pilot Checklist</title>
  <desc id="desc">A small rollout pattern before standardizing the connector</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="170" fill="#2563eb" opacity="0.16"/>
  <circle cx="180" cy="620" r="210" fill="#7c3aed" opacity="0.13"/>
  <path d="M60 585 C260 500 390 650 575 555 S925 520 1215 590" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="3" fill="none"/>
  <text x="72" y="84" fill="#e5f2ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Pilot Checklist</text>
  <text x="74" y="128" fill="#a7b7d6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">A small rollout pattern before standardizing the connector</text>

  <g filter="url(#glow)">
    <rect x="90" y="210" width="330" height="190" rx="24" fill="#0b1222" stroke="#38bdf8" stroke-width="2" opacity="0.98"/>
  </g>
  <text x="118" y="256" fill="#38bdf8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Pilot</text>
  <text x="118" y="298" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">One stream</text>
  <text x="118" y="336" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Known schema</text>
  <text x="118" y="366" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">low blast radius</text>
<path d="M432 305 H458" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><path d="M458 305 l-10 -8 m10 8 l-10 8" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>

  <g filter="url(#glow)">
    <rect x="465" y="210" width="330" height="190" rx="24" fill="#0b1222" stroke="#a78bfa" stroke-width="2" opacity="0.98"/>
  </g>
  <text x="493" y="256" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Validate</text>
  <text x="493" y="298" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">Throughput</text>
  <text x="493" y="336" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">failures</text>
  <text x="493" y="366" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">consumer lag</text>
<path d="M807 305 H833" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><path d="M833 305 l-10 -8 m10 8 l-10 8" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>

  <g filter="url(#glow)">
    <rect x="840" y="210" width="330" height="190" rx="24" fill="#0b1222" stroke="#34d399" stroke-width="2" opacity="0.98"/>
  </g>
  <text x="868" y="256" fill="#34d399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Standardize</text>
  <text x="868" y="298" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">Template</text>
  <text x="868" y="336" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">naming</text>
  <text x="868" y="366" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">access review</text>

  <rect x="86" y="510" width="1108" height="92" rx="22" fill="#020617" stroke="#334155" stroke-width="1.5" opacity="0.94"/>
  <text x="118" y="560" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Start with one useful stream, prove the operating model, then make it the default.</text>
  <text x="118" y="592" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Data Ninja AI Lab · Review draft · Shai Karmani</text>
</svg>