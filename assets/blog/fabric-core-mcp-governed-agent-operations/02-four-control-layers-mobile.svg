<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc"><title id="title">Four control layers</title><desc id="desc">Client, identity, tools, and resources</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" rx="28" fill="url(#bg)"/><circle cx="319" cy="70" r="150" fill="#18d7ff" opacity=".07"/><circle cx="70" cy="860" r="130" fill="#7b61ff" opacity=".07"/><text x="195.0" y="54" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="28">Four separate control layers</text><text x="195.0" y="86" text-anchor="middle" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="15">Each layer answers a different risk question</text><rect x="25" y="120" width="340" height="150" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><text x="50" y="164" text-anchor="start" fill="#18d7ff" font-family="Arial,sans-serif" font-weight="700" font-size="30">01</text><text x="105" y="160" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">CLIENT</text><text x="50" y="207" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Which AI application and retention path?</text><rect x="25" y="295" width="340" height="150" rx="18" fill="#0d2032" stroke="#9a86ff" stroke-width="2"/><text x="50" y="339" text-anchor="start" fill="#9a86ff" font-family="Arial,sans-serif" font-weight="700" font-size="30">02</text><text x="105" y="335" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">IDENTITY</text><text x="50" y="382" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Which Entra user and Fabric roles?</text><rect x="25" y="470" width="340" height="150" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><text x="50" y="514" text-anchor="start" fill="#67e8a5" font-family="Arial,sans-serif" font-weight="700" font-size="30">03</text><text x="105" y="510" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">TOOLS</text><text x="50" y="557" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Which read and mutation operations?</text><rect x="25" y="645" width="340" height="150" rx="18" fill="#0d2032" stroke="#ffca68" stroke-width="2"/><text x="50" y="689" text-anchor="start" fill="#ffca68" font-family="Arial,sans-serif" font-weight="700" font-size="30">04</text><text x="105" y="685" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">RESOURCES</text><text x="50" y="732" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Which capacities, workspaces, and items?</text><rect x="24" y="838" width="342" height="36" rx="18" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".55"/><text x="195.0" y="862" text-anchor="middle" fill="#18d7ff" font-family="Arial,sans-serif" font-weight="700" font-size="15">All four layers need evidence</text></svg>