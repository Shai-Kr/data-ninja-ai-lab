<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Four control layers</title><desc id="desc">Client, identity, tools, and resources</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" rx="28" fill="url(#bg)"/><circle cx="983" cy="70" r="150" fill="#18d7ff" opacity=".07"/><circle cx="70" cy="660" r="130" fill="#7b61ff" opacity=".07"/><text x="600.0" y="54" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="34">Four separate control layers</text><text x="600.0" y="86" text-anchor="middle" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="18">Each layer answers a different risk question</text><rect x="110.0" y="130" width="980" height="105" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><text x="145.0" y="193" text-anchor="start" fill="#18d7ff" font-family="Arial,sans-serif" font-weight="700" font-size="30">01</text><text x="210.0" y="174" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">CLIENT</text><text x="210.0" y="206" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="16">Which AI application and retention path?</text><rect x="160.0" y="250" width="880" height="105" rx="18" fill="#0d2032" stroke="#9a86ff" stroke-width="2"/><text x="195.0" y="313" text-anchor="start" fill="#9a86ff" font-family="Arial,sans-serif" font-weight="700" font-size="30">02</text><text x="260.0" y="294" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">IDENTITY</text><text x="260.0" y="326" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="16">Which Entra user and Fabric roles?</text><rect x="210.0" y="370" width="780" height="105" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><text x="245.0" y="433" text-anchor="start" fill="#67e8a5" font-family="Arial,sans-serif" font-weight="700" font-size="30">03</text><text x="310.0" y="414" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">TOOLS</text><text x="310.0" y="446" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="16">Which read and mutation operations?</text><rect x="260.0" y="490" width="680" height="105" rx="18" fill="#0d2032" stroke="#ffca68" stroke-width="2"/><text x="295.0" y="553" text-anchor="start" fill="#ffca68" font-family="Arial,sans-serif" font-weight="700" font-size="30">04</text><text x="360.0" y="534" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">RESOURCES</text><text x="360.0" y="566" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="16">Which capacities, workspaces, and items?</text><rect x="330" y="620" width="540" height="36" rx="18" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".55"/><text x="600.0" y="644" text-anchor="middle" fill="#18d7ff" font-family="Arial,sans-serif" font-weight="700" font-size="15">All four layers need evidence</text></svg>