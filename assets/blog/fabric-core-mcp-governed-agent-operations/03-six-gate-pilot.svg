ial,sans-serif" font-weight="700" font-size="16">2</text><text x="513" y="184" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="19">Discovery</text><text x="465" y="235" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="15">Stable target identified</text><text x="465" y="289" text-anchor="start" fill="#9a86ff" font-family="Arial,sans-serif" font-weight="700" font-size="14">PASS evidence required</text><rect x="815" y="135" width="330" height="200" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><circle cx="857" cy="177" r="20" fill="#67e8a5"/><text x="857" y="184" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="16">3</text><text x="893" y="184" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="19">Authorization</text><text x="845" y="235" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="15">Allowed action, denied boundary</text><text x="845" y="289" text-anchor="start" fill="#67e8a5" font-family="Arial,sans-serif" font-weight="700" font-size="14">PASS evidence required</text><rect x="55" y="380" width="330" height="200" rx="18" fill="#0d2032" stroke="#ffca68" stroke-width="2"/><circle cx="97" cy="422" r="20" fill="#ffca68"/><text x="97" y="429" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="16">4</text><text x="133" y="429" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="19">Accuracy</text><text x="85" y="480" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="15">Known answers and exact result</text><text x="85" y="534" text-anchor="start" fill="#ffca68" font-family="Arial,sans-serif" font-weight="700" font-size="14">PASS evidence required</text><rect x="435" y="380" width="330" height="200" 