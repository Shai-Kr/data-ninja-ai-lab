<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc"><title id="title">Six-gate pilot</title><desc id="desc">Acceptance gates for Fabric Core MCP</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" rx="28" fill="url(#bg)"/><circle cx="319" cy="70" r="150" fill="#18d7ff" opacity=".07"/><circle cx="70" cy="1120" r="130" fill="#7b61ff" opacity=".07"/><text x="195.0" y="54" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="20">Six gates for a production pilot</text><text x="195.0" y="86" text-anchor="middle" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="15">A demo proves a call. A pilot proves the boundary.</text><rect x="25" y="120" width="340" height="140" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><circle cx="57" cy="162" r="18" fill="#18d7ff"/><text x="57" y="169" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="15">1</text><text x="88" y="167" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Authentication</text><text x="47" y="210" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Approved identity connects</text><rect x="25" y="285" width="340" height="140" rx="18" fill="#0d2032" stroke="#9a86ff" stroke-width="2"/><circle cx="57" cy="327" r="18" fill="#9a86ff"/><text x="57" y="334" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="15">2</text><text x="88" y="332" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Discovery</text><text x="47" y="375" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Stable target identified</text><rect x="25" y="450" width="340" height="140" rx="18" fill="#0d2032" stroke="#67e8a5" stroke-width="2"/><circle cx="57" cy="492" r="18" fill="#67e8a5"/><text x="57" y="499" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="15">3</text><text x="88" y="497" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Authorization</text><text x="47" y="540" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Allowed action, denied boundary</text><rect x="25" y="615" width="340" height="140" rx="18" fill="#0d2032" stroke="#ffca68" stroke-width="2"/><circle cx="57" cy="657" r="18" fill="#ffca68"/><text x="57" y="664" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="15">4</text><text x="88" y="662" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Accuracy</text><text x="47" y="705" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Known answers and exact result</text><rect x="25" y="780" width="340" height="140" rx="18" fill="#0d2032" stroke="#9a86ff" stroke-width="2"/><circle cx="57" cy="822" r="18" fill="#9a86ff"/><text x="57" y="829" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="15">5</text><text x="88" y="827" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Failure behavior</text><text x="47" y="870" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Ambiguity stops the workflow</text><rect x="25" y="945" width="340" height="140" rx="18" fill="#0d2032" stroke="#18d7ff" stroke-width="2"/><circle cx="57" cy="987" r="18" fill="#18d7ff"/><text x="57" y="994" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-weight="700" font-size="15">6</text><text x="88" y="992" text-anchor="start" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="18">Evidence</text><text x="47" y="1035" text-anchor="start" fill="#b9d3df" font-family="Arial,sans-serif" font-weight="400" font-size="14">Request, result, audit correlated</text><rect x="24" y="1098" width="342" height="36" rx="18" fill="#092b3b" stroke="#18d7ff" stroke-opacity=".55"/><text x="195.0" y="1122" text-anchor="middle" fill="#18d7ff" font-family="Arial,sans-serif" font-weight="700" font-size="15">Expand only after all six pass</text></svg>