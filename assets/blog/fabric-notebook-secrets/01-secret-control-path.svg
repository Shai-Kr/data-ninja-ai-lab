<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Controlled Fabric notebook secret path</title><desc id="desc">Data Ninja AI Lab technical diagram</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b32"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="650" fill="url(#g)"/><circle cx="1120" cy="70" r="150" fill="#12335a" opacity=".22"/><circle cx="70" cy="610" r="140" fill="#0c4b53" opacity=".18"/><text x="60" y="66" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" text-anchor="start"><tspan x="60" dy="0">THE CONTROLLED SECRET PATH</tspan></text><text x="60" y="103" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="60" dy="0">Keep the value in Key Vault. Move only what the workload needs.</tspan></text><rect x="55" y="175" width="235" height="210" rx="22" fill="#0d1b2d" stroke="#ffca6b" stroke-width="2"/><rect x="55" y="175" width="8" height="210" rx="4" fill="#ffca6b"/><text x="83" y="217" fill="#ffca6b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="83" dy="0">AZURE KEY VAULT</tspan></text><text x="83" y="257" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Owns value</tspan><tspan x="83" dy="27">and rotation</tspan></text><rect x="340" y="175" width="235" height="210" rx="22" fill="#0d1b2d" stroke="#39d6ff" stroke-width="2"/><rect x="340" y="175" width="8" height="210" rx="4" fill="#39d6ff"/><text x="368" y="217" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="368" dy="0">FABRIC IDENTITY</tspan></text><text x="368" y="257" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="368" dy="0">Proves who</tspan><tspan x="368" dy="27">is requesting</tspan></text><rect x="625" y="175" width="235" height="210" rx="22" fill="#0d1b2d" stroke="#568bff" stroke-width="2"/><rect x="625" y="175" width="8" height="210" rx="4" fill="#568bff"/><text x="653" y="217" fill="#568bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="653" dy="0">NOTEBOOK</tspan></text><text x="653" y="257" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="653" dy="0">Retrieves late</tspan><tspan x="653" dy="27">never persists</tspan></text><rect x="910" y="175" width="235" height="210" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="910" y="175" width="8" height="210" rx="4" fill="#4ee3a3"/><text x="938" y="217" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="938" dy="0">TARGET SERVICE</tspan></text><text x="938" y="257" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="938" dy="0">Receives only</tspan><tspan x="938" dy="27">the connection</tspan></text><path d="M290 280 L335 280" stroke="#39d6ff" stroke-width="4" fill="none"/><path d="M322 272 L335 280 L322 288" fill="none" stroke="#39d6ff" stroke-width="4"/><path d="M575 280 L620 280" stroke="#39d6ff" stroke-width="4" fill="none"/><path d="M607 272 L620 280 L607 288" fill="none" stroke="#39d6ff" stroke-width="4"/><path d="M860 280 L905 280" stroke="#39d6ff" stroke-width="4" fill="none"/><path d="M892 272 L905 280 L892 288" fill="none" stroke="#39d6ff" stroke-width="4"/><text x="600" y="450" fill="#ff7f96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle"><tspan x="600" dy="0">NOT IN THE PATH</tspan></text><text x="600" y="490" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="600" dy="0">source code  •  notebook parameters  •  files  •  logs</tspan></text><text x="600" y="548" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">The notebook sees plaintext in memory. The controls prevent it becoming durable output.</tspan></text><text x="600.0" y="626" fill="#6f8da7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0">DATA NINJA AI LAB  •  SHAI KARMANI</tspan></text></svg>