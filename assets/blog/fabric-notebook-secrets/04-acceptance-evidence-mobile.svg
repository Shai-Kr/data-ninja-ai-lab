nchor="start"><tspan x="83" dy="0">Test secret and forced error</tspan><tspan x="83" dy="24">No value in exceptions</tspan></text><rect x="55" y="1070" width="650" height="155" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="55" y="1070" width="8" height="155" rx="4" fill="#4ee3a3"/><text x="83" y="1112" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">ROTATION</tspan></text><text x="83" y="1152" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Key Vault value changed</tspan><tspan x="83" dy="24">No notebook code edit</tspan></text><text x="380.0" y="1296" fill="#6f8da7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="380.0" dy="0">DATA NINJA AI LAB  •  SHAI KARMANI</tspan></text></svg>