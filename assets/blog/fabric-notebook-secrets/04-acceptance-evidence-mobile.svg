<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">Fabric notebook secret acceptance evidence</title><desc id="desc">Data Ninja AI Lab technical diagram</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b32"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="760" height="1320" fill="url(#g)"/><circle cx="680" cy="70" r="150" fill="#12335a" opacity=".22"/><circle cx="70" cy="1280" r="140" fill="#0c4b53" opacity=".18"/><text x="40" y="60" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" text-anchor="start"><tspan x="40" dy="0">ACCEPTANCE EVIDENCE</tspan></text><text x="40" y="98" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="40" dy="0">Test the boundary, not only the happy path.</tspan></text><rect x="55" y="145" width="650" height="155" rx="22" fill="#0d1b2d" stroke="#39d6ff" stroke-width="2"/><rect x="55" y="145" width="8" height="155" rx="4" fill="#39d6ff"/><text x="83" y="187" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">RUNTIME</tspan></text><text x="83" y="227" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Python runtime for putSecret</tspan><tspan x="83" dy="24">No Spark assumption</tspan></text><rect x="55" y="330" width="650" height="155" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="55" y="330" width="8" height="155" rx="4" fill="#4ee3a3"/><text x="83" y="372" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22"