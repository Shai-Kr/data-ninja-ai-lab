<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1370" viewBox="0 0 760 1370" role="img" aria-labelledby="title desc"><title id="title">Five gate review for Fabric notebook secrets</title><desc id="desc">Data Ninja AI Lab technical diagram</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b32"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="760" height="1370" fill="url(#g)"/><circle cx="680" cy="70" r="150" fill="#12335a" opacity=".22"/><circle cx="70" cy="1330" r="140" fill="#0c4b53" opacity=".18"/><text x="40" y="60" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" text-anchor="start"><tspan x="40" dy="0">FIVE GATES BEFORE</tspan><tspan x="40" dy="36">PRODUCTION</tspan></text><rect x="55" y="155" width="650" height="170" rx="22" fill="#0d1b2d" stroke="#ffca6b" stroke-width="2"/><rect x="55" y="155" width="8" height="170" rx="4" fill="#ffca6b"/><text x="83" y="197" fill="#ffca6b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">01  LIFECYCLE</tspan></text><text x="83" y="237" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Create and rotate</tspan><tspan x="83" dy="24">outside transformation</tspan></text><rect x="55" y="360" width="650" height="170" rx="22" fill="#0d1b2d" stroke="#39d6ff" stroke-width="2"/><rect x="55" y="360" width="8" height="170" rx="4" fill="#39d6ff"/><text x="83" y="402" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">02  IDENTITY</tspan></text><text x="83" y="442" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Name interactive and</tspan><tspan x="83" dy="24">scheduled identities</tspan></text><rect x="55" y="565" width="650" height="170" rx="22" fill="#0d1b2d" stroke="#568bff" stroke-width="2"/><rect x="55" y="565" width="8" height="170" rx="4" fill="#568bff"/><text x="83" y="607" fill="#568bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">03  RETRIEVAL</tspan></text><text x="83" y="647" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Fetch late and keep</tspan><tspan x="83" dy="24">the variable local</tspan></text><rect x="55" y="770" width="650" height="170" rx="22" fill="#0d1b2d" stroke="#ff7f96" stroke-width="2"/><rect x="55" y="770" width="8" height="170" rx="4" fill="#ff7f96"/><text x="83" y="812" fill="#ff7f96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">04  DISCLOSURE</tspan></text><text x="83" y="852" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Block output, files,</tspan><tspan x="83" dy="24">parameters, and logs</tspan></text><rect x="55" y="975" width="650" height="170" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="55" y="975" width="8" height="170" rx="4" fill="#4ee3a3"/><text x="83" y="1017" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="83" dy="0">05  FAILURE TEST</tspan></text><text x="83" y="1057" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Inspect every surface</tspan><tspan x="83" dy="24">with a test secret</tspan></text><rect x="55" y="1180" width="650" height="170" rx="22" fi