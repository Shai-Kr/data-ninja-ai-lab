<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Five gate review for Fabric notebook secrets</title><desc id="desc">Data Ninja AI Lab technical diagram</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b32"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="760" fill="url(#g)"/><circle cx="1120" cy="70" r="150" fill="#12335a" opacity=".22"/><circle cx="70" cy="720" r="140" fill="#0c4b53" opacity=".18"/><text x="60" y="62" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" text-anchor="start"><tspan x="60" dy="0">FIVE GATES BEFORE PRODUCTION</tspan></text><rect x="55" y="145" width="330" height="185" rx="22" fill="#0d1b2d" stroke="#ffca6b" stroke-width="2"/><rect x="55" y="145" width="8" height="185" rx="4" fill="#ffca6b"/><text x="83" y="187" fill="#ffca6b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="83" dy="0">01  LIFECYCLE</tspan></text><text x="83" y="227" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Create and rotate</tspan><tspan x="83" dy="27">outside transformation</tspan></text><rect x="435" y="145" width="330" height="185" rx="22" fill="#0d1b2d" stroke="#39d6ff" stroke-width="2"/><rect x="435" y="145" width="8" height="185" rx="4" fill="#39d6ff"/><text x="463" y="187" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="463" dy="0">02  IDENTITY</tspan></text><text x="463" y="227" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="463" dy="0">Name interactive and</tspan><tspan x="463" dy="27">scheduled identities</tspan></text><rect x="815" y="145" width="330" height="185" rx="22" fill="#0d1b2d" stroke="#568bff" stroke-width="2"/><rect x="815" y="145" width="8" height="185" rx="4" fill="#568bff"/><text x="843" y="187" fill="#568bff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="843" dy="0">03  RETRIEVAL</tspan></text><text x="843" y="227" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="843" dy="0">Fetch late and keep</tspan><tspan x="843" dy="27">the variable local</tspan></text><rect x="55" y="390" width="330" height="185" rx="22" fill="#0d1b2d" stroke="#ff7f96" stroke-width="2"/><rect x="55" y="390" width="8" height="185" rx="4" fill="#ff7f96"/><text x="83" y="432" fill="#ff7f96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="83" dy="0">04  DISCLOSURE</tspan></text><text x="83" y="472" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="83" dy="0">Block output, files,</tspan><tspan x="83" dy="27">parameters, and logs</tspan></text><rect x="435" y="390" width="330" height="185" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="435" y="390" width="8" height="185" rx="4" fill="#4ee3a3"/><text x="463" y="432" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="463" dy="0">05  FAILURE TEST</tspan></text><text x="463" y="472" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="463" dy="0">Inspect every surface</tspan><tspan x="463" dy="27">with a test secret</tspan></text><rect x="815" y="390" width="330" height="185" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="815" y="390" width="8" height="185" rx="4" fill="#4ee3a3"/><text x="843" y="432" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="843" dy="0">PASS CONDITION</tspan></text><text x="843" y="472" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="843" dy="0">Rotation needs no code edit</tspan><tspan x="843" dy="27">and failures reveal no value</tspan></text><text x="600" y="665" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Every gate produces evidence. A successful connection alone is not enough.</tspan></text><text x="600.0" y="736" fill="#6f8da7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0">DATA NINJA AI LAB  •  SHAI KARMANI</tspan></text></svg>