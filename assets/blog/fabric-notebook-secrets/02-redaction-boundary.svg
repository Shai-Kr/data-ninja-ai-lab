<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Redaction is not the security boundary</title><desc id="desc">Data Ninja AI Lab technical diagram</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b32"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="680" fill="url(#g)"/><circle cx="1120" cy="70" r="150" fill="#12335a" opacity=".22"/><circle cx="70" cy="640" r="140" fill="#0c4b53" opacity=".18"/><text x="60" y="65" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" text-anchor="start"><tspan x="60" dy="0">REDACTION HELPS. CONTROLS PROTECT.</tspan></text><rect x="65" y="145" width="470" height="365" rx="22" fill="#0d1b2d" stroke="#ffca6b" stroke-width="2"/><rect x="65" y="145" width="8" height="365" rx="4" fill="#ffca6b"/><text x="93" y="187" fill="#ffca6b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="93" dy="0">BEST-EFFORT SAFETY NET</tspan></text><text x="93" y="227" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="93" dy="0">Masks the original value</tspan><tspan x="93" dy="27">in direct notebook output</tspan><tspan x="93" dy="27"></tspan><tspan x="93" dy="27">Useful for demos and</tspan><tspan x="93" dy="27">accidental print statements</tspan><tspan x="93" dy="27"></tspan><tspan x="93" dy="27">Does not stop transformed</tspan><tspan x="93" dy="27">values, files, logs, or calls</tspan></text><rect x="665" y="145" width="470" height="365" rx="22" fill="#0d1b2d" stroke="#4ee3a3" stroke-width="2"/><rect x="665" y="145" width="8" height="365" rx="4" fill="#4ee3a3"/><text x="693" y="187" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="693" dy="0">ENFORCEABLE BOUNDARY</tspan></text><text x="693" y="227" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="693" dy="0">Key Vault permissions</tspan><tspan x="693" dy="27">workload identity</tspan><tspan x="693" dy="27"></tspan><tspan x="693" dy="27">workspace and network rules</tspan><tspan x="693" dy="27">least-privilege destination access</tspan><tspan x="693" dy="27"></tspan><tspan x="693" dy="27">code review, audit,</tspan><tspan x="693" dy="27">and failure-path tests</tspan></text><path d="M548 330 L648 330" stroke="#568bff" stroke-width="4" fill="none"/><path d="M635 322 L648 330 L635 338" fill="none" stroke="#568bff" stroke-width="4"/><text x="600" y="590" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Design as if authorized code can see plaintext, because it can.</tspan></text><text x="600.0" y="656" fill="#6f8da7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0">DATA NINJA AI LAB  •  SHAI KARMANI</tspan></text></svg>