<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Fabric notebook secret acceptance evidence</title><desc id="desc">Data Ninja AI Lab technical diagram</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b32"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="720" fill="url(#g)"/><circle cx="1120" cy="70" r="150" fill="#12335a" opacity=".22"/><circle cx="70" cy="680" r="140" fill="#0c4b53" opacity=".18"/><text x="60" y="62" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" text-anchor="start"><tspan x="60" dy="0">ACCEPTANCE EVIDENCE</tspan></text><text x="60" y="98" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start"><tspan x="60" dy="0">Test the boundary, not only the happy path.</tspan></text><rect x="55" y="145" width="1090" height="72" rx="14" fill="#0d1b2d" stroke="#25445e"/><text x="80" y="189" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start"><tspan x="80" dy="0">RUNTIME</tspan></text><text x="300" y="189" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="300" dy="0">Python runtime for putSecret</tspan></text><text x="800" y="189" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="800" dy="0">No Spark assumption</tspan></text><rect x="55" y="227" width="1090" height="72" rx="14" fill="#10243a" stroke="#25445e"/><text x="80" y="271" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start"><tspan x="80" dy="0">IDENTITY</tspan></text><text x="300" y="271" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="300" dy="0">User and scheduler named</tspan></text><text x="800" y="271" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="800" dy="0">No owner ambiguity</tspan></text><rect x="55" y="309" width="1090" height="72" rx="14" fill="#0d1b2d" stroke="#25445e"/><text x="80" y="353" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start"><tspan x="80" dy="0">PERMISSION</tspan></text><text x="300" y="353" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="300" dy="0">Read-only where possible</tspan></text><text x="800" y="353" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="800" dy="0">No broad vault role</tspan></text><rect x="55" y="391" width="1090" height="72" rx="14" fill="#10243a" stroke="#25445e"/><text x="80" y="435" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start"><tspan x="80" dy="0">OUTPUT</tspan></text><text x="300" y="435" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="300" dy="0">Notebook, pipeline, files checked</tspan></text><text x="800" y="435" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="800" dy="0">No plaintext or derivative</tspan></text><rect x="55" y="473" width="1090" height="72" rx="14" fill="#0d1b2d" stroke="#25445e"/><text x="80" y="517" fill="#39d6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start"><tspan x="80" dy="0">FAILURE</tspan></text><text x="300" y="517" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="300" dy="0">Test secret and forced error</tspan></text><text x="800" y="517" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="800" dy="0">No value in exceptions</tspan></text><rect x="55" y="555" width="1090" height="72" rx="14" fill="#10243a" stroke="#25445e"/><text x="80" y="599" fill="#4ee3a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="start"><tspan x="80" dy="0">ROTATION</tspan></text><text x="300" y="599" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="300" dy="0">Key Vault value changed</tspan></text><text x="800" y="599" fill="#a8bfd4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start"><tspan x="800" dy="0">No notebook code edit</tspan></text><text x="600" y="660" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Evidence turns a secret-handling convention into an operating control.</tspan></text><text x="600.0" y="696" fill="#6f8da7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><tspan x="600.0" dy="0">DATA NINJA AI LAB  •  SHAI KARMANI</tspan></text></svg>