<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img"><title>Find a table, then qualify it</title><rect width="640" height="820" fill="#091421"/><g font-family="Arial,sans-serif"><text x="32" y="62" fill="#66e3ff" font-size="30" font-weight="700">Find a table, then qualify it</text><rect x="28" y="105" width="584" height="170" rx="14" fill="#122738" stroke="#3e7288"/><text x="56" y="150" fill="#66e3ff" font-size="28" font-weight="700">1. Start with what you know</text><text x="56" y="193" fill="#f0f6fb" font-size="26">Table name or description</text><text x="56" y="227" fill="#f0f6fb" font-size="26">Or an exact column name</text><rect x="28" y="300" width="584" height="170" rx="14" fill="#122738" stroke="#3e7288"/><text x="56" y="345" fill="#66e3ff" font-size="28" font-weight="700">2. Find the containing table</text><text x="56" y="388" fill="#f0f6fb" font-size="26">Semantic model, lakehouse,</text><text x="56" y="422" fill="#f0f6fb" font-size="26">or mirrored database</text><rect x="28" y="495" width="584" height="170" rx="14" fill="#122738" stroke="#3e7288"/><text x="56" y="540" fill="#66e3ff" font-size="28" font-weight="700">3. Check the context</text><text x="56" y="583" fill="#f0f6fb" font-size="26">Confirm grain and ownership</text><text x="56" y="617" fill="#f0f6fb" font-size="26">Then test the intended data use</text><text x="32" y="752" fill="#c5d7e3" font-size="24">Preview rollout starts in late September.</text><text x="32" y="788" fill="#c5d7e3" font-size="24">Column matches return tables, not columns.</text></g></svg>
