<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img"><title>Discovery and use: two checks</title><rect width="640" height="820" fill="#091421"/><g font-family="Arial,sans-serif"><text x="32" y="62" fill="#66e3ff" font-size="30" font-weight="700">Discovery and use: two checks</text><rect x="28" y="105" width="584" height="170" rx="14" fill="#122738" stroke="#3e7288"/><text x="56" y="150" fill="#66e3ff" font-size="28" font-weight="700">Metadata discovery</text><text x="56" y="193" fill="#f0f6fb" font-size="26">Parent-item Read or higher</text><text x="56" y="227" fill="#f0f6fb" font-size="26">Object-search setting enabled</text><rect x="28" y="300" width="584" height="170" rx="14" fill="#122738" stroke="#3e7288"/><text x="56" y="345" fill="#66e3ff" font-size="28" font-weight="700">Data access</text><text x="56" y="388" fill="#f0f6fb" font-size="26">Workload permissions still apply</text><text x="56" y="422" fill="#f0f6fb" font-size="26">Search does not grant row access</text><rect x="28" y="495" width="584" height="170" rx="14" fill="#122738" stroke="#3e7288"/><text x="56" y="540" fill="#66e3ff" font-size="28" font-weight="700">Specific search exclusion</text><text x="56" y="583" fill="#f0f6fb" font-size="26">OLS-protected semantic models:</text><text x="56" y="617" fill="#f0f6fb" font-size="26">their tables are not surfaced</text><text x="32" y="752" fill="#c5d7e3" font-size="24">Test identities with different access levels.</text><text x="32" y="788" fill="#c5d7e3" font-size="24">Record search and query results separately.</text></g></svg>
