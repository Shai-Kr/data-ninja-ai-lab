<text x="102" y="450" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">4</text>
<text x="210.0" y="452" text-anchor="middle" fill="#33d6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Deploy + run</text>
<text x="210.0" y="492" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Ordered sets</text>
<text x="210.0" y="515" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">and actions</text>
<rect x="425" y="410" width="280" height="190" rx="18" fill="#0d1b2f" stroke="#4f8cff" stroke-width="2"/>
<circle cx="457" cy="444" r="18" fill="#4f8cff"/>
<text x="457" y="450" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">5</text>
<text x="565.0" y="452" text-anchor="middle" fill="#4f8cff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Validate</text>
<text x="565.0" y="492" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Data, security,</text>
<text x="565.0" y="515" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">performance, reports</text>
<rect x="780" y="410" width="280" height="190" rx="18" fill="#0d1b2f" stroke="#ffc857" stroke-width="2"/>
<circle cx="812" cy="444" r="18" fill="#ffc857"/>
<text x="812" y="450" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">6</text>
<text x="920.0" y="452" text-anchor="middle" fill="#ffc857" font-family="Arial,sans-serif" font-size="18" font-weight="700">Decide</text>
<text x="920.0" y="492" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Promote, stop,</text>
<text x="920.0" y="515" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">or recover</text>
<text x="600" y="690" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Release record = plan version + environment + timestamps + results + owner decision</text>
