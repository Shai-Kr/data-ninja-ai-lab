<text x="920.0" y="192" text-anchor="middle" fill="#5ee0a0" font-family="Arial,sans-serif" font-size="18" font-weight="700">Precheck</text>
<text x="920.0" y="232" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Permissions, variables,</text>
<text x="920.0" y="255" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">capacity, readiness</text>
