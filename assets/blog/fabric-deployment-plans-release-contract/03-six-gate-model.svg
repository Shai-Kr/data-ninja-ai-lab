<circle cx="457" cy="184" r="18" fill="#33d6ff"/>
<text x="457" y="190" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">2</text>
<text x="565.0" y="192" text-anchor="middle" fill="#33d6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Map</text>
<text x="565.0" y="232" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Detected and</text>
<text x="565.0" y="255" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">hidden dependencies</text>
<rect x="780" y="150" width="280" height="190" rx="18" fill="#0d1b2f" stroke="#5ee0a0" stroke-width="2"/>
