<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img">
<rect width="720" height="1320" rx="28" fill="#07111f"/>
<rect x="18" y="18" width="684" height="1284" rx="24" fill="none" stroke="#17324a" stroke-width="2"/>
<text x="360.0" y="62" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="30">Six release gates</text>
<text x="360.0" y="94" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="16">Repeatable delivery needs more than deployment</text>
<rect x="110" y="130" width="500" height="155" rx="18" fill="#0d1b2f" stroke="#4f8cff" stroke-width="2"/>
<circle cx="142" cy="164" r="18" fill="#4f8cff"/>
<text x="142" y="170" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">1</text>
<text x="360.0" y="172" text-anchor="middle" fill="#4f8cff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Inventory</text>
<text x="360.0" y="212" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Items, owners,</text>
<text x="360.0" y="235" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">environment</text>
<rect x="110" y="310" width="500" height="155" rx="18" fill="#0d1b2f" stroke="#33d6ff" stroke-width="2"/>
<circle cx="142" cy="344" r="18" fill="#33d6ff"/>
<text x="142" y="350" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">2</text>
<text x="360.0" y="352" text-anchor="middle" fill="#33d6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Map</text>
<text x="360.0" y="392" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Detected and</text>
<text x="360.0" y="415" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">hidden dependencies</text>
<rect x="110" y="490" width="500" height="155" rx="18" fill="#0d1b2f" stroke="#5ee0a0" stroke-width="2"/>
<circle cx="142" cy="524" r="18" fill="#5ee0a0"/>
<text x="142" y="530" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">3</text>
<text x="360.0" y="532" text-anchor="middle" fill="#5ee0a0" font-family="Arial,sans-serif" font-size="18" font-weight="700">Precheck</text>
<text x="360.0" y="572" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Permissions, variables,</text>
<text x="360.0" y="595" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">capacity, readiness</text>
<rect x="110" y="670" width="500" height="155" rx="18" fill="#0d1b2f" stroke="#33d6ff" stroke-width="2"/>
<circle cx="142" cy="704" r="18" fill="#33d6ff"/>
<text x="142" y="710" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">4</text>
<text x="360.0" y="712" text-anchor="middle" fill="#33d6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Deploy + run</text>
<text x="360.0" y="752" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Ordered sets</text>
<text x="360.0" y="775" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">and actions</text>
<rect x="110" y="850" width="500" height="155" rx="18" fill="#0d1b2f" stroke="#4f8cff" stroke-width="2"/>
<circle cx="142" cy="884" r="18" fill="#4f8cff"/>
<text x="142" y="890" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">5</text>
<text x="360.0" y="892" text-anchor="middle" fill="#4f8cff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Validate</text>
<text x="360.0" y="932" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Data, security,</text>
<text x="360.0" y="955" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">performance, reports</text>
<rect x="110" y="1030" width="500" height="155" rx="18" fill="#0d1b2f" stroke="#ffc857" stroke-width="2"/>
<circle cx="142" cy="1064" r="18" fill="#ffc857"/>
<text x="142" y="1070" text-anchor="middle" fill="#07111f" font-family="Arial,sans-serif" font-size="16" font-weight="700">6</text>
<text x="360.0" y="1072" text-anchor="middle" fill="#ffc857" font-family="Arial,sans-serif" font-size="18" font-weight="700">Decide</text>
<text x="360.0" y="1112" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Promote, stop,</text>
<text x="360.0" y="1135" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">or recover</text>
<rect x="70" y="1215" width="580" height="66" rx="16" fill="#10243a" stroke="#5ee0a0"/>
<text x="360" y="1255" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Keep one evidence record per run.</text>
</svg>