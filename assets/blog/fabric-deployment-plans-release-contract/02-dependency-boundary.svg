<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
<rect width="1200" height="720" rx="28" fill="#07111f"/>
<rect x="18" y="18" width="1164" height="684" rx="24" fill="none" stroke="#17324a" stroke-width="2"/>
<text x="600.0" y="62" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-weight="700" font-size="30">What Fabric can detect, and what your plan must declare</text>
<text x="600.0" y="94" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="16">Lineage is useful. Release intent is broader.</text>
<rect x="55" y="150" width="220" height="250" rx="18" fill="#0d1b2f" stroke="#5ee0a0" stroke-width="2"/>
<text x="165.0" y="192" text-anchor="middle" fill="#5ee0a0" font-family="Arial,sans-serif" font-size="18" font-weight="700">Detected dependency</text>
<text x="165.0" y="232" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Fabric item references</text>
<text x="165.0" y="255" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Known item relationships</text>
<text x="165.0" y="278" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Automatic ordering signal</text>
<rect x="345" y="150" width="220" height="250" rx="18" fill="#0d1b2f" stroke="#ffc857" stroke-width="2"/>
<text x="455.0" y="192" text-anchor="middle" fill="#ffc857" font-family="Arial,sans-serif" font-size="18" font-weight="700">Hidden dependency</text>
<text x="455.0" y="232" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Runtime state or data</text>
<text x="455.0" y="255" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Tables must exist</text>
<text x="455.0" y="278" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Reference data must be loaded</text>
<rect x="635" y="150" width="220" height="250" rx="18" fill="#0d1b2f" stroke="#33d6ff" stroke-width="2"/>
<text x="745.0" y="192" text-anchor="middle" fill="#33d6ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Operational action</text>
<text x="745.0" y="232" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Work needed between sets</text>
<text x="745.0" y="255" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Run notebook or pipeline</text>
<text x="745.0" y="278" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Hydrate or transform data</text>
<rect x="925" y="150" width="220" height="250" rx="18" fill="#0d1b2f" stroke="#4f8cff" stroke-width="2"/>
<text x="1035.0" y="192" text-anchor="middle" fill="#4f8cff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Acceptance proof</text>
<text x="1035.0" y="232" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Business-ready result</text>
<text x="1035.0" y="255" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Known-value query</text>
<text x="1035.0" y="278" text-anchor="middle" fill="#9db4c8" font-family="Arial,sans-serif" font-size="15" font-weight="400">Security and report checks</text>
<rect x="90" y="465" width="1020" height="150" rx="22" fill="#10243a" stroke="#33d6ff" stroke-width="2"/>
<text x="600" y="510" text-anchor="middle" fill="#33d6ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">The deployment plan closes the gap</text>
<text x="600" y="552" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-size="17" font-weight="400">Declare the order Fabric cannot infer. Run the action that creates the prerequisite.</text>
<text x="600" y="581" text-anchor="middle" fill="#eef8ff" font-family="Arial,sans-serif" font-size="17" font-weight="400">Stop when a gate fails. Save enough evidence to explain the result.</text>
</svg>