<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Event contract maturity</title><desc id="d">Untyped, classified, and schematized events form a contract ladder.</desc><rect width="600" height="900" rx="28" fill="#07111f"/><text x="38" y="62" fill="#eef7ff" font-family="Arial" font-size="28" font-weight="700">Choose the right contract level</text><text x="38" y="98" fill="#8eabc5" font-family="Arial" font-size="17">Progress without hiding unknown traffic.</text><g font-family="Arial"><rect x="38" y="140" width="524" height="180" rx="22" fill="#10283d" stroke="#36536d" stroke-width="2"/><text x="68" y="182" fill="#8eabc5" font-size="16" font-weight="700">UNTYPED</text><text x="68" y="224" fill="#fff" font-size="23" font-weight="700">Visible discovery</text><text x="68" y="262" fill="#b6c9da" font-size="17">No usable type contract yet</text><text x="68" y="293" fill="#ffbd69" font-size="17">Owner and deadline required</text><rect x="38" y="350" width="524" height="190" rx="22" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="68" y="392" fill="#b9a8ff" font-size="16" font-weight="700">CLASSIFIED</text><text x="68" y="434" fill="#fff" font-size="23" font-weight="700">Usable structure</text><text x="68" y="472" fill="#b6c9da" font-size="17">eventType or deviceType routing</text><text x="68" y="505" fill="#b9a8ff" font-size="17">Controlled transition</text><rect x="38" y="570" width="524" height="220" rx="22" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="68" y="612" fill="#31e6a1" font-size="16" font-weight="700">SCHEMATIZED</text><text x="68" y="654" fill="#fff" font-size="23" font-weight="700">Explicit shared contract</text><text x="68" y="692" fill="#b6c9da" font-size="17">SchemaSet + CloudEvents ce_type</text><text x="68" y="725" fill="#b6c9da" font-size="17">Versioned shape + ingress validation</text><text x="68" y="758" fill="#31e6a1" font-size="17">Producer and consumers aligned</text></g><text x="38" y="860" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
