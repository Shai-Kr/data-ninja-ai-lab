<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Event contract maturity</title><desc id="d">Untyped, classified, and schematized events form three useful levels of contract maturity.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Use the contract level your producer can own</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">Schema-aware Eventstreams supports progress without hiding unknown traffic.</text><g font-family="Arial"><rect x="70" y="205" width="300" height="275" rx="24" fill="#10283d" stroke="#36536d" stroke-width="2"/><text x="100" y="252" fill="#8eabc5" font-size="18" font-weight="700">UNTYPED</text><text x="100" y="294" fill="#fff" font-size="25" font-weight="700">Visible discovery</text><text x="100" y="340" fill="#b6c9da" font-size="18">No schema association</text><text x="100" y="374" fill="#b6c9da" font-size="18">No classifier match</text><text x="100" y="408" fill="#ffbd69" font-size="18" font-weight="700">Needs owner + deadline</text><rect x="450" y="170" width="300" height="310" rx="24" fill="#10283d" stroke="#9b7cff" stroke-width="2"/><text x="480" y="217" fill="#b9a8ff" font-size="18" font-weight="700">CLASSIFIED</text><text x="480" y="259" fill="#fff" font-size="25" font-weight="700">Usable structure</text><text x="480" y="305" fill="#b6c9da" font-size="18">eventType or deviceType</text><text x="480" y="339" fill="#b6c9da" font-size="18">Type-specific processing</text><text x="480" y="373" fill="#b6c9da" font-size="18">No registry contract yet</text><text x="480" y="425" fill="#b9a8ff" font-size="18" font-weight="700">Controlled transition</text><rect x="830" y="135" width="300" height="345" rx="24" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="860" y="182" fill="#31e6a1" font-size="18" font-weight="700">SCHEMATIZED</text><text x="860" y="224" fill="#fff" font-size="25" font-weight="700">Explicit contract</text><text x="860" y="270" fill="#b6c9da" font-size="18">Event SchemaSet</text><text x="860" y="304" fill="#b6c9da" font-size="18">CloudEvents ce_type</text><text x="860" y="338" fill="#b6c9da" font-size="18">Versioned reusable shape</text><text x="860" y="372" fill="#b6c9da" font-size="18">Validation at ingress</text><text x="860" y="425" fill="#31e6a1" font-size="18" font-weight="700">Shared producer contract</text><path d="M370 330 H432" stroke="#27d3ff" stroke-width="4"/><polygon points="444,330 424,318 424,342" fill="#27d3ff"/><path d="M750 295 H812" stroke="#31e6a1" stroke-width="4"/><polygon points="824,295 804,283 804,307" fill="#31e6a1"/><rect x="225" y="535" width="750" height="64" rx="18" fill="#0e2234" stroke="#36536d"/><text x="600" y="575" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">Maturity is useful only when identity, ownership, and evidence improve.</text></g><text x="70" y="650" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
