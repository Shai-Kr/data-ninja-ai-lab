<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">One typed routing boundary</title><desc id="d">A mixed stream is separated into type-specific processing paths.</desc><rect width="600" height="900" rx="28" fill="#07111f"/><text x="38" y="62" fill="#eef7ff" font-family="Arial" font-size="28" font-weight="700">Route by event identity</text><text x="38" y="98" fill="#8eabc5" font-family="Arial" font-size="17">One controlled boundary, clear paths.</text><g font-family="Arial"><rect x="38" y="135" width="524" height="115" rx="22" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="300" y="180" text-anchor="middle" fill="#27d3ff" font-size="16" font-weight="700">MIXED FEED</text><text x="300" y="218" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Many event shapes</text><path d="M300 250 V290" stroke="#31e6a1" stroke-width="4"/><polygon points="300,304 288,284 312,284" fill="#31e6a1"/><rect x="38" y="304" width="524" height="145" rx="22" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="300" y="348" text-anchor="middle" fill="#31e6a1" font-size="16" font-weight="700">SCHEMA-AWARE EVENTSTREAM</text><text x="300" y="391" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Registry or classifier</text><text x="300" y="423" text-anchor="middle" fill="#b6c9da" font-size="17">Identity + routing + evidence</text><rect x="38" y="485" width="252" height="130" rx="20" fill="#10283d" stroke="#31e6a1"/><text x="64" y="525" fill="#31e6a1" font-size="15" font-weight="700">THERMOSTAT</text><text x="64" y="564" fill="#fff" font-size="18">Temperature path</text><text x="64" y="591" fill="#b6c9da" font-size="15">Eventhouse</text><rect x="310" y="485" width="252" height="130" rx="20" fill="#10283d" stroke="#9b7cff"/><text x="336" y="525" fill="#b9a8ff" font-size="15" font-weight="700">OCCUPANCY</text><text x="336" y="564" fill="#fff" font-size="18">Zone-count path</text><text x="336" y="591" fill="#b6c9da" font-size="15">Lakehouse</text><rect x="38" y="640" width="252" height="130" rx="20" fill="#10283d" stroke="#27d3ff"/><text x="64" y="680" fill="#27d3ff" font-size="15" font-weight="700">ACCESS</text><text x="64" y="719" fill="#fff" font-size="18">Secure path</text><text x="64" y="746" fill="#b6c9da" font-size="15">Custom endpoint</text><rect x="310" y="640" width="252" height="130" rx="20" fill="#10283d" stroke="#ffbd69"/><text x="336" y="680" fill="#ffbd69" font-size="15" font-weight="700">UNKNOWN</text><text x="336" y="719" fill="#fff" font-size="18">Evidence path</text><text x="336" y="746" fill="#b6c9da" font-size="15">Owner workflow</text></g><text x="38" y="860" fill="#6f8ba4" font-family="Arial" font-size="14">Data Ninja AI Lab | Review visual</text></svg>
