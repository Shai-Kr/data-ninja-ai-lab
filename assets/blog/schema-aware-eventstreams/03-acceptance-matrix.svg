<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Event contract acceptance matrix</title><desc id="d">Six event cases are checked for expected routing and operational evidence.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Prove the contract before the stream becomes operational</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">Every test has an expected route, destination result, and evidence signal.</text><g font-family="Arial"><rect x="70" y="170" width="1060" height="390" rx="24" fill="#0e2234" stroke="#36536d"/><text x="100" y="215" fill="#8eabc5" font-size="17" font-weight="700">CASE</text><text x="510" y="215" fill="#8eabc5" font-size="17" font-weight="700">EXPECTED OUTCOME</text><text x="930" y="215" fill="#8eabc5" font-size="17" font-weight="700">PROOF</text><line x1="95" y1="235" x2="1105" y2="235" stroke="#36536d"/><g font-size="18"><text x="100" y="278" fill="#eef7ff">Valid registered event</text><text x="510" y="278" fill="#b6c9da">Typed route accepts it</text><text x="930" y="278" fill="#31e6a1">Destination row</text><text x="100" y="328" fill="#eef7ff">Missing classifier</text><text x="510" y="328" fill="#b6c9da">Untyped lane keeps it visible</text><text x="930" y="328" fill="#ffbd69">Untyped count</text><text x="100" y="378" fill="#eef7ff">Unknown classifier</text><text x="510" y="378" fill="#b6c9da">Owner workflow receives it</text><text x="930" y="378" fill="#ffbd69">Unknown count</text><text x="100" y="428" fill="#eef7ff">Schema violation</text><text x="510" y="428" fill="#b6c9da">Event is rejected</text><text x="930" y="428" fill="#ff8c8c">Runtime log</text><text x="100" y="478" fill="#eef7ff">Compatible change</text><text x="510" y="478" fill="#b6c9da">Existing consumers still pass</text><text x="930" y="478" fill="#31e6a1">Known answers</text><text x="100" y="528" fill="#eef7ff">Replay</text><text x="510" y="528" fill="#b6c9da">Routing remains deterministic</text><text x="930" y="528" fill="#27d3ff">Matched counts</text></g><rect x="260" y="585" width="680" height="52" rx="16" fill="#12354b" stroke="#31e6a1"/><text x="600" y="618" text-anchor="middle" fill="#31e6a1" font-size="18" font-weight="700">Release only when observed outcomes match the written contract.</text></g><text x="70" y="654" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
