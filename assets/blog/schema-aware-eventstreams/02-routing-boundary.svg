<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">One typed routing boundary</title><desc id="d">A mixed stream is separated into thermostat, occupancy, access, and unknown event paths.</desc><rect width="1200" height="675" rx="28" fill="#07111f"/><text x="70" y="82" fill="#eef7ff" font-family="Arial" font-size="38" font-weight="700">Detect event identity once, then route deliberately</text><text x="70" y="122" fill="#8eabc5" font-family="Arial" font-size="21">Each processing branch sees the fields that belong to its selected event type.</text><g font-family="Arial"><rect x="70" y="245" width="235" height="170" rx="24" fill="#10283d" stroke="#27d3ff" stroke-width="2"/><text x="187" y="293" text-anchor="middle" fill="#27d3ff" font-size="18" font-weight="700">MIXED FEED</text><text x="187" y="335" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">CloudEvents + JSON</text><text x="187" y="373" text-anchor="middle" fill="#b6c9da" font-size="17">Many event shapes</text><path d="M305 330 H385" stroke="#27d3ff" stroke-width="4"/><polygon points="397,330 377,318 377,342" fill="#27d3ff"/><rect x="397" y="205" width="255" height="250" rx="24" fill="#12354b" stroke="#31e6a1" stroke-width="3"/><text x="524" y="255" text-anchor="middle" fill="#31e6a1" font-size="17" font-weight="700">EVENTSTREAM</text><text x="524" y="300" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Schema-aware</text><text x="524" y="332" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">routing boundary</text><text x="524" y="378" text-anchor="middle" fill="#b6c9da" font-size="17">Registry or classifier</text><text x="524" y="408" text-anchor="middle" fill="#b6c9da" font-size="17">plus runtime evidence</text><path d="M652 255 H735" stroke="#31e6a1" stroke-width="3"/><path d="M652 310 H735" stroke="#9b7cff" stroke-width="3"/><path d="M652 365 H735" stroke="#27d3ff" stroke-width="3"/><path d="M652 420 H735" stroke="#ffbd69" stroke-width="3"/><rect x="735" y="185" width="395" height="75" rx="18" fill="#10283d" stroke="#31e6a1"/><text x="765" y="218" fill="#31e6a1" font-size="17" font-weight="700">THERMOSTAT</text><text x="765" y="244" fill="#b6c9da" font-size="16">Temperature filter → Eventhouse</text><rect x="735" y="280" width="395" height="75" rx="18" fill="#10283d" stroke="#9b7cff"/><text x="765" y="313" fill="#b9a8ff" font-size="17" font-weight="700">OCCUPANCY</text><text x="765" y="339" fill="#b6c9da" font-size="16">Zone counts → Lakehouse</text><rect x="735" y="375" width="395" height="75" rx="18" fill="#10283d" stroke="#27d3ff"/><text x="765" y="408" fill="#27d3ff" font-size="17" font-weight="700">ACCESS</text><text x="765" y="434" fill="#b6c9da" font-size="16">Badge events → secure endpoint</text><rect x="735" y="470" width="395" height="75" rx="18" fill="#10283d" stroke="#ffbd69"/><text x="765" y="503" fill="#ffbd69" font-size="17" font-weight="700">UNKNOWN / REJECTED</text><text x="765" y="529" fill="#b6c9da" font-size="16">Visible evidence → owner workflow</text></g><text x="70" y="650" fill="#6f8ba4" font-family="Arial" font-size="16">Data Ninja AI Lab | Review visual</text></svg>
