<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Production release gates</title><desc id="desc">Mobile checklist of six production release gates.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial"><text x="36" y="58" fill="#fff" font-size="28" font-weight="700">Six production release gates</text><text x="36" y="93" fill="#9ab8cf" font-size="17">Require evidence for every gate</text><g transform="translate(36 130)"><rect width="528" height="102" rx="17" fill="#0d2237" stroke="#1cc8ee"/><text x="22" y="33" fill="#1cc8ee" font-size="14" font-weight="700">01  CONTRACT</text><text x="22" y="67" fill="#fff" font-size="21" font-weight="700">Narrow typed capability</text><text x="22" y="91" fill="#b8cede" font-size="15">Stable name, types, handled errors</text></g><g transform="translate(36 248)"><rect width="528" height="102" rx="17" fill="#0d2237" stroke="#56e0a7"/><text x="22" y="33" fill="#56e0a7" font-size="14" font-weight="700">02  IDENTITY</text><text x="22" y="67" fill="#fff" font-size="21" font-weight="700">Least privilege</text><text x="22" y="91" fill="#b8cede" font-size="15">Caller and downstream access tested</text></g><g transform="translate(36 366)"><rect width="528" height="102" rx="17" fill="#0d2237" stroke="#a489ff"/><text x="22" y="33" fill="#b9a8ff" font-size="14" font-weight="700">03  WORKLOAD</text><text x="22" y="67" fill="#fff" font-size="21" font-weight="700">Bounded execution</text><text x="22" y="91" fill="#b8cede" font-size="15">Known rows, side effects, materialization</text></g><g transform="translate(36 484)"><rect width="528" height="102" rx="17" fill="#0d2237" stroke="#ffb55c"/><text x="22" y="33" fill="#ffbe70" font-size="14" font-weight="700">04  LIMITS</text><text x="22" y="67" fill="#fff" font-size="21" font-weight="700">Operating budget</text><text x="22" y="91" fill="#b8cede" font-size="15">Latency, payload, timeout, retry</text></g><g transform="translate(36 602)"><rect width="528" height="102" rx="17" fill="#0d2237" stroke="#6ae7ff"/><text x="22" y="33" fill="#6ae7ff" font-size="14" font-weight="700">05  TESTS</text><text x="22" y="67" fill="#fff" font-size="21" font-weight="700">Known-answer harness</text><text x="22" y="91" fill="#b8cede" font-size="15">Normal, edge, duplicate, timeout, auth</text></g><g transform="translate(36 720)"><rect width="528" height="102" rx="17" fill="#0d2237" stroke="#f16fd4"/><text x="22" y="33" fill="#f58cdd" font-size="14" font-weight="700">06  EVIDENCE</text><text x="22" y="67" fill="#fff" font-size="21" font-weight="700">Observable release</text><text x="22" y="91" fill="#b8cede" font-size="15">Invocation, version, latency, rollback</text></g><text x="300" y="865" fill="#d9f8ff" font-size="15" text-anchor="middle">All six gates need named evidence</text></g></svg>
