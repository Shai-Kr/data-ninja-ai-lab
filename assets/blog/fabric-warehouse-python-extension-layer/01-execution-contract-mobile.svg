<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Warehouse to Python execution contract</title><desc id="desc">Mobile diagram of the controlled execution path.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial"><text x="36" y="62" fill="#fff" font-size="29" font-weight="700">Controlled Python extension</text><text x="36" y="98" fill="#9ab8cf" font-size="17">Four explicit boundaries</text><g transform="translate(36 140)"><rect width="528" height="120" rx="18" fill="#0d2237" stroke="#1cc8ee" stroke-width="2"/><text x="24" y="37" fill="#1cc8ee" font-size="15" font-weight="700">01  T-SQL CALL</text><text x="24" y="73" fill="#fff" font-size="22" font-weight="700">Known rows and bounded scope</text><text x="24" y="101" fill="#b8cede" font-size="16">SELECT, INSERT, or UPDATE</text></g><g transform="translate(36 284)"><rect width="528" height="120" rx="18" fill="#0d2237" stroke="#6ae7ff" stroke-width="2"/><text x="24" y="37" fill="#6ae7ff" font-size="15" font-weight="700">02  SQL PROXY</text><text x="24" y="73" fill="#fff" font-size="22" font-weight="700">Stable name and typed return</text><text x="24" y="101" fill="#b8cede" font-size="16">AS EXTERNAL FUNCTION</text></g><g transform="translate(36 428)"><rect width="528" height="120" rx="18" fill="#0d2237" stroke="#a489ff" stroke-width="2"/><text x="24" y="37" fill="#b9a8ff" font-size="15" font-weight="700">03  PYTHON RUNTIME</text><text x="24" y="73" fill="#fff" font-size="22" font-weight="700">Published and versioned function</text><text x="24" y="101" fill="#b8cede" font-size="16">Typed implementation and handled errors</text></g><g transform="translate(36 572)"><rect width="528" height="120" rx="18" fill="#0d2237" stroke="#56e0a7" stroke-width="2"/><text x="24" y="37" fill="#56e0a7" font-size="15" font-weight="700">04  CONTROLLED DEPENDENCY</text><text x="24" y="73" fill="#fff" font-size="22" font-weight="700">Fabric, Azure, API, or package</text><text x="24" y="101" fill="#b8cede" font-size="16">Least privilege and explicit side effects</text></g><rect x="36" y="738" width="528" height="112" rx="18" fill="#0b1c2e" stroke="#29465e"/><text x="58" y="775" fill="#fff" font-size="18" font-weight="700">Production contract</text><text x="58" y="808" fill="#a9c3d6" font-size="15">Types • identity • latency • errors</text><text x="58" y="835" fill="#a9c3d6" font-size="15">version • invocation evidence</text></g></svg>
