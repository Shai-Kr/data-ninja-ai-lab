<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Workload fit decision model</title><desc id="desc">Four workload patterns for using Python from Fabric Warehouse.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient></defs><rect width="1200" height="675" rx="30" fill="url(#bg)"/><g font-family="Inter,Arial"><text x="70" y="82" fill="#fff" font-size="36" font-weight="700">Choose the execution pattern by workload shape</text><text x="70" y="121" fill="#9ab8cf" font-size="20">Python adds capability. The call pattern controls cost and reliability.</text><g transform="translate(70 178)"><rect width="510" height="175" rx="22" fill="#0d2237" stroke="#1cc8ee" stroke-width="2"/><text x="28" y="43" fill="#1cc8ee" font-size="16" font-weight="700">INTERACTIVE LOOKUP</text><text x="28" y="80" fill="#fff" font-size="25" font-weight="700">Small input, fast answer</text><text x="28" y="115" fill="#b8cede" font-size="17">Parsing • validation • reference lookup</text><text x="28" y="145" fill="#7fe8ff" font-size="16">Use in a bounded query path</text></g><g transform="translate(620 178)"><rect width="510" height="175" rx="22" fill="#0d2237" stroke="#56e0a7" stroke-width="2"/><text x="28" y="43" fill="#56e0a7" font-size="16" font-weight="700">BOUNDED WRITE</text><text x="28" y="80" fill="#fff" font-size="25" font-weight="700">Enrich once, persist result</text><text x="28" y="115" fill="#b8cede" font-size="17">Known row set • reusable output</text><text x="28" y="145" fill="#8df1bd" font-size="16">Batch up to 900 calls when supported</text></g><g transform="translate(70 388)"><rect width="510" height="175" rx="22" fill="#0d2237" stroke="#a489ff" stroke-width="2"/><text x="28" y="43" fill="#b9a8ff" font-size="16" font-weight="700">BATCH MATERIALIZATION</text><text x="28" y="80" fill="#fff" font-size="25" font-weight="700">Large set, repeatable output</text><text x="28" y="115" fill="#b8cede" font-size="17">Process away from report readers</text><text x="28" y="145" fill="#c9bdff" font-size="16">Store the result for broad reuse</text></g><g transform="translate(620 388)"><rect width="510" height="175" rx="22" fill="#0d2237" stroke="#ffb55c" stroke-width="2"/><text x="28" y="43" fill="#ffbe70" font-size="16" font-weight="700">APPLICATION WORKFLOW</text><text x="28" y="80" fill="#fff" font-size="25" font-weight="700">Side effects need ownership</text><text x="28" y="115" fill="#b8cede" font-size="17">Retries • delivery state • orchestration</text><text x="28" y="145" fill="#ffd19a" font-size="16">Use an app, event, or pipeline</text></g><rect x="70" y="600" width="1060" height="34" rx="12" fill="#122c42"/><text x="600" y="623" fill="#d9f8ff" font-size="16" text-anchor="middle">Decision rule: keep remote work bounded, observable, and reusable</text></g></svg>
