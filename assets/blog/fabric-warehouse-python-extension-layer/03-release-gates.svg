<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Production release gates</title><desc id="desc">Six release gates for external Python functions in Fabric Warehouse.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient></defs><rect width="1200" height="675" rx="30" fill="url(#bg)"/><g font-family="Inter,Arial"><text x="70" y="82" fill="#fff" font-size="36" font-weight="700">Six gates before the function enters a query path</text><text x="70" y="121" fill="#9ab8cf" font-size="20">A remote runtime deserves a real release contract</text><g font-size="16"><g transform="translate(70 178)"><rect width="330" height="155" rx="20" fill="#0d2237" stroke="#1cc8ee"/><text x="24" y="38" fill="#1cc8ee" font-weight="700">01  CONTRACT</text><text x="24" y="76" fill="#fff" font-size="22" font-weight="700">Narrow typed capability</text><text x="24" y="110" fill="#b8cede">Stable name, inputs, return type</text><text x="24" y="136" fill="#b8cede">and handled business errors</text></g><g transform="translate(435 178)"><rect width="330" height="155" rx="20" fill="#0d2237" stroke="#56e0a7"/><text x="24" y="38" fill="#56e0a7" font-weight="700">02  IDENTITY</text><text x="24" y="76" fill="#fff" font-size="22" font-weight="700">Least privilege</text><text x="24" y="110" fill="#b8cede">Caller and downstream access</text><text x="24" y="136" fill="#b8cede">are documented and tested</text></g><g transform="translate(800 178)"><rect width="330" height="155" rx="20" fill="#0d2237" stroke="#a489ff"/><text x="24" y="38" fill="#b9a8ff" font-weight="700">03  WORKLOAD</text><text x="24" y="76" fill="#fff" font-size="22" font-weight="700">Bounded execution</text><text x="24" y="110" fill="#b8cede">Known rows, side effects, and</text><text x="24" y="136" fill="#b8cede">materialization strategy</text></g><g transform="translate(70 370)"><rect width="330" height="155" rx="20" fill="#0d2237" stroke="#ffb55c"/><text x="24" y="38" fill="#ffbe70" font-weight="700">04  LIMITS</text><text x="24" y="76" fill="#fff" font-size="22" font-weight="700">Operating budget</text><text x="24" y="110" fill="#b8cede">Latency, payload, response,</text><text x="24" y="136" fill="#b8cede">timeout, and retry boundaries</text></g><g transform="translate(435 370)"><rect width="330" height="155" rx="20" fill="#0d2237" stroke="#6ae7ff"/><text x="24" y="38" fill="#6ae7ff" font-weight="700">05  TESTS</text><text x="24" y="76" fill="#fff" font-size="22" font-weight="700">Known-answer harness</text><text x="24" y="110" fill="#b8cede">Normal, edge, duplicate,</text><text x="24" y="136" fill="#b8cede">timeout, and auth cases</text></g><g transform="translate(800 370)"><rect width="330" height="155" rx="20" fill="#0d2237" stroke="#f16fd4"/><text x="24" y="38" fill="#f58cdd" font-weight="700">06  EVIDENCE</text><text x="24" y="76" fill="#fff" font-size="22" font-weight="700">Observable release</text><text x="24" y="110" fill="#b8cede">Invocation ID, errors, version,</text><text x="24" y="136" fill="#b8cede">latency, and rollback path</text></g></g><rect x="70" y="568" width="1060" height="52" rx="14" fill="#122c42"/><text x="600" y="601" fill="#d9f8ff" font-size="18" text-anchor="middle">Release only when all six gates have named evidence</text></g></svg>
