<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">Workload fit decision model</title><desc id="desc">Mobile workload decision cards.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial"><text x="36" y="60" fill="#fff" font-size="28" font-weight="700">Choose by workload shape</text><text x="36" y="95" fill="#9ab8cf" font-size="17">Keep remote work bounded</text><g transform="translate(36 132)"><rect width="528" height="145" rx="18" fill="#0d2237" stroke="#1cc8ee" stroke-width="2"/><text x="24" y="36" fill="#1cc8ee" font-size="14" font-weight="700">INTERACTIVE LOOKUP</text><text x="24" y="72" fill="#fff" font-size="22" font-weight="700">Small input, fast answer</text><text x="24" y="105" fill="#b8cede" font-size="16">Parsing • validation • reference lookup</text><text x="24" y="130" fill="#7fe8ff" font-size="15">Bounded query path</text></g><g transform="translate(36 299)"><rect width="528" height="145" rx="18" fill="#0d2237" stroke="#56e0a7" stroke-width="2"/><text x="24" y="36" fill="#56e0a7" font-size="14" font-weight="700">BOUNDED WRITE</text><text x="24" y="72" fill="#fff" font-size="22" font-weight="700">Enrich once, persist result</text><text x="24" y="105" fill="#b8cede" font-size="16">Known row set • reusable output</text><text x="24" y="130" fill="#8df1bd" font-size="15">Batch when supported</text></g><g transform="translate(36 466)"><rect width="528" height="145" rx="18" fill="#0d2237" stroke="#a489ff" stroke-width="2"/><text x="24" y="36" fill="#b9a8ff" font-size="14" font-weight="700">BATCH MATERIALIZATION</text><text x="24" y="72" fill="#fff" font-size="22" font-weight="700">Large set, reusable output</text><text x="24" y="105" fill="#b8cede" font-size="16">Process away from report readers</text><text x="24" y="130" fill="#c9bdff" font-size="15">Store for broad reuse</text></g><g transform="translate(36 633)"><rect width="528" height="145" rx="18" fill="#0d2237" stroke="#ffb55c" stroke-width="2"/><text x="24" y="36" fill="#ffbe70" font-size="14" font-weight="700">APPLICATION WORKFLOW</text><text x="24" y="72" fill="#fff" font-size="22" font-weight="700">Side effects need ownership</text><text x="24" y="105" fill="#b8cede" font-size="16">Retries • state • orchestration</text><text x="24" y="130" fill="#ffd19a" font-size="15">Use an app, event, or pipeline</text></g><rect x="36" y="816" width="528" height="50" rx="14" fill="#122c42"/><text x="300" y="848" fill="#d9f8ff" font-size="15" text-anchor="middle">Bounded • observable • reusable</text></g></svg>
