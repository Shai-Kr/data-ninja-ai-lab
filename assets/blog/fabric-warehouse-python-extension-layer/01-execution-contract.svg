<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Warehouse to Python execution contract</title>
  <desc id="desc">A four-stage architecture showing a T-SQL statement, typed proxy function, Fabric User Data Functions runtime, and controlled dependency.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <text x="70" y="86" fill="#f4fbff" font-family="Inter,Arial" font-size="36" font-weight="700">A controlled Python extension layer for Fabric Warehouse</text>
  <text x="70" y="126" fill="#9ab8cf" font-family="Inter,Arial" font-size="20">Make every remote boundary explicit in the contract</text>
  <g font-family="Inter,Arial">
    <g transform="translate(70 205)"><rect width="235" height="240" rx="22" fill="#0d2237" stroke="#1cc8ee" stroke-width="2"/><text x="26" y="48" fill="#1cc8ee" font-size="16" font-weight="700">01  T-SQL CALL</text><text x="26" y="92" fill="#fff" font-size="23" font-weight="700">SELECT / UPDATE</text><text x="26" y="128" fill="#b8cede" font-size="17">Known input rows</text><text x="26" y="158" fill="#b8cede" font-size="17">Bounded query scope</text><rect x="26" y="184" width="183" height="30" rx="9" fill="#153a54"/><text x="40" y="205" fill="#d9f8ff" font-family="monospace" font-size="14">dbo.normalize(x)</text></g>
    <g transform="translate(355 205)"><rect width="235" height="240" rx="22" fill="#0d2237" stroke="#6ae7ff" stroke-width="2"/><text x="26" y="48" fill="#6ae7ff" font-size="16" font-weight="700">02  SQL PROXY</text><text x="26" y="92" fill="#fff" font-size="23" font-weight="700">Typed contract</text><text x="26" y="128" fill="#b8cede" font-size="17">Stable schema and name</text><text x="26" y="158" fill="#b8cede" font-size="17">Explicit return type</text><rect x="26" y="184" width="183" height="30" rx="9" fill="#153a54"/><text x="40" y="205" fill="#d9f8ff" font-family="monospace" font-size="13">AS EXTERNAL FUNCTION</text></g>
    <g transform="translate(640 205)"><rect width="235" height="240" rx="22" fill="#0d2237" stroke="#a489ff" stroke-width="2"/><text x="26" y="48" fill="#b9a8ff" font-size="16" font-weight="700">03  PYTHON RUNTIME</text><text x="26" y="92" fill="#fff" font-size="23" font-weight="700">Published function</text><text x="26" y="128" fill="#b8cede" font-size="17">Typed implementation</text><text x="26" y="158" fill="#b8cede" font-size="17">Handled errors</text><rect x="26" y="184" width="183" height="30" rx="9" fill="#312858"/><text x="43" y="205" fill="#eee9ff" font-family="monospace" font-size="14">@udf.function()</text></g>
    <g transform="translate(925 205)"><rect width="205" height="240" rx="22" fill="#0d2237" stroke="#56e0a7" stroke-width="2"/><text x="24" y="48" fill="#56e0a7" font-size="16" font-weight="700">04  DEPENDENCY</text><text x="24" y="92" fill="#fff" font-size="22" font-weight="700">Controlled access</text><text x="24" y="128" fill="#b8cede" font-size="16">Fabric or Azure</text><text x="24" y="158" fill="#b8cede" font-size="16">API or package</text><rect x="24" y="184" width="157" height="30" rx="9" fill="#174337"/><text x="39" y="205" fill="#ddfff1" font-size="14">Least privilege</text></g>
    <path d="M305 325H346M590 325H631M875 325H916" stroke="#52d9f5" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="325" cy="325" r="6" fill="#52d9f5"/><circle cx="610" cy="325" r="6" fill="#52d9f5"/><circle cx="895" cy="325" r="6" fill="#52d9f5"/>
    <rect x="70" y="505" width="1060" height="92" rx="18" fill="#0b1c2e" stroke="#29465e"/><text x="100" y="545" fill="#f4fbff" font-size="20" font-weight="700">Production contract</text><text x="100" y="576" fill="#a9c3d6" font-size="17">Identity • input and output types • latency budget • side effects • errors • version • invocation evidence</text>
  </g>
</svg>
