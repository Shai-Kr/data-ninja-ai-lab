<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Scheduled User Data Functions loop</title><desc id="desc">Fabric function, schedule, job run, action, and monitoring loop.</desc><rect width="720" height="760" rx="34" fill="#07111f"/><rect x="34" y="34" width="652" height="692" rx="28" fill="#0b1527" stroke="#1d355a"/><text x="62" y="92" fill="#e6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Recurring logic stays in Fabric</text><text x="64" y="130" fill="#8fb3d9" font-family="Arial, sans-serif" font-size="20">Function, schedule, monitoring, and action in one operating loop.</text><g font-family="Arial, sans-serif"><rect x="86" y="184" width="548" height="74" rx="20" fill="#10233d" stroke="#20d9ff"/><text x="122" y="230" fill="#e6f7ff" font-size="26" font-weight="700">1. User Data Function</text><rect x="86" y="294" width="548" height="74" rx="20" fill="#10233d" stroke="#4fd1c5"/><text x="122" y="340" fill="#e6f7ff" font-size="26" font-weight="700">2. Schedule with parameters</text><rect x="86" y="404" width="548" height="74" rx="20" fill="#10233d" stroke="#a78bfa"/><text x="122" y="450" fill="#e6f7ff" font-size="26" font-weight="700">3. Automatic job run</text><rect x="86" y="514" width="548" height="74" rx="20" fill="#10233d" stroke="#f59e0b"/><text x="122" y="560" fill="#e6f7ff" font-size="26" font-weight="700">4. Validate, sync, notify</text></g><path d="M360 258 V294 M360 368 V404 M360 478 V514" stroke="#20d9ff" stroke-width="5" stroke-linecap="round"/><rect x="76" y="638" width="568" height="58" rx="24" fill="#132846" stroke="#284d78"/><text x="360" y="674" fill="#e6f7ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">Less hidden glue code. More visible ownership.</text></svg>