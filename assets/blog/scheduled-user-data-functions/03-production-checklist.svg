<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Production checklist for scheduled Fabric functions</title><desc id="desc">A checklist for operating scheduled User Data Functions.</desc><rect width="1200" height="720" rx="38" fill="#07111f"/><rect x="54" y="48" width="1092" height="624" rx="30" fill="#0b1527" stroke="#1d355a"/><text x="88" y="112" fill="#e6f7ff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Before the first scheduled run</text><text x="90" y="154" fill="#8fb3d9" font-family="Arial, sans-serif" font-size="22">Treat the schedule like production automation, not a convenience checkbox.</text><g font-family="Arial, sans-serif" font-size="23"><g fill="#10233d" stroke="#274b73"><rect x="108" y="222" width="455" height="76" rx="20"/><rect x="638" y="222" width="455" height="76" rx="20"/><rect x="108" y="326" width="455" height="76" rx="20"/><rect x="638" y="326" width="455" height="76" rx="20"/><rect x="108" y="430" width="455" height="76" rx="20"/><rect x="638" y="430" width="455" height="76" rx="20"/></g><g fill="#20d9ff" font-weight="700"><text x="140" y="269">01</text><text x="670" y="269">02</text><text x="140" y="373">03</text><text x="670" y="373">04</text><text x="140" y="477">05</text><text x="670" y="477">06</text></g><g fill="#e6f7ff"><text x="190" y="269">Clear owner and support path</text><text x="720" y="269">Parameters documented</text><text x="190" y="373">Idempotency checked</text><text x="720" y="373">Failure behavior known</text><text x="190" y="477">Monitoring reviewed</text><text x="720" y="477">Downstream effects tested</text></g></g><rect x="168" y="574" width="864" height="56" rx="28" fill="#132846" stroke="#20d9ff"/><text x="600" y="610" fill="#e6f7ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">A recurring job is an operational promise. Write down what happens when it runs.</text></svg>