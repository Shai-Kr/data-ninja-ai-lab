<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Scheduled function production checklist</title><desc id="desc">Six checks for scheduled User Data Functions.</desc><rect width="720" height="760" rx="34" fill="#07111f"/><rect x="34" y="34" width="652" height="692" rx="28" fill="#0b1527" stroke="#1d355a"/><text x="62" y="92" fill="#e6f7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Before the first run</text><text x="64" y="130" fill="#8fb3d9" font-family="Arial, sans-serif" font-size="20">A scheduled job is an operational promise.</text><g font-family="Arial, sans-serif"><g fill="#10233d" stroke="#274b73"><rect x="78" y="186" width="564" height="58" rx="18"/><rect x="78" y="270" width="564" height="58" rx="18"/><rect x="78" y="354" width="564" height="58" rx="18"/><rect x="78" y="438" width="564" height="58" rx="18"/><rect x="78" y="522" width="564" height="58" rx="18"/><rect x="78" y="606" width="564" height="58" rx="18"/></g><g fill="#20d9ff" font-size="22" font-weight="700"><text x="108" y="223">01</text><text x="108" y="307">02</text><text x="108" y="391">03</text><text x="108" y="475">04</text><text x="108" y="559">05</text><text x="108" y="643">06</text></g><g fill="#e6f7ff" font-size="23"><text x="162" y="223">Clear owner and support path</text><text x="162" y="307">Parameters documented</text><text x="162" y="391">Idempotency checked</text><text x="162" y="475">Failure behavior known</text><text x="162" y="559">Monitoring reviewed</text><text x="162" y="643">Downstream effects tested</text></g></g></svg>