<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Where scheduled functions fit</title><desc id="desc">A decision map showing good and poor uses for scheduled User Data Functions.</desc><rect width="1200" height="720" rx="38" fill="#07111f"/><rect x="52" y="52" width="1096" height="616" rx="30" fill="#0b1527" stroke="#1d355a"/><text x="82" y="112" fill="#e6f7ff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Use the schedule for small, owned business logic</text><text x="84" y="154" fill="#8fb3d9" font-family="Arial, sans-serif" font-size="22">Not every recurring task belongs here. The boundary is the architecture.</text><g font-family="Arial, sans-serif"><rect x="96" y="220" width="465" height="330" rx="28" fill="#0f2a2c" stroke="#31d0aa"/><text x="132" y="274" fill="#ccfff2" font-size="30" font-weight="700">Good fit</text><text x="132" y="328" fill="#dffcf7" font-size="22">Data validation rules</text><text x="132" y="370" fill="#dffcf7" font-size="22">Reference data synchronization</text><text x="132" y="412" fill="#dffcf7" font-size="22">Operational notifications</text><text x="132" y="454" fill="#dffcf7" font-size="22">Business event generation</text><text x="132" y="496" fill="#dffcf7" font-size="22">Small API-backed actions</text><rect x="638" y="220" width="465" height="330" rx="28" fill="#2a1831" stroke="#e879f9"/><text x="674" y="274" fill="#fae8ff" font-size="30" font-weight="700">Use another pattern</text><text x="674" y="328" fill="#f7d6ff" font-size="22">Large transformations</text><text x="674" y="370" fill="#f7d6ff" font-size="22">Long orchestration chains</text><text x="674" y="412" fill="#f7d6ff" font-size="22">Heavy Spark workloads</text><text x="674" y="454" fill="#f7d6ff" font-size="22">Unclear ownership</text><text x="674" y="496" fill="#f7d6ff" font-size="22">Manual approval workflows</text></g><rect x="250" y="596" width="700" height="48" rx="24" fill="#10233d" stroke="#20d9ff"/><text x="600" y="627" fill="#e6f7ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">Rule of thumb: schedule logic when the function is the product, not a hidden script.</text></svg>