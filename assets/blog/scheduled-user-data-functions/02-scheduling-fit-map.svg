<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Scheduled function fit map</title><desc id="desc">Good uses and cases that need a broader orchestration pattern.</desc><rect width="720" height="760" rx="34" fill="#07111f"/><rect x="34" y="34" width="652" height="692" rx="28" fill="#0b1527" stroke="#1d355a"/><text x="62" y="92" fill="#e6f7ff" font-family="Arial, sans-serif" font-size="33" font-weight="700">Use the schedule with intent</text><text x="64" y="130" fill="#8fb3d9" font-family="Arial, sans-serif" font-size="20">The boundary is the architecture, not the timer.</text><g font-family="Arial, sans-serif"><rect x="74" y="188" width="572" height="212" rx="26" fill="#0f2a2c" stroke="#31d0aa"/><text x="106" y="240" fill="#ccfff2" font-size="30" font-weight="700">Good fit</text><text x="106" y="286" fill="#dffcf7" font-size="22">Validation rules, notifications,</text><text x="106" y="322" fill="#dffcf7" font-size="22">small sync jobs, business events,</text><text x="106" y="358" fill="#dffcf7" font-size="22">and reusable logic with one owner.</text><rect x="74" y="438" width="572" height="188" rx="26" fill="#2a1831" stroke="#e879f9"/><text x="106" y="490" fill="#fae8ff" font-size="30" font-weight="700">Use another pattern</text><text x="106" y="536" fill="#f7d6ff" font-size="22">Large transformations, long chains,</text><text x="106" y="572" fill="#f7d6ff" font-size="22">heavy Spark work, or workflows that</text><text x="106" y="608" fill="#f7d6ff" font-size="22">need manual approval before running.</text></g><rect x="74" y="662" width="572" height="46" rx="23" fill="#10233d" stroke="#20d9ff"/><text x="360" y="692" fill="#e6f7ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700">Schedule logic when the function is the product.</text></svg>