<svg xmlns="http://www.w3.org/2000/svg" width="390" height="820" viewBox="0 0 390 820">
<rect width="390" height="820" fill="#06101f"/>
<circle cx="335" cy="80" r="125" fill="#00d4ff" opacity="0.12"/>
<circle cx="35" cy="780" r="140" fill="#6d5dfc" opacity="0.13"/>
<rect x="14" y="14" width="362" height="792" rx="22" fill="#0b1426" stroke="#2fc7ff" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="30" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#f4fbff">Fabric Runtime Release</text>
<text x="30" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#f4fbff">Channels</text>
<text x="30" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#b9d7ee">Test Spark runtime changes before</text>
<text x="30" y="157" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#b9d7ee">they become the default.</text>
<rect x="30" y="206" width="330" height="98" rx="15" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="48" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#ffffff">Default channel</text>
<text x="48" y="264" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">Current production runtime for</text>
<text x="48" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">Fabric Spark workloads.</text>
<rect x="30" y="328" width="330" height="98" rx="15" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="48" y="359" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#ffffff">Early access</text>
<text x="48" y="386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">Upcoming runtime with library,</text>
<text x="48" y="406" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">dependency, security, and OS</text>
<rect x="30" y="450" width="330" height="98" rx="15" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="48" y="481" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#ffffff">Validation window</text>
<text x="48" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">Run real jobs in dev or staging</text>
<text x="48" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">before promotion.</text>
<rect x="30" y="572" width="330" height="98" rx="15" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="48" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#ffffff">Promotion cycle</text>
<text x="48" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">Early access becomes default, then</text>
<text x="48" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#bfe7f8">a new channel opens.</text>
<text x="30" y="760" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#7ee7ff">Treat runtime updates like a release</text>
<text x="30" y="782" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#7ee7ff">process.</text>
</svg>