<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#06101f"/>
<circle cx="1080" cy="120" r="240" fill="#00d4ff" opacity="0.10"/>
<circle cx="120" cy="650" r="260" fill="#6d5dfc" opacity="0.12"/>
<rect x="54" y="48" width="1172" height="624" rx="34" fill="#0b1426" stroke="#1e88ff" stroke-opacity="0.45" stroke-width="2"/>
<text x="84" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#f4fbff">Fabric Runtime Release Channels</text>
<text x="84" y="158" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#b9d7ee">A cleaner way to validate Spark changes before they become default</text>
<rect x="84" y="220" width="500" height="126" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.55"/>
<text x="112" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#ffffff">Default channel</text>
<text x="112" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">Production runtime used unless a workload</text>
<text x="112" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">opts into early access.</text>
<rect x="644" y="220" width="500" height="126" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.55"/>
<text x="672" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#ffffff">Early access channel</text>
<text x="672" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">Upcoming runtime, library, dependency,</text>
<text x="672" y="324" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">security, and OS changes.</text>
<rect x="84" y="390" width="500" height="126" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.55"/>
<text x="112" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#ffffff">Validation window</text>
<text x="112" y="466" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">Run representative jobs in dev or staging</text>
<text x="112" y="494" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">before promotion.</text>
<rect x="644" y="390" width="500" height="126" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.55"/>
<text x="672" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#ffffff">Promotion cycle</text>
<text x="672" y="466" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">Early access becomes the next default, then</text>
<text x="672" y="494" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#bfe7f8">a new channel opens.</text>
<text x="84" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#7ee7ff">Treat runtime updates like a release process, not background weather.</text>
</svg>