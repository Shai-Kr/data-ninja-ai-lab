<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180">
<rect width="720" height="1180" fill="#06101f"/>
<circle cx="620" cy="110" r="210" fill="#00d4ff" opacity="0.12"/>
<circle cx="70" cy="1110" r="240" fill="#6d5dfc" opacity="0.13"/>
<rect x="28" y="28" width="664" height="1124" rx="30" fill="#0b1426" stroke="#2fc7ff" stroke-opacity="0.5" stroke-width="2"/>
<text x="58" y="88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="800" fill="#f4fbff">Fabric Runtime Release</text>
<text x="58" y="131" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="800" fill="#f4fbff">Channels</text>
<text x="58" y="183" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#b9d7ee">Test Spark runtime changes before they</text>
<text x="58" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#b9d7ee">become the default.</text>
<rect x="58" y="298" width="604" height="145" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="90" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="760" fill="#ffffff">Default channel</text>
<text x="90" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">Current production runtime for Fabric</text>
<text x="90" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">Spark workloads.</text>
<rect x="58" y="483" width="604" height="145" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="90" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="760" fill="#ffffff">Early access</text>
<text x="90" y="572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">Upcoming runtime with library,</text>
<text x="90" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">dependency, security, and OS updates.</text>
<rect x="58" y="668" width="604" height="145" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="90" y="715" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="760" fill="#ffffff">Validation window</text>
<text x="90" y="757" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">Run real jobs in dev or staging before</text>
<text x="90" y="788" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">promotion.</text>
<rect x="58" y="853" width="604" height="145" rx="22" fill="#0f213b" stroke="#2fc7ff" stroke-opacity="0.58"/>
<text x="90" y="900" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="760" fill="#ffffff">Promotion cycle</text>
<text x="90" y="942" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">Early access becomes default, then a new</text>
<text x="90" y="973" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#bfe7f8">channel opens.</text>
<text x="58" y="1080" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#7ee7ff">Treat runtime updates like a release</text>
<text x="58" y="1114" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#7ee7ff">process, not background weather.</text>
</svg>