<rect x="848.0" y="414" width="340" height="150" rx="24" fill="#111c2e" stroke="#60a5fa" stroke-opacity="0.65"/>
<rect x="870.0" y="436" width="52" height="52" rx="16" fill="#60a5fa" opacity="0.22"/>
<text x="936.0" y="468" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Fallback</text>
<text x="876.0" y="516" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">What happens when the source</text>
<text x="876.0" y="544" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">changes?</text>
