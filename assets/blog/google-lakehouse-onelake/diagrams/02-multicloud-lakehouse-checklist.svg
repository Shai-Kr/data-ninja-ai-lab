<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#07111a"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<circle cx="1050" cy="120" r="220" fill="#0ea5e9" opacity="0.12"/>
<circle cx="170" cy="650" r="260" fill="#7c3aed" opacity="0.14"/>
<rect x="52" y="52" width="1176" height="616" rx="34" fill="#0f172a" opacity="0.72" stroke="#334155"/>
<text x="92" y="120" fill="#e5f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">The checklist before connecting another lakehouse</text>
<text x="94" y="168" fill="#a7c4dd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Multi-cloud access is valuable only when teams know what they are trusting.</text>
