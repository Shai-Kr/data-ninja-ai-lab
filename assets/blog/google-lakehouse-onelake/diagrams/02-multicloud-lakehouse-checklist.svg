<rect x="92.0" y="230" width="340" height="150" rx="24" fill="#111c2e" stroke="#38bdf8" stroke-opacity="0.65"/>
<rect x="114.0" y="252" width="52" height="52" rx="16" fill="#38bdf8" opacity="0.22"/>
<text x="180.0" y="284" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Ownership</text>
<text x="120.0" y="332" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Who owns the source catalog and</text>
<text x="120.0" y="360" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">tables?</text>
</g>
<g filter="url(#shadow)">
