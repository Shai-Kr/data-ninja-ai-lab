<rect x="492.0" y="252" width="52" height="52" rx="16" fill="#a78bfa" opacity="0.22"/>
<text x="558.0" y="284" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Freshness</text>
<text x="498.0" y="332" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">What latency should consumers</text>
<text x="498.0" y="360" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">expect?</text>
</g>
<g filter="url(#shadow)">
<rect x="848.0" y="230" width="340" height="150" rx="24" fill="#111c2e" stroke="#22c55e" stroke-opacity="0.65"/>
<rect x="870.0" y="252" width="52" height="52" rx="16" fill="#22c55e" opacity="0.22"/>
<text x="936.0" y="284" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Schema change</text>
<text x="876.0" y="332" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Who approves breaking changes?</text>
</g>
<g filter="url(#shadow)">
<rect x="92.0" y="414" width="340" height="150" rx="24" fill="#111c2e" stroke="#f59e0b" stroke-opacity="0.65"/>
<rect x="114.0" y="436" width="52" height="52" rx="16" fill="#f59e0b" opacity="0.22"/>
<text x="180.0" y="468" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Security</text>
<text x="120.0" y="516" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Which identities can discover</text>
<text x="120.0" y="544" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">and query?</text>
</g>
<g filter="url(#shadow)">
<rect x="470.0" y="414" width="340" height="150" rx="24" fill="#111c2e" stroke="#f472b6" stroke-opacity="0.65"/>
<rect x="492.0" y="436" width="52" height="52" rx="16" fill="#f472b6" opacity="0.22"/>
<text x="558.0" y="468" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Cost</text>
<text x="498.0" y="516" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Which workloads should read</text>
<text x="498.0" y="544" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">remotely?</text>
</g>
