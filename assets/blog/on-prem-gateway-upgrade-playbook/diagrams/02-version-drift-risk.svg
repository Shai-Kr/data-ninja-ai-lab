<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title>Where gateway version drift shows up</title><desc>A cluster can look healthy while different members behave differently.</desc>
<rect width="1200" height="720" fill="#07111f"/>
<circle cx="1040" cy="100" r="210" fill="#0b5d78" opacity="0.18"/>
<circle cx="130" cy="650" r="260" fill="#1b3b88" opacity="0.18"/>
<rect x="46" y="42" width="1108" height="636" rx="34" fill="#0d1b2d" stroke="#214866" stroke-width="2"/>
<text x="86" y="104" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">Where gateway version drift shows up</text>
<text x="88" y="146" fill="#a8c3d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">A cluster can look healthy while different members behave differently.</text>

<rect x="86" y="198" width="310" height="290" rx="22" fill="#102640" stroke="#ffbd66" stroke-width="2"/>
<text x="114" y="240" fill="#ffbd66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Old member</text>
<text x="114" y="280" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Older Mashup Engine</text>
<text x="114" y="312" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Possible sign-in risk</text>
<text x="114" y="344" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Different query behavior</text>
<text x="114" y="376" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Hidden until routed here</text>
<rect x="445" y="198" width="310" height="290" rx="22" fill="#102640" stroke="#76f7b2" stroke-width="2"/>
<text x="473" y="240" fill="#76f7b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Current member</text>
<text x="473" y="280" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">August 2026 build</text>
<text x="473" y="312" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Desktop compatibility</text>
<text x="473" y="344" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Security updates</text>
<text x="473" y="376" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Expected refresh path</text>
<rect x="804" y="198" width="310" height="290" rx="22" fill="#102640" stroke="#36d7ff" stroke-width="2"/>
<text x="832" y="240" fill="#36d7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">User impact</text>
<text x="832" y="280" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Same dataset</text>
<text x="832" y="312" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Different outcome</text>
<text x="832" y="344" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Harder incident review</text>
<text x="832" y="376" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Lower trust in BI</text>
<text x="86" y="642" fill="#76f7b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Version consistency is not cosmetic. It affects refresh reliability and support quality.</text>
</svg>