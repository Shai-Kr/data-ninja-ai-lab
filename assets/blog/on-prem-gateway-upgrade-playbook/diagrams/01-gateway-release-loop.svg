<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title>Monthly gateway release loop</title><desc>Turn the August 2026 release into a predictable operating habit.</desc>
<rect width="1200" height="720" fill="#07111f"/>
<circle cx="1040" cy="100" r="210" fill="#0b5d78" opacity="0.18"/>
<circle cx="130" cy="650" r="260" fill="#1b3b88" opacity="0.18"/>
<rect x="46" y="42" width="1108" height="636" rx="34" fill="#0d1b2d" stroke="#214866" stroke-width="2"/>
<text x="86" y="104" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">Monthly gateway release loop</text>
<text x="88" y="146" fill="#a8c3d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Turn the August 2026 release into a predictable operating habit.</text>

<rect x="86" y="198" width="300" height="330" rx="22" fill="#102640" stroke="#36d7ff" stroke-width="2"/>
<text x="114" y="240" fill="#36d7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">1. Inventory</text>
<text x="114" y="280" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Gateway clusters</text>
<text x="114" y="312" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Owners and admins</text>
<text x="114" y="344" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Critical refresh paths</text>
<text x="114" y="376" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Current installed version</text>
<rect x="450" y="198" width="300" height="330" rx="22" fill="#102640" stroke="#76f7b2" stroke-width="2"/>
<text x="478" y="240" fill="#76f7b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">2. Upgrade</text>
<text x="478" y="280" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">One member at a time</text>
<text x="478" y="312" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Validate refresh behavior</text>
<text x="478" y="344" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Keep Desktop aligned</text>
<text x="478" y="376" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Document rollback owner</text>
<rect x="814" y="198" width="300" height="330" rx="22" fill="#102640" stroke="#b994ff" stroke-width="2"/>
<text x="842" y="240" fill="#b994ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">3. Verify</text>
<text x="842" y="280" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Refresh success rate</text>
<text x="842" y="312" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Credential prompts</text>
<text x="842" y="344" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Mashup behavior</text>
<text x="842" y="376" fill="#ecf7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Diagnostics and alerts</text>
<text x="86" y="642" fill="#76f7b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">The goal is boring refreshes: current builds, known owners, and fewer surprises.</text>
</svg>