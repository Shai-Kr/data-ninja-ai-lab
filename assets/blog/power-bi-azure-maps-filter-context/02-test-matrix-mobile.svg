<svg xmlns="http://www.w3.org/2000/svg" width="675" height="1180" viewBox="0 0 675 1180" role="img" aria-labelledby="t d"><title id="t">Azure Maps four-case acceptance test</title><desc id="d">Four stacked test cards for broad view, slicer filter, cross-filter, and reset.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102940"/></linearGradient></defs><rect width="675" height="1180" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="42" y="68" font-size="34" font-weight="700" fill="#f4f9ff">FOUR TESTS BEFORE</text><text x="42" y="110" font-size="34" font-weight="700" fill="#f4f9ff">PRODUCTION</text><text x="42" y="150" font-size="20" fill="#9bb6cc">Validate the interaction, not the screenshot</text>
<g transform="translate(42 195)"><rect width="591" height="205" rx="22" fill="#0b1f31" stroke="#22d3ee" stroke-width="3"/><text x="28" y="45" font-size="25" font-weight="700" fill="#67e8f9">1  BROAD VIEW</text><text x="28" y="87" font-size="20" fill="#d8e7f2">Context: Default</text><text x="300" y="87" font-size="20" fill="#d8e7f2">Points: Baseline</text><text x="28" y="126" font-size="20" fill="#d8e7f2">Viewport: Expected extent</text><text x="300" y="126" font-size="20" fill="#d8e7f2">Total: Recorded</text><text x="28" y="170" font-size="18" fill="#9bb6cc">Capture the starting state.</text></g>
<g transform="translate(42 425)"><rect width="591" height="205" rx="22" fill="#0b1f31" stroke="#3b82f6" stroke-width="3"/><text x="28" y="45" font-size="25" font-weight="700" fill="#93c5fd">2  SLICER FILTER</text><text x="28" y="87" font-size="20" fill="#d8e7f2">Context: One region</text><text x="300" y="87" font-size="20" fill="#d8e7f2">Points: Reloaded</text><text x="28" y="126" font-size="20" fill="#d8e7f2">Viewport: Fits selection</text><text x="300" y="126" font-size="20" fill="#d8e7f2">Total: Matches</text><text x="28" y="170" font-size="18" fill="#9bb6cc">Use a known regional count.</text></g>
<g transform="translate(42 655)"><rect width="591" height="205" rx="22" fill="#0b1f31" stroke="#8b5cf6" stroke-width="3"/><text x="28" y="45" font-size="25" font-weight="700" fill="#c4b5fd">3  CROSS-FILTER</text><text x="28" y="87" font-size="20" fill="#d8e7f2">Context: Other visual</text><text x="300" y="87" font-size="20" fill="#d8e7f2">Points: Relevant set</text><text x="28" y="126" font-size="20" fill="#d8e7f2">Viewport: Fits selection</text><text x="300" y="126" font-size="20" fill="#d8e7f2">Total: Matches</text><text x="28" y="170" font-size="18" fill="#9bb6cc">Confirm the intended interaction.</text></g>
<g transform="translate(42 885)"><rect width="591" height="205" rx="22" fill="#0b1f31" stroke="#2dd4bf" stroke-width="3"/><text x="28" y="45" font-size="25" font-weight="700" fill="#99f6e4">4  CLEAR / RESET</text><text x="28" y="87" font-size="20" fill="#d8e7f2">Context: Default again</text><text x="300" y="87" font-size="20" fill="#d8e7f2">Points: Baseline</text><text x="28" y="126" font-size="20" fill="#d8e7f2">Viewport: Returns cleanly</text><text x="300" y="126" font-size="20" fill="#d8e7f2">Total: Restored</text><text x="28" y="170" font-size="18" fill="#9bb6cc">Make the path back predictable.</text></g>
<text x="337" y="1140" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Compare every state with a known total.</text></g></svg>
