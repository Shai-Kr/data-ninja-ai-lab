<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Azure Maps four-case acceptance test</title><desc id="d">A matrix with broad view, slicer filter, cross-filter, and reset cases, each checked for context, selected points, viewport, and known totals.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102940"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="72" y="88" font-size="40" font-weight="700" fill="#f4f9ff">FOUR TESTS BEFORE PRODUCTION</text><text x="72" y="128" font-size="22" fill="#9bb6cc">Validate the interaction, not only the screenshot</text>
<g transform="translate(70 180)"><rect width="1060" height="390" rx="24" fill="#0b1f31" stroke="#28506d" stroke-width="2"/>
<rect x="0" y="0" width="1060" height="70" rx="24" fill="#123552"/><rect y="48" width="1060" height="22" fill="#123552"/>
<text x="30" y="44" font-size="21" font-weight="700" fill="#fff">CASE</text><text x="320" y="44" font-size="21" font-weight="700" fill="#fff">CONTEXT</text><text x="520" y="44" font-size="21" font-weight="700" fill="#fff">POINTS</text><text x="700" y="44" font-size="21" font-weight="700" fill="#fff">VIEWPORT</text><text x="890" y="44" font-size="21" font-weight="700" fill="#fff">TOTAL</text>
<g font-size="20"><text x="30" y="118" font-weight="700" fill="#67e8f9">1  BROAD VIEW</text><text x="320" y="118" fill="#d8e7f2">Default</text><text x="520" y="118" fill="#d8e7f2">Baseline</text><text x="700" y="118" fill="#d8e7f2">Expected extent</text><text x="890" y="118" fill="#d8e7f2">Recorded</text>
<line x1="25" y1="145" x2="1035" y2="145" stroke="#24445b"/><text x="30" y="193" font-weight="700" fill="#93c5fd">2  SLICER FILTER</text><text x="320" y="193" fill="#d8e7f2">One region</text><text x="520" y="193" fill="#d8e7f2">Reloaded</text><text x="700" y="193" fill="#d8e7f2">Fits selection</text><text x="890" y="193" fill="#d8e7f2">Matches</text>
<line x1="25" y1="220" x2="1035" y2="220" stroke="#24445b"/><text x="30" y="268" font-weight="700" fill="#c4b5fd">3  CROSS-FILTER</text><text x="320" y="268" fill="#d8e7f2">Other visual</text><text x="520" y="268" fill="#d8e7f2">Relevant set</text><text x="700" y="268" fill="#d8e7f2">Fits selection</text><text x="890" y="268" fill="#d8e7f2">Matches</text>
<line x1="25" y1="295" x2="1035" y2="295" stroke="#24445b"/><text x="30" y="343" font-weight="700" fill="#99f6e4">4  CLEAR / RESET</text><text x="320" y="343" fill="#d8e7f2">Default again</text><text x="520" y="343" fill="#d8e7f2">Baseline</text><text x="700" y="343" fill="#d8e7f2">Returns cleanly</text><text x="890" y="343" fill="#d8e7f2">Restored</text></g></g>
<rect x="245" y="600" width="710" height="48" rx="18" fill="#123552" stroke="#22d3ee"/><text x="600" y="631" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Use a known comparison count for every selected state.</text></g></svg>
