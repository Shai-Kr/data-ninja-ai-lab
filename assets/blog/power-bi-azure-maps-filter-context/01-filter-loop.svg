<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Power BI Azure Maps filter interaction loop</title><desc id="d">A four-stage flow from user selection to filter context, relevant map points, and an automatically fitted viewport.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102940"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="72" y="92" fill="#f4f9ff" font-family="Arial,sans-serif" font-size="40" font-weight="700">THE MAP FOLLOWS THE ANALYSIS</text><text x="72" y="132" fill="#9bb6cc" font-family="Arial,sans-serif" font-size="22">Treat the viewport as the final step of the report interaction</text>
<g font-family="Arial,sans-serif">
<g transform="translate(65 205)"><rect width="230" height="250" rx="24" fill="#102b42" stroke="#22d3ee" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#22d3ee"/><text x="48" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="#06111d">1</text><text x="28" y="110" font-size="25" font-weight="700" fill="#fff">USER SELECTS</text><text x="28" y="154" font-size="20" fill="#bad2e5">Slicer, filter, or</text><text x="28" y="184" font-size="20" fill="#bad2e5">another visual</text><text x="28" y="222" font-size="17" fill="#67e8f9">Example: Ontario</text></g>
<g transform="translate(345 205)"><rect width="230" height="250" rx="24" fill="#102b42" stroke="#3b82f6" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#3b82f6"/><text x="48" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="28" y="110" font-size="25" font-weight="700" fill="#fff">CONTEXT UPDATES</text><text x="28" y="154" font-size="20" fill="#bad2e5">Power BI applies the</text><text x="28" y="184" font-size="20" fill="#bad2e5">intended interaction</text><text x="28" y="222" font-size="17" fill="#93c5fd">Verify the filter path</text></g>
<g transform="translate(625 205)"><rect width="230" height="250" rx="24" fill="#102b42" stroke="#8b5cf6" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#8b5cf6"/><text x="48" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="28" y="110" font-size="25" font-weight="700" fill="#fff">POINTS RELOAD</text><text x="28" y="154" font-size="20" fill="#bad2e5">Azure Maps loads the</text><text x="28" y="184" font-size="20" fill="#bad2e5">relevant selection</text><text x="28" y="222" font-size="17" fill="#c4b5fd">Limit still applies</text></g>
<g transform="translate(905 205)"><rect width="230" height="250" rx="24" fill="#102b42" stroke="#2dd4bf" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#2dd4bf"/><text x="48" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="#06111d">4</text><text x="28" y="110" font-size="25" font-weight="700" fill="#fff">VIEWPORT FITS</text><text x="28" y="154" font-size="20" fill="#bad2e5">The map reframes to</text><text x="28" y="184" font-size="20" fill="#bad2e5">the visible geography</text><text x="28" y="222" font-size="17" fill="#99f6e4">Check orientation</text></g>
<g fill="none" stroke="#67e8f9" stroke-width="5" filter="url(#glow)"><path d="M300 330h35"/><path d="M580 330h35"/><path d="M860 330h35"/></g><g fill="#67e8f9"><path d="M335 330l-14-10v20z"/><path d="M615 330l-14-10v20z"/><path d="M895 330l-14-10v20z"/></g>
<rect x="120" y="515" width="960" height="88" rx="20" fill="#0b1f31" stroke="#28506d"/><text x="600" y="552" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">PASS CONDITION</text><text x="600" y="583" text-anchor="middle" font-size="19" fill="#bad2e5">The map, supporting totals, and active filters describe the same selection.</text>
</g></svg>
