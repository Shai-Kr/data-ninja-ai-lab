<svg xmlns="http://www.w3.org/2000/svg" width="675" height="1120" viewBox="0 0 675 1120" role="img" aria-labelledby="t d"><title id="t">Power BI Azure Maps filter interaction loop</title><desc id="d">Four vertical stages from user selection to context update, relevant points, and fitted viewport.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102940"/></linearGradient></defs><rect width="675" height="1120" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="42" y="68" fill="#f4f9ff" font-size="34" font-weight="700">THE MAP FOLLOWS</text><text x="42" y="110" fill="#f4f9ff" font-size="34" font-weight="700">THE ANALYSIS</text><text x="42" y="150" fill="#9bb6cc" font-size="20">Validate every step of the interaction</text>
<g transform="translate(42 198)"><rect width="591" height="170" rx="22" fill="#102b42" stroke="#22d3ee" stroke-width="3"/><circle cx="52" cy="52" r="27" fill="#22d3ee"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#06111d">1</text><text x="100" y="57" font-size="27" font-weight="700" fill="#fff">USER SELECTS</text><text x="100" y="98" font-size="21" fill="#bad2e5">Slicer, filter, or another visual</text><text x="100" y="133" font-size="19" fill="#67e8f9">Example: Ontario</text></g>
<path d="M337 373v26" stroke="#67e8f9" stroke-width="5"/><path d="M337 410l-11-18h22z" fill="#67e8f9"/>
<g transform="translate(42 414)"><rect width="591" height="170" rx="22" fill="#102b42" stroke="#3b82f6" stroke-width="3"/><circle cx="52" cy="52" r="27" fill="#3b82f6"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="100" y="57" font-size="27" font-weight="700" fill="#fff">CONTEXT UPDATES</text><text x="100" y="98" font-size="21" fill="#bad2e5">Power BI applies the interaction</text><text x="100" y="133" font-size="19" fill="#93c5fd">Verify the filter path</text></g>
<path d="M337 589v26" stroke="#67e8f9" stroke-width="5"/><path d="M337 626l-11-18h22z" fill="#67e8f9"/>
<g transform="translate(42 630)"><rect width="591" height="170" rx="22" fill="#102b42" stroke="#8b5cf6" stroke-width="3"/><circle cx="52" cy="52" r="27" fill="#8b5cf6"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="100" y="57" font-size="27" font-weight="700" fill="#fff">POINTS RELOAD</text><text x="100" y="98" font-size="21" fill="#bad2e5">Azure Maps loads the relevant set</text><text x="100" y="133" font-size="19" fill="#c4b5fd">The rendering limit still applies</text></g>
<path d="M337 805v26" stroke="#67e8f9" stroke-width="5"/><path d="M337 842l-11-18h22z" fill="#67e8f9"/>
<g transform="translate(42 846)"><rect width="591" height="170" rx="22" fill="#102b42" stroke="#2dd4bf" stroke-width="3"/><circle cx="52" cy="52" r="27" fill="#2dd4bf"/><text x="52" y="61" text-anchor="middle" font-size="24" font-weight="700" fill="#06111d">4</text><text x="100" y="57" font-size="27" font-weight="700" fill="#fff">VIEWPORT FITS</text><text x="100" y="98" font-size="21" fill="#bad2e5">The map reframes to visible data</text><text x="100" y="133" font-size="19" fill="#99f6e4">Check orientation and totals</text></g>
<text x="337" y="1065" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">PASS: map, totals, and filters agree</text></g></svg>
