<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-label="Semantic exchange through Apache Ossie"><rect width="760" height="940" rx="28" fill="#07111f"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28d7ff"/><stop offset="1" stop-color="#4f7cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><text x="380" y="60" fill="#eef8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle">ONE SEMANTIC CONTRACT</text><text x="380" y="95" fill="#a9bfd1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="middle">More places to use it</text><rect x="95" y="135" width="570" height="170" rx="20" fill="#0d2034" stroke="#1d4b68" stroke-width="2"/><rect x="95" y="135" width="7" height="170" rx="4" fill="#4f7cff"/><text x="123" y="179" fill="#4f7cff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Power BI</text><text x="123" y="217" fill="#a9bfd1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">Semantic model  |  TMDL  |  DAX</text><path d="M380 315 V355" stroke="#28d7ff" stroke-width="7"/><path d="M364 337 L380 360 L396 337" fill="none" stroke="#28d7ff" stroke-width="7"/><rect x="95" y="370" width="570" height="230" rx="20" fill="#0d2034" stroke="#1d4b68" stroke-width="2"/><rect x="95" y="370" width="7" height="230" rx="4" fill="#28d7ff"/><text x="123" y="414" fill="#28d7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Apache Ossie</text><text x="123" y="452" fill="#a9bfd1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start">JSON or YAML exchange document</text><text x="123" y="483" fill="#a9bfd1"