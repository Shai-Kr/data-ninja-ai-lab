<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="OneLake report asset operating model">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#102a44"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233a"/><stop offset="1" stop-color="#0f1b2e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="70" y="82" fill="#f8fbff" font-family="Inter,Arial" font-size="38" font-weight="800">A practical operating model</text><text x="70" y="122" fill="#b8c7dc" font-family="Inter,Arial" font-size="20">Keep the pattern simple enough that report authors will actually use it.</text>
<g filter="url(#shadow)">
<rect x="80" y="190" width="305" height="290" rx="28" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="116" y="244" fill="#93c5fd" font-family="Inter,Arial" font-size="26" font-weight="800">Ownership</text><text x="116" y="300" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Media library owner</text><text x="116" y="340" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Folder naming rules</text><text x="116" y="380" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Change review path</text>
<rect x="448" y="190" width="305" height="290" rx="28" fill="url(#card)" stroke="#2dd4bf" stroke-width="2"/><text x="484" y="244" fill="#5eead4" font-family="Inter,Arial" font-size="26" font-weight="800">Access</text><text x="484" y="300" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Least privilege reads</text><text x="484" y="340" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Viewer account test</text><text x="484" y="380" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">No anonymous links</text>
<rect x="816" y="190" width="305" height="290" rx="28" fill="url(#card)" stroke="#fbbf24" stroke-width="2"/><text x="852" y="244" fill="#fcd34d" font-family="Inter,Arial" font-size="26" font-weight="800">Performance</text><text x="852" y="300" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Right size images</text><text x="852" y="340" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Stable paths</text><text x="852" y="380" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Deployment notes</text>
</g>
<rect x="225" y="535" width="750" height="72" rx="22" fill="#0b1628" stroke="#334155"/><text x="270" y="580" fill="#dbeafe" font-family="Inter,Arial" font-size="24" font-weight="700">If the media matters to the report, it needs a platform home.</text>
</svg>