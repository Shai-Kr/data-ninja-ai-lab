<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Power BI OneLake media checklist">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#102a44"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233a"/><stop offset="1" stop-color="#0f1b2e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="80" y="82" fill="#f8fbff" font-family="Inter,Arial" font-size="38" font-weight="800">The OneLake media checklist</text><text x="80" y="122" fill="#b8c7dc" font-family="Inter,Arial" font-size="20">A small operating model keeps report images from becoming hidden dependencies.</text><rect x="90" y="190" width="1020" height="82" rx="22" fill="#111d31" stroke="#263b59"/><circle cx="138" cy="231" r="24" fill="#2dd4bf"/><text x="131" y="239" fill="#04111f" font-family="Inter,Arial" font-size="22" font-weight="800">1</text><text x="190" y="224" fill="#f8fbff" font-family="Inter,Arial" font-size="25" font-weight="800">Store</text><text x="190" y="253" fill="#b8c7dc" font-family="Inter,Arial" font-size="19">Lakehouse Files folder with stable paths</text><rect x="90" y="292" width="1020" height="82" rx="22" fill="#111d31" stroke="#263b59"/><circle cx="138" cy="333" r="24" fill="#2dd4bf"/><text x="131" y="341" fill="#04111f" font-family="Inter,Arial" font-size="22" font-weight="800">2</text><text x="190" y="326" fill="#f8fbff" font-family="Inter,Arial" font-size="25" font-weight="800">Reference</text><text x="190" y="355" fill="#b8c7dc" font-family="Inter,Arial" font-size="19">OneLake HTTPS URL in supported visuals</text><rect x="90" y="394" width="1020" height="82" rx="22" fill="#111d31" stroke="#263b59"/><circle cx="138" cy="435" r="24" fill="#2dd4bf"/><text x="131" y="443" fill="#04111f" font-family="Inter,Arial" font-size="22" font-weight="800">3</text><text x="190" y="428" fill="#f8fbff" font-family="Inter,Arial" font-size="25" font-weight="800">Secure</text><text x="190" y="457" fill="#b8c7dc" font-family="Inter,Arial" font-size="19">Viewer needs report access and file read access</text><rect x="90" y="496" width="1020" height="82" rx="22" fill="#111d31" stroke="#263b59"/><circle cx="138" cy="537" r="24" fill="#2dd4bf"/><text x="131" y="545" fill="#04111f" font-family="Inter,Arial" font-size="22" font-weight="800">4</text><text x="190" y="530" fill="#f8fbff" font-family="Inter,Arial" font-size="25" font-weight="800">Operate</text><text x="190" y="559" fill="#b8c7dc" font-family="Inter,Arial" font-size="19">Owner, naming, deployment, and resize rules</text>
<text x="90" y="622" fill="#7dd3fc" font-family="Inter,Arial" font-size="20" font-weight="700">Test with a normal viewer account, not only the developer account.</text></svg>