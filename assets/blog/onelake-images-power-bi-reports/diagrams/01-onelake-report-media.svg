<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="OneLake report media architecture">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#102a44"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233a"/><stop offset="1" stop-color="#0f1b2e"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1040" cy="105" r="150" fill="#20d3ee" opacity="0.10"/><circle cx="180" cy="560" r="170" fill="#7c3aed" opacity="0.12"/>
<text x="70" y="78" fill="#f8fbff" font-family="Inter,Arial" font-size="38" font-weight="800">OneLake as the report media layer</text>
<text x="70" y="118" fill="#b8c7dc" font-family="Inter,Arial" font-size="20">Authenticated files become controlled Power BI report dependencies.</text>
<g filter="url(#shadow)">
<rect x="70" y="190" width="270" height="220" rx="26" fill="url(#card)" stroke="#2dd4bf" stroke-width="2"/><text x="105" y="240" fill="#2dd4bf" font-family="Inter,Arial" font-size="24" font-weight="700">OneLake Files</text><text x="105" y="285" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Images</text><text x="105" y="322" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Icons</text><text x="105" y="359" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Shape maps</text>
<rect x="465" y="190" width="270" height="220" rx="26" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="500" y="240" fill="#93c5fd" font-family="Inter,Arial" font-size="24" font-weight="700">Power BI Report</text><text x="500" y="285" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Image visual</text><text x="500" y="322" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Cards and tables</text><text x="500" y="359" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Maps and icons</text>
<rect x="860" y="190" width="270" height="220" rx="26" fill="url(#card)" stroke="#fbbf24" stroke-width="2"/><text x="895" y="240" fill="#fcd34d" font-family="Inter,Arial" font-size="24" font-weight="700">Viewer Identity</text><text x="895" y="285" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">Entra auth</text><text x="895" y="322" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">OneLake read access</text><text x="895" y="359" fill="#eaf2ff" font-family="Inter,Arial" font-size="20">No public URL needed</text>
</g>
<path d="M350 300 H450" stroke="#76e4f7" stroke-width="6" stroke-linecap="round"/><path d="M735 300 H845" stroke="#76e4f7" stroke-width="6" stroke-linecap="round"/><path d="M440 286 L462 300 L440 314" fill="none" stroke="#76e4f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M835 286 L857 300 L835 314" fill="none" stroke="#76e4f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="175" y="500" width="850" height="78" rx="22" fill="#0b1628" stroke="#334155"/><text x="230" y="548" fill="#dbeafe" font-family="Inter,Arial" font-size="24" font-weight="700">Goal: own, secure, reuse, and review report media like platform assets.</text>
</svg>