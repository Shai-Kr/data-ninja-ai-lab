<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1320" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
<title id="title">Six release gates</title><desc id="desc">Make repeat execution safe.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0b2135"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<circle cx="570" cy="55" r="90" fill="#20d9ff" opacity=".08"/><circle cx="55" cy="1275" r="100" fill="#7c5cff" opacity=".08"/>
<text x="320.0" y="62" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Six release gates</text>
<text x="320.0" y="94" text-anchor="middle" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="15">Make repeat execution safe.</text><g filter="url(#shadow)"><rect x="55" y="125" width="530" height="150" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="90" cy="160" r="20" fill="#20d9ff"/><text x="90" y="167" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">1</text><text x="123" y="167" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">SCOPE</text><text x="79" y="207" fill="#c8e4ef" font-family="Arial" font-size="15">One purpose and named owner</text></g><g filter="url(#shadow)"><rect x="55" y="295" width="530" height="150" rx="18" fill="#0d273b" stroke="#8b7cff" stroke-width="2"/><circle cx="90" cy="330" r="20" fill="#8b7cff"/><text x="90" y="337" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">2</text><text x="123" y="337" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">IDEMPOTENCE</text><text x="79" y="377" fill="#c8e4ef" font-family="Arial" font-size="15">Run twice with no duplicate effects</text></g><g filter="url(#shadow)"><rect x="55" y="465" width="530" height="150" rx="18" fill="#0d273b" stroke="#ffbb55" stroke-width="2"/><circle cx="90" cy="500" r="20" fill="#ffbb55"/><text x="90" y="507" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">3</text><text x="123" y="507" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">SAFETY</text><text x="79" y="547" fill="#c8e4ef" font-family="Arial" font-size="15">Review SQL and protect data</text></g><g filter="url(#shadow)"><rect x="55" y="635" width="530" height="150" rx="18" fill="#0d273b" stroke="#32e6a1" stroke-width="2"/><circle cx="90" cy="670" r="20" fill="#32e6a1"/><text x="90" y="677" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">4</text><text x="123" y="677" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">ENVIRONMENT</text><text x="79" y="717" fill="#c8e4ef" font-family="Arial" font-size="15">No embedded secrets or IDs</text></g><g filter="url(#shadow)"><rect x="55" y="805" width="530" height="150" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="90" cy="840" r="20" fill="#20d9ff"/><text x="90" y="847" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">5</text><text x="123" y="847" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">VALIDATION</text><text x="79" y="887" fill="#c8e4ef" font-family="Arial" font-size="15">Known-result checks and evidence</text></g><g filter="url(#shadow)"><rect x="55" y="975" width="530" height="150" rx="18" fill="#0d273b" stroke="#ff6f91" stroke-width="2"/><circle cx="90" cy="1010" r="20" fill="#ff6f91"/><text x="90" y="1017" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">6</text><text x="123" y="1017" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">RECOVERY</text><text x="79" y="1057" fill="#c8e4ef" font-family="Arial" font-size="15">Failure branch and rollback</text></g><rect x="24" y="1250" width="592" height="46" rx="14" fill="#062a39" stroke="#20d9ff" stroke-opacity=".45"/><text x="320.0" y="1280" text-anchor="middle" fill="#79e8ff" font-family="Arial" font-size="14" font-weight="700">Build  →  test twice  →  promote  →  validate</text></svg>