<text x="600.0" y="62" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Put each change in the right layer</text>
<text x="600.0" y="94" text-anchor="middle" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">A deployment script complements the project. It should not become a second schema model.</text><g filter="url(#shadow)"><rect x="55" y="140" width="330" height="285" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="90" cy="175" r="20" fill="#20d9ff"/><text x="90" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">A</text><text x="123" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">SQL PROJECT</text><text x="79" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Tables and views</text><text x="79" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Stored procedures</text><text x="79" y="276" fill="#c8e4ef" font-family="Arial" font-size="16">Functions</text><text x="79" y="303" fill="#c8e4ef" font-family="Arial" font-size="16">Desired schema state</text></g><g filter="url(#shadow)"><rect x="435" y="140" width="330" height="285" rx="18" fill="#0d273b" stroke="#32e6a1" stroke-width="2"/><circle cx="470" cy="175" r="20" fill="#32e6a1"/><text x="470" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">B</text><text x="503" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">DEPLOYMENT SCRIPT</text><text x="459" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Reference data</text><text x="459" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Roles and grants</text><text x="459" y="276" fill="#c8e4ef" font-family="Arial" font-size="16">Environment setup</text><text x="459" y="303" fill="#c8e4ef" font-family="Arial" font-size="16">Cross-warehouse bridge</text></g><g filter="url(#shadow)"><rect x="815" y="140" width="330" height="285" rx="18" fill="#0d273b" stroke="#ffbb55" stroke-width="2"/><circle cx="850" cy="175" r="20" fill="#ffbb55"/><text x="850" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">C</text><text x="883" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">PIPELINE CONTROL</text><text x="839" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Promotion approval</text><text x="839" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Secrets and variables</text><text x="839" y="276" fill="#c8e4ef" font-family="Arial" font-size="16">Health validation</text><text x="839" y="303" fill="#c8e4ef" font-family="Arial" font-size="16">Rollback decision</text></g><rect x="24" y="480" width="1152" height="46" rx="14" fill="#062a39" stroke="#20d9ff" stroke-opacity=".45"/><text x="600.0" y="510" text-anchor="middle" fill="#79e8ff" font-family="Arial" font-size="17" font-weight="700">Clear ownership makes repeated deployments predictable</text></svg>