<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">One deployment, three controlled stages</title><desc id="desc">The schema remains the center. Scripts handle work the model cannot express.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0b2135"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<circle cx="1130" cy="55" r="90" fill="#20d9ff" opacity=".08"/><circle cx="55" cy="475" r="100" fill="#7c5cff" opacity=".08"/>
<text x="600.0" y="62" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="32" font-weight="700">One deployment, three controlled stages</text>
<text x="600.0" y="94" text-anchor="middle" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">The schema remains the center. Scripts handle work the model cannot express.</text><g filter="url(#shadow)"><rect x="55" y="140" width="330" height="260" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="90" cy="175" r="20" fill="#20d9ff"/><text x="90" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">1</text><text x="123" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">PRE-DEPLOYMENT</text><text x="79" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Prepare safe conditions</text><text x="79" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Clean temporary state</text><text x="79" y="276" fill="#c8e4ef" font-family="Arial" font-size="16">Handle a dependency</text><text x="79" y="303" fill="#c8e4ef" font-family="Arial" font-size="16">Must be rerunnable</text></g><g filter="url(#shadow)"><rect x="435" y="140" width="330" height="260" rx="18" fill="#0d273b" stroke="#8b7cff" stroke-width="2"/><circle cx="470" cy="175" r="20" fill="#8b7cff"/><text x="470" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">2</text><text x="503" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">SCHEMA DIFF</text><text x="459" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Compare desired state</text><text x="459" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Create or alter objects</text><text x="459" y="276" fill="#c8e4ef" font-family="Arial" font-size="16">Apply warehouse project</text><text x="459" y="303" fill="#c8e4ef" font-family="Arial" font-size="16">Review data-loss settings</text></g><g filter="url(#shadow)"><rect x="815" y="140" width="330" height="260" rx="18" fill="#0d273b" stroke="#32e6a1" stroke-width="2"/><circle cx="850" cy="175" r="20" fill="#32e6a1"/><text x="850" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">3</text><text x="883" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">POST-DEPLOYMENT</text><text x="839" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Seed reference rows</text><text x="839" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Reapply SQL security</text><text x="839" y="276" fill="#c8e4ef" font-family="Arial" font-size="16">Initialize metadata</text><text x="839" y="303" fill="#c8e4ef" font-family="Arial" font-size="16">Record validation evidence</text></g><rect x="24" y="450" width="1152" height="46" rx="14" fill="#062a39" stroke="#20d9ff" stroke-opacity=".45"/><text x="600.0" y="480" text-anchor="middle" fill="#79e8ff" font-family="Arial" font-size="17" font-weight="700">Pre script  →  schema deployment  →  post script</text></svg>