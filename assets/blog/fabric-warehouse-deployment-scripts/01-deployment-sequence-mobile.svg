<svg xmlns="http://www.w3.org/2000/svg" width="640" height="980" viewBox="0 0 640 980" role="img" aria-labelledby="title desc">
<title id="title">Three controlled stages</title><desc id="desc">The schema stays at the center.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0b2135"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<circle cx="570" cy="55" r="90" fill="#20d9ff" opacity=".08"/><circle cx="55" cy="935" r="100" fill="#7c5cff" opacity=".08"/>
<text x="320.0" y="62" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Three controlled stages</text>
<text x="320.0" y="94" text-anchor="middle" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="15">The schema stays at the center.</text><g filter="url(#shadow)"><rect x="55" y="130" width="530" height="220" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="90" cy="165" r="20" fill="#20d9ff"/><text x="90" y="172" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">1</text><text x="123" y="172" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">PRE-DEPLOYMENT</text><text x="79" y="212" fill="#c8e4ef" font-family="Arial" font-size="15">Prepare safe conditions</text><text x="79" y="239" fill="#c8e4ef" font-family="Arial" font-size="15">Clean temporary state</text><text x="79" y="266" fill="#c8e4ef" font-family="Arial" font-size="15">Must be rerunnable</text></g><g filter="url(#shadow)"><rect x="55" y="380" width="530" height="220" rx="18" fill="#0d273b" stroke="#8b7cff" stroke-width="2"/><circle cx="90" cy="415" r="20" fill="#8b7cff"/><text x="90" y="422" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">2</text><text x="123" y="422" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">SCHEMA DIFF</text><text x="79" y="462" fill="#c8e4ef" font-family="Arial" font-size="15">Compare desired state</text><text x="79" y="489" fill="#c8e4ef" font-family="Arial" font-size="15">Create or alter objects</text><text x="79" y="516" fill="#c8e4ef" font-family="Arial" font-size="15">Review data-loss settings</text></g><g filter="url(#shadow)"><rect x="55" y="630" width="530" height="220" rx="18" fill="#0d273b" stroke="#32e6a1" stroke-width="2"/><circle cx="90" cy="665" r="20" fill="#32e6a1"/><text x="90" y="672" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">3</text><text x="123" y="672" fill="#f6fbff" font-family="Arial" font-size="19" font-weight="700">POST-DEPLOYMENT</text><text x="79" y="712" fill="#c8e4ef" font-family="Arial" font-size="15">Seed reference rows</text><text x="79" y="739" fill="#c8e4ef" font-family="Arial" font-size="15">Reapply SQL security</text><text x="79" y="766" fill="#c8e4ef" font-family="Arial" font-size="15">Record validation evidence</text></g><rect x="24" y="910" width="592" height="46" rx="14" fill="#062a39" stroke="#20d9ff" stroke-opacity=".45"/><text x="320.0" y="940" text-anchor="middle" fill="#79e8ff" font-family="Arial" font-size="14" font-weight="700">Pre  →  schema  →  post</text></svg>