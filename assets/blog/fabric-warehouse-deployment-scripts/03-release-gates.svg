<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Six gates for a reusable deployment script</title><desc id="desc">Treat every execution as production-capable, even when the first target is development.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0b2135"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter></defs>
<rect width="100%" height="100%" rx="26" fill="url(#bg)"/>
<circle cx="1130" cy="55" r="90" fill="#20d9ff" opacity=".08"/><circle cx="55" cy="555" r="100" fill="#7c5cff" opacity=".08"/>
<text x="600.0" y="62" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Six gates for a reusable deployment script</text>
<text x="600.0" y="94" text-anchor="middle" fill="#9cc8dc" font-family="Arial, sans-serif" font-size="17">Treat every execution as production-capable, even when the first target is development.</text><g filter="url(#shadow)"><rect x="45" y="140" width="350" height="155" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="80" cy="175" r="20" fill="#20d9ff"/><text x="80" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">1</text><text x="113" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">SCOPE</text><text x="69" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">One purpose</text><text x="69" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Named owner</text></g><g filter="url(#shadow)"><rect x="425" y="140" width="350" height="155" rx="18" fill="#0d273b" stroke="#8b7cff" stroke-width="2"/><circle cx="460" cy="175" r="20" fill="#8b7cff"/><text x="460" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">2</text><text x="493" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">IDEMPOTENCE</text><text x="449" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Run twice safely</text><text x="449" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">No duplicate effects</text></g><g filter="url(#shadow)"><rect x="805" y="140" width="350" height="155" rx="18" fill="#0d273b" stroke="#ffbb55" stroke-width="2"/><circle cx="840" cy="175" r="20" fill="#ffbb55"/><text x="840" y="182" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">3</text><text x="873" y="182" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">SAFETY</text><text x="829" y="222" fill="#c8e4ef" font-family="Arial" font-size="16">Review generated SQL</text><text x="829" y="249" fill="#c8e4ef" font-family="Arial" font-size="16">Protect data loss</text></g><g filter="url(#shadow)"><rect x="45" y="325" width="350" height="155" rx="18" fill="#0d273b" stroke="#32e6a1" stroke-width="2"/><circle cx="80" cy="360" r="20" fill="#32e6a1"/><text x="80" y="367" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">4</text><text x="113" y="367" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">ENVIRONMENT</text><text x="69" y="407" fill="#c8e4ef" font-family="Arial" font-size="16">Externalize differences</text><text x="69" y="434" fill="#c8e4ef" font-family="Arial" font-size="16">No embedded secrets</text></g><g filter="url(#shadow)"><rect x="425" y="325" width="350" height="155" rx="18" fill="#0d273b" stroke="#20d9ff" stroke-width="2"/><circle cx="460" cy="360" r="20" fill="#20d9ff"/><text x="460" y="367" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">5</text><text x="493" y="367" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">VALIDATION</text><text x="449" y="407" fill="#c8e4ef" font-family="Arial" font-size="16">Known-result checks</text><text x="449" y="434" fill="#c8e4ef" font-family="Arial" font-size="16">Capture evidence</text></g><g filter="url(#shadow)"><rect x="805" y="325" width="350" height="155" rx="18" fill="#0d273b" stroke="#ff6f91" stroke-width="2"/><circle cx="840" cy="360" r="20" fill="#ff6f91"/><text x="840" y="367" text-anchor="middle" fill="#04121d" font-family="Arial" font-size="19" font-weight="700">6</text><text x="873" y="367" fill="#f6fbff" font-family="Arial" font-size="21" font-weight="700">RECOVERY</text><text x="829" y="407" fill="#c8e4ef" font-family="Arial" font-size="16">Failure branch</text><text x="829" y="434" fill="#c8e4ef" font-family="Arial" font-size="16">Document rollback</text></g><rect x="24" y="530" width="1152" height="46" rx="14" fill="#062a39" stroke="#20d9ff" stroke-opacity=".45"/><text x="600.0" y="560" text-anchor="middle" fill="#79e8ff" font-family="Arial" font-size="17" font-weight="700">Build  →  test twice  →  promote  →  validate  →  retain evidence</text></svg>