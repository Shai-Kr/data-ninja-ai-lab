<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Five release gates</title><desc id="d">Validate dates, milestones, progress, filters, and scale before using a Power BI Gantt report.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#112f43"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/>
<g font-family="Inter,Segoe UI,sans-serif"><text x="70" y="80" fill="#f3f8fb" font-size="34" font-weight="700">Release the page through five gates</text><text x="70" y="118" fill="#9fc4d8" font-size="20">Native visual does not mean automatic trust.</text>
<g transform="translate(70 170)"><rect width="200" height="335" rx="22" fill="#0d2637" stroke="#2489a8"/><circle cx="100" cy="62" r="32" fill="#123c51" stroke="#35d5ff"/><text x="100" y="71" text-anchor="middle" fill="#35d5ff" font-size="25" font-weight="700">1</text><text x="100" y="128" text-anchor="middle" fill="#f2f8fb" font-size="20" font-weight="700">DATE MEANING</text><text x="100" y="176" text-anchor="middle" fill="#b8d4e1" font-size="16">Baseline</text><text x="100" y="204" text-anchor="middle" fill="#b8d4e1" font-size="16">Forecast</text><text x="100" y="232" text-anchor="middle" fill="#b8d4e1" font-size="16">Actual</text><text x="100" y="292" text-anchor="middle" fill="#4fe2ff" font-size="16">No mixed semantics</text></g>
<g transform="translate(285 170)"><rect width="200" height="335" rx="22" fill="#0d2637" stroke="#2489a8"/><circle cx="100" cy="62" r="32" fill="#123c51" stroke="#35d5ff"/><text x="100" y="71" text-anchor="middle" fill="#35d5ff" font-size="25" font-weight="700">2</text><text x="100" y="128" text-anchor="middle" fill="#f2f8fb" font-size="20" font-weight="700">MILESTONES</text><text x="100" y="176" text-anchor="middle" fill="#b8d4e1" font-size="16">Explicit task type</text><text x="100" y="204" text-anchor="middle" fill="#b8d4e1" font-size="16">Controlled blank end</text><text x="100" y="292" text-anchor="middle" fill="#4fe2ff" font-size="16">No accidental markers</text></g>
<g transform="translate(500 170)"><rect width="200" height="335" rx="22" fill="#0d2637" stroke="#2489a8"/><circle cx="100" cy="62" r="32" fill="#123c51" stroke="#35d5ff"/><text x="100" y="71" text-anchor="middle" fill="#35d5ff" font-size="25" font-weight="700">3</text><text x="100" y="128" text-anchor="middle" fill="#f2f8fb" font-size="20" font-weight="700">PROGRESS</text><text x="100" y="176" text-anchor="middle" fill="#b8d4e1" font-size="16">Known calculation</text><text x="100" y="204" text-anchor="middle" fill="#b8d4e1" font-size="16">Correct aggregation</text><text x="100" y="292" text-anchor="middle" fill="#4fe2ff" font-size="16">Reconciled evidence</text></g>
<g transform="translate(715 170)"><rect width="200" height="335" rx="22" fill="#0d2637" stroke="#2489a8"/><circle cx="100" cy="62" r="32" fill="#123c51" stroke="#35d5ff"/><text x="100" y="71" text-anchor="middle" fill="#35d5ff" font-size="25" font-weight="700">4</text><text x="100" y="128" text-anchor="middle" fill="#f2f8fb" font-size="20" font-weight="700">FILTERS</text><text x="100" y="176" text-anchor="middle" fill="#b8d4e1" font-size="16">Project and owner</text><text x="100" y="204" text-anchor="middle" fill="#b8d4e1" font-size="16">Status and date</text><text x="100" y="292" text-anchor="middle" fill="#4fe2ff" font-size="16">Known-answer tests</text></g>
<g transform="translate(930 170)"><rect width="200" height="335" rx="22" fill="#0d2637" stroke="#2489a8"/><circle cx="100" cy="62" r="32" fill="#123c51" stroke="#35d5ff"/><text x="100" y="71" text-anchor="middle" fill="#35d5ff" font-size="25" font-weight="700">5</text><text x="100" y="128" text-anchor="middle" fill="#f2f8fb" font-size="20" font-weight="700">SCALE</text><text x="100" y="176" text-anchor="middle" fill="#b8d4e1" font-size="16">Bounded page</text><text x="100" y="204" text-anchor="middle" fill="#b8d4e1" font-size="16">Readable density</text><text x="100" y="232" text-anchor="middle" fill="#b8d4e1" font-size="16">1,000-row limit</text><text x="100" y="292" text-anchor="middle" fill="#4fe2ff" font-size="16">Summary plus detail</text></g>
<rect x="220" y="550" width="760" height="68" rx="20" fill="#123c51" stroke="#35d5ff" stroke-width="2"/><text x="600" y="593" text-anchor="middle" fill="#eaf7fb" font-size="22" font-weight="700">PASS: ready for a controlled delivery review</text></g></svg>
