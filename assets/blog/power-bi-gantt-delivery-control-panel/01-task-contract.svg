<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">A governed task contract</title><desc id="d">Six field groups make a Power BI Gantt timeline trustworthy.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102f43"/></linearGradient></defs>
<rect width="1200" height="675" rx="28" fill="url(#b)"/>
<g font-family="Inter,Segoe UI,sans-serif"><text x="70" y="80" fill="#f3f8fb" font-size="34" font-weight="700">One row needs a delivery contract</text><text x="70" y="118" fill="#9fc4d8" font-size="20">The timeline is only as trustworthy as the task grain beneath it.</text>
<rect x="420" y="150" width="360" height="88" rx="20" fill="#0d2637" stroke="#35d5ff" stroke-width="2"/><text x="600" y="188" text-anchor="middle" fill="#35d5ff" font-size="23" font-weight="700">DELIVERY TASK</text><text x="600" y="218" text-anchor="middle" fill="#d7edf7" font-size="17">One stable key, one outcome</text>
<g transform="translate(70 285)"><rect width="320" height="120" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="24" y="38" fill="#4fe2ff" font-size="21" font-weight="700">IDENTITY</text><text x="24" y="72" fill="#e2f1f7" font-size="18">Task key, project, workstream</text><text x="24" y="100" fill="#9fc4d8" font-size="16">Stable grain for every measure</text></g>
<g transform="translate(440 285)"><rect width="320" height="120" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="24" y="38" fill="#4fe2ff" font-size="21" font-weight="700">DATES</text><text x="24" y="72" fill="#e2f1f7" font-size="18">Baseline, forecast, actual</text><text x="24" y="100" fill="#9fc4d8" font-size="16">Preserve schedule movement</text></g>
<g transform="translate(810 285)"><rect width="320" height="120" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="24" y="38" fill="#4fe2ff" font-size="21" font-weight="700">PROGRESS</text><text x="24" y="72" fill="#e2f1f7" font-size="18">Percent plus method</text><text x="24" y="100" fill="#9fc4d8" font-size="16">Manual or evidence-based</text></g>
<g transform="translate(70 450)"><rect width="320" height="120" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="24" y="38" fill="#4fe2ff" font-size="21" font-weight="700">OWNERSHIP</text><text x="24" y="72" fill="#e2f1f7" font-size="18">Owner, status, next decision</text><text x="24" y="100" fill="#9fc4d8" font-size="16">Someone can act</text></g>
<g transform="translate(440 450)"><rect width="320" height="120" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="24" y="38" fill="#4fe2ff" font-size="21" font-weight="700">RISK</text><text x="24" y="72" fill="#e2f1f7" font-size="18">Dependency, severity, impact</text><text x="24" y="100" fill="#9fc4d8" font-size="16">Explain schedule movement</text></g>
<g transform="translate(810 450)"><rect width="320" height="120" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="24" y="38" fill="#4fe2ff" font-size="21" font-weight="700">EVIDENCE</text><text x="24" y="72" fill="#e2f1f7" font-size="18">Source, timestamp, record</text><text x="24" y="100" fill="#9fc4d8" font-size="16">Prove freshness and origin</text></g></g></svg>
