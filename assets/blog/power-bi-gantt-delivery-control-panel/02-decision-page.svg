<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Signal to schedule to action</title><desc id="d">A Power BI delivery page moves from portfolio signals to Gantt timeline to exception evidence.</desc>
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#112f43"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/>
<g font-family="Inter,Segoe UI,sans-serif"><text x="70" y="76" fill="#f3f8fb" font-size="34" font-weight="700">Signal to schedule to action</text><text x="70" y="113" fill="#9fc4d8" font-size="20">Explain the exception without displaying every task.</text>
<rect x="70" y="150" width="1060" height="100" rx="20" fill="#0d2637" stroke="#2489a8"/><text x="100" y="184" fill="#35d5ff" font-size="18" font-weight="700">PORTFOLIO SIGNALS</text><g fill="#e5f2f7" font-size="17"><text x="100" y="220">14 active projects</text><text x="320" y="220">7 milestones due</text><text x="545" y="220">11 late tasks</text><text x="745" y="220">4 stale updates</text><text x="950" y="220">+18 days drift</text></g>
<rect x="70" y="280" width="1060" height="230" rx="20" fill="#0d2637" stroke="#35d5ff" stroke-width="2"/><text x="100" y="316" fill="#35d5ff" font-size="18" font-weight="700">GOVERNED GANTT</text><g fill="#9fc4d8" font-size="15"><text x="100" y="365">Data platform</text><text x="100" y="412">Semantic model</text><text x="100" y="459">UAT milestone</text></g>
<g stroke="#274c61"><line x1="300" y1="338" x2="300" y2="485"/><line x1="500" y1="338" x2="500" y2="485"/><line x1="700" y1="338" x2="700" y2="485"/><line x1="900" y1="338" x2="900" y2="485"/><line x1="1100" y1="338" x2="1100" y2="485"/></g>
<rect x="330" y="348" width="360" height="28" rx="8" fill="#238eb0"/><rect x="330" y="348" width="250" height="28" rx="8" fill="#4fe2ff" opacity=".75"/><rect x="540" y="395" width="330" height="28" rx="8" fill="#7d65db"/><rect x="540" y="395" width="165" height="28" rx="8" fill="#b7a7ff" opacity=".72"/><polygon points="930,438 946,454 930,470 914,454" fill="#ffbf59"/>
<rect x="70" y="540" width="1060" height="82" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="100" y="574" fill="#35d5ff" font-size="18" font-weight="700">EXCEPTION EVIDENCE</text><text x="340" y="574" fill="#e5f2f7" font-size="17">Dependency</text><text x="510" y="574" fill="#e5f2f7" font-size="17">Owner</text><text x="650" y="574" fill="#e5f2f7" font-size="17">Source record</text><text x="850" y="574" fill="#e5f2f7" font-size="17">Next decision</text><text x="100" y="605" fill="#9fc4d8" font-size="15">Drill through when a signal needs action</text></g></svg>
