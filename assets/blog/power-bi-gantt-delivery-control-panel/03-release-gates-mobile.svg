<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Five release gates</title><desc id="d">Validate dates, milestones, progress, filters, and scale.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#112f43"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#b)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="36" y="58" fill="#f3f8fb" font-size="30" font-weight="700">Five release gates</text><text x="36" y="92" fill="#9fc4d8" font-size="18">Native visual still needs proof.</text>
