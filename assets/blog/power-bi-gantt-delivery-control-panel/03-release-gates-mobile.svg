-size="24" font-weight="700">5</text><text x="105" y="48" fill="#f2f8fb" font-size="22" font-weight="700">SCALE</text><text x="105" y="80" fill="#b8d4e1" font-size="18">Readable near the 1,000-row limit</text></g><rect x="100" y="810" width="400" height="58" rx="18" fill="#123c51" stroke="#35d5ff"/><text x="300" y="847" text-anchor="middle" fill="#eaf7fb" font-size="20" font-weight="700">PASS: controlled review ready</text></g></svg>
