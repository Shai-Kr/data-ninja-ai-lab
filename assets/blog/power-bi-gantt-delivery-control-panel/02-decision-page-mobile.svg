<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Signal to action</title><desc id="d">Portfolio signals lead to a timeline and exception evidence.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#112f43"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#b)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="36" y="58" fill="#f3f8fb" font-size="30" font-weight="700">Signal to action</text><text x="36" y="92" fill="#9fc4d8" font-size="18">A bounded delivery review page.</text>
<rect x="36" y="125" width="528" height="190" rx="20" fill="#0d2637" stroke="#2489a8"/><text x="62" y="162" fill="#35d5ff" font-size="21" font-weight="700">1. PORTFOLIO SIGNALS</text><text x="62" y="205" fill="#e5f2f7" font-size="18">14 active projects</text><text x="310" y="205" fill="#e5f2f7" font-size="18">7 milestones due</text><text x="62" y="245" fill="#e5f2f7" font-size="18">11 late tasks</text><text x="310" y="245" fill="#e5f2f7" font-size="18">4 stale updates</text><text x="62" y="285" fill="#e5f2f7" font-size="18">+18 days forecast drift</text>
<rect x="36" y="340" width="528" height="310" rx="20" fill="#0d2637" stroke="#35d5ff" stroke-width="2"/><text x="62" y="380" fill="#35d5ff" font-size="21" font-weight="700">2. GOVERNED GANTT</text><text x="62" y="435" fill="#9fc4d8" font-size="18">Data platform</text><rect x="230" y="414" width="260" height="30" rx="8" fill="#238eb0"/><rect x="230" y="414" width="180" height="30" rx="8" fill="#4fe2ff" opacity=".75"/><text x="62" y="505" fill="#9fc4d8" font-size="18">Semantic model</text><rect x="250" y="484" width="240" height="30" rx="8" fill="#7d65db"/><rect x="250" y="484" width="120" height="30" rx="8" fill="#b7a7ff" opacity=".72"/><text x="62" y="575" fill="#9fc4d8" font-size="18">UAT milestone</text><polygon points="400,553 418,571 400,589 382,571" fill="#ffbf59"/>
