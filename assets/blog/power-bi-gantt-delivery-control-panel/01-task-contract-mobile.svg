<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Task contract</title><desc id="d">Six groups for a governed Gantt task.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102f43"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#b)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="36" y="58" fill="#f3f8fb" font-size="30" font-weight="700">One task, six field groups</text><text x="36" y="92" fill="#9fc4d8" font-size="18">Trust starts below the timeline.</text>
<g transform="translate(36 125)"><rect width="528" height="105" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="22" y="38" fill="#4fe2ff" font-size="22" font-weight="700">IDENTITY</text><text x="22" y="74" fill="#e2f1f7" font-size="19">Task key, project, workstream</text></g><g transform="translate(36 245)"><rect width="528" height="105" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="22" y="38" fill="#4fe2ff" font-size="22" font-weight="700">DATES</text><text x="22" y="74" fill="#e2f1f7" font-size="19">Baseline, forecast, actual</text></g><g transform="translate(36 365)"><rect width="528" height="105" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="22" y="38" fill="#4fe2ff" font-size="22" font-weight="700">PROGRESS</text><text x="22" y="74" fill="#e2f1f7" font-size="19">Percent plus calculation method</text></g><g transform="translate(36 485)"><rect width="528" height="105" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="22" y="38" fill="#4fe2ff" font-size="22" font-weight="700">OWNERSHIP</text><text x="22" y="74" fill="#e2f1f7" font-size="19">Owner, status, next decision</text></g><g transform="translate(36 605)"><rect width="528" height="105" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="22" y="38" fill="#4fe2ff" font-size="22" font-weight="700">RISK</text><text x="22" y="74" fill="#e2f1f7" font-size="19">Dependency, severity, impact</text></g><g transform="translate(36 725)"><rect width="528" height="105" rx="18" fill="#102b3e" stroke="#2489a8"/><text x="22" y="38" fill="#4fe2ff" font-size="22" font-weight="700">EVIDENCE</text><text x="22" y="74" fill="#e2f1f7" font-size="19">Source, timestamp, record link</text></g></g></svg>
