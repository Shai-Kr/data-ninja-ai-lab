<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061426"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:34px;fill:#f8fafc}
      .sub{font-family:Inter,Arial,sans-serif;font-weight:600;font-size:18px;fill:#cbd5e1}
      .step{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:24px;fill:#f8fafc}
      .body{font-family:Inter,Arial,sans-serif;font-weight:550;font-size:18px;fill:#cbd5e1}
      .num{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:22px;fill:#020617}
      .foot{font-family:JetBrains Mono,monospace;font-weight:650;font-size:16px;fill:#93c5fd}
    </style>
  </defs>
  <rect width="760" height="640" rx="30" fill="url(#bg)"/>
  <circle cx="660" cy="75" r="110" fill="#2563eb" opacity="0.18"/>
  <circle cx="80" cy="545" r="125" fill="#7c3aed" opacity="0.16"/>
  <text x="38" y="62" class="title">Event contract first</text>
  <text x="40" y="98" class="sub">Automation is safer when the event is owned</text>
  <rect x="40" y="155" width="680" height="72" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="76" cy="191" r="22" fill="#38bdf8"/>
  <text x="68" y="199" class="num">1</text>
  <text x="114" y="185" class="step">Name</text>
  <text x="114" y="212" class="body">Clear business meaning, not a vague alert</text>
  <rect x="40" y="247" width="680" height="72" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="76" cy="283" r="22" fill="#a78bfa"/>
  <text x="68" y="291" class="num">2</text>
  <text x="114" y="277" class="step">Payload</text>
  <text x="114" y="304" class="body">Only the fields the response actually needs</text>
  <rect x="40" y="339" width="680" height="72" rx="20" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <circle cx="76" cy="375" r="22" fill="#22c55e"/>
  <text x="68" y="383" class="num">3</text>
  <text x="114" y="369" class="step">Owner</text>
  <text x="114" y="396" class="body">One team owns the rule and reaction path</text>
  <rect x="40" y="431" width="680" height="72" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="76" cy="467" r="22" fill="#f59e0b"/>
  <text x="68" y="475" class="num">4</text>
  <text x="114" y="461" class="step">History</text>
  <text x="114" y="488" class="body">Retention and analysis path in Eventhouse</text>
  <text x="42" y="606" class="foot">Business event design beats alert sprawl</text>
</svg>