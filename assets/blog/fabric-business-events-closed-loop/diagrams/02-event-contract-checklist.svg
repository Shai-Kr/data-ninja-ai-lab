<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061426"/><stop offset="0.55" stop-color="#0c1226"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:42px;fill:#f8fafc}
      .sub{font-family:Inter,Arial,sans-serif;font-weight:500;font-size:22px;fill:#cbd5e1}
      .boxTitle{font-family:Inter,Arial,sans-serif;font-weight:750;font-size:24px;fill:#f8fafc}
      .boxText{font-family:Inter,Arial,sans-serif;font-weight:500;font-size:17px;fill:#cbd5e1}
      .footer{font-family:JetBrains Mono,monospace;font-weight:600;font-size:18px;fill:#93c5fd}
      .num{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:28px;fill:#020617}
    </style>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1070" cy="115" r="155" fill="#2563eb" opacity="0.16"/>
  <circle cx="180" cy="630" r="185" fill="#7c3aed" opacity="0.14"/>
  <path d="M70 160 C310 70, 540 90, 770 150 S1120 205,1215 130" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="5"/>
  <text x="70" y="90" class="title">The event contract is the product</text>
  <text x="72" y="130" class="sub">Useful events need ownership before automation</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker></defs>  <rect x="90" y="270" width="255" height="170" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="124" cy="306" r="19" fill="#38bdf8" filter="url(#glow)"/><text x="115" y="316" class="num">1</text>
  <text x="155" y="316" class="boxTitle">Name</text>
  <text x="120" y="356" class="boxText">Business meaning</text>
  <text x="120" y="383" class="boxText">stable vocabulary</text>
  <path d="M355 355 H395" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.85"/>
  <rect x="370" y="270" width="255" height="170" rx="24" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="404" cy="306" r="19" fill="#a78bfa" filter="url(#glow)"/><text x="395" y="316" class="num">2</text>
  <text x="435" y="316" class="boxTitle">Payload</text>
  <text x="400" y="356" class="boxText">Only fields needed</text>
  <text x="400" y="383" class="boxText">no accidental leakage</text>
  <path d="M635 355 H675" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.85"/>
  <rect x="650" y="270" width="255" height="170" rx="24" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="684" cy="306" r="19" fill="#22c55e" filter="url(#glow)"/><text x="675" y="316" class="num">3</text>
  <text x="715" y="316" class="boxTitle">Consumer</text>
  <text x="680" y="356" class="boxText">Who reacts</text>
  <text x="680" y="383" class="boxText">what action is allowed</text>
  <path d="M915 355 H955" stroke="#22c55e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.85"/>
  <rect x="930" y="270" width="255" height="170" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="964" cy="306" r="19" fill="#f59e0b" filter="url(#glow)"/><text x="955" y="316" class="num">4</text>
  <text x="995" y="316" class="boxTitle">History</text>
  <text x="960" y="356" class="boxText">Retention, query path</text>
  <text x="960" y="383" class="boxText">and operational evidence</text>
  <text x="72" y="660" class="footer">Business event design beats alert sprawl</text>
</svg>