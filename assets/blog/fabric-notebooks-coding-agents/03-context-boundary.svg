<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Context sharing boundary for Fabric notebook coding agents</title><desc id="desc">Context sharing boundary for Fabric notebook coding agents</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1b2d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42d9ff"/></marker></defs>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#42d9ff" text-anchor="start">THE CONTEXT BOUNDARY</text><text x="60" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="500" fill="#a9c4d8" text-anchor="start">Useful context is not the same as unrestricted access.</text><rect x="55" y="145" width="360" height="440" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="79" y="198" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#edf8ff" text-anchor="start">SHARED BY DEFAULT</text><circle cx="90" cy="238" r="7" fill="#48e1a8"/><text x="112" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Notebook identity</text><circle cx="90" cy="310" r="7" fill="#48e1a8"/><text x="112" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Target + revision</text><circle cx="90" cy="382" r="7" fill="#48e1a8"/><text x="112" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Language + runtime</text><circle cx="90" cy="454" r="7" fill="#48e1a8"/><text x="112" y="461" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Attached metadata</text><rect x="420" y="145" width="360" height="440" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="444" y="198" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#edf8ff" text-anchor="start">EXPLICIT CONSENT</text><circle cx="455" cy="238" r="7" fill="#ffc86b"/><text x="477" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Resource content</text><circle cx="455" cy="310" r="7" fill="#ffc86b"/><text x="477" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Sample rows</text><circle cx="455" cy="382" r="7" fill="#ffc86b"/><text x="477" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Selected resource only</text><circle cx="455" cy="454" r="7" fill="#ffc86b"/><text x="477" y="461" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Prompt-bounded use</text><rect x="785" y="145" width="360" height="440" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="809" y="198" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#edf8ff" text-anchor="start">EXCLUDED / REDACTED</text><circle cx="820" cy="238" r="7" fill="#ff7f9c"/><text x="842" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Access tokens</text><circle cx="820" cy="310" r="7" fill="#ff7f9c"/><text x="842" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Configured secrets</text><circle cx="820" cy="382" r="7" fill="#ff7f9c"/><text x="842" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Known sensitive fields</text><circle cx="820" cy="454" r="7" fill="#ff7f9c"/><text x="842" y="461" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Unrelated workspace data</text><rect x="180" y="610" width="840" height="45" rx="14" fill="#0b2437" stroke="#24516c" stroke-width="2"/><text x="600" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#edf8ff" text-anchor="middle">Permissions still apply. Generated code still requires human review.</text></svg>