<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">A controlled context handoff from Fabric notebook to coding agent</title><desc id="desc">A controlled context handoff from Fabric notebook to coding agent</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1b2d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42d9ff"/></marker></defs>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="60" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#42d9ff" text-anchor="start">THE USEFUL SHIFT: CONTEXT MOVES WITH THE REQUEST</text><rect x="55" y="125" width="350" height="350" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="79" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">FABRIC NOTEBOOK</text><text x="79" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Language + target cell</text><text x="79" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Document revision</text><text x="79" y="339" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Runtime + workspace</text><rect x="425" y="125" width="350" height="350" rx="22" fill="#102a42" stroke="#24516c" stroke-width="2"/><text x="449" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">LOCAL MCP HANDOFF</text><text x="449" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Approved metadata only</text><text x="449" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Attached resource context</text><text x="449" y="339" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Context change invalidates request</text><rect x="795" y="125" width="350" height="350" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="819" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">CODING AGENT</text><text x="819" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Claude Code or Codex</text><text x="819" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Proposes code for one target</text><text x="819" y="339" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Does not execute the result</text><line x1="405" y1="300" x2="422" y2="300" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="775" y1="300" x2="792" y2="300" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="150" y="520" width="900" height="78" rx="18" fill="#0b2437" stroke="#42d9ff" stroke-width="2"/><text x="600" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="middle">Prompt stays short. Review and execution stay with the engineer.</text></svg>