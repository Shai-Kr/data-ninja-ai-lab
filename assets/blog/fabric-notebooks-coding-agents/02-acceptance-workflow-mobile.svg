<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1280" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc">
<title id="title">Four-step acceptance workflow for agent-generated Fabric notebook code</title><desc id="desc">Four-step acceptance workflow for agent-generated Fabric notebook code</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1b2d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42d9ff"/></marker></defs>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="380" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#42d9ff" text-anchor="middle">ACCEPTANCE WORKFLOW</text><rect x="65" y="105" width="630" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">1. LOCK CONTEXT</text><text x="95" y="217" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Open the Fabric notebook</text><text x="95" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Select one cell or insertion point</text><rect x="65" y="360" width="630" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">2. STATE THE RESULT</text><text x="95" y="472" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Name the source, transformation</text><text x="95" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">and expected output</text><rect x="65" y="615" width="630" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">3. REVIEW THE DIFF</text><text x="95" y="727" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Check imports, paths, joins,</text><text x="95" y="763" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">filters and write operations</text><rect x="65" y="870" width="630" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="925" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">4. RUN WITH EVIDENCE</text><text x="95" y="982" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Execute deliberately</text><text x="95" y="1018" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Compare to a known result</text><line x1="380" y1="315" x2="380" y2="353" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="380" y1="570" x2="380" y2="608" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="380" y1="825" x2="380" y2="863" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="1120" width="630" height="100" rx="16" fill="#0b2437" stroke="#48e1a8" stroke-width="2"/><text x="380" y="1162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#edf8ff" text-anchor="middle">Reviewed change.</text><text x="380" y="1197" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#edf8ff" text-anchor="middle">Not a trusted answer.</text></svg>