<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc">
<title id="title">A controlled context handoff from Fabric notebook to coding agent</title><desc id="desc">A controlled context handoff from Fabric notebook to coding agent</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1b2d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42d9ff"/></marker></defs>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="380" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#42d9ff" text-anchor="middle">CONTEXT MOVES WITH THE REQUEST</text><rect x="65" y="105" width="630" height="235" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="157" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">FABRIC NOTEBOOK</text><text x="95" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Language + target cell</text><text x="95" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Document revision</text><text x="95" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Runtime + workspace</text><rect x="65" y="390" width="630" height="235" rx="22" fill="#102a42" stroke="#24516c" stroke-width="2"/><text x="95" y="442" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">LOCAL MCP HANDOFF</text><text x="95" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Approved metadata only</text><text x="95" y="533" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Attached resource context</text><text x="95" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Context change invalidates request</text><rect x="65" y="675" width="630" height="235" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="727" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">CODING AGENT</text><text x="95" y="780" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Claude Code or Codex</text><text x="95" y="818" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Proposes code for one target</text><text x="95" y="856" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="start">Does not execute the result</text><line x1="380" y1="345" x2="380" y2="383" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="380" y1="630" x2="380" y2="668" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="950" width="630" height="82" rx="18" fill="#0b2437" stroke="#42d9ff" stroke-width="2"/><text x="380" y="985" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#edf8ff" text-anchor="middle">Short prompt. Explicit review.</text><text x="380" y="1017" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#edf8ff" text-anchor="middle">Engineer-controlled execution.</text></svg>