<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1510" viewBox="0 0 760 1510" role="img" aria-labelledby="title desc">
<title id="title">Context sharing boundary for Fabric notebook coding agents</title><desc id="desc">Context sharing boundary for Fabric notebook coding agents</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1b2d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42d9ff"/></marker></defs>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="380" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#42d9ff" text-anchor="middle">THE CONTEXT BOUNDARY</text><text x="380" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#a9c4d8" text-anchor="middle">Useful context is not unrestricted access.</text><rect x="65" y="135" width="630" height="365" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#edf8ff" text-anchor="start">SHARED BY DEFAULT</text><circle cx="105" cy="240" r="7" fill="#48e1a8"/><text x="130" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Notebook identity</text><circle cx="105" cy="296" r="7" fill="#48e1a8"/><text x="130" y="303" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Target + revision</text><circle cx="105" cy="352" r="7" fill="#48e1a8"/><text x="130" y="359" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Language + runtime</text><circle cx="105" cy="408" r="7" fill="#48e1a8"/><text x="130" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Attached metadata</text><rect x="65" y="555" width="630" height="365" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#edf8ff" text-anchor="start">EXPLICIT CONSENT</text><circle cx="105" cy="660" r="7" fill="#ffc86b"/><text x="130" y="667" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Resource content</text><circle cx="105" cy="716" r="7" fill="#ffc86b"/><text x="130" y="723" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Sample rows</text><circle cx="105" cy="772" r="7" fill="#ffc86b"/><text x="130" y="779" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Selected resource only</text><circle cx="105" cy="828" r="7" fill="#ffc86b"/><text x="130" y="835" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Prompt-bounded use</text><rect x="65" y="975" width="630" height="365" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="95" y="1030" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#edf8ff" text-anchor="start">EXCLUDED / REDACTED</text><circle cx="105" cy="1080" r="7" fill="#ff7f9c"/><text x="130" y="1087" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Access tokens</text><circle cx="105" cy="1136" r="7" fill="#ff7f9c"/><text x="130" y="1143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Configured secrets</text><circle cx="105" cy="1192" r="7" fill="#ff7f9c"/><text x="130" y="1199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Known sensitive fields</text><circle cx="105" cy="1248" r="7" fill="#ff7f9c"/><text x="130" y="1255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#a9c4d8" text-anchor="start">Unrelated workspace data</text><rect x="65" y="1385" width="630" height="80" rx="16" fill="#0b2437" stroke="#24516c" stroke-width="2"/><text x="380" y="1420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#edf8ff" text-anchor="middle">Permissions still apply.</text><text x="380" y="1451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#edf8ff" text-anchor="middle">Human review still applies.</text></svg>