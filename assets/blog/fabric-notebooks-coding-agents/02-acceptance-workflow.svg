<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Four-step acceptance workflow for agent-generated Fabric notebook code</title><desc id="desc">Four-step acceptance workflow for agent-generated Fabric notebook code</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1b2d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42d9ff"/></marker></defs>
<rect width="100%" height="100%" fill="url(#bg)"/><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#42d9ff" text-anchor="start">A FOUR-STEP ACCEPTANCE WORKFLOW</text><rect x="60" y="120" width="510" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="88" y="175" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">1. LOCK CONTEXT</text><text x="88" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Open the Fabric notebook</text><text x="88" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Select one cell or insertion point</text><rect x="630" y="120" width="510" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="658" y="175" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">2. STATE THE RESULT</text><text x="658" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Name the source, transformation</text><text x="658" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">and expected output</text><rect x="60" y="380" width="510" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="88" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">3. REVIEW THE DIFF</text><text x="88" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Check imports, paths, joins,</text><text x="88" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">filters and write operations</text><rect x="630" y="380" width="510" height="205" rx="22" fill="#0d2034" stroke="#24516c" stroke-width="2"/><text x="658" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#edf8ff" text-anchor="start">4. RUN WITH EVIDENCE</text><text x="658" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Execute deliberately</text><text x="658" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#a9c4d8" text-anchor="start">Compare to a known result</text><line x1="570" y1="222" x2="627" y2="222" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="885" y1="326" x2="885" y2="376" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="630" y1="482" x2="573" y2="482" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="220" y="625" width="760" height="60" rx="16" fill="#0b2437" stroke="#48e1a8" stroke-width="2"/><text x="600" y="664" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#edf8ff" text-anchor="middle">Generated code becomes a reviewed change, not a trusted answer.</text></svg>