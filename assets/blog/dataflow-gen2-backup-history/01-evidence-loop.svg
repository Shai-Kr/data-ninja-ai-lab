<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><rect width="1200" height="675" fill="url(#bg)"/><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1930"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#31d7ff"/></marker></defs><text x="60" y="74" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" text-anchor="start">The query-result evidence loop</text><text x="60" y="112" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start">Preserve selected Dataflow Gen2 outputs, then compare with context</text><rect x="55" y="190" width="250" height="255" rx="22" fill="#10243b" stroke="#4f7cff" stroke-width="3"/><circle cx="93" cy="226" r="22" fill="#4f7cff"/><text x="93" y="234" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">1</text><text x="83" y="286" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" text-anchor="start">Source</text><text x="83" y="333" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Operational data</text><text x="83" y="362" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">at refresh time</text><path d="M307 317 L329 317" stroke="#31d7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="335" y="190" width="250" height="255" rx="22" fill="#10243b" stroke="#31d7ff" stroke-width="3"/><circle cx="373" cy="226" r="22" fill="#31d7ff"/><text x="373" y="234" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">2</text><text x="363" y="286" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" text-anchor="start">Dataflow Gen2</text><text x="363" y="333" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Transform query</text><text x="363" y="362" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">request ID + time</text><path d="M587 317 L609 317" stroke="#31d7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="615" y="190" width="250" height="255" rx="22" fill="#10243b" stroke="#55e6a5" stroke-width="3"/><circle cx="653" cy="226" r="22" fill="#55e6a5"/><text x="653" y="234" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">3</text><text x="643" y="286" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" text-anchor="start">Backup history</text><text x="643" y="333" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Lakehouse snapshots</text><text x="643" y="362" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">comparable runs</text><path d="M867 317 L889 317" stroke="#31d7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="895" y="190" width="250" height="255" rx="22" fill="#10243b" stroke="#ffc857" stroke-width="3"/><circle cx="933" cy="226" r="22" fill="#ffc857"/><text x="933" y="234" fill="#07111f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">4</text><text x="923" y="286" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" text-anchor="start">Decision</text><text x="923" y="333" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Accept, investigate</text><text x="923" y="362" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">or recover</text><rect x="145" y="505" width="910" height="88" rx="18" fill="#0a2232" stroke="#31d7ff" stroke-width="2"/><text x="600" y="542" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">The output snapshot is linked to the exact refresh that produced it</text><text x="600" y="571" fill="#a9bfd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">Evidence turns a successful run into an explainable result</text><text x="1158" y="651" fill="#63809f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="end">Shai Karmani • Data Ninja AI Lab</text></svg>