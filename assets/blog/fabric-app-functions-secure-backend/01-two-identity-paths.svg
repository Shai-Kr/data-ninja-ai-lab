<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Two identity paths in Fabric App functions</title><desc id="d">External resources use app identity while Rayfin database access preserves caller identity.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071529"/><stop offset="1" stop-color="#102746"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#f6fbff" font-size="34" font-weight="700">Two identity paths, one server boundary</text><text x="70" y="120" fill="#9db6d0" font-size="20">Document which identity reaches each resource before deployment.</text><rect x="70" y="225" width="230" height="150" rx="22" fill="#102f4f" stroke="#31d7ff" stroke-width="2"/><text x="185" y="282" text-anchor="middle" fill="#31d7ff" font-size="23" font-weight="700">Signed-in user</text><text x="185" y="325" text-anchor="middle" fill="#d9e7f5" font-size="18">Fabric App browser</text><path d="M300 300H430" stroke="#31d7ff" stroke-width="4"/><path d="M416 290l14 10-14 10" fill="none" stroke="#31d7ff" stroke-width="4"/><rect x="430" y="205" width="290" height="190" rx="24" fill="#142f4c" stroke="#8d70ff" stroke-width="3"/><text x="575" y="270" text-anchor="middle" fill="#c5b9ff" font-size="25" font-weight="700">TypeScript function</text><text x="575" y="315" text-anchor="middle" fill="#f1f6fb" font-size="18">Validation and business logic</text><text x="575" y="350" text-anchor="middle" fill="#f1f6fb" font-size="18">Secrets stay server-side</text><path d="M720 250H830" stroke="#ffb44a" stroke-width="4"/><path d="M816 240l14 10-14 10" fill="none" stroke="#ffb44a" stroke-width="4"/><text x="775" y="228" text-anchor="middle" fill="#ffce84" font-size="15">App identity</text><rect x="830" y="175" width="300" height="150" rx="22" fill="#173346" stroke="#ffb44a" stroke-width="2"/><text x="980" y="228" text-anchor="middle" fill="#ffce84" font-size="22" font-weight="700">External resources</text><text x="980" y="266" text-anchor="middle" fill="#dbe7ef" font-size="17">Fabric, SQL, Storage, AI, ADO</text><text x="980" y="296" text-anchor="middle" fill="#96adbd" font-size="15">ctx.Tokens.*</text><path d="M720 355c50 0 60 120 110 120" stroke="#48e0a4" stroke-width="4" fill="none"/><path d="M816 465l14 10-14 10" fill="none" stroke="#48e0a4" stroke-width="4"/><text x="750" y="435" fill="#83f3c5" font-size="15">Caller identity</text><rect x="830" y="405" width="300" height="150" rx="22" fill="#14394a" stroke="#48e0a4" stroke-width="2"/><text x="980" y="458" text-anchor="middle" fill="#83f3c5" font-size="22" font-weight="700">Rayfin database</text><text x="980" y="498" text-anchor="middle" fill="#dbe7ef" font-size="17">Caller permissions preserved</text><text x="980" y="528" text-anchor="middle" fill="#96adbd" font-size="15">ctx.getDataClient()</text><text x="70" y="620" fill="#8ca7c0" font-size="16">App sign-in, function invocation, and downstream authorization are separate decisions.</text></g></svg>