<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Release evidence loop</title><desc id="d">Local test, deployment, identity proof, denial proof, and operations.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071529"/><stop offset="1" stop-color="#102746"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="70" y="78" fill="#f6fbff" font-size="34" font-weight="700">Release with deployed evidence</text><text x="70" y="118" fill="#9db6d0" font-size="20">Local access and runtime identity are different proof points.</text><path d="M160 335H1040" stroke="#244f70" stroke-width="8" stroke-linecap="round"/><g transform="translate(160 335)" text-anchor="middle"><circle r="62" fill="#153149" stroke="#31d7ff" stroke-width="4"/><text y="-5" fill="#31d7ff" font-size="24" font-weight="700">1</text><text y="24" fill="#f1f6fb" font-size="16">Local test</text><text y="115" fill="#9db6d0" font-size="16">Developer identity</text></g><g transform="translate(380 335)" text-anchor="middle"><circle r="62" fill="#153149" stroke="#8d70ff" stroke-width="4"/><text y="-5" fill="#8d70ff" font-size="24" font-weight="700">2</text><text y="24" fill="#f1f6fb" font-size="16">Deploy</text><text y="115" fill="#9db6d0" font-size="16">App and functions</text></g><g transform="translate(600 335)" text-anchor="middle"><circle r="62" fill="#153149" stroke="#48e0a4" stroke-width="4"/><text y="-5" fill="#48e0a4" font-size="24" font-weight="700">3</text><text y="24" fill="#f1f6fb" font-size="16">Prove identity</text><text y="115" fill="#9db6d0" font-size="16">Allowed resource</text></g><g transform="translate(820 335)" text-anchor="middle"><circle r="62" fill="#153149" stroke="#ff668f" stroke-width="4"/><text y="-5" fill="#ff668f" font-size="24" font-weight="700">4</text><text y="24" fill="#f1f6fb" font-size="16">Prove denial</text><text y="115" fill="#9db6d0" font-size="16">Resource and row</text></g><g transform="translate(1040 335)" text-anchor="middle"><circle r="62" fill="#153149" stroke="#ffb44a" stroke-width="4"/><text y="-5" fill="#ffb44a" font-size="24" font-weight="700">5</text><text y="24" fill="#f1f6fb" font-size="16">Operate</text><text y="115" fill="#9db6d0" font-size="16">Safe evidence</text></g><rect x="120" y="525" width="960" height="76" rx="18" fill="#0e2943" stroke="#2f5878"/><text x="600" y="557" text-anchor="middle" fill="#dce9f5" font-size="18">Pass: expected identity, least privilege, safe failure, useful correlation data</text><text x="600" y="584" text-anchor="middle" fill="#8ca7c0" font-size="15">A successful deployment starts runtime validation.</text></g></svg>