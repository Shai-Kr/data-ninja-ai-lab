<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Six-part function contract</title><desc id="d">Business action, input, identity, audience, failure behavior, and evidence.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071529"/><stop offset="1" stop-color="#102746"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="70" y="78" fill="#f6fbff" font-size="34" font-weight="700">A function is a small service contract</text><text x="70" y="118" fill="#9db6d0" font-size="20">Six fields make the boundary reviewable and supportable.</text><g transform="translate(70 175)"><rect width="320" height="150" rx="20" fill="#112f4d" stroke="#31d7ff" stroke-width="2"/><text x="28" y="45" fill="#31d7ff" font-size="18" font-weight="700">01  BUSINESS ACTION</text><text x="28" y="87" fill="#f1f6fb" font-size="20">One owned outcome</text><text x="28" y="119" fill="#9db6d0" font-size="16">Clear side effect and owner</text></g><g transform="translate(440 175)"><rect width="320" height="150" rx="20" fill="#112f4d" stroke="#8d70ff" stroke-width="2"/><text x="28" y="45" fill="#8d70ff" font-size="18" font-weight="700">02  INPUT CONTRACT</text><text x="28" y="87" fill="#f1f6fb" font-size="20">Validate on the server</text><text x="28" y="119" fill="#9db6d0" font-size="16">Do not trust browser checks</text></g><g transform="translate(810 175)"><rect width="320" height="150" rx="20" fill="#112f4d" stroke="#48e0a4" stroke-width="2"/><text x="28" y="45" fill="#48e0a4" font-size="18" font-weight="700">03  IDENTITY PATH</text><text x="28" y="87" fill="#f1f6fb" font-size="20">App, caller, or both</text><text x="28" y="119" fill="#9db6d0" font-size="16">Map every resource call</text></g><g transform="translate(70 375)"><rect width="320" height="150" rx="20" fill="#112f4d" stroke="#ffb44a" stroke-width="2"/><text x="28" y="45" fill="#ffb44a" font-size="18" font-weight="700">04  RESOURCE AUDIENCE</text><text x="28" y="87" fill="#f1f6fb" font-size="20">Declare and grant</text><text x="28" y="119" fill="#9db6d0" font-size="16">Binding is not permission</text></g><g transform="translate(440 375)"><rect width="320" height="150" rx="20" fill="#112f4d" stroke="#ff668f" stroke-width="2"/><text x="28" y="45" fill="#ff668f" font-size="18" font-weight="700">05  FAILURE BEHAVIOR</text><text x="28" y="87" fill="#f1f6fb" font-size="20">Bound retries and timeouts</text><text x="28" y="119" fill="#9db6d0" font-size="16">Safe partial-failure path</text></g><g transform="translate(810 375)"><rect width="320" height="150" rx="20" fill="#112f4d" stroke="#70b6ff" stroke-width="2"/><text x="28" y="45" fill="#70b6ff" font-size="18" font-weight="700">06  EVIDENCE</text><text x="28" y="87" fill="#f1f6fb" font-size="20">Correlation and result</text><text x="28" y="119" fill="#9db6d0" font-size="16">Never log secrets</text></g><text x="70" y="605" fill="#8ca7c0" font-size="16">If the contract does not fit on one page, the first function is probably doing too much.</text></g></svg>