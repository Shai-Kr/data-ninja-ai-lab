<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Warehouse monitoring operating model</title><desc id="d">Five stacked controls cover scope, baseline, ownership, investigation, and evidence.</desc><rect width="600" height="900" rx="28" fill="#081426"/><text x="42" y="62" fill="#effaff" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">Monitoring that survives an incident</text><text x="42" y="96" fill="#8fb4c9" font-family="Inter,Segoe UI,sans-serif" font-size="17">Five controls, one repeatable path</text><g font-family="Inter,Segoe UI,sans-serif">
<rect x="42" y="132" width="516" height="116" rx="20" fill="#10273a" stroke="#22d3ee" stroke-width="2"/><text x="70" y="174" fill="#67e8f9" font-size="17" font-weight="700">01  SCOPE</text><text x="70" y="214" fill="#fff" font-size="21" font-weight="700">Items expected to emit, plus exclusions</text>
<rect x="42" y="268" width="516" height="116" rx="20" fill="#12263e" stroke="#38bdf8" stroke-width="2"/><text x="70" y="310" fill="#7dd3fc" font-size="17" font-weight="700">02  BASELINE</text><text x="70" y="350" fill="#fff" font-size="21" font-weight="700">P50, P95, failures, volume, CPU</text>
<rect x="42" y="404" width="516" height="116" rx="20" fill="#14233d" stroke="#60a5fa" stroke-width="2"/><text x="70" y="446" fill="#93c5fd" font-size="17" font-weight="700">03  OWNERSHIP</text><text x="70" y="486" fill="#fff" font-size="21" font-weight="700">Item mapped to service and owner</text>
<rect x="42" y="540" width="516" height="116" rx="20" fill="#18213c" stroke="#818cf8" stroke-width="2"/><text x="70" y="582" fill="#a5b4fc" font-size="17" font-weight="700">04  INVESTIGATE</text><text x="70" y="622" fill="#fff" font-size="21" font-weight="700">OperationId links KQL to Query Insights</text>
<rect x="42" y="676" width="516" height="116" rx="20" fill="#1d203a" stroke="#a78bfa" stroke-width="2"/><text x="70" y="718" fill="#c4b5fd" font-size="17" font-weight="700">05  EVIDENCE</text><text x="70" y="758" fill="#fff" font-size="21" font-weight="700">Action, result, and comparison window</text></g><rect x="80" y="824" width="440" height="48" rx="24" fill="#0b2a3d" stroke="#164e63"/><text x="300" y="855" text-anchor="middle" fill="#b7f4ff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="600">Detect, assign, diagnose, compare</text></svg>
