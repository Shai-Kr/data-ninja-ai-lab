<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Warehouse monitoring operating model</title><desc id="d">Five connected controls cover scope, baseline, ownership, investigation, and evidence.</desc><defs><linearGradient id="bg" x2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#121a34"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="78" fill="#effaff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Turn query telemetry into an operating model</text><text x="70" y="116" fill="#8fb4c9" font-family="Inter,Segoe UI,sans-serif" font-size="18">Five controls make the monitoring signal usable during a real incident</text><g font-family="Inter,Segoe UI,sans-serif">
<g><rect x="70" y="210" width="196" height="250" rx="22" fill="#10273a" stroke="#22d3ee" stroke-width="2"/><text x="96" y="255" fill="#67e8f9" font-size="16" font-weight="700">01  SCOPE</text><text x="96" y="305" fill="#fff" font-size="24" font-weight="700">Know what</text><text x="96" y="336" fill="#fff" font-size="24" font-weight="700">should emit</text><text x="96" y="389" fill="#bfd5df" font-size="17">Items</text><text x="96" y="420" fill="#bfd5df" font-size="17">Known exclusions</text></g>
<g><rect x="286" y="210" width="196" height="250" rx="22" fill="#12263e" stroke="#38bdf8" stroke-width="2"/><text x="312" y="255" fill="#7dd3fc" font-size="16" font-weight="700">02  BASELINE</text><text x="312" y="305" fill="#fff" font-size="24" font-weight="700">Define normal</text><text x="312" y="336" fill="#fff" font-size="24" font-weight="700">before alerts</text><text x="312" y="389" fill="#bfd5df" font-size="17">P50 and P95</text><text x="312" y="420" fill="#bfd5df" font-size="17">Failure rate</text></g>
<g><rect x="502" y="210" width="196" height="250" rx="22" fill="#14233d" stroke="#60a5fa" stroke-width="2"/><text x="528" y="255" fill="#93c5fd" font-size="16" font-weight="700">03  OWNERSHIP</text><text x="528" y="305" fill="#fff" font-size="24" font-weight="700">Map item to</text><text x="528" y="336" fill="#fff" font-size="24" font-weight="700">service owner</text><text x="528" y="389" fill="#bfd5df" font-size="17">Item lookup</text><text x="528" y="420" fill="#bfd5df" font-size="17">Business impact</text></g>
<g><rect x="718" y="210" width="196" height="250" rx="22" fill="#18213c" stroke="#818cf8" stroke-width="2"/><text x="744" y="255" fill="#a5b4fc" font-size="16" font-weight="700">04  INVESTIGATE</text><text x="744" y="305" fill="#fff" font-size="24" font-weight="700">Follow the</text><text x="744" y="336" fill="#fff" font-size="24" font-weight="700">OperationId</text><text x="744" y="389" fill="#bfd5df" font-size="17">KQL to SQL</text><text x="744" y="420" fill="#bfd5df" font-size="17">Exact execution</text></g>
<g><rect x="934" y="210" width="196" height="250" rx="22" fill="#1d203a" stroke="#a78bfa" stroke-width="2"/><text x="960" y="255" fill="#c4b5fd" font-size="16" font-weight="700">05  EVIDENCE</text><text x="960" y="305" fill="#fff" font-size="24" font-weight="700">Prove the</text><text x="960" y="336" fill="#fff" font-size="24" font-weight="700">change worked</text><text x="960" y="389" fill="#bfd5df" font-size="17">Action taken</text><text x="960" y="420" fill="#bfd5df" font-size="17">Comparison window</text></g></g>
<path d="M168 500H1032" stroke="#22445d" stroke-width="4"/><g fill="#67e8f9"><circle cx="168" cy="500" r="7"/><circle cx="384" cy="500" r="7"/><circle cx="600" cy="500" r="7"/><circle cx="816" cy="500" r="7"/><circle cx="1032" cy="500" r="7"/></g><rect x="240" y="550" width="720" height="54" rx="27" fill="#0b2a3d" stroke="#164e63"/><text x="600" y="584" text-anchor="middle" fill="#b7f4ff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="600">Detect, assign, diagnose, change, compare</text></svg>
