<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Warehouse monitoring signal matrix</title><desc id="d">Performance, reliability, and workload signals shown as three stacked cards.</desc><rect width="600" height="900" rx="28" fill="#081426"/><text x="42" y="62" fill="#effaff" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">Three operational questions</text><text x="42" y="96" fill="#8fb4c9" font-family="Inter,Segoe UI,sans-serif" font-size="17">One table, separate decisions</text><g font-family="Inter,Segoe UI,sans-serif">
<rect x="42" y="135" width="516" height="205" rx="22" fill="#10273a" stroke="#22d3ee" stroke-width="2"/><text x="72" y="180" fill="#67e8f9" font-size="19" font-weight="700">PERFORMANCE</text><text x="72" y="224" fill="#fff" font-size="23" font-weight="700">Average + P50 + P95</text><text x="72" y="265" fill="#dceaf0" font-size="18">Consistent slowdown or</text><text x="72" y="297" fill="#dceaf0" font-size="18">long-tail regression?</text>
<rect x="42" y="365" width="516" height="205" rx="22" fill="#14233b" stroke="#60a5fa" stroke-width="2"/><text x="72" y="410" fill="#93c5fd" font-size="19" font-weight="700">RELIABILITY</text><text x="72" y="454" fill="#fff" font-size="23" font-weight="700">Failures + rate + result code</text><text x="72" y="495" fill="#dceaf0" font-size="18">Isolated execution or</text><text x="72" y="527" fill="#dceaf0" font-size="18">repeating failure mode?</text>
<rect x="42" y="595" width="516" height="205" rx="22" fill="#1a213c" stroke="#a78bfa" stroke-width="2"/><text x="72" y="640" fill="#c4b5fd" font-size="19" font-weight="700">WORKLOAD</text><text x="72" y="684" fill="#fff" font-size="23" font-weight="700">Count + total CPU + avg CPU</text><text x="72" y="725" fill="#dceaf0" font-size="18">Normal concentration or</text><text x="72" y="757" fill="#dceaf0" font-size="18">ownership problem?</text></g><text x="300" y="850" text-anchor="middle" fill="#9fc4d5" font-family="Inter,Segoe UI,sans-serif" font-size="17">Keep each signal tied to its decision</text></svg>
