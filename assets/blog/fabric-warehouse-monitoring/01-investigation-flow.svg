<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Fabric Warehouse investigation flow</title><desc id="d">Workspace monitoring identifies the affected item and OperationId before Query Insights provides query-level evidence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101b35"/></linearGradient><filter id="g"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="78" fill="#eaf7ff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">From workspace signal to query evidence</text><text x="70" y="116" fill="#8fb4c9" font-family="Inter,Segoe UI,sans-serif" font-size="18">Use breadth first, then carry the same operation into detailed diagnosis</text>
<g filter="url(#g)" font-family="Inter,Segoe UI,sans-serif"><rect x="70" y="185" width="300" height="330" rx="24" fill="#10243d" stroke="#22d3ee" stroke-width="2"/><text x="100" y="232" fill="#67e8f9" font-size="18" font-weight="700">01  DETECT</text><text x="100" y="280" fill="#fff" font-size="27" font-weight="700">Workspace monitoring</text><text x="100" y="327" fill="#b9d2df" font-size="18">WarehouseExecutions</text><text x="100" y="370" fill="#dceaf0" font-size="18">P95 duration</text><text x="100" y="406" fill="#dceaf0" font-size="18">Failure rate</text><text x="100" y="442" fill="#dceaf0" font-size="18">CPU concentration</text><text x="100" y="478" fill="#dceaf0" font-size="18">ItemId + OperationId</text>
<rect x="450" y="185" width="300" height="330" rx="24" fill="#13223d" stroke="#60a5fa" stroke-width="2"/><text x="480" y="232" fill="#93c5fd" font-size="18" font-weight="700">02  TRIAGE</text><text x="480" y="280" fill="#fff" font-size="27" font-weight="700">Affected item</text><text x="480" y="327" fill="#b9d2df" font-size="18">Warehouse or endpoint</text><text x="480" y="370" fill="#dceaf0" font-size="18">Confirm time window</text><text x="480" y="406" fill="#dceaf0" font-size="18">Classify the symptom</text><text x="480" y="442" fill="#dceaf0" font-size="18">Record the owner</text><text x="480" y="478" fill="#dceaf0" font-size="18">Preserve OperationId</text>
<rect x="830" y="185" width="300" height="330" rx="24" fill="#17213b" stroke="#a78bfa" stroke-width="2"/><text x="860" y="232" fill="#c4b5fd" font-size="18" font-weight="700">03  DIAGNOSE</text><text x="860" y="280" fill="#fff" font-size="27" font-weight="700">Query Insights</text><text x="860" y="327" fill="#b9d2df" font-size="18">Exact distributed statement</text><text x="860" y="370" fill="#dceaf0" font-size="18">Query text and status</text><text x="860" y="406" fill="#dceaf0" font-size="18">Login and duration</text><text x="860" y="442" fill="#dceaf0" font-size="18">Scan and pool metrics</text><text x="860" y="478" fill="#dceaf0" font-size="18">Root-cause evidence</text></g>
<path d="M386 350h46" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/><path d="m423 339 14 11-14 11" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M766 350h46" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/><path d="m803 339 14 11-14 11" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="240" y="565" width="720" height="54" rx="27" fill="#0b2a3d" stroke="#164e63"/><text x="600" y="599" text-anchor="middle" fill="#b7f4ff" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="600">Shared key: OperationId = distributed_statement_id</text></svg>
