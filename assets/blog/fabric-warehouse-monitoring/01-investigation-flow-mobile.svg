<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d"><title id="t">Fabric Warehouse investigation flow</title><desc id="d">A vertical flow from workspace monitoring to the affected item and Query Insights.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101b35"/></linearGradient></defs><rect width="600" height="900" rx="28" fill="url(#bg)"/><text x="42" y="65" fill="#eaf7ff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700">Signal to query evidence</text><text x="42" y="100" fill="#8fb4c9" font-family="Inter,Segoe UI,sans-serif" font-size="17">Breadth first, detailed diagnosis second</text>
<g font-family="Inter,Segoe UI,sans-serif"><rect x="42" y="145" width="516" height="180" rx="22" fill="#10243d" stroke="#22d3ee" stroke-width="2"/><text x="72" y="186" fill="#67e8f9" font-size="17" font-weight="700">01  WORKSPACE MONITORING</text><text x="72" y="229" fill="#fff" font-size="24" font-weight="700">Detect and rank</text><text x="72" y="268" fill="#dceaf0" font-size="18">P95  |  failure rate  |  CPU time</text><text x="72" y="300" fill="#b9d2df" font-size="17">Capture ItemId and OperationId</text><path d="M300 327v34" stroke="#67e8f9" stroke-width="5"/><path d="m290 352 10 13 10-13" fill="none" stroke="#67e8f9" stroke-width="5"/>
<rect x="42" y="365" width="516" height="180" rx="22" fill="#13223d" stroke="#60a5fa" stroke-width="2"/><text x="72" y="406" fill="#93c5fd" font-size="17" font-weight="700">02  AFFECTED ITEM</text><text x="72" y="449" fill="#fff" font-size="24" font-weight="700">Triage the symptom</text><text x="72" y="488" fill="#dceaf0" font-size="18">Confirm time window and owner</text><text x="72" y="520" fill="#b9d2df" font-size="17">Preserve the operation identifier</text><path d="M300 547v34" stroke="#93c5fd" stroke-width="5"/><path d="m290 572 10 13 10-13" fill="none" stroke="#93c5fd" stroke-width="5"/>
<rect x="42" y="585" width="516" height="180" rx="22" fill="#17213b" stroke="#a78bfa" stroke-width="2"/><text x="72" y="626" fill="#c4b5fd" font-size="17" font-weight="700">03  QUERY INSIGHTS</text><text x="72" y="669" fill="#fff" font-size="24" font-weight="700">Diagnose the execution</text><text x="72" y="708" fill="#dceaf0" font-size="18">Text, login, scans, pool metrics</text><text x="72" y="740" fill="#b9d2df" font-size="17">Build root-cause evidence</text></g><rect x="70" y="810" width="460" height="50" rx="25" fill="#0b2a3d" stroke="#164e63"/><text x="300" y="842" text-anchor="middle" fill="#b7f4ff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="600">OperationId links both monitoring layers</text></svg>
