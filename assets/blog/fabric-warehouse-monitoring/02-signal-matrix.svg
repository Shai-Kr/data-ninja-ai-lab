<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Warehouse monitoring signal matrix</title><desc id="d">Performance, reliability, and workload need separate operational measures and decisions.</desc><rect width="1200" height="675" rx="32" fill="#081426"/><text x="70" y="78" fill="#effaff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">One table, three operational questions</text><text x="70" y="116" fill="#8fb4c9" font-family="Inter,Segoe UI,sans-serif" font-size="18">Keep performance, reliability, and workload signals separate</text>
<g font-family="Inter,Segoe UI,sans-serif"><rect x="70" y="178" width="330" height="390" rx="24" fill="#10273a" stroke="#22d3ee" stroke-width="2"/><circle cx="120" cy="230" r="23" fill="#164e63"/><text x="120" y="238" text-anchor="middle" fill="#67e8f9" font-size="22" font-weight="700">P</text><text x="160" y="239" fill="#fff" font-size="27" font-weight="700">Performance</text><text x="105" y="300" fill="#67e8f9" font-size="16" font-weight="700">MEASURE</text><text x="105" y="339" fill="#dceaf0" font-size="19">Average duration</text><text x="105" y="376" fill="#dceaf0" font-size="19">P50 and P95 duration</text><text x="105" y="435" fill="#67e8f9" font-size="16" font-weight="700">DECIDE</text><text x="105" y="474" fill="#dceaf0" font-size="19">Consistent slowdown or</text><text x="105" y="506" fill="#dceaf0" font-size="19">long-tail regression?</text>
<rect x="435" y="178" width="330" height="390" rx="24" fill="#14233b" stroke="#60a5fa" stroke-width="2"/><circle cx="485" cy="230" r="23" fill="#1e3a5f"/><text x="485" y="238" text-anchor="middle" fill="#93c5fd" font-size="22" font-weight="700">R</text><text x="525" y="239" fill="#fff" font-size="27" font-weight="700">Reliability</text><text x="470" y="300" fill="#93c5fd" font-size="16" font-weight="700">MEASURE</text><text x="470" y="339" fill="#dceaf0" font-size="19">Failed query count</text><text x="470" y="376" fill="#dceaf0" font-size="19">Rate by result code</text><text x="470" y="435" fill="#93c5fd" font-size="16" font-weight="700">DECIDE</text><text x="470" y="474" fill="#dceaf0" font-size="19">Isolated execution or</text><text x="470" y="506" fill="#dceaf0" font-size="19">repeating failure mode?</text>
<rect x="800" y="178" width="330" height="390" rx="24" fill="#1a213c" stroke="#a78bfa" stroke-width="2"/><circle cx="850" cy="230" r="23" fill="#352b5b"/><text x="850" y="238" text-anchor="middle" fill="#c4b5fd" font-size="22" font-weight="700">W</text><text x="890" y="239" fill="#fff" font-size="27" font-weight="700">Workload</text><text x="835" y="300" fill="#c4b5fd" font-size="16" font-weight="700">MEASURE</text><text x="835" y="339" fill="#dceaf0" font-size="19">Query count by item</text><text x="835" y="376" fill="#dceaf0" font-size="19">Total and avg CPU time</text><text x="835" y="435" fill="#c4b5fd" font-size="16" font-weight="700">DECIDE</text><text x="835" y="474" fill="#dceaf0" font-size="19">Normal concentration or</text><text x="835" y="506" fill="#dceaf0" font-size="19">ownership problem?</text></g><text x="600" y="625" text-anchor="middle" fill="#9fc4d5" font-family="Inter,Segoe UI,sans-serif" font-size="18">Do not collapse three different questions into one red or green score</text></svg>
