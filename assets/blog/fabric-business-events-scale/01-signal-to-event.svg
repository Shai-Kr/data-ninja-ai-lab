<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From operational signal to scalable business event</title><desc id="desc">Raw signals are evaluated into a meaningful state change, published with a governed contract, and consumed independently.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#102942"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="82" fill="#eaf6ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">From signal to shared business event</text><text x="70" y="122" fill="#8eabc4" font-family="Arial,sans-serif" font-size="22">Keep telemetry separate. Publish meaning once. Let consumers subscribe independently.</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="190" width="235" height="285" rx="24" fill="#10283e" stroke="#294d68" stroke-width="2"/><circle cx="116" cy="238" r="22" fill="#173b55"/><text x="108" y="247" fill="#5de1ff" font-size="26" font-weight="700">1</text><text x="98" y="302" fill="#eaf6ff" font-size="28" font-weight="700">Raw signals</text><text x="98" y="348" fill="#b8cada" font-size="21">Telemetry</text><text x="98" y="384" fill="#b8cada" font-size="21">Logs</text><text x="98" y="420" fill="#b8cada" font-size="21">Metrics</text>
<rect x="355" y="190" width="235" height="285" rx="24" fill="#10283e" stroke="#294d68" stroke-width="2"/><circle cx="401" cy="238" r="22" fill="#173b55"/><text x="393" y="247" fill="#5de1ff" font-size="26" font-weight="700">2</text><text x="383" y="302" fill="#eaf6ff" font-size="28" font-weight="700">Meaning</text><text x="383" y="348" fill="#b8cada" font-size="21">Evaluate a rule</text><text x="383" y="384" fill="#b8cada" font-size="21">Confirm a business</text><text x="383" y="416" fill="#b8cada" font-size="21">state change</text>
<rect x="640" y="190" width="235" height="285" rx="24" fill="#10283e" stroke="#26d3e8" stroke-width="3" filter="url(#glow)"/><circle cx="686" cy="238" r="22" fill="#14455b"/><text x="678" y="247" fill="#5de1ff" font-size="26" font-weight="700">3</text><text x="668" y="298" fill="#eaf6ff" font-size="27" font-weight="700">Event contract</text><text x="668" y="346" fill="#b8cada" font-size="21">Name + schema</text><text x="668" y="382" fill="#b8cada" font-size="21">Owner + version</text><text x="668" y="418" fill="#b8cada" font-size="21">ID + occurrence time</text>
<rect x="925" y="190" width="205" height="285" rx="24" fill="#10283e" stroke="#294d68" stroke-width="2"/><circle cx="971" cy="238" r="22" fill="#173b55"/><text x="963" y="247" fill="#5de1ff" font-size="26" font-weight="700">4</text><text x="953" y="298" fill="#eaf6ff" font-size="27" font-weight="700">Consumers</text><text x="953" y="346" fill="#b8cada" font-size="20">Activator</text><text x="953" y="380" fill="#b8cada" font-size="20">Functions</text><text x="953" y="414" fill="#b8cada" font-size="20">Data workflows</text>
<g fill="none" stroke="#5de1ff" stroke-width="4"><path d="M315 332h30"/><path d="M600 332h30"/><path d="M885 332h30"/></g><g fill="#5de1ff"><path d="M345 332l-14-9v18z"/><path d="M630 332l-14-9v18z"/><path d="M915 332l-14-9v18z"/></g>
<rect x="155" y="540" width="890" height="92" rx="22" fill="#0b1e30" stroke="#1b6076"/><text x="600" y="578" text-anchor="middle" fill="#5de1ff" font-size="22" font-weight="700">Design test</text><text x="600" y="612" text-anchor="middle" fill="#d2e4f2" font-size="23">Can a new consumer subscribe without changing the publisher?</text>
</g></svg>
