<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" viewBox="0 0 720 1260" role="img" aria-labelledby="title"><title id="title">Fabric Business Events scalable operating model</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#102942"/></linearGradient></defs><rect width="720" height="1260" rx="32" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="56" y="82" fill="#eaf6ff" font-size="38" font-weight="700">A scalable operating model</text><text x="56" y="126" fill="#8eabc4" font-size="22">Separate ownership. Share one contract.</text>
<rect x="56" y="190" width="608" height="160" rx="24" fill="#10283e" stroke="#2a566f" stroke-width="2"/><text x="92" y="235" fill="#5de1ff" font-size="21" font-weight="700">PUBLISHER OWNER</text><text x="92" y="285" fill="#eaf6ff" font-size="30" font-weight="700">Source process publishes one fact</text><text x="92" y="324" fill="#b8cada" font-size="22">No consumer-specific instructions.</text>
<rect x="56" y="405" width="608" height="240" rx="26" fill="#0c3046" stroke="#26d3e8" stroke-width="3"/><text x="92" y="452" fill="#5de1ff" font-size="21" font-weight="700">SHARED CONTRACT</text><text x="92" y="505" fill="#eaf6ff" font-size="34" font-weight="700">Business Event</text><text x="92" y="555" fill="#b8cada" font-size="23">Schema Registry • ID • occurrence time</text><text x="92" y="595" fill="#b8cada" font-size="23">Version • meaning • classification</text>
<g fill="#10283e" stroke="#2a566f" stroke-width="2"><rect x="56" y="700" width="608" height="120" rx="22"/><rect x="56" y="850" width="608" height="120" rx="22"/><rect x="56" y="1000" width="608" height="120" rx="22"/></g><g fill="#eaf6ff" font-size="28" font-weight="700"><text x="92" y="750">Consumer A</text><text x="92" y="900">Consumer B</text><text x="92" y="1050">Consumer C</text></g><g fill="#b8cada" font-size="21"><text x="92" y="790">Own action and failure path</text><text x="92" y="940">Own workflow and recovery</text><text x="92" y="1090">Own analysis and response target</text></g>
<text x="360" y="1184" text-anchor="middle" fill="#5de1ff" font-size="21" font-weight="700">OPERATING EVIDENCE</text><text x="360" y="1220" text-anchor="middle" fill="#d2e4f2" font-size="20">Preview • history • correlation • outcomes</text></g></svg>
