<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title"><title id="title">From signal to shared business event</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#102942"/></linearGradient></defs><rect width="720" height="1180" rx="32" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="56" y="78" fill="#eaf6ff" font-size="38" font-weight="700">From signal to shared</text><text x="56" y="124" fill="#eaf6ff" font-size="38" font-weight="700">business event</text><text x="56" y="166" fill="#8eabc4" font-size="23">Publish meaning once. Subscribe independently.</text>
<g><rect x="56" y="220" width="608" height="172" rx="24" fill="#10283e" stroke="#294d68" stroke-width="2"/><circle cx="105" cy="270" r="24" fill="#173b55"/><text x="97" y="280" fill="#5de1ff" font-size="28" font-weight="700">1</text><text x="150" y="270" fill="#eaf6ff" font-size="30" font-weight="700">Raw signals</text><text x="150" y="315" fill="#b8cada" font-size="23">Telemetry, logs, and metrics</text><text x="150" y="352" fill="#b8cada" font-size="23">stay outside the event catalog.</text>
<rect x="56" y="430" width="608" height="172" rx="24" fill="#10283e" stroke="#294d68" stroke-width="2"/><circle cx="105" cy="480" r="24" fill="#173b55"/><text x="97" y="490" fill="#5de1ff" font-size="28" font-weight="700">2</text><text x="150" y="480" fill="#eaf6ff" font-size="30" font-weight="700">Meaning</text><text x="150" y="525" fill="#b8cada" font-size="23">Evaluate a rule and confirm</text><text x="150" y="562" fill="#b8cada" font-size="23">a business state change.</text>
<rect x="56" y="640" width="608" height="172" rx="24" fill="#10283e" stroke="#26d3e8" stroke-width="3"/><circle cx="105" cy="690" r="24" fill="#14455b"/><text x="97" y="700" fill="#5de1ff" font-size="28" font-weight="700">3</text><text x="150" y="690" fill="#eaf6ff" font-size="30" font-weight="700">Event contract</text><text x="150" y="735" fill="#b8cada" font-size="23">Name, schema, owner, version,</text><text x="150" y="772" fill="#b8cada" font-size="23">identifier, and occurrence time.</text>
<rect x="56" y="850" width="608" height="172" rx="24" fill="#10283e" stroke="#294d68" stroke-width="2"/><circle cx="105" cy="900" r="24" fill="#173b55"/><text x="97" y="910" fill="#5de1ff" font-size="28" font-weight="700">4</text><text x="150" y="900" fill="#eaf6ff" font-size="30" font-weight="700">Independent consumers</text><text x="150" y="945" fill="#b8cada" font-size="23">Activator, functions, analytics,</text><text x="150" y="982" fill="#b8cada" font-size="23">and data workflows subscribe.</text></g>
<text x="360" y="1090" text-anchor="middle" fill="#5de1ff" font-size="22" font-weight="700">DESIGN TEST</text><text x="360" y="1130" text-anchor="middle" fill="#d2e4f2" font-size="22">Add a consumer without changing the publisher.</text></g></svg>
