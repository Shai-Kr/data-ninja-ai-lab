<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;750;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">DN</span>
        <span>Data Ninja AI Lab</span>
      </a>
      <nav class="nav">
        <a href="https://github.com/Shai-Kr/data-ninja-ai-lab">GitHub</a>
        <a href="https://www.linkedin.com/in/shai-kr">LinkedIn</a>
      </nav>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} Shai Karmani</span>
      <a href="https://www.linkedin.com/in/shai-kr">Let’s connect on LinkedIn</a>
    </footer>
  </div>
</body>
</html>
