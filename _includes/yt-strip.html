{%- assign yt = site.data.youtube.channel -%}
<section class="yt-strip" aria-label="{{ yt.name }} on YouTube">
<a class="yt-avatar yt-avatar--sm" href="{{ yt.url }}" target="_blank" rel="noopener" aria-label="{{ yt.name }} on YouTube"><img src="{{ '/assets/img/youtube/pbi101-avatar.jpg' | relative_url }}" alt="" width="56" height="56"></a>
<div class="yt-strip-copy">
<p class="yt-kicker"><span class="yt-dot" aria-hidden="true"></span>{{ yt.name }} on YouTube</p>
<p><strong>{{ yt.tagline }}</strong> Real Power BI and Fabric builds where AI does the work, 5 to 10 minutes each.</p>
</div>
<a class="yt-subscribe yt-subscribe--sm" href="{{ yt.subscribe }}" target="_blank" rel="noopener"><svg class="yt-logo" viewBox="0 0 28 20" aria-hidden="true"><path fill="currentColor" d="M27.4 3.1A3.5 3.5 0 0 0 25 .6C22.8 0 14 0 14 0S5.2 0 3 .6A3.5 3.5 0 0 0 .6 3.1C0 5.3 0 10 0 10s0 4.7.6 6.9A3.5 3.5 0 0 0 3 19.4c2.2.6 11 .6 11 .6s8.8 0 11-.6a3.5 3.5 0 0 0 2.4-2.5c.6-2.2.6-6.9.6-6.9s0-4.7-.6-6.9Z"/><path fill="#ff0033" d="M11.2 14.3 18.5 10l-7.3-4.3v8.6Z"/></svg><span>Subscribe</span></a>
</section>
